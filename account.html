<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Minha conta</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.nav button,.buy{border:1px solid #292930;background:#111115;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.hero{padding:34px 0}.muted{color:#85858f;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#0b0b0d;border:1px solid #222229;border-radius:14px;padding:20px}.panel h2{margin:0 0 5px;font-size:18px}.field{margin-top:14px}.field label{display:block;color:#92929b;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;height:42px;padding:0 11px;border-radius:8px;border:1px solid #292930;background:#070708;color:#fff;outline:0}.buy{width:100%;margin-top:15px;background:#fff;color:#050505;border:0;font-weight:750}.orders{margin-top:14px}.order{padding:14px 0;border-top:1px solid #202027;display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;padding:5px 8px;border-radius:6px;background:#18181d;color:#c8bfff;white-space:nowrap}.pix{margin-top:14px;padding:14px;border:1px solid #30253e;background:#100d15;border-radius:11px}.pix img{max-width:230px;width:100%;display:block;margin:12px auto}.copy{width:100%;padding:10px;background:#18181d;border:1px solid #292930;color:#fff;border-radius:8px}.empty{color:#777;font-size:13px}.error{color:#ff8585;font-size:12px;margin-top:10px}.success{color:#7ed4a0;font-size:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding-top:25px}}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux</div><button onclick="logout()">Sair</button></nav><section class="hero"><h1 id="hello">Minha conta</h1><div class="muted">Gerencie seus dados e acompanhe seus pedidos.</div></section><div class="grid"><section class="panel"><h2>Novo pedido</h2><div class="muted">Escolha a quantidade e gere seu PIX.</div><div class="field"><label>QUANTIDADE</label><select id="qty"><option value="1000">1.000 Robux</option><option value="5000">5.000 Robux</option><option value="10000">10.000 Robux</option><option value="20000">20.000 Robux</option><option value="50000">50.000 Robux</option></select></div><div class="field"><label>TIPO</label><select id="method"><option>Gamepass</option><option>Robux Plus</option></select></div><div class="field"><label>USUÁRIO ROBLOX</label><input id="roblox" maxlength="20" placeholder="Seu usuário Roblox"></div><div class="field"><label>NOME COMPLETO</label><input id="payerName" placeholder="Nome completo" autocomplete="name"></div><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div><button class="buy" id="payBtn" onclick="createPayment()">Gerar PIX</button><div id="pay"></div></section><section class="panel"><h2>Seus pedidos</h2><div class="muted">Histórico e status das compras.</div><div class="orders" id="orders"><div class="empty">Carregando...</div></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user;const $=id=>document.getElementById(id);function digits(v){return String(v).replace(/\D/g,'').slice(0,11)}function mask(v){let d=digits(v);if(d.length>9)return d.replace(/(\d{3})(\d{3})(\d{3})(\d)/,'$1.$2.$3-$4');if(d.length>6)return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');if(d.length>3)return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');return d}$('cpf').addEventListener('input',e=>e.target.value=mask(e.target.value));async function boot(){const c=await(await fetch('/api/config')).json();if(!c.supabaseUrl||!c.supabaseAnonKey)return location.href='login.html';client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(!s.data.session)return location.href='login.html';user=s.data.session.user;const p=await client.from('profiles').select('username,roblox_username').eq('id',user.id).maybeSingle();hello.textContent='Olá, '+(p.data?.username||user.user_metadata?.username||user.email.split('@')[0]);if(p.data?.roblox_username)$('roblox').value=p.data.roblox_username;await loadOrders()}async function loadOrders(){const r=await client.from('orders').select('id,robux,method,amount,status,roblox_username,created_at,pix_copy_paste,pix_qr_code').order('created_at',{ascending:false}).limit(30);if(r.error){orders.innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>';return}if(!r.data.length){orders.innerHTML='<div class="empty">Você ainda não fez nenhum pedido.</div>';return}orders.innerHTML=r.data.map(o=>`<div class="order"><div><b>${Number(o.robux).toLocaleString('pt-BR')} Robux</b><div class="muted">${o.method} · ${o.roblox_username} · ${new Date(o.created_at).toLocaleString('pt-BR')}</div></div><span class="status">${o.status}</span></div>`).join('')}async function createPayment(){const s=(await client.auth.getSession()).data.session;if(!s)return location.href='/login.html';const robloxUsername=roblox.value.trim(),name=payerName.value.trim();if(name.split(/\s+/).length<2)return pay.innerHTML='<div class="error">Informe o nome completo.</div>';if(!/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(cpf.value))return pay.innerHTML='<div class="error">Informe o CPF completo.</div>';if(!/^[A-Za-z0-9_]{3,20}$/.test(robloxUsername))return pay.innerHTML='<div class="error">Informe um usuário Roblox válido.</div>';const btn=$('payBtn');btn.disabled=true;btn.textContent='Gerando PIX...';pay.innerHTML='';try{const response=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({quantity:+qty.value,type:method.value,robloxUsername,name,cpf:cpf.value,email:user.email})});const d=await response.json();if(!response.ok)throw Error(d.error||'Não foi possível gerar o PIX.');if(!d.payment?.copy_paste&&!d.payment?.qr_code)throw Error('O gateway não retornou os dados do PIX.');const qr=d.payment.qr_code||'';pay.innerHTML=`<div class="pix"><b>Pagamento criado</b><div class="muted">Pedido: ${d.order.id}<br>Valor: R$ ${Number(d.order.amount).toFixed(2).replace('.',',')}</div>${qr?`<img src="${qr}" alt="QR Code PIX">`:''}<textarea id="copy" class="copy" rows="4" readonly>${d.payment.copy_paste||''}</textarea>${d.payment.copy_paste?'<button class="copy" onclick="copyPix()">Copiar código PIX</button>':''}<div class="muted" style="margin-top:10px">Status: ${d.order.status}</div></div>`;await loadOrders()}catch(e){pay.innerHTML='<div class="error">'+e.message+'</div>'}finally{btn.disabled=false;btn.textContent='Gerar PIX'}}async function copyPix(){await navigator.clipboard.writeText($('copy').value);document.querySelector('.copy+button')?.remove()}async function logout(){await client.auth.signOut();location.href='index.html'}boot();</script></body></html>
