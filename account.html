<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Minha conta</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font-family:Inter,system-ui}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.nav button,.buy{border:1px solid #292930;background:#111115;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.hero{padding:35px 0}.muted{color:#9696a3;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:#0d0d10;border:1px solid #24242b;border-radius:18px;padding:22px}.panel h2{margin:0 0 7px}.field{margin-top:14px}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #292930;background:#08080a;color:#fff}.buy{width:100%;margin-top:15px;background:linear-gradient(90deg,#a78bfa,#7c3aed);border:0;font-weight:800}.orders{margin-top:15px}.order{padding:15px 0;border-top:1px solid #222229;display:flex;justify-content:space-between;gap:10px}.status{font-size:12px;padding:5px 8px;border-radius:7px;background:#19191f;color:#c4b5fd}.pix{margin-top:15px;padding:14px;border:1px solid #30253e;background:#100d15;border-radius:12px}.pix img{max-width:220px;width:100%;display:block;margin:12px auto}.copy{width:100%;padding:10px;background:#19191e;border:1px solid #292930;color:#fff;border-radius:8px}.empty{color:#777;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding-top:25px}}
</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux</div><button onclick="logout()">Sair</button></nav><section class="hero"><h1 id="hello">Minha conta</h1><div class="muted">Gerencie seus dados e acompanhe seus pedidos.</div></section><div class="grid"><section class="panel"><h2>Novo pedido</h2><div class="muted">Escolha a quantidade e gere seu PIX.</div><div class="field"><label>QUANTIDADE</label><select id="qty"><option value="1000">1.000 Robux</option><option value="5000">5.000 Robux</option><option value="10000">10.000 Robux</option><option value="20000">20.000 Robux</option><option value="50000">50.000 Robux</option></select></div><div class="field"><label>MÉTODO</label><select id="method"><option>Gamepass</option><option>Robux Plus</option></select></div><div class="field"><label>USUÁRIO ROBLOX</label><input id="roblox" placeholder="Seu usuário Roblox"></div><div class="field"><label>NOME DO PAGADOR</label><input id="payerName" placeholder="Nome completo"></div><div class="field"><label>CPF DO PAGADOR</label><input id="cpf" inputmode="numeric" placeholder="Somente números"></div><button class="buy" onclick="createPayment()">Gerar PIX</button><div id="pay"></div></section><section class="panel"><h2>Seus pedidos</h2><div class="muted">Histórico e status das compras.</div><div class="orders" id="orders"><div class="empty">Carregando...</div></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user;async function boot(){const c=await (await fetch('/api/config')).json();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(!s.data.session){location.href='auth.html';return}user=s.data.session.user;hello.textContent='Olá, '+(user.user_metadata?.username||user.email.split('@')[0]);await loadOrders();client.auth.onAuthStateChange(()=>loadOrders())}async function loadOrders(){const r=await client.from('orders').select('id,robux,method,amount,status,roblox_username,created_at,pix_copy_paste,pix_qr_code').order('created_at',{ascending:false}).limit(30);if(r.error){orders.innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>';return}if(!r.data.length){orders.innerHTML='<div class="empty">Você ainda não fez nenhum pedido.</div>';return}orders.innerHTML=r.data.map(o=>{let date=new Date(o.created_at).toLocaleString('pt-BR');return `<div class="order"><div><b>${o.robux.toLocaleString('pt-BR')} Robux</b><div class="muted">${o.method} • ${o.roblox_username} • ${date}</div></div><div><span class="status">${o.status}</span></div></div>`}).join('')}async function createPayment(){const session=(await client.auth.getSession()).data.session;if(!session)return location.href='auth.html';pay.innerHTML='<div class="pix">Gerando PIX...</div>';const res=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({robux:+qty.value,method:method.value,robloxUsername:roblox.value.trim(),payerName:payerName.value.trim(),payerDocument:cpf.value})});const d=await res.json();if(!res.ok){pay.innerHTML='<div class="pix">'+(d.error||'Erro ao gerar PIX.')+'</div>';return}const img=d.qrCode?(d.qrCode.startsWith('data:image')?d.qrCode:d.qrCode):'';pay.innerHTML=`<div class="pix"><b>PIX criado</b><div class="muted">Pedido ${d.orderId}</div>${img?`<img src="${img}" alt="QR Code PIX">`:''}<textarea class="copy" rows="4" readonly>${d.copyPaste||'Código PIX indisponível'}</textarea><button class="copy" onclick="navigator.clipboard.writeText(document.querySelector('.copy').value)">Copiar código PIX</button></div>`;await loadOrders()}async function logout(){await client.auth.signOut();location.href='index.html'}boot();</script></body></html>
