<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administradores — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0}.role{color:#9f97ff;font-size:12px}.input{padding:10px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;flex:1}.form{display:flex;gap:8px;margin:20px 0}.btn{padding:10px;border-radius:9px;border:1px solid #292930;background:#fff;color:#050505;font-weight:700;cursor:pointer}.danger{color:#ffaaa9;background:#171013;border:1px solid #4a292d;padding:9px;border-radius:9px;cursor:pointer}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>🛡️ Administradores</h1><p style="color:#888">O proprietário é o líder permanente. Somente ele pode adicionar ou remover outros administradores.</p><div id="list">Carregando...</div><div id="form"></div></main><script>const OWNER_EMAIL='willianwca2011@gmail.com';async function load(){if(!await requireAdmin())return;const {data:roles,error}=await adminSB.from('admin_roles').select('user_id,created_at').order('created_at',{ascending:false});if(error){list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';return}const owner=(adminUser.email||'').toLowerCase()===OWNER_EMAIL;let rows='<div class="row"><div><b>👑 '+OWNER_EMAIL+'</b><div class="role">Líder / proprietário — protegido permanentemente</div></div><span class="role">PROPRIETÁRIO</span></div>';rows+=(roles||[]).filter(x=>x.user_id!==adminUser.id).map(x=>'<div class="row"><div><b>Administrador</b><div class="role">ID: '+adminEsc(x.user_id)+'</div></div>'+(owner?'<button class="danger" onclick="removeAdmin(\''+x.user_id+'\')">Remover</button>':'')).join('');list.innerHTML=rows;form.innerHTML=owner?'<div class="form"><input class="input" id="target" placeholder="UUID do usuário"><button class="btn" onclick="addAdmin()">Adicionar administrador</button></div>':''}async function addAdmin(){const id=document.getElementById('target').value.trim();if(!id)return adminToast('Informe o UUID.');const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:true});if(error)return adminToast(error.message);adminToast('Administrador adicionado.',true);load()}async function removeAdmin(id){if(!confirm('Remover este administrador?'))return;const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:false});if(error)return adminToast(error.message);adminToast('Administrador removido.',true);load()}load()</script></body></html>
