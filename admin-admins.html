<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administradores — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>.notice{padding:14px 16px;background:#15191d;border:1px solid #343b42;border-radius:7px;color:#b8c0c7;line-height:1.5;margin-bottom:12px}.admin-list{display:grid;gap:9px}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;background:#111417;border:1px solid #2a3036;border-radius:7px}.identity{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:6px;background:#32171b;border:1px solid #63262d;display:grid;place-items:center;color:#ffb1b7;font-weight:900}.role{color:#929aa3;font-size:11px;margin-top:4px}.form{display:flex;gap:8px;margin-top:14px}.form input{flex:1;min-height:42px}.danger{background:#251417!important;color:#ff9da3!important;border-color:#6b2a31!important}@media(max-width:650px){.admin-row{align-items:flex-start;flex-direction:column}.form{flex-direction:column}}</style></head><body><main class="wrap"><div class="notice">O proprietário permanece protegido permanentemente. Somente o proprietário pode adicionar ou remover administradores.</div><section class="admin-list" id="list">Carregando administradores...</section><section id="form"></section></main><script>const OWNER_EMAIL='willianwca2011@gmail.com';const $=id=>document.getElementById(id);async function load(){if(!await requireAdmin())return;const {data:roles,error}=await adminSB.from('admin_roles').select('user_id,created_at').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="admin-row">'+adminEsc(error.message)+'</div>';return}const owner=(adminUser.email||'').toLowerCase()===OWNER_EMAIL;let html='<article class="admin-row"><div class="identity"><span class="avatar">L</span><div><b>'+adminEsc(OWNER_EMAIL)+'</b><div class="role">Proprietário · Líder permanente</div></div></div><span class="status">PROPRIETÁRIO</span></article>';html+=(roles||[]).filter(x=>x.user_id!==adminUser.id).map(x=>'<article class="admin-row"><div class="identity"><span class="avatar">A</span><div><b>Administrador</b><div class="role">ID: '+adminEsc(x.user_id)+' · Adicionado '+new Date(x.created_at).toLocaleDateString('pt-BR')+'</div></div></div>'+(owner?'<button class="danger" onclick="removeAdmin(\''+x.user_id+'\')">Remover acesso</button>':'')).join('');$('list').innerHTML=html;$('form').innerHTML=owner?'<div class="form"><input id="target" placeholder="UUID do usuário"><button class="primary" onclick="addAdmin()">Adicionar administrador</button></div>':''}async function addAdmin(){const id=$('target').value.trim();if(!id)return adminToast('Informe o UUID do usuário.');const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:true});if(error)return adminToast(error.message);adminToast('Administrador adicionado.',true);$('target').value='';load()}async function removeAdmin(id){if(!confirm('Remover o acesso administrativo deste usuário?'))return;const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:false});if(error)return adminToast(error.message);adminToast('Acesso removido.',true);load()}load()</script></body></html>
