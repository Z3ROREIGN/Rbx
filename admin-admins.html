<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administradores — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.row{display:flex;justify-content:space-between;gap:12px;padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0}input,button{padding:10px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff}button{cursor:pointer}.danger{color:#ffaaa9}.form{display:flex;gap:8px;margin:20px 0}.form input{flex:1}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>🛡️ Administradores</h1><p style="color:#888">Somente o proprietário pode adicionar ou remover administradores.</p><div id="list">Carregando...</div><div id="form"></div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('admin_roles').select('user_id,created_at').order('created_at',{ascending:false});if(error)return list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';const owner=(adminUser.email||'').toLowerCase()==='willianwca2011@gmail.com';list.innerHTML=(data||[]).map(x=>'<div class="row"><span>ID: '+adminEsc(x.user_id)+'</span>'+(owner&&x.user_id!==adminUser.id?'<button class="danger" onclick="removeAdmin(\''+x.user_id+'\')">Remover</button>':'<small>Protegido</small>')).join('')||'Nenhum administrador adicional.';form.innerHTML=owner?'<div class="form"><input id="target" placeholder="UUID do usuário"><button onclick="addAdmin()">Adicionar administrador</button></div>':''}async function addAdmin(){const id=target.value.trim();if(!id)return adminToast('Informe o UUID.');const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:true});if(error)return adminToast(error.message);adminToast('Administrador adicionado.',true);load()}async function removeAdmin(id){if(!confirm('Remover este administrador?'))return;const {error}=await adminSB.rpc('set_admin',{target:id,make_admin:false});if(error)return adminToast(error.message);adminToast('Administrador removido.',true);load()}load()</script></body></html>
