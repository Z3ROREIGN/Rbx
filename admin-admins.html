<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administradores | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--panel2:#171b1f;--line:#293038;--text:#f3f5f7;--muted:#8e98a2;--red:#d92f3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0}.sub,.meta,.role{color:var(--muted)}.notice{background:#171113;border:1px solid #4c2026;padding:13px;border-radius:6px;margin-bottom:12px}.toolbar{display:flex;gap:8px;margin-bottom:9px}.input{flex:1;min-height:42px;background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;padding:0 12px;outline:0}.results{display:grid;gap:5px;margin-bottom:12px}.candidate,.admin{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#32151a;flex:none}.name{font-weight:800}.role{font-size:11px;margin-top:3px}.admin-list{display:grid;gap:8px}.admin{background:var(--panel2)}.actions{display:flex;gap:7px;flex-wrap:wrap}button{min-height:40px}.danger{background:#251417!important;color:#ff9da3!important;border-color:#6b2a31!important}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:650px){.wrap{padding:18px 12px 95px}.toolbar{flex-direction:column}.candidate,.admin{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{width:100%}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Controle de acesso</div><h1>Administradores</h1><p class="sub">Gerencie a equipe por nome, @username ou Roblox. O proprietário permanece protegido.</p></header><div class="notice">Somente o proprietário pode adicionar ou remover administradores. O acesso do proprietário não pode ser removido.</div><section class="toolbar"><input class="input" id="search" placeholder="Pesquisar usuário por nome, @username ou Roblox"></section><section id="results" class="results"></section><h2>Equipe atual</h2><section id="list" class="admin-list">Carregando...</section></main><script>const OWNER_EMAIL='willianwca2011@gmail.com';const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let profiles=[],roles=[],canManage=false;async function load(){if(!await requireAdmin())return;canManage=(adminUser.email||'').toLowerCase()===OWNER_EMAIL;try{const r=await adminSB.from('admin_roles').select('user_id,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;roles=r.data||[];const p=await adminSB.from('profiles').select('id,display_name,username,roblox_username,avatar_url,account_status').order('created_at',{ascending:false}).limit(1000);if(p.error)throw p.error;profiles=p.data||[];renderList();renderSearch()}catch(e){$('list').innerHTML='<div class="admin">'+esc(e.message)+'</div>'}}function prof(id){return profiles.find(x=>x.id===id)||{id}}function label(id){const p=prof(id);return p.display_name||p.username||'Usuário'}function handle(id){const p=prof(id);return p.username?'@'+p.username:'@usuário'}function renderList(){let html=`<article class="admin"><div class="identity"><img class="avatar" src="${esc(adminUser.user_metadata?.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><div class="name">Proprietário</div><div class="role">${esc(OWNER_EMAIL)} · Líder permanente</div></div></div><span class="role">PROPRIETÁRIO</span></article>`;html+=roles.filter(x=>x.user_id!==adminUser.id).map(x=>{const p=prof(x.user_id);return `<article class="admin"><div class="identity"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><div class="name">${esc(label(x.user_id))}</div><div class="role">${esc(handle(x.user_id))} · Roblox: ${esc(p.roblox_username||'—')}</div><div class="role">Administrador desde ${new Date(x.created_at).toLocaleDateString('pt-BR')}</div></div></div>${canManage?`<div class="actions"><button class="danger" onclick="removeAdmin('${esc(x.user_id)}')">Remover acesso</button></div>`:''}</article>`}).join('');$('list').innerHTML=html||'<div class="empty">Nenhum administrador adicional.</div>'}function renderSearch(){const q=$('search').value.trim().toLowerCase().replace(/^@/,'');if(!canManage||!q){$('results').innerHTML='';return}const existing=new Set(roles.map(x=>x.user_id));const arr=profiles.filter(p=>p.id!==adminUser.id&&!existing.has(p.id)&&[p.display_name,p.username,p.roblox_username,p.id].join(' ').toLowerCase().includes(q)).slice(0,8);$('results').innerHTML=arr.length?arr.map(p=>`<article class="candidate"><div class="identity"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><div class="name">${esc(p.display_name||p.username||'Usuário')}</div><div class="role">${esc(p.username?'@'+p.username:'@usuário')} · Roblox: ${esc(p.roblox_username||'—')}</div></div></div><button onclick="addAdmin('${esc(p.id)}')">Adicionar administrador</button></article>`).join(''):'<div class="empty">Nenhum usuário disponível para adicionar.</div>'}async function addAdmin(id){if(!canManage)return adminToast('Apenas o proprietário pode fazer isso.');try{await adminRpc('set_admin',{target:id,make_admin:true});adminToast('Administrador adicionado.',true);await load()}catch(e){adminToast(e.message)}}async function removeAdmin(id){if(!canManage)return adminToast('Apenas o proprietário pode fazer isso.');if(!confirm('Remover o acesso administrativo deste usuário?'))return;try{await adminRpc('set_admin',{target:id,make_admin:false});adminToast('Acesso removido.',true);await load()}catch(e){adminToast(e.message)}}$('search').oninput=renderSearch;load();</script></body></html>
