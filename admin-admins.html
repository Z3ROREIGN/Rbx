<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js?v=20260819-4"></script><style>body{margin:0;background:#090a0c;color:#f3f5f7;font:14px system-ui}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.panel{background:#121518;border:1px solid #293038;border-radius:8px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #252b30}.row:last-child{border-bottom:0}.id{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#251316}.muted{color:#929aa3;font-size:12px}.role{padding:4px 7px;border:1px solid #5d3035;border-radius:5px;font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}button,select,input{background:#191d21;color:#fff;border:1px solid #343c44;border-radius:6px;padding:10px}button{cursor:pointer;font-weight:800}button:disabled{opacity:.5}.danger{border-color:#6b2a31;background:#251417}.search{width:100%;box-sizing:border-box}.notice{padding:11px;border:1px solid #4c2026;background:#171113;border-radius:6px}.ok{border-color:#315d40;background:#111a14}.candidate{padding:12px;border:1px solid #293038;border-radius:7px;margin:7px 0;background:#121518}.empty{text-align:center;color:#929aa3;padding:25px}@media(max-width:700px){.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1}}</style></head><body><main class="wrap"><h1>Equipe administrativa</h1><p class="muted">Somente o Líder pode adicionar, alterar ou remover cargos.</p><div id="notice" class="notice">Carregando...</div><div class="panel"><input id="search" class="search" placeholder="Pesquisar usuário por nome, @username, Roblox ou ID"></div><div id="results"></div><div class="panel"><h2>Equipe atual</h2><div id="list" class="empty">Carregando...</div></div></main><script>let profiles=[],roles=[],busy=false;const $=x=>document.getElementById(x);const esc=x=>adminEsc(x);const profile=id=>profiles.find(p=>String(p.id)===String(id))||{};const name=id=>{const p=profile(id);return p.display_name||p.username||p.roblox_username||'Usuário'};const handle=id=>{const p=profile(id);return p.username?'@'+p.username:p.roblox_username?'@'+p.roblox_username:'@usuário'};function notice(t,ok=false){$('notice').textContent=t;$('notice').className='notice'+(ok?' ok':'')}async function load(){if(!(await requireAdmin()))return;try{const rr=await adminGet('/api/admin-data?resource=admin_roles&limit=1000&order=created_at&asc=true');roles=rr.data||[];const pp=await adminGet('/api/admin-data?resource=profiles&limit=1000');profiles=pp.data||[];if(String(adminRole).toUpperCase()!=='LIDER'){notice('Somente o Líder pode gerenciar cargos.');render();return}notice('Você é Líder. Os controles de cargos estão liberados.',true);render();search()}catch(e){notice(e.message||'Erro ao carregar.');$('list').innerHTML='<div class="empty">'+esc(e.message||'Erro')+'</div>'}}function render(){const list=roles.map(r=>{const p=profile(r.user_id),self=String(r.user_id)===String(adminUser.id);return '<div class="row"><div class="id"><img class="avatar" src="'+esc(p.avatar_url||'/logo.png')+'"><div><b>'+esc(self?'Você':name(r.user_id))+'</b><div class="muted">'+esc(handle(r.user_id))+' · '+esc(p.roblox_username||'—')+'</div><span class="role">'+esc(r.role)+'</span></div></div>'+(self?'':('<div class="actions"><select onchange="changeRole(\''+esc(r.user_id)+'\',this.value,this)"><option value="ADMINISTRADOR" '+(r.role==='ADMINISTRADOR'?'selected':'')+'>Administrador</option><option value="SUPORTE" '+(r.role==='SUPORTE'?'selected':'')+'>Suporte</option><option value="ATENDENTE" '+(r.role==='ATENDENTE'?'selected':'')+'>Atendente</option></select><button class="danger" onclick="removeRole(\''+esc(r.user_id)+'\',this)">Remover</button></div>'))+'</div>'}).join('');$('list').innerHTML=list||'<div class="empty">Nenhum membro administrativo.</div>'}function search(){const q=$('search').value.trim().toLowerCase().replace(/^@/,'');if(!q||String(adminRole).toUpperCase()!=='LIDER'){$('results').innerHTML='';return}const existing=new Set(roles.map(r=>String(r.user_id)));const found=profiles.filter(p=>String(p.id)!==String(adminUser.id)&&!existing.has(String(p.id))&&[p.id,p.display_name,p.username,p.roblox_username].filter(Boolean).join(' ').toLowerCase().includes(q)).slice(0,10);$('results').innerHTML=found.map(p=>'<div class="candidate"><div class="row"><div class="id"><img class="avatar" src="'+esc(p.avatar_url||'/logo.png')+'"><div><b>'+esc(name(p.id))+'</b><div class="muted">'+esc(handle(p.id))+' · '+esc(p.id)+'</div></div></div><div class="actions"><button onclick="addRole(\''+esc(p.id)+'\',\'ADMINISTRADOR\',this)">Administrador</button><button onclick="addRole(\''+esc(p.id)+'\',\'SUPORTE\',this)">Suporte</button><button onclick="addRole(\''+esc(p.id)+'\',\'ATENDENTE\',this)">Atendente</button></div></div></div>').join('')||'<div class="empty">Nenhum usuário encontrado.</div>'}$('search').addEventListener('input',search);async function addRole(id,role,b){await action('set',id,role,b)}async function changeRole(id,role,b){await action('set',id,role,b)}async function removeRole(id,b){if(!confirm('Remover o cargo administrativo deste usuário?'))return;await action('remove',id,null,b)}async function action(type,id,role,b){if(busy)return;if(String(adminRole).toUpperCase()!=='LIDER'){adminToast('Somente o Líder pode gerenciar cargos.');return}busy=true;if(b)b.disabled=true;try{let result;if(type==='set')result=await adminRpc('manage_admin_role',{p_target_user_id:id,p_role:role});else result=await adminRpc('remove_admin_role',{p_target_user_id:id});if(!result?.ok)throw Error('O Supabase não confirmou a alteração.');adminToast(type==='set'?'Cargo salvo com sucesso.':'Cargo removido com sucesso.',true);await load()}catch(e){console.error(e);adminToast(e.message||'Não foi possível alterar o cargo.');notice(e.message||'Falha ao alterar o cargo.')}finally{if(b)b.disabled=false;busy=false}}load();</script></body></html>
