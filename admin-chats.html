<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:25px 16px}.row{padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between}.messages{margin-top:20px}.msg{padding:10px;border:1px solid #292930;border-radius:10px;margin:7px 0;background:#0d0d10}button,a{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}</style></head><body><main class="wrap"><a href="/admin.html">← Painel</a><h1>💬 Conversas</h1><p style="color:#888">Área exclusiva para análise de moderação. E-mails não são exibidos.</p><div id="list">Carregando...</div><div id="messages" class="messages"></div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('direct_conversations').select('id,user_a,user_b,updated_at').order('updated_at',{ascending:false}).limit(100);if(error)return list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';list.innerHTML=data?.length?data.map(x=>'<div class="row"><span>Conversa '+adminEsc(String(x.id).slice(0,8))+' · '+adminEsc(String(x.user_a).slice(0,8))+' ↔ '+adminEsc(String(x.user_b).slice(0,8))+'</span><button onclick="openChat(\''+x.id+'\')">Analisar</button></div>').join(''):'Nenhuma conversa.'}async function openChat(id){const {data,error}=await adminSB.from('direct_messages').select('sender_id,body,created_at').eq('conversation_id',id).order('created_at');if(error)return adminToast(error.message);messages.innerHTML='<h2>Conversa</h2>'+(data?.length?data.map(x=>'<div class="msg"><small>'+adminEsc(String(x.sender_id).slice(0,8))+' · '+new Date(x.created_at).toLocaleString('pt-BR')+'</small><div>'+adminEsc(x.body)+'</div></div>').join(''):'<p>Nenhuma mensagem.') }load()</script></body></html>
