<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.grid{display:grid;grid-template-columns:360px 1fr;gap:12px}.card,.row{background:#101013;border:1px solid #292930;border-radius:14px}.row{padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px;cursor:pointer}.row:hover{border-color:#555}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222}.muted{color:#888}.msg{padding:11px;border:1px solid #292930;border-radius:12px;margin:8px 0;background:#0d0d10}.who{display:flex;align-items:center;gap:9px;margin-bottom:6px}.thumb{max-width:280px;max-height:280px;border-radius:10px;display:block;margin-top:8px}.btn{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="btn" href="/admin.html">← Painel</a><h1>💬 Análise de conversas</h1><p class="muted">Identidade visual, mensagens e imagens enviadas. E-mails nunca são exibidos.</p><div class="grid"><section class="card" style="padding:12px"><div id="list">Carregando...</div></section><section class="card" style="padding:16px"><div id="messages"><p class="muted">Selecione uma conversa.</p></div></section></div></main><script>const $=id=>document.getElementById(id);async function load(){if(!await requireAdmin())return;const r=await adminSB.from('direct_conversations').select('id,user_a,user_b,updated_at').order('updated_at',{ascending:false}).limit(200);if(r.error)return $('list').innerHTML='<p style="color:#ff8585">'+adminEsc(r.error.message)+'</p>';const rows=r.data||[];const ids=[...new Set(rows.flatMap(x=>[x.user_a,x.user_b]))];const pr=ids.length?await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids):{data:[]};const pm=new Map((pr.data||[]).map(x=>[x.id,x]));$('list').innerHTML=rows.map(x=>{const a=pm.get(x.user_a)||{},b=pm.get(x.user_b)||{};return `<div class="row" onclick="openChat('${x.id}')"><img class="avatar" src="${adminEsc(a.avatar_url||'')}" onerror="this.style.display='none'"><div><b>${adminEsc(a.display_name||a.username||'Usuário')}</b> <span class="muted">↔</span> <b>${adminEsc(b.display_name||b.username||'Usuário')}</b><div class="muted">${new Date(x.updated_at).toLocaleString('pt-BR')}</div></div></div>`}).join('')||'<p class="muted">Nenhuma conversa.</p>'}async function openChat(id){const r=await adminSB.from('direct_messages').select('sender_id,body,image_url,created_at').eq('conversation_id',id).order('created_at',{ascending:true});if(r.error)return adminToast(r.error.message);const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.sender_id))];const pr=ids.length?await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids):{data:[]};const pm=new Map((pr.data||[]).map(x=>[x.id,x]));$('messages').innerHTML='<h2>Conversa</h2>'+(rows.map(x=>{const p=pm.get(x.sender_id)||{};return `<div class="msg"><div class="who"><img class="avatar" src="${adminEsc(p.avatar_url||'')}" onerror="this.style.display='none'"><b>${adminEsc(p.display_name||p.username||'Usuário')}</b><span class="muted">@${adminEsc(p.username||'usuário')} · ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div><div>${adminEsc(x.body||'')}</div>${x.image_url?`<a href="${adminEsc(x.image_url)}" target="_blank" rel="noopener"><img class="thumb" src="${adminEsc(x.image_url)}" alt="Imagem enviada"></a>`:''}</div>`}).join('')||'<p class="muted">Nenhuma mensagem.</p>');}load();</script></body></html>
