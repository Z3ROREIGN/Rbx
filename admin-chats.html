<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--panel2:#171b1f;--line:#293038;--text:#f3f5f7;--muted:#8e98a2;--red:#d92f3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0;font-size:28px}.sub{color:var(--muted);margin:0}.tools{display:flex;gap:8px;margin-bottom:12px}.input{flex:1;min-height:44px;background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;padding:0 12px;outline:0}.btn{min-height:42px;padding:0 14px;border:1px solid #343c44;background:#191d21;color:#fff;border-radius:6px;cursor:pointer;font-weight:800}.layout{display:grid;grid-template-columns:390px 1fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.list{max-height:680px;overflow:auto;padding:8px}.conversation{padding:13px;border:1px solid transparent;border-radius:6px;display:flex;gap:10px;cursor:pointer}.conversation:hover,.conversation.active{background:#1b2025;border-color:#343c44}.avatar{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#2b1216;flex:none}.name{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:3px}.detail{min-height:600px;padding:18px}.detail-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}.messages{padding-top:10px}.message{background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:6px;margin:8px 0}.who{display:flex;align-items:center;gap:9px;margin-bottom:7px}.thumb{max-width:min(360px,100%);max-height:360px;border-radius:5px;margin-top:8px;display:block}.empty{color:var(--muted);padding:25px;text-align:center}.count{font-size:11px;color:var(--muted);padding:0 3px 7px}.loading{opacity:.6;pointer-events:none}@media(max-width:800px){.wrap{padding:18px 12px 95px}.layout{grid-template-columns:1fr}.list{max-height:360px}.detail{min-height:500px}.tools{flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Moderação</div><h1>Análise de conversas</h1><p class="sub">Pesquise qualquer participante por nome, @username ou ID e revise todo o histórico da conversa.</p></header><div class="tools"><input class="input" id="search" placeholder="Pesquisar nome, @username ou ID" autocomplete="off"><button class="btn" onclick="loadList()">Atualizar</button></div><div class="layout"><section class="panel"><div class="list"><div id="count" class="count"></div><div id="list" class="empty">Carregando conversas...</div></div></section><section class="panel detail"><div id="messages" class="empty">Selecione uma conversa para analisar.</div></section></div></main><script>const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let conversations=[],profiles=new Map(),selected=null,searchTimer=null;const getP=id=>profiles.get(id)||{},display=id=>getP(id).display_name||getP(id).username||getP(id).roblox_username||'Usuário',handle=id=>getP(id).username?('@'+getP(id).username):(getP(id).roblox_username?('@'+getP(id).roblox_username):'@usuário');async function loadList(){if(!await requireAdmin())return;const box=$('list');box.classList.add('loading');try{const term=$('search').value.trim();profiles.clear();let url='/api/admin-data?resource=direct_conversations&limit=1000&order=updated_at&asc=false';if(term){const p=await adminGet('/api/admin-data?resource=profiles&limit=1000');const all=p.data||[];for(const x of all)profiles.set(x.id,x);const normalized=term.toLowerCase().replace(/^@/,'');const ids=all.filter(x=>[x.display_name,x.username,x.roblox_username,x.email,x.id].filter(Boolean).join(' ').toLowerCase().includes(normalized)).map(x=>x.id);if(!ids.length){conversations=[];renderList();return}url='/api/admin-data?resource=direct_conversations&participant_ids='+encodeURIComponent(ids.join(','))+'&limit=1000&order=updated_at&asc=false'}const r=await adminGet(url);conversations=r.data||[];const ids=[...new Set(conversations.flatMap(c=>[c.user_a,c.user_b]).filter(Boolean))];if(ids.length){const p=await adminGet('/api/admin-data?resource=profiles&user_ids='+encodeURIComponent(ids.join(','))+'&limit=1000');for(const x of p.data||[])profiles.set(x.id,x)}renderList();const requested=new URLSearchParams(location.search).get('conversation');if(requested&&conversations.some(c=>c.id===requested))openConversation(requested)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}finally{box.classList.remove('loading')}}function renderList(){const q=$('search').value.trim().toLowerCase().replace(/^@/,'');const arr=q?conversations.filter(c=>[c.user_a,c.user_b].some(id=>[display(id),handle(id),getP(id).roblox_username||'',getP(id).email||'',id].join(' ').toLowerCase().includes(q))):conversations;$('count').textContent=arr.length+' conversa'+(arr.length===1?'':'s');$('list').innerHTML=arr.length?arr.map(c=>'<div class="conversation '+(selected===c.id?'active':'')+'" onclick="openConversation('+JSON.stringify(c.id)+')"><img class="avatar" src="'+esc(getP(c.user_a).avatar_url||'/logo.png')+'" onerror="this.src=\'/logo.png\'"><div style="min-width:0"><div class="name">'+esc(display(c.user_a))+' <span style="color:#65707a">×</span> '+esc(display(c.user_b))+'</div><div class="meta">'+esc(handle(c.user_a))+' · '+esc(handle(c.user_b))+'</div><div class="meta">'+new Date(c.updated_at||c.created_at).toLocaleString('pt-BR')+'</div></div></div>').join(''):'<div class="empty">Nenhuma conversa encontrada.</div>'}async function openConversation(id){selected=id;renderList();$('messages').innerHTML='<div class="empty">Carregando mensagens...</div>';try{const c=conversations.find(x=>x.id===id);if(!c)throw Error('Conversa não encontrada.');const r=await adminGet('/api/admin-data?resource=direct_messages&conversation_id='+encodeURIComponent(id)+'&limit=1000&order=created_at&asc=true');const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.sender_id).filter(Boolean))];if(ids.length){const p=await adminGet('/api/admin-data?resource=profiles&user_ids='+encodeURIComponent(ids.join(','))+'&limit=1000');for(const x of p.data||[])profiles.set(x.id,x)}$('messages').innerHTML='<div class="detail-head"><img class="avatar" src="'+esc(getP(c.user_a).avatar_url||'/logo.png')+'" onerror="this.src=\'/logo.png\'"><div><div class="name">'+esc(display(c.user_a))+' × '+esc(display(c.user_b))+'</div><div class="meta">'+esc(handle(c.user_a))+' · '+esc(handle(c.user_b))+' · '+rows.length+' mensagem'+(rows.length===1?'':'ns')+'</div></div></div><div class="messages">'+(rows.length?rows.map(m=>{const p=getP(m.sender_id);return '<article class="message"><div class="who"><img class="avatar" src="'+esc(p.avatar_url||'/logo.png')+'" onerror="this.src=\'/logo.png\'"><div><b>'+esc(p.display_name||p.username||p.roblox_username||'Usuário')+'</b><div class="meta">'+esc(handle(m.sender_id))+' · '+new Date(m.created_at).toLocaleString('pt-BR')+'</div></div></div><div>'+esc(m.body||'')+'</div>'+(m.image_url?'<a href="'+esc(m.image_url)+'" target="_blank" rel="noopener noreferrer"><img class="thumb" src="'+esc(m.image_url)+'" alt="Imagem enviada"></a>':'')+'</article>'}).join(''):'<div class="empty">Nenhuma mensagem nessa conversa.</div>')+'</div>'}catch(e){$('messages').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadList,250)});loadList();setInterval(loadList,30000)</script></body></html>
