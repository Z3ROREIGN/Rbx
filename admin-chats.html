<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--panel2:#171b1f;--line:#293038;--text:#f3f5f7;--muted:#8e98a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:#d92f3d;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0;font-size:26px}.sub{color:var(--muted);margin:0}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1;min-height:44px}.tools button,button{min-height:42px}.input{background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;padding:0 12px;outline:0}.layout{display:grid;grid-template-columns:390px 1fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.list{max-height:680px;overflow:auto;padding:8px}.conversation{padding:13px;border:1px solid transparent;border-radius:6px;display:flex;gap:10px;cursor:pointer}.conversation:hover,.conversation.active{background:#1b2025;border-color:#343c44}.avatar{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#2b1216;flex:none}.name{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:3px}.detail{min-height:600px;padding:18px}.detail-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}.messages{padding-top:10px}.message{background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:6px;margin:8px 0}.who{display:flex;align-items:center;gap:9px;margin-bottom:7px}.thumb{max-width:min(360px,100%);max-height:360px;border-radius:5px;margin-top:8px;display:block}.empty{color:var(--muted);padding:25px;text-align:center}.count{font-size:11px;color:var(--muted);padding:0 3px 7px}@media(max-width:800px){.wrap{padding:18px 12px 95px}.layout{grid-template-columns:1fr}.list{max-height:360px}.detail{min-height:500px}.tools{flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Moderação</div><h1>Análise de conversas</h1><p class="sub">Encontre participantes por nome ou @username e revise mensagens e imagens.</p></header><div class="tools"><input class="input" id="search" placeholder="Pesquisar nome ou @username" autocomplete="off"><button onclick="loadList()">Atualizar</button></div><div class="layout"><section class="panel"><div class="list"><div id="count" class="count"></div><div id="list" class="empty">Carregando conversas...</div></div></section><section class="panel detail"><div id="messages" class="empty">Selecione uma conversa para analisar.</div></section></div></main><script>const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let conversations=[],profiles=new Map(),selected=null;const getP=id=>profiles.get(id)||{},display=id=>getP(id).display_name||getP(id).username||'Usuário',handle=id=>getP(id).username?('@'+getP(id).username):'@usuário';async function loadList(){if(!await requireAdmin())return;const r=await adminSB.from('direct_conversations').select('id,user_a,user_b,updated_at').order('updated_at',{ascending:false}).limit(500);if(r.error){$('list').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}conversations=r.data||[];const ids=[...new Set(conversations.flatMap(c=>[c.user_a,c.user_b]))];if(ids.length){const p=await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids);if(p.error){$('list').innerHTML='<div class="empty">'+esc(p.error.message)+'</div>';return}profiles=new Map((p.data||[]).map(x=>[x.id,x]))}renderList();const requested=new URLSearchParams(location.search).get('conversation');if(requested&&!selected&&conversations.some(c=>c.id===requested))openConversation(requested)}function renderList(){const q=$('search').value.trim().toLowerCase().replace(/^@/,'');const arr=conversations.filter(c=>!q||[c.user_a,c.user_b].some(id=>(display(id)+' '+handle(id)).toLowerCase().includes(q)));$('count').textContent=arr.length+' conversa'+(arr.length===1?'':'s');$('list').innerHTML=arr.length?arr.map(c=>`<div class="conversation ${selected===c.id?'active':''}" onclick="openConversation('${esc(c.id)}')"><img class="avatar" src="${esc(getP(c.user_a).avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div style="min-width:0"><div class="name">${esc(display(c.user_a))} <span style="color:#65707a">×</span> ${esc(display(c.user_b))}</div><div class="meta">${esc(handle(c.user_a))} · ${esc(handle(c.user_b))}</div><div class="meta">${new Date(c.updated_at).toLocaleString('pt-BR')}</div></div></div>`).join(''):'<div class="empty">Nenhuma conversa encontrada.</div>'}async function openConversation(id){selected=id;renderList();$('messages').innerHTML='<div class="empty">Carregando mensagens...</div>';const c=conversations.find(x=>x.id===id),r=await adminSB.from('direct_messages').select('sender_id,body,image_url,created_at').eq('conversation_id',id).order('created_at',{ascending:true});if(r.error){$('messages').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const ids=[...new Set((r.data||[]).map(x=>x.sender_id))];if(ids.length){const p=await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids);if(!p.error)for(const x of p.data||[])profiles.set(x.id,x)}const rows=r.data||[];$('messages').innerHTML=`<div class="detail-head"><img class="avatar" src="${esc(getP(c?.user_a).avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><div class="name">${esc(c?display(c.user_a):'Conversa')} × ${esc(c?display(c.user_b):'')}</div><div class="meta">${esc(c?handle(c.user_a):'')} · ${esc(c?handle(c.user_b):'')} · ${rows.length} mensagem${rows.length===1?'':'ns'}</div></div></div><div class="messages">${rows.length?rows.map(m=>{const p=getP(m.sender_id);return `<article class="message"><div class="who"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(p.display_name||p.username||'Usuário')}</b><div class="meta">@${esc(p.username||'usuário')} · ${new Date(m.created_at).toLocaleString('pt-BR')}</div></div></div><div>${esc(m.body||'')}</div>${m.image_url?`<a href="${esc(m.image_url)}" target="_blank" rel="noopener noreferrer"><img class="thumb" src="${esc(m.image_url)}" alt="Imagem enviada"></a>`:''}</article>`}).join(''):'<div class="empty">Nenhuma mensagem nessa conversa.</div>'}</div>`}$('search').addEventListener('input',renderList);loadList();setInterval(loadList,30000)</script></body></html>
