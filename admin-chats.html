<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1150px;margin:auto;padding:25px 16px}.grid{display:grid;grid-template-columns:380px 1fr;gap:12px}.card,.row{background:#101013;border:1px solid #292930;border-radius:14px}.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1;background:#0b0b0e;color:#fff;border:1px solid #303038;border-radius:10px;padding:12px;outline:none}.search button{background:#fff;color:#000;border:0;border-radius:10px;padding:0 14px;font-weight:700}.row{padding:12px;margin:8px 0;display:flex;align-items:center;gap:11px;cursor:pointer}.row:hover,.row.active{border-color:#777}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#222;flex:none}.muted{color:#888}.msg{padding:11px;border:1px solid #292930;border-radius:12px;margin:8px 0;background:#0d0d10}.who{display:flex;align-items:center;gap:9px;margin-bottom:6px}.thumb{max-width:280px;max-height:280px;border-radius:10px;display:block;margin-top:8px}.btn{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}.count{font-size:12px;color:#777;margin:8px 2px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="btn" href="/admin.html">← Painel</a><h1>💬 Análise de conversas</h1><p class="muted">Pesquise pelo nome ou @username para localizar rapidamente as conversas. E-mails não são exibidos.</p><section class="card" style="padding:12px;margin:14px 0"><div class="search"><input id="search" placeholder="🔎 Pesquisar nome ou @username..." autocomplete="off"><button onclick="applySearch()">Pesquisar</button></div><div id="count" class="count"></div></section><div class="grid"><section class="card" style="padding:12px"><div id="list">Carregando...</div></section><section class="card" style="padding:16px"><div id="messages"><p class="muted">Selecione uma conversa.</p></div></section></div></main><script>const $=id=>document.getElementById(id);let conversations=[],profiles=new Map(),selectedId=null;const esc=v=>typeof adminEsc==='function'?adminEsc(v):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!await requireAdmin())return;const r=await adminSB.from('direct_conversations').select('id,user_a,user_b,updated_at').order('updated_at',{ascending:false}).limit(500);if(r.error)return $('list').innerHTML='<p style="color:#ff8585">'+esc(r.error.message)+'</p>';conversations=r.data||[];const ids=[...new Set(conversations.flatMap(x=>[x.user_a,x.user_b]))];if(ids.length){const pr=await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids);if(pr.error)return $('list').innerHTML='<p style="color:#ff8585">'+esc(pr.error.message)+'</p>';profiles=new Map((pr.data||[]).map(x=>[x.id,x]))}renderList();}function person(id){return profiles.get(id)||{}}function name(id){const p=person(id);return p.display_name||p.username||'Usuário'}function username(id){return person(id).username||''}function renderList(){const q=$('search').value.trim().toLowerCase().replace(/^@/,'');const filtered=!q?conversations:conversations.filter(c=>[c.user_a,c.user_b].some(id=>name(id).toLowerCase().includes(q)||username(id).toLowerCase().includes(q)));$('count').textContent=`${filtered.length} conversa${filtered.length===1?'':'s'} encontrada${filtered.length===1?'':'s'}`;$('list').innerHTML=filtered.map(x=>{const a=person(x.user_a),b=person(x.user_b);return `<div class="row ${selectedId===x.id?'active':''}" onclick="openChat('${esc(x.id)}')"><img class="avatar" src="${esc(a.avatar_url||'')}" onerror="this.src='/logo.png'"><div style="min-width:0"><div><b>${esc(name(x.user_a))}</b> <span class="muted">↔</span> <b>${esc(name(x.user_b))}</b></div><div class="muted">@${esc(username(x.user_a)||'usuário')} ↔ @${esc(username(x.user_b)||'usuário')}</div><div class="muted">${new Date(x.updated_at).toLocaleString('pt-BR')}</div></div></div>`}).join('')||'<p class="muted">Nenhuma conversa encontrada.</p>'}function applySearch(){renderList()}$('search').addEventListener('input',renderList);async function openChat(id){selectedId=id;renderList();const r=await adminSB.from('direct_messages').select('sender_id,body,image_url,created_at').eq('conversation_id',id).order('created_at',{ascending:true});if(r.error)return adminToast(r.error.message);const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.sender_id))];if(ids.length){const pr=await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids);if(!pr.error)for(const p of pr.data||[])profiles.set(p.id,p)}const c=conversations.find(x=>x.id===id);$('messages').innerHTML=`<h2>${esc(c?name(c.user_a)+' ↔ '+name(c.user_b):'Conversa')}</h2><p class="muted">${rows.length} mensagem${rows.length===1?'':'ns'}</p>`+(rows.map(x=>{const p=person(x.sender_id);return `<div class="msg"><div class="who"><img class="avatar" src="${esc(p.avatar_url||'')}" onerror="this.src='/logo.png'"><div><b>${esc(p.display_name||p.username||'Usuário')}</b><br><span class="muted">@${esc(p.username||'usuário')} · ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div></div><div>${esc(x.body||'')}</div>${x.image_url?`<a href="${esc(x.image_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(x.image_url)}" alt="Imagem enviada"></a>`:''}</div>`}).join('')||'<p class="muted">Nenhuma mensagem.</p>')}load();</script></body></html>
