<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.row{padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:9px 0}.muted{color:#888}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>📋 Logs administrativos</h1><div id="list">Carregando...</div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('admin_audit_logs').select('admin_id,action,target_user_id,metadata,created_at').order('created_at',{ascending:false}).limit(200);if(error)return list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';list.innerHTML=data?.length?data.map(x=>'<div class="row"><b>'+adminEsc(x.action)+'</b><div class="muted">Admin: '+adminEsc(String(x.admin_id||'').slice(0,8))+' · Alvo: '+adminEsc(String(x.target_user_id||'').slice(0,8))+' · '+new Date(x.created_at).toLocaleString('pt-BR')+'</div><div>'+adminEsc(JSON.stringify(x.metadata||{}))+'</div></div>').join(''):'Nenhum log registrado.'}load()</script></body></html>
