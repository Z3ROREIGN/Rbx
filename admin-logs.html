<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--panel2:#171b1f;--line:#293038;--text:#f3f5f7;--muted:#8e98a2;--red:#d92f3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0}.sub,.meta{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,select{background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;min-height:42px;padding:0 12px;outline:0}.input{flex:1;min-width:230px}.log{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:12px}.action{font-weight:800}.actor{display:flex;align-items:center;gap:8px;margin-top:10px}.avatar{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#32151a}.data{margin-top:10px;background:#0b0e10;border:1px solid var(--line);padding:10px;border-radius:5px;white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,SFMono-Regular,monospace;color:#cbd1d6}.empty{padding:20px;color:var(--muted);text-align:center}@media(max-width:650px){.wrap{padding:18px 12px 95px}.toolbar{flex-direction:column}.top{display:block}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Auditoria</div><h1>Registro de atividades</h1><p class="sub">Acompanhe ações administrativas, responsáveis e alvos.</p></header><div class="toolbar"><input class="input" id="search" placeholder="Pesquisar ação, administrador, usuário ou dados"><select id="limit" class="input"><option value="50">50 registros</option><option value="100">100 registros</option><option value="200" selected>200 registros</option></select></div><section id="list"><div class="empty">Carregando registros...</div></section></main><script>const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let logs=[],profiles=new Map();async function load(){if(!await requireAdmin())return;const r=await adminSB.from('admin_audit_logs').select('admin_id,action,target_user_id,metadata,created_at').order('created_at',{ascending:false}).limit(Number($('limit').value));if(r.error){$('list').innerHTML='<div class="log">'+esc(r.error.message)+'</div>';return}logs=r.data||[];const ids=[...new Set(logs.flatMap(x=>[x.admin_id,x.target_user_id]).filter(Boolean))];if(ids.length){const p=await adminSB.from('profiles').select('id,display_name,username,avatar_url').in('id',ids);if(!p.error)profiles=new Map((p.data||[]).map(x=>[x.id,x]))}render()}const person=id=>profiles.get(id)||{};const label=id=>{const p=person(id);return p.display_name||p.username||id||'Sistema'};const handle=id=>{const p=person(id);return p.username?'@'+p.username:''};function render(){const q=$('search').value.trim().toLowerCase();const rows=logs.filter(x=>!q||[x.action,label(x.admin_id),handle(x.admin_id),label(x.target_user_id),handle(x.target_user_id),JSON.stringify(x.metadata||{})].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(x=>{const a=person(x.admin_id),t=person(x.target_user_id);return `<article class="log"><div class="top"><span class="action">${esc(x.action||'Ação')}</span><span class="meta">${new Date(x.created_at).toLocaleString('pt-BR')}</span></div><div class="actor"><img class="avatar" src="${esc(a.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(label(x.admin_id))}</b> <span class="meta">${esc(handle(x.admin_id))}</span><div class="meta">Administrador</div></div></div>${x.target_user_id?`<div class="actor"><img class="avatar" src="${esc(t.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(label(x.target_user_id))}</b> <span class="meta">${esc(handle(x.target_user_id))}</span><div class="meta">Alvo</div></div></div>`:''}<div class="data">${esc(JSON.stringify(x.metadata||{},null,2))}</div></article>`}).join(''):'<div class="empty">Nenhum registro encontrado.</div>'}$('search').oninput=render;$('limit').onchange=load;load();setInterval(load,30000)</script></body></html>
