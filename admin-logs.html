<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>.admin-content{display:grid;gap:12px}.log-toolbar{display:flex;gap:8px;flex-wrap:wrap}.log-toolbar input,.log-toolbar select{flex:1;min-width:180px}.log{padding:16px;background:#111417;border:1px solid #2a3036;border-radius:7px}.log-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.log-action{font-weight:800}.log-meta{color:#929aa3;font-size:12px;margin-top:5px}.log-data{margin-top:10px;padding:10px;background:#0b0e10;border:1px solid #252b31;border-radius:5px;white-space:pre-wrap;word-break:break-word;color:#c7cdd2;font:12px ui-monospace,SFMono-Regular,monospace}@media(max-width:650px){.log-head{display:block}}</style></head><body><main class="wrap"><div class="admin-content"><div class="log-toolbar"><input id="search" placeholder="Pesquisar ação, administrador ou alvo"><select id="limit"><option value="50">50 registros</option><option value="100">100 registros</option><option value="200" selected>200 registros</option></select></div><div id="list">Carregando registros...</div></div></main><script>let logs=[];const $=id=>document.getElementById(id);const esc=v=>adminEsc(v);async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('admin_audit_logs').select('admin_id,action,target_user_id,metadata,created_at').order('created_at',{ascending:false}).limit(Number($('limit').value));if(error){$('list').innerHTML='<div class="log">'+esc(error.message)+'</div>';return}logs=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase();const rows=logs.filter(x=>(!q||[x.action,x.admin_id,x.target_user_id,JSON.stringify(x.metadata||{})].join(' ').toLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(x=>'<article class="log"><div class="log-head"><span class="log-action">'+esc(x.action||'Ação')+'</span><span class="log-meta">'+new Date(x.created_at).toLocaleString('pt-BR')+'</span></div><div class="log-meta">Administrador: '+esc(x.admin_id||'—')+' · Alvo: '+esc(x.target_user_id||'—')+'</div><div class="log-data">'+esc(JSON.stringify(x.metadata||{},null,2))+'</div></article>').join(''):'<div class="log">Nenhum registro encontrado.</div>'}$('search').oninput=render;$('limit').onchange=load;load();setInterval(load,30000)</script></body></html>
