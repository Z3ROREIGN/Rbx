<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 4%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn{padding:10px 14px;border-radius:7px;border:1px solid #3b4148;background:#171a1d;color:#fff;cursor:pointer;font-weight:700}.btn:hover{border-color:#e3343f}.ok{background:#173a27;border-color:#356d49}.bad{background:#3a171c;border-color:#713039}.card{background:#151719;border:1px solid #292e33;border-radius:9px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#929aa3}.list{display:grid;gap:12px}.back{color:#ff5962;text-decoration:none;font-weight:700}h1,h2{color:#f5f6f7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}input,select{width:100%;padding:10px;margin:5px 0 9px;background:#0d0f10;border:1px solid #343a40;border-radius:7px;color:#fff}small{color:#929aa3}@media(max-width:700px){.wrap{padding:25px 4%}}</style></head><body><main class="wrap"><a class="back" href="/admin.html">← Painel administrativo</a><h1>Marketplace</h1><p class="muted">Controle de vendedores, produtos, pedidos, saques e auditoria.</p><div class="tabs"><button class="btn" onclick="show('apps')">Vendedores</button><button class="btn" onclick="show('products')">Produtos</button><button class="btn" onclick="show('orders')">Pedidos</button><button class="btn" onclick="show('withdrawals')">Saques</button><button class="btn" onclick="show('archives')">Conversas arquivadas</button></div><section id="content">Carregando...</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,data={};async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error('Configuração do Supabase indisponível.');sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'} });const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){document.querySelector('#content').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}async function token(){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sessão expirada.');return s.access_token}async function api(body){const t=await token(),r=await fetch('/api/admin-marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function load(){const t=await token(),r=await fetch('/api/admin-marketplace',{headers:{Authorization:'Bearer '+t},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível carregar o Marketplace administrativo.');data=d;show('apps')}function show(type){const c=document.querySelector('#content');if(type==='apps')c.innerHTML='<h2>Solicitações de vendedor</h2><div class="list">'+(data.applications||[]).map(x=>`<div class="card"><div class="row"><div><b>${esc(x.full_name)}</b><br><span class="muted">${esc(x.email)} • ${esc(x.phone)}<br>CPF: ${esc(x.cpf)} • Nascimento: ${esc(x.birth_date)}<br>Status: ${esc(x.status)}</span></div><div>${x.status==='PENDING'?`<button class="btn ok" onclick="review('${x.id}','APPROVED')">Aprovar</button> <button class="btn bad" onclick="review('${x.id}','REJECTED')">Recusar</button>`:''}</div></div></div>`).join('')||'<div class="card muted">Nenhuma solicitação.</div></div>';if(type==='products')c.innerHTML='<h2>Produtos</h2><div class="grid">'+(data.products||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.category)} • R$ ${Number(x.price).toFixed(2)} • estoque ${x.quantity} • ${x.active?'Ativo':'Inativo'}</span><div class="actions"><button class="btn" onclick="editProduct('${x.id}')">Editar</button><button class="btn" onclick="toggleProduct('${x.id}',${!x.active})">${x.active?'Desativar':'Ativar'}</button><button class="btn bad" onclick="deleteProduct('${x.id}')">Excluir</button></div></div>`).join('')||'<div class="card muted">Nenhum produto cadastrado.</div></div>';if(type==='orders')c.innerHTML='<h2>Pedidos</h2><div class="list">'+(data.orders||[]).map(x=>`<div class="card"><b>${esc(x.marketplace_products?.title||'Produto')}</b><br>R$ ${Number(x.subtotal).toFixed(2)} • ${esc(x.status)} • qtd. ${x.quantity}<br><small>${esc(x.id)}</small><div class="actions"><button class="btn" onclick="orderStatus('${x.id}','DELIVERING')">Marcar entrega</button><button class="btn ok" onclick="orderStatus('${x.id}','COMPLETED')">Concluir</button><button class="btn bad" onclick="orderStatus('${x.id}','CANCELLED')">Cancelar</button></div></div>`).join('')||'<div class="card muted">Nenhum pedido.</div></div>';if(type==='withdrawals')c.innerHTML='<h2>Saques</h2><div class="list">'+(data.withdrawals||[]).map(x=>`<div class="card"><b>R$ ${Number(x.amount).toFixed(2)}</b> + taxa R$ ${Number(x.fee).toFixed(2)}<br>PIX: ${esc(x.pix_key)}<br>Status: ${esc(x.status)}<div class="actions">${x.status==='PENDING'?`<button class="btn" onclick="wd('${x.id}','PROCESSING')">Processando</button><button class="btn ok" onclick="wd('${x.id}','PAID')">Pago</button><button class="btn bad" onclick="wd('${x.id}','REJECTED')">Recusar</button>`:''}</div></div>`).join('')||'<div class="card muted">Nenhum saque.</div></div>';if(type==='archives')c.innerHTML='<h2>Conversas arquivadas</h2><div class="list">'+(data.archives||[]).map(x=>`<div class="card"><b>Pedido ${esc(x.order_id)}</b><br><span class="muted">Arquivado em ${new Date(x.archived_at).toLocaleString('pt-BR')}</span><br><small>Conteúdo armazenado de forma criptografada.</small></div>`).join('')||'<div class="card muted">Nenhuma conversa arquivada.</div></div>'}async function review(id,status){try{let reason='';if(status==='REJECTED')reason=prompt('Motivo da recusa:')||'Não aprovado pela equipe.';await api({action:'review-seller',id,status,reason});await load()}catch(e){alert(e.message)}}async function wd(id,status){try{await api({action:'withdrawal',id,status});await load()}catch(e){alert(e.message)}}async function orderStatus(id,status){try{await api({action:'order-status',id,status});await load()}catch(e){alert(e.message)}}async function editProduct(id){const p=(data.products||[]).find(x=>x.id===id);if(!p)return;const title=prompt('Título do produto:',p.title);if(title===null)return;const price=prompt('Preço:',p.price);if(price===null)return;const quantity=prompt('Quantidade em estoque:',p.quantity);if(quantity===null)return;try{await api({action:'update-product',id,title,price:Number(price),quantity:Number(quantity)});await load();show('products')}catch(e){alert(e.message)}}async function toggleProduct(id,active){try{await api({action:'update-product',id,active});await load();show('products')}catch(e){alert(e.message)}}async function deleteProduct(id){if(!confirm('Excluir este produto?'))return;try{await api({action:'delete-product',id});await load();show('products')}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot()</script><script src="/site-nav.js"></script></body></html>
