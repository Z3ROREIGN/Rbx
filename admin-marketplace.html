<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Inter,system-ui}.wrap{max-width:1250px;margin:auto;padding:30px 4%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn{padding:10px 14px;border-radius:10px;border:1px solid #2b4260;background:#112139;color:#fff;cursor:pointer}.ok{background:#155c45}.bad{background:#6d2631}.card{background:#0d1a2b;border:1px solid #253a55;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#9db0c8}.list{display:grid;gap:12px}</style></head><body><main class="wrap"><a href="/admin.html">← Painel administrativo</a><h1>Marketplace</h1><p class="muted">Aprovação de vendedores, pedidos, saques e auditoria de conversas encerradas.</p><div class="tabs"><button class="btn" onclick="show('apps')">Vendedores</button><button class="btn" onclick="show('orders')">Pedidos</button><button class="btn" onclick="show('withdrawals')">Saques</button><button class="btn" onclick="show('archives')">Conversas arquivadas</button></div><section id="content">Carregando...</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,data;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);load()}async function api(body={}){const t=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch('/api/admin-marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){const t=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch('/api/admin-marketplace',{headers:{Authorization:'Bearer '+t}});data=await r.json();if(!r.ok)throw Error(data.error);show('apps')}function show(type){const c=document.querySelector('#content');if(type==='apps')c.innerHTML='<h2>Solicitações de vendedor</h2><div class="list">'+(data.applications||[]).map(x=>`<div class="card"><div class="row"><div><b>${x.full_name}</b><br><span class="muted">${x.email} • ${x.phone}<br>CPF: ${x.cpf} • Nascimento: ${x.birth_date}<br>Status: ${x.status}</span></div><div>${x.status==='PENDING'?`<button class="btn ok" onclick="review('${x.id}','APPROVED')">Aprovar</button> <button class="btn bad" onclick="review('${x.id}','REJECTED')">Recusar</button>`:''}</div></div></div>`).join('')+'</div>';if(type==='orders')c.innerHTML='<h2>Pedidos</h2><div class="list">'+(data.orders||[]).map(x=>`<div class="card"><b>${x.marketplace_products?.title||'Produto'}</b><br>R$ ${Number(x.subtotal).toFixed(2)} • ${x.status}<br><span class="muted">${x.id}</span></div>`).join('')+'</div>';if(type==='withdrawals')c.innerHTML='<h2>Saques</h2><div class="list">'+(data.withdrawals||[]).map(x=>`<div class="card"><b>R$ ${Number(x.amount).toFixed(2)}</b> + taxa R$ ${Number(x.fee).toFixed(2)}<br>PIX: ${x.pix_key}<br>Status: ${x.status}<div style="margin-top:10px">${x.status==='PENDING'?`<button class="btn" onclick="wd('${x.id}','PROCESSING')">Processando</button> <button class="btn ok" onclick="wd('${x.id}','PAID')">Pago</button> <button class="btn bad" onclick="wd('${x.id}','REJECTED')">Recusar</button>`:''}</div></div>`).join('')+'</div>';if(type==='archives')c.innerHTML='<h2>Auditoria de conversas</h2><div class="card"><p class="muted">Os registros encerrados ficam armazenados como ciphertext. A chave de descriptografia deve existir apenas no ambiente administrativo seguro.</p>'+(data.archives?data.archives.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #20324b"><b>${x.order_id}</b><br><span class="muted">Arquivado em ${new Date(x.archived_at).toLocaleString('pt-BR')}</span></div>`).join(''):'')+'</div>'}async function review(id,status){let reason='';if(status==='REJECTED')reason=prompt('Motivo da recusa:')||'Não aprovado pela equipe.';await api({action:'review-seller',id,status,reason});await load()}async function wd(id,status){await api({action:'withdrawal',id,status});await load()}boot().catch(e=>document.querySelector('#content').textContent=e.message)</script><script src="/site-nav.js"></script></body></html>
