<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 4%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn{padding:10px 14px;border-radius:6px;border:1px solid #3b4148;background:#171a1d;color:#fff;cursor:pointer;font-weight:700}.btn:hover{border-color:#e3343f}.ok{background:#173a27;border-color:#356d49}.bad{background:#3a171c;border-color:#713039}.card{background:#151719;border:1px solid #292e33;border-radius:8px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#929aa3}.list{display:grid;gap:12px}.back{color:#ff5962;text-decoration:none;font-weight:700}h1,h2{color:#f5f6f7}@media(max-width:700px){.wrap{padding:25px 4%}}</style></head><body><main class="wrap"><a class="back" href="/admin.html">← Painel administrativo</a><h1>Marketplace</h1><p class="muted">Aprovação de vendedores, pedidos, saques e auditoria de conversas encerradas.</p><div class="tabs"><button class="btn" onclick="show('apps')">Vendedores</button><button class="btn" onclick="show('orders')">Pedidos</button><button class="btn" onclick="show('withdrawals')">Saques</button><button class="btn" onclick="show('archives')">Conversas arquivadas</button></div><section id="content">Carregando...</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,data;async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){document.querySelector('#content').textContent=e.message}}async function api(body={}){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sessão expirada.');const r=await fetch('/api/admin-marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function load(){const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/admin-marketplace',{headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'});data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Não foi possível carregar o Marketplace administrativo.');show('apps')}function show(type){const c=document.querySelector('#content');if(type==='apps')c.innerHTML='<h2>Solicitações de vendedor</h2><div class="list">'+(data.applications||[]).map(x=>`<div class="card"><div class="row"><div><b>${esc(x.full_name)}</b><br><span class="muted">${esc(x.email)} • ${esc(x.phone)}<br>CPF: ${esc(x.cpf)} • Nascimento: ${esc(x.birth_date)}<br>Status: ${esc(x.status)}</span></div><div>${x.status==='PENDING'?`<button class="btn ok" onclick="review('${escAttr(x.id)}','APPROVED')">Aprovar</button> <button class="btn bad" onclick="review('${escAttr(x.id)}','REJECTED')">Recusar</button>`:''}</div></div></div>`).join('')+'</div>';if(type==='orders')c.innerHTML='<h2>Pedidos</h2><div class="list">'+(data.orders||[]).map(x=>`<div class="card"><b>${esc(x.marketplace_products?.title||'Produto')}</b><br>R$ ${Number(x.subtotal).toFixed(2)} • ${esc(x.status)}<br><span class="muted">${esc(x.id)}</span></div>`).join('')+'</div>';if(type==='withdrawals')c.innerHTML='<h2>Saques</h2><div class="list">'+(data.withdrawals||[]).map(x=>`<div class="card"><b>R$ ${Number(x.amount).toFixed(2)}</b> + taxa R$ ${Number(x.fee).toFixed(2)}<br>PIX: ${esc(x.pix_key)}<br>Status: ${esc(x.status)}<div style="margin-top:10px">${x.status==='PENDING'?`<button class="btn" onclick="wd('${escAttr(x.id)}','PROCESSING')">Processando</button> <button class="btn ok" onclick="wd('${escAttr(x.id)}','PAID')">Pago</button> <button class="btn bad" onclick="wd('${escAttr(x.id)}','REJECTED')">Recusar</button>`:''}</div></div>`).join('')+'</div>';if(type==='archives')c.innerHTML='<h2>Auditoria de conversas</h2><div class="card"><p class="muted">Conversas encerradas são mantidas para auditoria administrativa.</p>'+(data.archives||[]).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #292e33"><b>${esc(x.order_id)}</b><br><span class="muted">Arquivado em ${new Date(x.archived_at).toLocaleString('pt-BR')}</span></div>`).join('')+'</div>'}async function review(id,status){let reason='';if(status==='REJECTED')reason=prompt('Motivo da recusa:')||'Não aprovado pela equipe.';await api({action:'review-seller',id,status,reason});await load()}async function wd(id,status){await api({action:'withdrawal',id,status});await load()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}boot().catch(e=>document.querySelector('#content').textContent=e.message)</script><script src="/site-nav.js"></script></body></html>
