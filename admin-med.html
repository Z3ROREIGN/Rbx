<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MED • Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#080a0c;color:#f2f4f6;font-family:system-ui}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#101316;border:1px solid #2a3036;border-radius:8px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#929aa3;font-size:13px}.pill{padding:5px 8px;border-radius:5px;background:#222830;font-size:11px}.btn{border:1px solid #3b424a;background:#171b1f;color:#fff;border-radius:6px;padding:8px 11px;cursor:pointer;font-weight:700}.btn.ok{border-color:#376447}.btn.no{border-color:#6b3036}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px}.modal>div{width:min(560px,100%);background:#101316;border:1px solid #343b43;border-radius:8px;padding:16px}.modal textarea{width:100%;box-sizing:border-box;background:#080a0c;color:#fff;border:1px solid #343b43;border-radius:6px;padding:10px;min-height:110px;margin:10px 0}</style></head><body><main class="wrap"><h1>MED</h1><p class="muted">Análise e decisão de solicitações MED. Aprovação é transacional e idempotente.</p><div class="row"><button class="btn" onclick="load()">Atualizar</button><span id="count" class="muted"></span></div><section id="list" class="grid"></section></main><div id="modal" class="modal"><div><h2 id="mt">Revisar MED</h2><div id="md" class="muted"></div><textarea id="reason" placeholder="Informe o motivo da decisão (obrigatório)"></textarea><div class="row"><button class="btn ok" onclick="decide('APPROVE')">Aprovar</button><button class="btn no" onclick="decide('REFUSE')">Recusar</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div></div><script>let selected=null;async function load(){try{const r=await adminQuery('med_cases').select('*').order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;const rows=r.data||[];document.getElementById('count').textContent=rows.length+' caso(s)';document.getElementById('list').innerHTML=rows.map(m=>`<article class="card"><div class="row"><strong>${adminEsc(m.amount)} • ${adminEsc(m.status)}</strong><span class="pill">${adminEsc(m.source_type||'PIX')}</span></div><p class="muted">ID: ${adminEsc(m.id)}<br>Usuário: ${adminEsc(m.user_id)}<br>Criado: ${adminEsc(new Date(m.created_at).toLocaleString('pt-BR'))}</p><p>${adminEsc(m.reason)}</p>${m.justification?`<p class="muted"><b>Justificativa:</b> ${adminEsc(m.justification)}</p>`:''}${['UNDER_REVIEW'].includes(m.status)?`<button class="btn" onclick="openModal('${m.id}')">Revisar</button>`:''}</article>`).join('')||'<div class="card">Nenhum MED encontrado.</div>'}catch(e){adminToast(e.message||'Erro ao carregar MED')}}function openModal(id){selected=id;document.getElementById('reason').value='';document.getElementById('modal').style.display='grid'}function closeModal(){selected=null;document.getElementById('modal').style.display='none'}async function decide(decision){if(!selected)return;const reason=document.getElementById('reason').value.trim();if(reason.length<5){adminToast('Informe o motivo da decisão.');return}try{await adminRpc('review_med_case',{p_med_id:selected,p_decision:decision,p_reason:reason});adminToast(decision==='APPROVE'?'MED aprovado.':'MED recusado.',true);closeModal();await load()}catch(e){adminToast(e.message||'Não foi possível concluir a decisão')}}setTimeout(load,400);</script></body></html>
