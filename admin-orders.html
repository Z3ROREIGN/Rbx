<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--line:#293038;--text:#f3f5f7;--muted:#8e98a2;--red:#d92f3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0}.sub,.meta{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.stat{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:7px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:22px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,select{background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;min-height:42px;padding:0 12px;outline:0}.input{flex:1;min-width:220px}.order{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:12px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.detail{background:#0c0f11;border:1px solid var(--line);padding:10px;border-radius:5px}.detail small{display:block;color:#707a84;margin-bottom:4px}.status{font-size:10px;font-weight:800;padding:5px 8px;border:1px solid var(--line);border-radius:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.gamepass{display:inline-flex;align-items:center;min-height:40px;padding:0 11px;background:#1b2025;color:#fff;text-decoration:none;border:1px solid #343c44;border-radius:6px}.empty{padding:22px;text-align:center;color:var(--muted)}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr 1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:650px){.wrap{padding:18px 12px 95px}.stats{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}.top{display:block}.details{grid-template-columns:1fr 1fr}.actions>*{flex:1}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Operações</div><h1>Central de pedidos</h1><p class="sub">Acompanhe pagamentos, processamento e entrega em uma única tela.</p></header><section class="stats"><div class="stat"><span>Pendentes</span><b id="pending">0</b></div><div class="stat"><span>Pagos</span><b id="paid">0</b></div><div class="stat"><span>Processando</span><b id="processing">0</b></div><div class="stat"><span>Entregues</span><b id="delivered">0</b></div><div class="stat"><span>Cancelados</span><b id="cancelled">0</b></div></section><div class="toolbar"><input class="input" id="search" placeholder="Pesquisar usuário, Roblox ou método"><select class="input" id="filter"><option value="ALL">Todos os status</option><option>PENDING</option><option>PAID</option><option>PROCESSING</option><option>DELIVERED</option><option>CANCELLED</option></select></div><section id="list"><div class="empty">Carregando pedidos...</div></section></main><script>const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let orders=[];async function load(){if(!await requireAdmin())return;try{const d=await adminGet('/api/admin-orders');orders=d.orders||[];for(const s of ['PENDING','PAID','PROCESSING','DELIVERED','CANCELLED'])$(s.toLowerCase()).textContent=orders.filter(o=>o.status===s).length;render()}catch(e){$('list').innerHTML='<div class="order">'+esc(e.message)+'</div>'}}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,arr=orders.filter(o=>(f==='ALL'||o.status===f)&&(!q||((o.roblox_username||'')+' '+(o.method||'')).toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(o=>`<article class="order"><div class="top"><div><b>${Number(o.robux||0).toLocaleString('pt-BR')} Robux</b><div class="meta">${esc(o.roblox_username||'—')} · ${esc(o.method||'—')}</div></div><span class="status">${esc(o.status)}</span></div><div class="details"><div class="detail"><small>Valor</small>R$ ${Number(o.amount||0).toFixed(2).replace('.',',')}</div><div class="detail"><small>Criado</small>${new Date(o.created_at).toLocaleString('pt-BR')}</div><div class="detail"><small>Atualizado</small>${new Date(o.updated_at||o.created_at).toLocaleString('pt-BR')}</div><div class="detail"><small>Entrega</small>${o.delivered_at?new Date(o.delivered_at).toLocaleString('pt-BR'):'Ainda não'}</div></div>${o.delivery_note?`<div class="meta" style="margin-top:10px">Observação: ${esc(o.delivery_note)}</div>`:''}<div class="actions">${o.status==='PAID'?`<button class="primary" onclick="change('${esc(o.id)}','PROCESSING')">Processar pedido</button>`:''}${o.status==='PROCESSING'?`<button class="primary" onclick="change('${esc(o.id)}','DELIVERED')">Marcar entregue</button>`:''}${['PENDING','PAID','PROCESSING'].includes(o.status)?`<button class="danger" onclick="change('${esc(o.id)}','CANCELLED')">Cancelar</button>`:''}${o.gamepass_url?`<a class="gamepass" target="_blank" rel="noopener noreferrer" href="${esc(o.gamepass_url)}">Abrir Gamepass</a>`:''}</div></article>`).join(''):'<div class="empty">Nenhum pedido encontrado.</div>'}async function change(id,status){if(!confirm('Alterar este pedido para '+status+'?'))return;try{await adminApi('/api/admin-order-status',{orderId:id,status});adminToast('Pedido atualizado.',true);await load()}catch(e){adminToast(e.message||'Não foi possível atualizar')}}$('search').oninput=render;$('filter').onchange=render;load();setInterval(load,30000)</script></body></html>
