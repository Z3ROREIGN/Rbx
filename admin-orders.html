<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.panel,.row{background:#101013;border:1px solid #292930;border-radius:14px;padding:15px}.row{display:flex;justify-content:space-between;gap:15px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}button.primary{background:#fff;color:#050505}.danger{color:#ffaaa9}@media(max-width:650px){.row{flex-direction:column}}</style></head><body><main class="wrap"><a href="/admin.html">← Painel</a><h1>🛒 Pedidos</h1><p style="color:#888">Somente ações de pedido.</p><div id="list" class="panel">Carregando...</div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('orders').select('id,robux,method,amount,status,roblox_username,gamepass_url,created_at').order('created_at',{ascending:false}).limit(100);if(error)return list.innerHTML='<b style="color:#ff9d9d">'+adminEsc(error.message)+'</b>';list.innerHTML=data?.length?data.map(o=>'<div class="row"><div><b>'+Number(o.robux).toLocaleString('pt-BR')+' Robux · '+adminEsc(o.method)+'</b><div style="color:#888">R$ '+Number(o.amount).toFixed(2).replace('.',',')+' · '+adminEsc(o.roblox_username)+'</div><small>'+adminEsc(o.status)+'</small></div><div class="actions">'+(o.status==='PAID'?'<button class="primary" onclick="change(\''+o.id+'\',\'PROCESSING\')">Processar</button>':'')+(o.status==='PROCESSING'?'<button class="primary" onclick="change(\''+o.id+'\',\'DELIVERED\')">Entregar</button>':'')+(['PENDING','PAID','PROCESSING'].includes(o.status)?'<button class="danger" onclick="change(\''+o.id+'\',\'CANCELLED\')">Cancelar</button>':'')+(o.gamepass_url?'<a target="_blank" rel="noopener" href="'+adminEsc(o.gamepass_url)+'">Gamepass ↗</a>':'')+'</div></div>').join(''):'Nenhum pedido.'}async function change(id,status){if(!confirm('Alterar para '+status+'?'))return;try{await adminApi('/api/admin-order-status',{orderId:id,status});adminToast('Pedido atualizado.',true);load()}catch(e){adminToast(e.message)}}load()</script></body></html>
