<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1150px;margin:auto;padding:24px 16px}.muted{color:#888}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.panel,.order{background:#101013;border:1px solid #292930;border-radius:15px;padding:16px}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,button{padding:10px;border-radius:9px;border:1px solid #303038;background:#0b0b0e;color:#fff}button{cursor:pointer;font-weight:700}.primary{background:#fff;color:#050505}.danger{border-color:#542929;color:#ffaaa9}.order{margin:10px 0}.top{display:flex;justify-content:space-between;gap:15px}.badge{padding:5px 9px;border-radius:99px;background:#1a1a1e;color:#bbb;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.detail{padding:9px;background:#151519;border-radius:9px}.detail small{display:block;color:#777}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}.top{display:block}}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>🛒 Central de pedidos</h1><p class="muted">Controle de pagamentos, processamento e entrega.</p><div class="stats"><div class="stat"><span class="muted">Pendentes</span><b id="pending">0</b></div><div class="stat"><span class="muted">Pagos</span><b id="paid">0</b></div><div class="stat"><span class="muted">Processando</span><b id="processing">0</b></div><div class="stat"><span class="muted">Entregues</span><b id="delivered">0</b></div></div><div class="toolbar"><input id="search" placeholder="Buscar por usuário Roblox..." oninput="render()"><select id="filter" onchange="render()"><option value="ALL">Todos os status</option><option>PENDING</option><option>PAID</option><option>PROCESSING</option><option>DELIVERED</option><option>CANCELLED</option></select></div><section class="panel"><div id="list">Carregando...</div></section></main><script>let orders=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('orders').select('id,robux,method,amount,status,roblox_username,gamepass_url,delivery_note,created_at,updated_at,delivered_at').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<p style="color:#ff8585">'+esc(error.message)+'</p>';return}orders=data||[];['PENDING','PAID','PROCESSING','DELIVERED'].forEach(s=>$(s.toLowerCase()).textContent=orders.filter(o=>o.status===s).length);render()}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const arr=orders.filter(o=>(f==='ALL'||o.status===f)&&((o.roblox_username||'').toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(o=>`<article class="order"><div class="top"><div><b>${Number(o.robux).toLocaleString('pt-BR')} Robux</b><div class="muted">${esc(o.roblox_username)} · ${esc(o.method)}</div></div><span class="badge">${esc(o.status)}</span></div><div class="details"><div class="detail"><small>Valor</small>R$ ${Number(o.amount).toFixed(2).replace('.',',')}</div><div class="detail"><small>Criado</small>${new Date(o.created_at).toLocaleString('pt-BR')}</div><div class="detail"><small>Atualizado</small>${new Date(o.updated_at).toLocaleString('pt-BR')}</div></div>${o.delivery_note?`<p class="muted">Entrega: ${esc(o.delivery_note)}</p>`:''}<div class="actions">${o.status==='PAID'?`<button class="primary" onclick="change('${o.id}','PROCESSING')">▶ Processar</button>`:''}${o.status==='PROCESSING'?`<button class="primary" onclick="change('${o.id}','DELIVERED')">✓ Marcar entregue</button>`:''}${['PENDING','PAID','PROCESSING'].includes(o.status)?`<button class="danger" onclick="change('${o.id}','CANCELLED')">Cancelar</button>`:''}${o.gamepass_url?`<a target="_blank" rel="noopener noreferrer" href="${encodeURI(o.gamepass_url)}" style="padding:10px;color:#fff">Gamepass ↗</a>`:''}</div></article>`).join(''):'<p class="muted">Nenhum pedido encontrado.</p>'}async function change(id,status){if(!confirm('Alterar este pedido para '+status+'?'))return;try{await adminApi('/api/admin-order-status',{orderId:id,status});adminToast('Pedido atualizado.',true);await load()}catch(e){adminToast(e.message||'Não foi possível atualizar')}}load();setInterval(load,20000)</script></body></html>
