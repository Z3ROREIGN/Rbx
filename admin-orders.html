<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:16px;background:#111417;border:1px solid #2a3036;border-radius:7px}.stat span{display:block;color:#929aa3;font-size:11px}.stat b{display:block;margin-top:6px;font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{min-height:40px}.order{padding:17px;background:#111417;border:1px solid #2a3036;border-radius:7px;margin:10px 0}.order-head{display:flex;justify-content:space-between;gap:12px}.meta{color:#929aa3;font-size:12px;margin-top:5px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.detail{padding:10px;background:#0d1012;border:1px solid #252b31;border-radius:5px}.detail small{display:block;color:#737c85;margin-bottom:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.gamepass{display:inline-flex;align-items:center;padding:10px;background:#1a1e22;color:#fff;text-decoration:none;border:1px solid #353c43;border-radius:5px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}.order-head{display:block}}</style></head><body><main class="wrap"><div class="stats"><div class="stat"><span>Pendentes</span><b id="pending">0</b></div><div class="stat"><span>Pagos</span><b id="paid">0</b></div><div class="stat"><span>Processando</span><b id="processing">0</b></div><div class="stat"><span>Entregues</span><b id="delivered">0</b></div></div><div class="toolbar"><input id="search" placeholder="Pesquisar usuário Roblox ou método"><select id="filter"><option value="ALL">Todos os status</option><option>PENDING</option><option>PAID</option><option>PROCESSING</option><option>DELIVERED</option><option>CANCELLED</option></select></div><section id="list">Carregando pedidos...</section></main><script>let orders=[];const $=id=>document.getElementById(id);const esc=v=>adminEsc(v);async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('orders').select('id,robux,method,amount,status,roblox_username,gamepass_url,delivery_note,created_at,updated_at,delivered_at').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<div class="order">'+esc(error.message)+'</div>';return}orders=data||[];for(const s of ['PENDING','PAID','PROCESSING','DELIVERED'])$(s.toLowerCase()).textContent=orders.filter(o=>o.status===s).length;render()}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const arr=orders.filter(o=>(f==='ALL'||o.status===f)&&(!q||((o.roblox_username||'')+' '+(o.method||'')).toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(o=>'<article class="order"><div class="order-head"><div><b>'+Number(o.robux||0).toLocaleString('pt-BR')+' Robux</b><div class="meta">'+esc(o.roblox_username||'—')+' · '+esc(o.method||'—')+'</div></div><span class="status">'+esc(o.status)+'</span></div><div class="details"><div class="detail"><small>Valor</small>R$ '+Number(o.amount||0).toFixed(2).replace('.',',')+'</div><div class="detail"><small>Criado</small>'+new Date(o.created_at).toLocaleString('pt-BR')+'</div><div class="detail"><small>Atualizado</small>'+new Date(o.updated_at||o.created_at).toLocaleString('pt-BR')+'</div></div>'+(o.delivery_note?'<div class="meta" style="margin-top:10px">Entrega: '+esc(o.delivery_note)+'</div>':'')+'<div class="actions">'+(o.status==='PAID'?'<button class="primary" onclick="change(\''+o.id+'\',\'PROCESSING\')">Processar pedido</button>':'')+(o.status==='PROCESSING'?'<button class="primary" onclick="change(\''+o.id+'\',\'DELIVERED\')">Marcar como entregue</button>':'')+(['PENDING','PAID','PROCESSING'].includes(o.status)?'<button class="danger" onclick="change(\''+o.id+'\',\'CANCELLED\')">Cancelar</button>':'')+(o.gamepass_url?'<a class="gamepass" target="_blank" rel="noopener noreferrer" href="'+encodeURI(o.gamepass_url)+'">Abrir Gamepass</a>':'')+'</div></article>').join(''):'<div class="order">Nenhum pedido encontrado.</div>'}async function change(id,status){if(!confirm('Alterar este pedido para '+status+'?'))return;try{await adminApi('/api/admin-order-status',{orderId:id,status});adminToast('Pedido atualizado.',true);await load()}catch(e){adminToast(e.message||'Não foi possível atualizar')}}$('search').oninput=render;$('filter').onchange=render;load();setInterval(load,20000)</script></body></html>
