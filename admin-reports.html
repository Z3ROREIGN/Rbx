<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias | Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#090a0c;--panel:#121518;--panel2:#171b1f;--line:#293038;--text:#f3f5f7;--muted:#8e98a2;--red:#d92f3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.head{margin-bottom:16px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.head h1{margin:5px 0}.sub,.meta{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat,.report{background:var(--panel);border:1px solid var(--line);border-radius:7px}.stat{padding:15px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font-size:24px;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,select,textarea{background:#0c0e10;border:1px solid var(--line);color:#fff;border-radius:6px;padding:10px;outline:0}#search{flex:1;min-width:220px}.report{padding:16px;margin:9px 0}.report-head{display:flex;justify-content:space-between;gap:12px}.people{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.person{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}.avatar{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#32151a}.person small{display:block;color:var(--muted)}.desc{line-height:1.55}.status{font-size:10px;font-weight:800;padding:5px 8px;border:1px solid var(--line);border-radius:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}textarea{width:100%;min-height:70px;margin-top:10px;resize:vertical}button{min-height:40px}@media(max-width:700px){.wrap{padding:18px 12px 95px}.stats{grid-template-columns:1fr 1fr}.report-head{display:block}.toolbar{flex-direction:column}.people{display:grid;grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">Moderação</div><h1>Central de denúncias</h1><p class="sub">Analise denúncias com identificação visual de quem denunciou e de quem foi denunciado.</p></header><section class="stats"><div class="stat"><span>Pendentes</span><b id="pending">0</b></div><div class="stat"><span>Em análise</span><b id="reviewing">0</b></div><div class="stat"><span>Resolvidas</span><b id="resolved">0</b></div><div class="stat"><span>Rejeitadas</span><b id="rejected">0</b></div></section><div class="toolbar"><input class="input" id="search" placeholder="Pesquisar categoria, descrição, denunciante ou alvo"><select class="input" id="filter"><option value="ALL">Todos os status</option><option>PENDING</option><option>REVIEWING</option><option>RESOLVED</option><option>REJECTED</option></select></div><section id="list">Carregando denúncias...</section></main><script>const $=id=>document.getElementById(id),esc=v=>adminEsc(v);let reports=[],profiles=new Map();const p=id=>profiles.get(id)||{};const nm=id=>p(id).display_name||p(id).username||'Usuário';const un=id=>p(id).username?'@'+p(id).username:'@usuário';const av=id=>p(id).avatar_url||'/logo.png';async function load(){if(!await requireAdmin())return;const r=await adminSB.from('reports').select('id,reporter_id,reported_user_id,message_id,conversation_id,category,description,status,resolution_note,created_at,updated_at').order('created_at',{ascending:false}).limit(300);if(r.error){$('list').innerHTML='<div class="report">'+esc(r.error.message)+'</div>';return}reports=r.data||[];const ids=[...new Set(reports.flatMap(x=>[x.reporter_id,x.reported_user_id]))];if(ids.length){const pr=await adminSB.from('profiles').select('id,display_name,username,avatar_url,account_status').in('id',ids);if(!pr.error)profiles=new Map((pr.data||[]).map(x=>[x.id,x]))}for(const s of ['PENDING','REVIEWING','RESOLVED','REJECTED'])$(s.toLowerCase()).textContent=reports.filter(x=>x.status===s).length;render()}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const arr=reports.filter(r=>(f==='ALL'||r.status===f)&&(!q||[r.category,r.description,nm(r.reporter_id),un(r.reporter_id),nm(r.reported_user_id),un(r.reported_user_id)].join(' ').toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(r=>`<article class="report"><div class="report-head"><div><b>${esc(r.category||'Denúncia')}</b><div class="meta">${new Date(r.created_at).toLocaleString('pt-BR')}</div></div><span class="status">${esc(r.status)}</span></div><div class="people"><div class="person"><img class="avatar" src="${esc(av(r.reporter_id))}" onerror="this.src='/logo.png'"><div><b>${esc(nm(r.reporter_id))}</b><small>${esc(un(r.reporter_id))} · denunciante</small></div></div><div class="person"><img class="avatar" src="${esc(av(r.reported_user_id))}" onerror="this.src='/logo.png'"><div><b>${esc(nm(r.reported_user_id))}</b><small>${esc(un(r.reported_user_id))} · denunciado</small></div></div></div><div class="desc">${esc(r.description||'Sem descrição')}</div>${r.resolution_note?`<div class="meta" style="margin-top:9px">Observação: ${esc(r.resolution_note)}</div>`:''}<textarea id="note-${r.id}" maxlength="1000" placeholder="Observação da moderação"></textarea><div class="actions"><button onclick="setStatus('${esc(r.id)}','REVIEWING')">Iniciar análise</button><button class="primary" onclick="setStatus('${esc(r.id)}','RESOLVED')">Resolver</button><button class="danger" onclick="setStatus('${esc(r.id)}','REJECTED')">Rejeitar</button>${r.conversation_id?`<a class="btn" href="/admin-chats.html?conversation=${encodeURIComponent(r.conversation_id)}">Abrir conversa</a>`:''}</div></article>`).join(''):'<div class="report">Nenhuma denúncia encontrada.</div>'}async function setStatus(id,status){const note=$('note-'+id)?.value.trim()||null;const r=await adminSB.rpc('update_report_status',{report_id:id,new_status:status,note});if(r.error)return adminToast(r.error.message);adminToast('Denúncia atualizada.',true);load()}$('search').oninput=render;$('filter').onchange=render;load();setInterval(load,30000)</script></body></html>
