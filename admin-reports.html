<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:16px;background:#111417;border:1px solid #2a3036;border-radius:7px}.stat span{display:block;color:#929aa3;font-size:11px}.stat b{display:block;margin-top:6px;font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{min-height:40px}.report{padding:17px;background:#111417;border:1px solid #2a3036;border-radius:7px;margin:10px 0}.report-head{display:flex;justify-content:space-between;gap:12px}.report-meta{color:#929aa3;font-size:12px;margin-top:5px}.report-desc{line-height:1.55;color:#d7dbe0}.report textarea{width:100%;min-height:72px;box-sizing:border-box;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.status{padding:5px 8px;border:1px solid #30373e;border-radius:5px;font-size:10px;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.report-head{display:block}}</style></head><body><main class="wrap"><div class="stats"><div class="stat"><span>Pendentes</span><b id="pending">0</b></div><div class="stat"><span>Em análise</span><b id="reviewing">0</b></div><div class="stat"><span>Resolvidas</span><b id="resolved">0</b></div><div class="stat"><span>Rejeitadas</span><b id="rejected">0</b></div></div><div class="toolbar"><input id="search" placeholder="Pesquisar categoria ou descrição"><select id="filter"><option value="ALL">Todos os status</option><option>PENDING</option><option>REVIEWING</option><option>RESOLVED</option><option>REJECTED</option></select></div><section id="list">Carregando denúncias...</section></main><script>let reports=[];const $=id=>document.getElementById(id);const esc=v=>adminEsc(v);async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('reports').select('id,reporter_id,reported_user_id,message_id,conversation_id,category,description,status,resolution_note,created_at,updated_at').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<div class="report">'+esc(error.message)+'</div>';return}reports=data||[];for(const s of ['PENDING','REVIEWING','RESOLVED','REJECTED'])$(s.toLowerCase()).textContent=reports.filter(r=>r.status===s).length;render()}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const arr=reports.filter(r=>(f==='ALL'||r.status===f)&&(!q||((r.category||'')+' '+(r.description||'')).toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(r=>'<article class="report"><div class="report-head"><div><b>'+esc(r.category||'Denúncia')+'</b><div class="report-meta">'+new Date(r.created_at).toLocaleString('pt-BR')+' · Denunciante '+esc(r.reporter_id||'—')+' · Alvo '+esc(r.reported_user_id||'—')+'</div></div><span class="status">'+esc(r.status)+'</span></div><p class="report-desc">'+esc(r.description||'Sem descrição')+'</p>'+(r.resolution_note?'<div class="report-meta">Observação atual: '+esc(r.resolution_note)+'</div>':'')+'<textarea id="note-'+r.id+'" maxlength="1000" placeholder="Observação da moderação"></textarea><div class="actions"><button onclick="setStatus(\''+r.id+'\',\'REVIEWING\')">Iniciar análise</button><button class="primary" onclick="setStatus(\''+r.id+'\',\'RESOLVED\')">Resolver</button><button class="danger" onclick="setStatus(\''+r.id+'\',\'REJECTED\')">Rejeitar</button></div></article>').join(''):'<div class="report">Nenhuma denúncia encontrada.</div>'}async function setStatus(id,status){const note=$("note-"+id)?.value.trim()||null;const {error}=await adminSB.rpc('update_report_status',{report_id:id,new_status:status,note});if(error)return adminToast(error.message);adminToast('Denúncia atualizada.',true);load()}$('search').oninput=render;$('filter').onchange=render;load();setInterval(load,20000)</script></body></html>
