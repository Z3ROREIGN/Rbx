<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:25px 16px}.row{padding:16px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0}.actions{display:flex;gap:8px;margin-top:12px}button,a{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}.primary{background:#fff;color:#050505}</style></head><body><main class="wrap"><a href="/admin.html">← Painel</a><h1>🚨 Denúncias</h1><div id="list">Carregando...</div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('reports').select('id,category,description,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)return list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';list.innerHTML=data?.length?data.map(x=>'<article class="row"><b>'+adminEsc(x.category)+'</b> <small>'+adminEsc(x.status)+'</small><p>'+adminEsc(x.description||'Sem descrição')+'</p><div class="actions"><button onclick="setStatus(\''+x.id+'\',\'REVIEWING\')">Analisar</button><button class="primary" onclick="setStatus(\''+x.id+'\',\'RESOLVED\')">Resolver</button><button onclick="setStatus(\''+x.id+'\',\'REJECTED\')">Rejeitar</button></div></article>').join(''):'<p>Nenhuma denúncia.'}async function setStatus(id,status){const note=prompt('Observação (opcional):');if(note===null)return;const {error}=await adminSB.rpc('update_report_status',{report_id:id,new_status:status,note:note.trim()||null});if(error)return adminToast(error.message);adminToast('Denúncia atualizada.',true);load()}load()</script></body></html>
