<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.muted{color:#888}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.panel,.report{background:#101013;border:1px solid #292930;border-radius:15px;padding:16px}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,textarea,button{padding:10px;border-radius:9px;border:1px solid #303038;background:#0b0b0e;color:#fff}button{cursor:pointer;font-weight:700}.primary{background:#fff;color:#050505}.report{margin:10px 0}.top{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 9px;border-radius:99px;background:#1a1a1e;color:#bbb;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.top{display:block}}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>🚨 Central de denúncias</h1><p class="muted">Triagem, análise e resolução de denúncias.</p><div class="stats"><div class="stat"><span class="muted">Pendentes</span><b id="pending">0</b></div><div class="stat"><span class="muted">Em análise</span><b id="reviewing">0</b></div><div class="stat"><span class="muted">Resolvidas</span><b id="resolved">0</b></div><div class="stat"><span class="muted">Rejeitadas</span><b id="rejected">0</b></div></div><div class="toolbar"><input id="search" placeholder="Buscar categoria ou descrição..." oninput="render()"><select id="filter" onchange="render()"><option value="ALL">Todos os status</option><option>PENDING</option><option>REVIEWING</option><option>RESOLVED</option><option>REJECTED</option></select></div><section class="panel"><div id="list">Carregando...</div></section></main><script>let reports=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('reports').select('id,reporter_id,reported_user_id,message_id,conversation_id,category,description,status,resolution_note,created_at,updated_at').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<p style="color:#ff8585">'+esc(error.message)+'</p>';return}reports=data||[];['PENDING','REVIEWING','RESOLVED','REJECTED'].forEach(s=>$(s.toLowerCase()).textContent=reports.filter(r=>r.status===s).length);render()}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const arr=reports.filter(r=>(f==='ALL'||r.status===f)&&((r.category||'').toLowerCase().includes(q)||(r.description||'').toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map(r=>`<article class="report"><div class="top"><div><b>${esc(r.category)}</b><div class="muted">${new Date(r.created_at).toLocaleString('pt-BR')}</div></div><span class="badge">${esc(r.status)}</span></div><p>${esc(r.description||'Sem descrição')}</p>${r.resolution_note?`<p class="muted">Observação: ${esc(r.resolution_note)}</p>`:''}<textarea id="note-${r.id}" maxlength="1000" placeholder="Observação da moderação..."></textarea><div class="actions"><button onclick="setStatus('${r.id}','REVIEWING')">Analisar</button><button class="primary" onclick="setStatus('${r.id}','RESOLVED')">Resolver</button><button onclick="setStatus('${r.id}','REJECTED')">Rejeitar</button></div></article>`).join(''):'<p class="muted">Nenhuma denúncia encontrada.</p>'}async function setStatus(id,status){const note=$('note-'+id)?.value.trim()||null;const {error}=await adminSB.rpc('update_report_status',{report_id:id,new_status:status,note});if(error)return adminToast(error.message);adminToast('Denúncia atualizada.',true);load()}load();setInterval(load,20000)</script></body></html>
