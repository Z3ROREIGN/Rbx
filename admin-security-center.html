<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Centro de Segurança — Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f2f3f5;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.head{display:flex;justify-content:space-between;align-items:end;padding:28px 0 18px;border-bottom:1px solid #25292d;gap:12px}.head h1{margin:0 0 7px;font-size:30px}.muted{color:#9298a0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:18px;border:1px solid #292d32;background:#151719;border-radius:10px}.stat b{display:block;font-size:25px;margin-top:8px}.panel{margin:12px 0;border:1px solid #292d32;background:#111315;border-radius:10px;padding:18px}.panel h2{margin:0 0 14px;font-size:17px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #25292d}.row:last-child{border-bottom:0}.ok{color:#72d6a0}.bad{color:#ff8f99}.btn{display:inline-block;padding:9px 12px;border:1px solid #30343a;background:#1a1d20;color:#fff;border-radius:7px;text-decoration:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="head"><div><h1>Centro de Segurança</h1><div class="muted">Integridade, auditoria e saúde operacional.</div></div><a class="btn" href="/admin.html">Voltar ao painel</a></header><section class="grid"><div class="stat"><span class="muted">Integridade</span><b id="integrity">—</b></div><div class="stat"><span class="muted">Mismatches</span><b id="mismatch">—</b></div><div class="stat"><span class="muted">Eventos de segurança</span><b id="events">—</b></div><div class="stat"><span class="muted">Auditoria</span><b id="audit">—</b></div></section><section class="panel"><h2>Últimas verificações da carteira</h2><div id="checks" class="muted">Carregando…</div></section><section class="panel"><h2>Últimos eventos de segurança</h2><div id="security" class="muted">Carregando…</div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));async function boot(){try{const c=await(await fetch('/api/config',{cache:'no-store'})).json();sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=(await sb.auth.getSession()).data.session;if(!s){location.href='/login.html?redirect=/admin-security-center.html';return}const role=await sb.from('admin_roles').select('role').eq('user_id',s.user.id).maybeSingle();if(role.error||!role.data||!['LIDER','ADMINISTRADOR'].includes(role.data.role)){document.body.innerHTML='<main style="padding:40px;font-family:system-ui;color:white;background:#090a0b;min-height:100vh">Acesso negado.</main>';return}await load()}catch(e){document.body.innerHTML='<main style="padding:40px;font-family:system-ui;color:white;background:#090a0b;min-height:100vh">Não foi possível carregar o centro de segurança.</main>'}}async function load(){const [c,e,a]=await Promise.all([sb.from('wallet_integrity_checks').select('user_id,recorded_balance,ledger_balance,difference,status,checked_at,details').order('checked_at',{ascending:false}).limit(20),sb.from('security_events').select('event_type,created_at,metadata').order('created_at',{ascending:false}).limit(20),sb.from('security_audit_log').select('action,actor_user_id,target_type,target_id,created_at').order('created_at',{ascending:false}).limit(20)]);if(c.error||e.error||a.error)throw new Error('load');const checks=c.data||[],events=e.data||[],audit=a.data||[];const bad=checks.filter(x=>x.status!=='OK');$('integrity').textContent=bad.length?'ATENÇÃO':'OK';$('integrity').className=bad.length?'bad':'ok';$('mismatch').textContent=String(bad.length);$('events').textContent=String(events.length);$('audit').textContent=String(audit.length);$('checks').innerHTML=checks.length?checks.map(x=>`<div class="row"><span>${esc(x.status)} · ${esc(x.user_id)}</span><span>${new Date(x.checked_at).toLocaleString('pt-BR')}</span></div>`).join(''):'Nenhuma verificação registrada.';$('security').innerHTML=events.length?events.map(x=>`<div class="row"><span>${esc(x.event_type)}</span><span>${new Date(x.created_at).toLocaleString('pt-BR')}</span></div>`).join(''):'Nenhum evento recente.'}boot();</script></body></html>
