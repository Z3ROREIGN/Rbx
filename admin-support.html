<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1150px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#888}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:#101013;border:1px solid #292930;border-radius:15px;padding:16px}.stat b{font-size:25px;display:block}.layout{display:grid;grid-template-columns:340px 1fr;gap:12px}.ticket{padding:13px;border-radius:11px;margin:7px 0;background:#151519;border:1px solid #25252c;cursor:pointer}.ticket.active{border-color:#fff}.msg{padding:11px;border-radius:12px;background:#16161a;margin:8px 0;max-width:85%}.me{margin-left:auto;background:#eee;color:#111}.reply{display:flex;gap:8px;margin-top:14px}.reply textarea{flex:1;min-height:80px;resize:vertical;background:#0b0b0e;color:#fff;border:1px solid #303038;border-radius:10px;padding:10px}input,select,button{padding:10px;border-radius:9px;border:1px solid #303038;background:#0b0b0e;color:#fff}button{cursor:pointer;font-weight:700}.primary{background:#fff;color:#050505}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.head{display:block}}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><div class="head"><div><h1>🛟 Central de suporte</h1><p class="muted">Atendimento, respostas e acompanhamento de chamados.</p></div></div><div class="stats"><div class="stat"><span class="muted">Abertos</span><b id="sOpen">0</b></div><div class="stat"><span class="muted">Em andamento</span><b id="sProgress">0</b></div><div class="stat"><span class="muted">Aguardando</span><b id="sWaiting">0</b></div><div class="stat"><span class="muted">Resolvidos</span><b id="sResolved">0</b></div></div><div class="toolbar"><input id="search" placeholder="Buscar chamado..." oninput="renderList()"><select id="filter" onchange="renderList()"><option value="ALL">Todos</option><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select></div><div class="layout"><section class="card"><div id="tickets">Carregando...</div></section><section class="card"><div id="detail"><p class="muted">Selecione um chamado para visualizar o atendimento.</p></div></section></div></main><script>let tickets=[],selected=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('support_tickets').select('id,user_id,subject,category,status,created_at,updated_at').order('updated_at',{ascending:false}).limit(200);if(error){$('tickets').innerHTML='<p style="color:#ff8585">'+esc(error.message)+'</p>';return}tickets=data||[];$('sOpen').textContent=tickets.filter(x=>x.status==='OPEN').length;$('sProgress').textContent=tickets.filter(x=>x.status==='IN_PROGRESS').length;$('sWaiting').textContent=tickets.filter(x=>x.status==='WAITING_USER').length;$('sResolved').textContent=tickets.filter(x=>['RESOLVED','CLOSED'].includes(x.status)).length;renderList();if(selected)openTicket(selected)}function renderList(){const q=$('search').value.toLowerCase(),f=$('filter').value;const arr=tickets.filter(t=>(f==='ALL'||t.status===f)&&((t.subject||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q)));$('tickets').innerHTML=arr.length?arr.map(t=>`<div class="ticket ${selected===t.id?'active':''}" onclick="openTicket('${t.id}')"><b>${esc(t.subject)}</b><div class="muted">${esc(t.category)} · ${esc(t.status)}</div><small class="muted">${new Date(t.updated_at).toLocaleString('pt-BR')}</small></div>`).join(''):'<p class="muted">Nenhum chamado encontrado.</p>'}async function openTicket(id){selected=id;renderList();const t=tickets.find(x=>x.id===id);if(!t)return;const {data,error}=await adminSB.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});const me=(await adminSB.auth.getUser()).data.user?.id;$('detail').innerHTML=`<h2>${esc(t.subject)}</h2><p class="muted">${esc(t.category)} · ${esc(t.status)} · aberto em ${new Date(t.created_at).toLocaleString('pt-BR')}</p><div style="max-height:430px;overflow:auto">${error?'<p style="color:#ff8585">'+esc(error.message)+'</p>':(data||[]).map(m=>`<div class="msg ${m.sender_id===me?'me':''}">${esc(m.body)}<small class="muted"><br>${new Date(m.created_at).toLocaleString('pt-BR')}</small></div>`).join('')||'<p class="muted">Nenhuma mensagem.</p>'}</div><div class="reply"><textarea id="reply" maxlength="3000" placeholder="Escreva uma resposta para o usuário..."></textarea><button class="primary" onclick="replyTicket('${id}')">Responder</button></div><div class="toolbar"><select id="status"><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select><button onclick="changeStatus('${id}')">Atualizar status</button></div>`;$('status').value=t.status}async function replyTicket(id){const box=$('reply'),body=box.value.trim();if(!body)return adminToast('Digite uma resposta.');const {error}=await adminSB.rpc('admin_reply_support_ticket',{p_ticket_id:id,p_body:body});if(error)return adminToast(error.message);box.value='';adminToast('Resposta enviada.',true);await load()}async function changeStatus(id){const status=$('status').value;const {error}=await adminSB.rpc('admin_update_support_ticket',{p_ticket_id:id,p_status:status});if(error)return adminToast(error.message);adminToast('Status atualizado.',true);await load()}load();setInterval(load,15000)</script></body></html>
