<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070809;color:#eee;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#888;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.stat,.card{background:#101214;border:1px solid #292d32;border-radius:8px;padding:16px}.stat b{font-size:23px;display:block}.layout{display:grid;grid-template-columns:360px 1fr;gap:10px}.ticket{padding:12px;border-radius:6px;margin:6px 0;background:#151719;border:1px solid #252a2e;cursor:pointer}.ticket.active{border-color:#e3343f}.ticketTop{display:flex;justify-content:space-between;gap:8px}.msg{padding:11px;border-radius:7px;background:#16191c;margin:8px 0;max-width:85%}.me{margin-left:auto;background:#e3343f;color:#fff}.reply{display:flex;gap:8px;margin-top:14px}.reply textarea{flex:1;min-height:80px;resize:vertical;background:#0b0d0f;color:#fff;border:1px solid #30343a;border-radius:6px;padding:10px}input,select,button{padding:10px;border-radius:6px;border:1px solid #30343a;background:#0b0d0f;color:#fff}button{cursor:pointer;font-weight:800}.primary{background:#e3343f;border-color:#b91f2a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.person{display:flex;gap:9px;align-items:center;margin:10px 0}.avatar{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#202327}.tag{font-size:10px;font-weight:900;padding:4px 6px;border-radius:4px;background:#32171b;border:1px solid #62272e;color:#ffb4ba}.rating{letter-spacing:2px;color:#ffb4ba}@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.head{display:block}.reply{display:block}.reply button{width:100%;margin-top:7px}}</style></head><body><main class="wrap"><div class="head"><div><h1>Central de suporte</h1><p class="muted">Atendimento, identificação do cliente, prioridades, respostas e avaliação.</p></div></div><div class="stats"><div class="stat"><span class="muted">Abertos</span><b id="sOpen">0</b></div><div class="stat"><span class="muted">Em andamento</span><b id="sProgress">0</b></div><div class="stat"><span class="muted">Aguardando</span><b id="sWaiting">0</b></div><div class="stat"><span class="muted">Resolvidos</span><b id="sResolved">0</b></div><div class="stat"><span class="muted">Avaliação média</span><b id="sRating">—</b></div></div><div class="toolbar"><input id="search" placeholder="Buscar por assunto, nome ou e-mail..."><select id="filter"><option value="ALL">Todos os status</option><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select><select id="priorityFilter"><option value="ALL">Todas prioridades</option><option>LOW</option><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></div><div class="layout"><section class="card"><div id="tickets">Carregando...</div></section><section class="card"><div id="detail"><p class="muted">Selecione um chamado para visualizar o atendimento.</p></div></section></div></main><script>let tickets=[],selected=null,profiles=new Map();const $=id=>document.getElementById(id),esc=v=>adminEsc(v);async function load(){if(!await requireAdmin())return;const r=await adminSB.from('support_tickets').select('id,user_id,subject,category,status,priority,rating,rating_note,created_at,updated_at').order('updated_at',{ascending:false}).limit(200);if(r.error){$('tickets').innerHTML='<p style="color:#ff8585">'+esc(r.error.message)+'</p>';return}tickets=r.data||[];const ids=[...new Set(tickets.map(t=>t.user_id))];if(ids.length){const p=await adminSB.from('profiles').select('id,display_name,username,email,avatar_url').in('id',ids);if(p.error){$('tickets').innerHTML='<p style="color:#ff8585">'+esc(p.error.message)+'</p>';return}profiles=new Map((p.data||[]).map(x=>[x.id,x]))}const rated=tickets.filter(t=>Number.isInteger(t.rating));$('sOpen').textContent=tickets.filter(x=>x.status==='OPEN').length;$('sProgress').textContent=tickets.filter(x=>x.status==='IN_PROGRESS').length;$('sWaiting').textContent=tickets.filter(x=>x.status==='WAITING_USER').length;$('sResolved').textContent=tickets.filter(x=>['RESOLVED','CLOSED'].includes(x.status)).length;$('sRating').textContent=rated.length?(rated.reduce((s,x)=>s+x.rating,0)/rated.length).toFixed(1):'—';renderList();if(selected)openTicket(selected)}function renderList(){const q=$('search').value.toLowerCase(),f=$('filter').value,pf=$('priorityFilter').value,arr=tickets.filter(t=>{const p=profiles.get(t.user_id)||{},hay=(t.subject||'')+' '+(t.category||'')+' '+(p.display_name||'')+' '+(p.username||'')+' '+(p.email||'');return(f==='ALL'||t.status===f)&&(pf==='ALL'||(t.priority||'NORMAL')===pf)&&hay.toLowerCase().includes(q)});$('tickets').innerHTML=arr.length?arr.map(t=>{const p=profiles.get(t.user_id)||{};return `<div class="ticket ${selected===t.id?'active':''}" onclick="openTicket('${t.id}')"><div class="ticketTop"><b>${esc(t.subject)}</b><span class="tag">${esc(t.priority||'NORMAL')}</span></div><div class="person"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(p.display_name||p.username||'Usuário')}</b><div class="muted">${esc(p.email||'')} · ${esc(t.category)} · ${esc(t.status)}</div></div></div><small class="muted">${new Date(t.updated_at).toLocaleString('pt-BR')}</small></div>`}).join(''):'<p class="muted">Nenhum chamado encontrado.</p>'}async function openTicket(id){selected=id;renderList();const t=tickets.find(x=>x.id===id);if(!t)return;const {data,error}=await adminSB.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});if(error){$('detail').innerHTML='<p style="color:#ff8585">'+esc(error.message)+'</p>';return}const ids=[...new Set((data||[]).map(m=>m.sender_id))];if(ids.length){const p=await adminSB.from('profiles').select('id,display_name,username,email,avatar_url').in('id',ids);(p.data||[]).forEach(x=>profiles.set(x.id,x))}const me=(await adminSB.auth.getUser()).data.user?.id,owner=profiles.get(t.user_id)||{};$('detail').innerHTML=`<div class="person"><img class="avatar" src="${esc(owner.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><h2 style="margin:0">${esc(t.subject)}</h2><div class="muted">Solicitante: <b>${esc(owner.display_name||owner.username||'Usuário')}</b> · ${esc(owner.email||'')}</div></div></div><p class="muted">${esc(t.category)} · aberto em ${new Date(t.created_at).toLocaleString('pt-BR')}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="status"><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select><select id="priority"><option>LOW</option><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select><button onclick="changeTicket('${id}')">Salvar atendimento</button></div><div style="max-height:430px;overflow:auto;margin-top:12px">${(data||[]).map(m=>{const p=profiles.get(m.sender_id)||{};return `<div class="msg ${m.sender_id===me?'me':''}"><div class="person"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(p.display_name||p.username||'Usuário')}</b><div class="muted">${new Date(m.created_at).toLocaleString('pt-BR')}</div></div></div><div>${esc(m.body)}</div></div>`}).join('')||'<p class="muted">Nenhuma mensagem.</p>'}</div><div class="reply"><textarea id="reply" maxlength="3000" placeholder="Escreva uma resposta para o usuário..."></textarea><button class="primary" onclick="replyTicket('${id}')">Responder</button></div><div class="muted" style="margin-top:12px">Avaliação: <span class="rating">${t.rating?'★'.repeat(t.rating)+'☆'.repeat(5-t.rating):'Ainda não avaliado'}</span>${t.rating_note?' · '+esc(t.rating_note):''}</div>`;$('status').value=t.status;$('priority').value=t.priority||'NORMAL'}async function replyTicket(id){const body=$('reply').value.trim();if(!body)return adminToast('Digite uma resposta.');try{await adminRpc('admin_reply_support_ticket',{p_ticket_id:id,p_body:body});$('reply').value='';adminToast('Resposta enviada.',true);await load()}catch(e){adminToast(e.message)}}async function changeTicket(id){try{await adminRpc('admin_update_support_ticket',{p_ticket_id:id,p_status:$('status').value});await adminRpc('set_support_priority',{p_ticket_id:id,p_priority:$('priority').value});adminToast('Atendimento atualizado.',true);await load()}catch(e){adminToast(e.message)}}$('search').oninput=renderList;$('filter').onchange=renderList;$('priorityFilter').onchange=renderList;load();setInterval(load,15000)</script></body></html>
