<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte Admin — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.card{background:#101013;border:1px solid #292930;border-radius:16px;padding:16px}.ticket{padding:13px;border-radius:11px;margin:7px 0;background:#151519;border:1px solid #25252c;cursor:pointer}.ticket.active{border-color:#fff}.muted{color:#888}.msg{padding:11px;border-radius:11px;background:#16161a;margin:8px 0;max-width:85%}.me{margin-left:auto;background:#eee;color:#111}.reply{display:flex;gap:8px;margin-top:12px}.reply textarea{flex:1;min-height:80px;resize:vertical;background:#0b0b0e;color:#fff;border:1px solid #303038;border-radius:10px;padding:10px}.reply button,button{padding:10px 13px;border-radius:9px;border:1px solid #303038;background:#fff;color:#050505;font-weight:700;cursor:pointer}@media(max-width:750px){.layout{grid-template-columns:1fr}}select{background:#0b0b0e;color:#fff;border:1px solid #303038;border-radius:9px;padding:9px}</style></head><body><main class="wrap"><a href="/admin.html" style="color:#fff">← Painel</a><h1>🛟 Central de suporte</h1><p class="muted">Atenda chamados, responda usuários e acompanhe o histórico.</p><div class="layout"><section class="card"><h3>Chamados</h3><div id="tickets">Carregando...</div></section><section class="card"><div id="detail"><p class="muted">Selecione um chamado.</p></div></section></div></main><script>let tickets=[],selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadTickets(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('support_tickets').select('id,user_id,subject,category,status,created_at,updated_at').order('updated_at',{ascending:false}).limit(100);if(error){tickets.innerHTML='<p style="color:#ff8585">'+esc(error.message)+'</p>';return}tickets=data||[];document.getElementById('tickets').innerHTML=tickets.length?tickets.map(t=>`<div class="ticket ${selected===t.id?'active':''}" onclick="openTicket('${t.id}')"><b>${esc(t.subject||'Sem assunto')}</b><div class="muted">${esc(t.category||'outros')} · ${esc(t.status)}</div></div>`).join(''):'<p class="muted">Nenhum chamado.</p>';if(selected)openTicket(selected)}async function openTicket(id){selected=id;await loadTicketsNoReopen();const t=tickets.find(x=>x.id===id);if(!t)return;const {data,error}=await adminSB.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});document.getElementById('detail').innerHTML=`<h2>${esc(t.subject||'Sem assunto')}</h2><p class="muted">${esc(t.category||'outros')} · ${esc(t.status)}</p><div>${error?'<p style="color:#ff8585">'+esc(error.message)+'</p>':(data||[]).map(m=>`<div class="msg ${m.sender_id===adminSB.auth.currentUser?.id?'me':''}">${esc(m.body)}<small class="muted"><br>${new Date(m.created_at).toLocaleString('pt-BR')}</small></div>`).join('')}</div><div class="reply"><textarea id="reply" maxlength="3000" placeholder="Escreva uma resposta..."></textarea><button onclick="replyTicket('${id}')">Responder</button></div><div style="margin-top:12px"><select id="status"><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select> <button onclick="changeStatus('${id}')">Atualizar status</button></div>`;document.getElementById('status').value=t.status}async function loadTicketsNoReopen(){const {data}=await adminSB.from('support_tickets').select('id,user_id,subject,category,status,created_at,updated_at').order('updated_at',{ascending:false}).limit(100);tickets=data||[];document.getElementById('tickets').innerHTML=tickets.map(t=>`<div class="ticket ${selected===t.id?'active':''}" onclick="openTicket('${t.id}')"><b>${esc(t.subject||'Sem assunto')}</b><div class="muted">${esc(t.category||'outros')} · ${esc(t.status)}</div></div>`).join('')||'<p class="muted">Nenhum chamado.</p>'}async function replyTicket(id){const body=document.getElementById('reply').value.trim();if(!body)return;const {error}=await adminSB.rpc('admin_reply_support_ticket',{p_ticket_id:id,p_body:body});if(error)return adminToast(error.message);adminToast('Resposta enviada.',true);openTicket(id)}async function changeStatus(id){const status=document.getElementById('status').value;const {error}=await adminSB.rpc('admin_update_support_ticket',{p_ticket_id:id,p_status:status});if(error)return adminToast(error.message);adminToast('Status atualizado.',true);openTicket(id)}loadTickets();</script></body></html>
