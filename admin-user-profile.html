<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#0b0d0f;color:#f1f3f5;font:14px system-ui}.wrap{max-width:760px;margin:30px auto;padding:16px}.card{background:#15181b;border:1px solid #2b3036;border-radius:8px;padding:20px}.top{display:flex;gap:15px;align-items:center}.avatar{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#35171b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.item{background:#101214;border:1px solid #292f35;border-radius:6px;padding:12px}.label{font-size:10px;color:#78818a;font-weight:800;text-transform:uppercase}.value{margin-top:5px;word-break:break-word}.btn{display:inline-block;margin-top:16px;padding:10px 13px;border-radius:6px;background:#20242a;color:#fff;text-decoration:none;border:1px solid #343a40}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="app" class="card">Carregando...</section></main><script>async function boot(){const app=document.getElementById('app');try{if(!await requireAdmin())return;const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Usuário não informado.');const r=await adminGet('/api/admin-users?q='+encodeURIComponent(id));const u=(r.users||[])[0];if(!u)throw Error('Usuário não encontrado.');const avatar=u.avatar_url?'<img class="avatar" src="'+adminEsc(u.avatar_url)+'" alt="">':'<div class="avatar"></div>';app.innerHTML='<div class="top">'+avatar+'<div><h1 style="margin:0">'+adminEsc(u.display_name||u.username||'Usuário')+'</h1><div style="color:#929aa3">@'+adminEsc(u.username||'—')+'</div></div></div><div class="grid"><div class="item"><div class="label">ID</div><div class="value">'+adminEsc(u.id)+'</div></div><div class="item"><div class="label">Roblox</div><div class="value">'+adminEsc(u.roblox_username||'—')+'</div></div><div class="item"><div class="label">Status</div><div class="value">'+adminEsc(u.account_status||'ACTIVE')+'</div></div><div class="item"><div class="label">Suspensão</div><div class="value">'+adminEsc(u.suspended_until?new Date(u.suspended_until).toLocaleString('pt-BR'):'—')+'</div></div><div class="item"><div class="label">Motivo</div><div class="value">'+adminEsc(u.moderation_reason||'—')+'</div></div><div class="item"><div class="label">Criado</div><div class="value">'+adminEsc(u.created_at?new Date(u.created_at).toLocaleString('pt-BR'):'—')+'</div></div></div><a class="btn" href="/admin-users.html">← Usuários</a>'}catch(e){app.innerHTML='<div style="color:#ff9da5">'+adminEsc(e.message)+'</div><a class="btn" href="/admin-users.html">Voltar</a>'}}boot()</script></body></html>
