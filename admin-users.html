<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:220px;min-height:40px}.user-list{display:grid;gap:9px}.user-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px;background:#111417;border:1px solid #2a3036;border-radius:7px}.identity{display:flex;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:6px;background:#32171b;border:1px solid #63262d;display:grid;place-items:center;color:#ffb1b7;font-weight:900}.meta{color:#929aa3;font-size:12px;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.state{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:5px;border:1px solid #30373e;font-size:10px;font-weight:800}.danger{background:#251417!important;color:#ff9da3!important;border-color:#6b2a31!important}@media(max-width:700px){.user-row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}</style></head><body><main class="wrap"><div class="toolbar"><input id="search" placeholder="Pesquisar por nome, @usuário ou Roblox"></div><section class="user-list" id="list">Carregando usuários...</section></main><script>let users=[];const $=id=>document.getElementById(id);async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('profiles').select('id,display_name,username,roblox_username,account_status,suspended_until,moderation_reason,created_at').order('created_at',{ascending:false}).limit(300);if(error){$('list').innerHTML='<div class="user-row">'+adminEsc(error.message)+'</div>';return}users=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase();const arr=users.filter(x=>!q||[x.display_name,x.username,x.roblox_username,x.id].join(' ').toLowerCase().includes(q));$('list').innerHTML=arr.length?arr.map(x=>{const until=x.suspended_until?new Date(x.suspended_until):null;const suspended=x.account_status==='SUSPENDED'&&until&&until>new Date();const name=x.display_name||x.username||'Usuário';return '<article class="user-row"><div class="identity"><span class="avatar">'+adminEsc(name.slice(0,1).toUpperCase())+'</span><div><b>'+adminEsc(name)+'</b><div class="meta">@'+adminEsc(x.username||'—')+' · Roblox: '+adminEsc(x.roblox_username||'—')+'</div><span class="state">'+adminEsc(x.account_status||'ACTIVE')+(suspended?' · até '+adminEsc(until.toLocaleString('pt-BR')):'')+'</span>'+(x.moderation_reason?'<div class="meta">Motivo: '+adminEsc(x.moderation_reason)+'</div>':'')+'</div></div><div class="actions">'+(x.account_status==='BANNED'?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Reativar</button>':'<button class="danger" onclick="moderate(\''+x.id+'\',\'BANNED\')">Banir</button>')+(suspended?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Encerrar suspensão</button>':'<button onclick="suspend(\''+x.id+'\')">Suspender</button>')+'</div></article>'}).join(''):'<div class="user-row">Nenhum usuário encontrado.</div>'}async function moderate(id,status){if(id===adminUser.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da alteração:');if(!reason?.trim())return;const {error}=await adminSB.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:null});if(error)return adminToast(error.message);adminToast(status==='BANNED'?'Usuário banido.':'Usuário reativado.',true);load()}async function suspend(id){if(id===adminUser.id)return adminToast('Você não pode suspender sua própria conta.');const reason=prompt('Motivo da suspensão:');if(!reason?.trim())return;const days=Number(prompt('Duração em dias (1 a 365):','7'));if(!Number.isInteger(days)||days<1||days>365)return adminToast('Informe uma duração entre 1 e 365 dias.');const until=new Date(Date.now()+days*86400000).toISOString();const {error}=await adminSB.rpc('moderate_user',{target:id,new_status:'SUSPENDED',reason:reason.trim(),until_at:until});if(error)return adminToast(error.message);adminToast('Usuário suspenso.',true);load()}$('search').oninput=render;load();setInterval(load,30000)</script></body></html>
