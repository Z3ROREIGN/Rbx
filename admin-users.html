<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.row{display:flex;justify-content:space-between;gap:15px;padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}button,a{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none}.danger{color:#ffaaa9}@media(max-width:650px){.row{flex-direction:column}}</style></head><body><main class="wrap"><a href="/admin.html">← Painel</a><h1>👥 Usuários</h1><div id="list">Carregando...</div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('profiles').select('id,display_name,username,roblox_username,account_status').order('created_at',{ascending:false}).limit(200);if(error)return list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';list.innerHTML=data?.length?data.map(x=>'<div class="row"><div><b>'+adminEsc(x.display_name||x.username||'Usuário')+'</b><div style="color:#888">@'+adminEsc(x.username||'—')+' · Roblox: '+adminEsc(x.roblox_username||'—')+'</div><small>'+adminEsc(x.account_status||'ACTIVE')+'</small></div><div class="actions">'+(x.account_status==='BANNED'?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Desbanir</button>':'<button class="danger" onclick="moderate(\''+x.id+'\',\'BANNED\')">Banir</button>')+(x.account_status==='SUSPENDED'?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Reativar</button>':'<button onclick="moderate(\''+x.id+'\',\'SUSPENDED\')">Suspender 7 dias</button>')+'</div></div>').join(''):'Nenhum usuário.'}async function moderate(id,status){if(id===adminUser.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt('Motivo obrigatório:');if(!reason?.trim())return;const until=status==='SUSPENDED'?new Date(Date.now()+604800000).toISOString():null;const {error}=await adminSB.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:until});if(error)return adminToast(error.message);adminToast('Usuário atualizado.',true);load()}load()</script></body></html>
