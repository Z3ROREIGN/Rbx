<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#0b0d0f;--panel:#15181b;--line:#2b3036;--text:#f1f3f5;--muted:#929aa3;--red:#df3340}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.page{max-width:1180px;margin:auto;padding:20px}.head{margin-bottom:18px}.eyebrow{color:#747c85;text-transform:uppercase;font-size:10px;font-weight:800}.title{font-size:36px;font-weight:850;margin-top:5px}.subtitle{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat,.row,.empty,.error{background:var(--panel);border:1px solid var(--line);border-radius:7px}.stat{padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:10px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search{height:42px;border:1px solid #343a41;background:#0f1113;color:#fff;border-radius:6px;padding:0 12px}.filters{display:flex;gap:5px}.filter,.btn{height:42px;padding:0 12px;border:1px solid var(--line);background:#15181b;color:#fff;border-radius:6px;font-weight:750;cursor:pointer}.filter.active{background:#35171b}.list{display:grid;gap:7px}.row{padding:13px;display:flex;justify-content:space-between;gap:16px;align-items:center}.identity{display:flex;gap:12px;align-items:center;min-width:0}.avatar{width:46px;height:46px;border-radius:7px;background:#30171b;border:1px solid #66272e;display:grid;place-items:center;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;padding:4px 7px;border-radius:5px;background:#101214;border:1px solid #343a40;color:#aeb5bd}.badge.red{background:#35171b;color:#ffb1b7}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{height:36px;background:#20242a}.btn.danger{background:#2a1518;color:#ffabb2}.btn.primary{background:var(--red)}.empty,.error{padding:28px;text-align:center;color:var(--muted)}.loading{opacity:.6;pointer-events:none}@media(max-width:850px){.toolbar{grid-template-columns:1fr}.row{display:block}.actions{margin-top:12px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.page{padding:12px}.title{font-size:30px}.actions .btn{flex:1}}</style></head><body><main class="page"><header class="head"><div class="eyebrow">Administração</div><div class="title">Usuários</div><div class="subtitle">Pesquisa e moderação com validação no servidor.</div></header><section class="stats"><div class="stat"><b id="total">—</b><span>Total</span></div><div class="stat"><b id="active">—</b><span>Ativos</span></div><div class="stat"><b id="suspended">—</b><span>Suspensos</span></div><div class="stat"><b id="banned">—</b><span>Banidos</span></div></section><section class="toolbar"><input id="search" class="search" placeholder="Pesquisar nome, @usuário, Roblox ou ID"><div class="filters"><button class="filter active" data-filter="ALL">Todos</button><button class="filter" data-filter="ACTIVE">Ativos</button><button class="filter" data-filter="SUSPENDED">Suspensos</button><button class="filter" data-filter="BANNED">Banidos</button></div></section><section id="list" class="list"><div class="empty">Carregando usuários...</div></section></main><script>let users=[],currentFilter='ALL',busy=false;const $=id=>document.getElementById(id);function statusOf(u){if(u.account_status==='SUSPENDED'&&u.suspended_until&&new Date(u.suspended_until)<=new Date())return'ACTIVE';return u.account_status||'ACTIVE'}function stats(){const s=users.map(statusOf);$('total').textContent=users.length;$('active').textContent=s.filter(x=>x==='ACTIVE').length;$('suspended').textContent=s.filter(x=>x==='SUSPENDED').length;$('banned').textContent=s.filter(x=>x==='BANNED').length}function render(){const q=$('search').value.trim().toLowerCase(),arr=users.filter(u=>{const hay=[u.id,u.username,u.display_name,u.roblox_username].filter(Boolean).join(' ').toLowerCase();return(!q||hay.includes(q))&&(currentFilter==='ALL'||statusOf(u)===currentFilter)});$('list').innerHTML=arr.length?arr.map(u=>{const st=statusOf(u),name=u.display_name||u.username||'Usuário',av=u.avatar_url?'<img src="'+adminEsc(u.avatar_url)+'">':adminEsc(name.slice(0,2).toUpperCase());return'<article class="row"><div class="identity"><span class="avatar">'+av+'</span><div><div class="name">'+adminEsc(name)+'</div><div class="meta">@'+adminEsc(u.username||'—')+' · '+adminEsc(u.roblox_username||'—')+' · '+adminEsc(u.id)+'</div><div class="badges"><span class="badge '+(st==='BANNED'?'red':'')+'">'+adminEsc(st)+'</span>'+(u.moderation_reason?'<span class="badge">'+adminEsc(u.moderation_reason)+'</span>':'')+'</div></div></div><div class="actions"><button class="btn" onclick="openProfile('+JSON.stringify(u.id)+')">Ver perfil</button>'+(st==='BANNED'?'<button class="btn primary" onclick="moderate('+JSON.stringify(u.id)+',\'ACTIVE\')">Reativar</button>':'<button class="btn danger" onclick="moderate('+JSON.stringify(u.id)+',\'BANNED\')">Banir</button>')+(st==='SUSPENDED'?'<button class="btn" onclick="moderate('+JSON.stringify(u.id)+',\'ACTIVE\')">Encerrar suspensão</button>':'<button class="btn" onclick="suspend('+JSON.stringify(u.id)+')">Suspender</button>')+'</div></article>'}).join(''):'<div class="empty">Nenhum usuário encontrado.</div>'}async function load(){if(busy)return;if(!await requireAdmin())return;busy=true;$('list').classList.add('loading');try{const r=await adminGet('/api/admin-users');users=Array.isArray(r.users)?r.users:[];stats();render()}catch(e){$('list').innerHTML='<div class="error">'+adminEsc(e.message)+'</div>'}finally{busy=false;$('list').classList.remove('loading')}}function openProfile(id){location.href='/admin-user-profile.html?id='+encodeURIComponent(id)}async function moderate(id,status){if(id===adminUser?.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da alteração:');if(!reason?.trim())return;try{const r=await adminRequest('/api/admin-users',{method:'POST',body:{target:id,new_status:status,reason:reason.trim(),until_at:null}});adminToast(r.warning|| (status==='BANNED'?'Usuário banido com sucesso.':'Usuário reativado com sucesso.'),!r.warning);await load()}catch(e){adminToast(e.message)}}async function suspend(id){if(id===adminUser?.id)return adminToast('Você não pode suspender sua própria conta.');const reason=prompt('Motivo da suspensão:');if(!reason?.trim())return;const days=Number(prompt('Duração em dias (1 a 365):','7'));if(!Number.isInteger(days)||days<1||days>365)return adminToast('Informe de 1 a 365 dias.');try{const r=await adminRequest('/api/admin-users',{method:'POST',body:{target:id,new_status:'SUSPENDED',reason:reason.trim(),until_at:new Date(Date.now()+days*86400000).toISOString()}});adminToast(r.warning||'Usuário suspenso com sucesso.',!r.warning);await load()}catch(e){adminToast(e.message)}}$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});load();setInterval(load,30000)</script></body></html>
