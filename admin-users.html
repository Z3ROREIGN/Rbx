<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>Usuários — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#0b0d0f;--panel:#15181b;--panel2:#111417;--line:#2b3036;--text:#f1f3f5;--muted:#9098a2;--red:#df3340;--red2:#35171b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1180px;margin:0 auto;padding:28px 18px 100px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:#747c85;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:800}.title{font-size:28px;font-weight:850;margin-top:5px}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}.stat b{display:block;font-size:21px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.search{width:100%;height:42px;border:1px solid #343a41;background:#0f1113;color:var(--text);border-radius:6px;padding:0 12px;outline:0}.search:focus{border-color:#7b2a31;box-shadow:0 0 0 2px #df33401a}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{height:42px;padding:0 12px;border:1px solid var(--line);background:#15181b;color:#aeb5bd;border-radius:6px;cursor:pointer;font-weight:700}.filter.active{background:var(--red2);color:#fff;border-color:#6d2930}.list{display:grid;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;justify-content:space-between;gap:16px;align-items:center}.identity{display:flex;gap:12px;align-items:center;min-width:0}.avatar{width:46px;height:46px;border-radius:7px;background:#30171b;border:1px solid #66272e;display:grid;place-items:center;color:#ffb3b9;font-weight:900;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;font-weight:800;padding:4px 7px;border-radius:5px;border:1px solid #343a40;color:#aeb5bd;background:#101214}.badge.red{background:var(--red2);border-color:#65262d;color:#ffb1b7}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{height:36px;padding:0 10px;border:1px solid #343a40;background:#20242a;color:#dce0e4;border-radius:5px;cursor:pointer;font-weight:750}.btn:hover{background:#282d33}.btn.danger{background:#2a1518;border-color:#6a282f;color:#ffabb2}.btn.primary{background:var(--red);border-color:#a9232d;color:#fff}.empty,.error{background:var(--panel);border:1px dashed #343a40;border-radius:7px;padding:28px;text-align:center;color:var(--muted)}.loading{padding:28px;color:var(--muted)}@media(max-width:760px){.page{padding:20px 10px 94px}.head{display:block}.title{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{display:block}.filters{margin-top:8px;overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.filter{flex:none}.row{display:block}.identity{align-items:flex-start}.actions{justify-content:stretch;margin-top:12px}.actions .btn{flex:1;min-width:120px}.meta{white-space:normal}}@media(max-width:420px){.stats{gap:7px}.stat{padding:11px}.stat b{font-size:18px}.actions .btn{min-width:0;padding:0 7px;font-size:12px}}</style></head><body><main class="page"><header class="head"><div><div class="eyebrow">Administração</div><div class="title">Usuários</div><div class="subtitle">Gerencie contas, status e medidas de moderação.</div></div></header><section class="stats" id="stats"><div class="stat"><b id="total">—</b><span>Total</span></div><div class="stat"><b id="active">—</b><span>Ativos</span></div><div class="stat"><b id="suspended">—</b><span>Suspensos</span></div><div class="stat"><b id="banned">—</b><span>Banidos</span></div></section><section class="toolbar"><input class="search" id="search" placeholder="Pesquisar nome, @usuário, Roblox ou ID" autocomplete="off"><div class="filters"><button class="filter active" data-filter="ALL">Todos</button><button class="filter" data-filter="ACTIVE">Ativos</button><button class="filter" data-filter="SUSPENDED">Suspensos</button><button class="filter" data-filter="BANNED">Banidos</button></div></section><section class="list" id="list"><div class="loading">Carregando usuários...</div></section></main><script>let users=[];let currentFilter='ALL';const $=id=>document.getElementById(id);const safe=v=>typeof adminEsc==='function'?adminEsc(v):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));function statusOf(x){const until=x.suspended_until?new Date(x.suspended_until):null;if(x.account_status==='SUSPENDED'&&until&&until<=new Date())return 'ACTIVE';return x.account_status||'ACTIVE'}function initials(name){return safe((name||'U').trim().slice(0,2).toUpperCase())}function renderStats(){const s=users.map(statusOf);$('total').textContent=users.length;$('active').textContent=s.filter(x=>x==='ACTIVE').length;$('suspended').textContent=s.filter(x=>x==='SUSPENDED').length;$('banned').textContent=s.filter(x=>x==='BANNED').length}function render(){const q=$('search').value.trim().toLowerCase();const arr=users.filter(x=>{const status=statusOf(x);const hay=[x.display_name,x.username,x.roblox_username,x.id].filter(Boolean).join(' ').toLowerCase();return(!q||hay.includes(q))&&(currentFilter==='ALL'||status===currentFilter)});if(!arr.length){$('list').innerHTML='<div class="empty">Nenhum usuário encontrado com esses filtros.</div>';return}$('list').innerHTML=arr.map(x=>{const status=statusOf(x);const until=x.suspended_until?new Date(x.suspended_until):null;const name=x.display_name||x.username||'Usuário';const avatar=x.avatar_url?'<img src="'+safe(x.avatar_url)+'" alt="">':initials(name);return '<article class="row"><div class="identity"><span class="avatar">'+avatar+'</span><div><div class="name">'+safe(name)+'</div><div class="meta">@'+safe(x.username||'—')+' · Roblox: '+safe(x.roblox_username||'—')+'</div><div class="badges"><span class="badge '+(status==='BANNED'?'red':'')+'">'+safe(status)+'</span>'+(until&&status==='SUSPENDED'?'<span class="badge">até '+safe(until.toLocaleString('pt-BR'))+'</span>':'')+(x.moderation_reason?'<span class="badge">Motivo: '+safe(x.moderation_reason)+'</span>':'')+'</div></div></div><div class="actions"><button class="btn" onclick="openProfile(\''+safe(x.id)+'\')">Ver perfil</button>'+(status==='BANNED'?'<button class="btn primary" onclick="moderate(\''+safe(x.id)+'\',\'ACTIVE\')">Reativar</button>':'<button class="btn danger" onclick="moderate(\''+safe(x.id)+'\',\'BANNED\')">Banir</button>')+(status==='SUSPENDED'?'<button class="btn" onclick="moderate(\''+safe(x.id)+'\',\'ACTIVE\')">Encerrar suspensão</button>':'<button class="btn" onclick="suspend(\''+safe(x.id)+'\')">Suspender</button>')+'</div></article>'}).join('')}async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('profiles').select('id,display_name,username,roblox_username,avatar_url,account_status,suspended_until,moderation_reason,created_at').order('created_at',{ascending:false}).limit(500);if(error){$('list').innerHTML='<div class="error">'+safe(error.message)+'</div>';return}users=data||[];renderStats();render()}function openProfile(id){location.href='/profile.html?id='+encodeURIComponent(id)}async function moderate(id,status){if(id===adminUser.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da alteração:');if(!reason?.trim())return;const {error}=await adminSB.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:null});if(error)return adminToast(error.message);adminToast(status==='BANNED'?'Usuário banido.':'Usuário reativado.',true);await load()}async function suspend(id){if(id===adminUser.id)return adminToast('Você não pode suspender sua própria conta.');const reason=prompt('Motivo da suspensão:');if(!reason?.trim())return;const days=Number(prompt('Duração em dias (1 a 365):','7'));if(!Number.isInteger(days)||days<1||days>365)return adminToast('Informe uma duração entre 1 e 365 dias.');const until=new Date(Date.now()+days*86400000).toISOString();const {error}=await adminSB.rpc('moderate_user',{target:id,new_status:'SUSPENDED',reason:reason.trim(),until_at:until});if(error)return adminToast(error.message);adminToast('Usuário suspenso.',true);await load()}$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});load();setInterval(load,30000)</script></body></html>
