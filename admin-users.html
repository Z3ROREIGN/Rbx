<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#0b0d0f;color:#f1f3f5;font:14px system-ui}.page{max-width:1180px;margin:auto;padding:20px}.head{margin-bottom:18px}.eyebrow{color:#747c85;text-transform:uppercase;font-size:10px;font-weight:800}.title{font-size:36px;font-weight:850}.subtitle,.meta{color:#929aa3;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat,.row,.empty,.error{background:#15181b;border:1px solid #2b3036;border-radius:7px}.stat{padding:14px}.stat b{display:block;font-size:22px}.stat span{color:#929aa3;font-size:10px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search{height:42px;border:1px solid #343a41;background:#0f1113;color:#fff;border-radius:6px;padding:0 12px}.filters,.actions{display:flex;gap:6px;flex-wrap:wrap}.filter,.btn{height:40px;padding:0 12px;border:1px solid #343a40;background:#20242a;color:#fff;border-radius:6px;font-weight:750;cursor:pointer}.filter.active{background:#35171b}.btn.danger{background:#3a171c;color:#ffb4bb}.btn.primary{background:#df3340}.btn:disabled{opacity:.5;cursor:wait}.list{display:grid;gap:7px}.row{padding:13px;display:flex;justify-content:space-between;gap:16px;align-items:center}.identity{display:flex;gap:12px;align-items:center;min-width:0}.avatar{width:46px;height:46px;border-radius:7px;background:#30171b;border:1px solid #66272e;display:grid;place-items:center;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;padding:4px 7px;border-radius:5px;background:#101214;border:1px solid #343a40;color:#aeb5bd}.badge.red{background:#35171b;color:#ffb1b7}.empty,.error{padding:28px;text-align:center;color:#929aa3}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.toolbar{grid-template-columns:1fr}.row{display:block}.actions{margin-top:12px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.page{padding:12px}.actions .btn{flex:1}}</style></head><body><main class="page"><header class="head"><div class="eyebrow">Administração</div><div class="title">Usuários</div><div class="subtitle">Gerenciamento e punições com execução no servidor.</div></header><section class="stats"><div class="stat"><b id="total">—</b><span>Total</span></div><div class="stat"><b id="active">—</b><span>Ativos</span></div><div class="stat"><b id="suspended">—</b><span>Suspensos</span></div><div class="stat"><b id="banned">—</b><span>Banidos</span></div></section><section class="toolbar"><input id="search" class="search" placeholder="Pesquisar nome, @usuário, Roblox ou ID"><div class="filters"><button class="filter active" data-filter="ALL">Todos</button><button class="filter" data-filter="ACTIVE">Ativos</button><button class="filter" data-filter="SUSPENDED">Suspensos</button><button class="filter" data-filter="BANNED">Banidos</button></div></section><section id="list" class="list"><div class="empty">Carregando...</div></section></main><script>
let users=[],filter='ALL',busy=false;
const $=id=>document.getElementById(id);
const esc=v=>adminEsc(v);
function status(u){return u.account_status==='SUSPENDED'&&u.suspended_until&&new Date(u.suspended_until)<=new Date()?'ACTIVE':u.account_status||'ACTIVE'}
function draw(){const q=$('search').value.trim().toLowerCase();const a=users.filter(u=>{const h=[u.id,u.username,u.display_name,u.roblox_username].filter(Boolean).join(' ').toLowerCase();return(!q||h.includes(q))&&(filter==='ALL'||status(u)===filter)});$('total').textContent=users.length;$('active').textContent=users.filter(u=>status(u)==='ACTIVE').length;$('suspended').textContent=users.filter(u=>status(u)==='SUSPENDED').length;$('banned').textContent=users.filter(u=>status(u)==='BANNED').length;$('list').innerHTML=a.length?a.map(u=>{const s=status(u),name=u.display_name||u.username||'Usuário';const av=u.avatar_url?'<img src="'+esc(u.avatar_url)+'">':esc(name.slice(0,2).toUpperCase());return '<article class="row"><div class="identity"><span class="avatar">'+av+'</span><div><div class="name">'+esc(name)+'</div><div class="meta">@'+esc(u.username||'—')+' · '+esc(u.roblox_username||'—')+' · '+esc(u.id)+'</div><div class="badges"><span class="badge '+(s==='BANNED'?'red':'')+'">'+esc(s)+'</span>'+(u.moderation_reason?'<span class="badge">'+esc(u.moderation_reason)+'</span>':'')+'</div></div></div><div class="actions"><button class="btn profile" data-id="'+esc(u.id)+'">Abrir perfil</button>'+(s==='BANNED'?'<button class="btn primary action" data-id="'+esc(u.id)+'" data-status="ACTIVE">Reativar</button>':'<button class="btn danger action" data-id="'+esc(u.id)+'" data-status="BANNED">Banir</button>')+(s==='SUSPENDED'?'<button class="btn action" data-id="'+esc(u.id)+'" data-status="ACTIVE">Encerrar suspensão</button>':'<button class="btn action" data-id="'+esc(u.id)+'" data-status="SUSPENDED">Suspender</button>')+'</div></article>'}).join(''):'<div class="empty">Nenhum usuário encontrado.</div>';document.querySelectorAll('.profile').forEach(b=>b.onclick=()=>openProfile(b.dataset.id));document.querySelectorAll('.action').forEach(b=>b.onclick=()=>runAction(b))}
async function load(){if(busy)return;if(!await requireAdmin())return;busy=true;$('list').classList.add('loading');try{const r=await adminGet('/api/admin-users');if(!Array.isArray(r.users))throw Error('A API não retornou a lista de usuários.');users=r.users;draw()}catch(e){$('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{busy=false;$('list').classList.remove('loading')}}
function openProfile(id){if(!id)return adminToast('Usuário inválido.');location.href='/admin-user-profile.html?id='+encodeURIComponent(id)}
async function runAction(btn){const id=btn.dataset.id,status=btn.dataset.status;if(!id||!status)return adminToast('Ação inválida.');if(id===adminUser?.id)return adminToast('Você não pode punir sua própria conta.');let reason='';let until=null;if(status==='SUSPENDED'){reason=prompt('Motivo da suspensão:')||'';if(!reason.trim())return;const days=Number(prompt('Duração em dias (1–365):','7'));if(!Number.isInteger(days)||days<1||days>365)return adminToast('Duração inválida.');until=new Date(Date.now()+days*86400000).toISOString()}else{reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da reativação:')||'';if(!reason.trim())return}btn.disabled=true;const old=btn.textContent;btn.textContent='Processando...';try{const r=await adminRequest('/api/admin-users',{method:'POST',body:{target:id,new_status:status,reason:reason.trim(),until_at:until}});if(!r?.ok)throw Error(r?.error||'A ação não foi confirmada pelo servidor.');adminToast(r.warning||'Ação realizada com sucesso.',!r.warning);await load()}catch(e){adminToast(e.message||'Não foi possível executar a ação.')}finally{btn.disabled=false;btn.textContent=old}}
$('search').oninput=draw;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});load();setInterval(load,30000);
</script></body></html>
