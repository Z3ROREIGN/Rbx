<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>body{margin:0;background:#070709;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.row{display:flex;justify-content:space-between;gap:15px;padding:15px;background:#101013;border:1px solid #292930;border-radius:14px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}button,a{padding:9px 12px;border-radius:9px;border:1px solid #292930;background:#17171b;color:#fff;text-decoration:none;cursor:pointer}.danger{color:#ffaaa9}.muted{color:#999}.status{font-weight:700}@media(max-width:650px){.row{flex-direction:column}}</style></head><body><main class="wrap"><a href="/admin.html">← Painel</a><h1>👥 Usuários</h1><p class="muted">Gerencie suspensão e banimento. A conta do proprietário permanece protegida.</p><div id="list">Carregando...</div></main><script>async function load(){if(!await requireAdmin())return;const {data,error}=await adminSB.from('profiles').select('id,display_name,username,roblox_username,account_status,suspended_until,moderation_reason').order('created_at',{ascending:false}).limit(200);if(error){list.innerHTML='<p style="color:#ff9d9d">'+adminEsc(error.message)+'</p>';return}list.innerHTML=data?.length?data.map(x=>{const until=x.suspended_until?new Date(x.suspended_until).toLocaleString('pt-BR'):'';const suspended=x.account_status==='SUSPENDED'&&x.suspended_until&&new Date(x.suspended_until)>new Date();return '<div class="row"><div><b>'+adminEsc(x.display_name||x.username||'Usuário')+'</b><div style="color:#888">@'+adminEsc(x.username||'—')+' · Roblox: '+adminEsc(x.roblox_username||'—')+'</div><div class="status">Status: '+adminEsc(x.account_status||'ACTIVE')+(suspended?' até '+adminEsc(until):'')+'</div>'+(x.moderation_reason?'<small class="muted">Motivo: '+adminEsc(x.moderation_reason)+'</small>':'')+'</div><div class="actions">'+(x.account_status==='BANNED'?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Desbanir</button>':'<button class="danger" onclick="moderate(\''+x.id+'\',\'BANNED\')">Banir</button>')+(suspended?'<button onclick="moderate(\''+x.id+'\',\'ACTIVE\')">Reativar</button>':'<button onclick="suspend(\''+x.id+'\')">Suspender</button>')+'</div></div>'}).join(''):'Nenhum usuário.'}async function moderate(id,status){if(id===adminUser.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da alteração:');if(!reason?.trim())return;try{await adminSB.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:null});adminToast(status==='BANNED'?'Usuário banido.':'Usuário reativado.',true);await load()}catch(e){adminToast(e.message)}}async function suspend(id){if(id===adminUser.id)return adminToast('Você não pode suspender sua própria conta.');const reason=prompt('Motivo da suspensão:');if(!reason?.trim())return;const days=prompt('Duração em dias (1 a 365):','7');const n=Number(days);if(!Number.isInteger(n)||n<1||n>365)return adminToast('Informe de 1 a 365 dias.');const until=new Date(Date.now()+n*86400000).toISOString();try{await adminSB.rpc('moderate_user',{target:id,new_status:'SUSPENDED',reason:reason.trim(),until_at:until});adminToast('Usuário suspenso por '+n+' dias.',true);await load()}catch(e){adminToast(e.message)}}load()</script></body></html>
