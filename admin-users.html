<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Best Robux Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><style>:root{--bg:#0b0d0f;--panel:#15181b;--line:#2b3036;--text:#f1f3f5;--muted:#9098a2;--red:#df3340}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.page{max-width:1180px;margin:0 auto}.head{margin-bottom:18px}.eyebrow{color:#747c85;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:800}.title{font-size:clamp(28px,4vw,38px);font-weight:850;letter-spacing:-.04em;margin-top:5px}.subtitle{color:var(--muted);font-size:13px;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}.stat b{display:block;font-size:22px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search{width:100%;height:42px;border:1px solid #343a41;background:#0f1113;color:var(--text);border-radius:6px;padding:0 12px;outline:0}.filters{display:flex;gap:5px}.filter{height:42px;padding:0 12px;border:1px solid var(--line);background:#15181b;color:#aeb5bd;border-radius:6px;cursor:pointer;font-weight:700}.filter.active{background:#35171b;color:#fff;border-color:#6d2930}.list{display:grid;gap:7px}.row{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px;display:flex;justify-content:space-between;gap:16px;align-items:center}.identity{display:flex;gap:12px;align-items:center;min-width:0}.avatar{width:46px;height:46px;border-radius:7px;background:#30171b;border:1px solid #66272e;display:grid;place-items:center;color:#ffb3b9;font-weight:900;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;font-weight:800;padding:4px 7px;border-radius:5px;border:1px solid #343a40;color:#aeb5bd;background:#101214}.badge.red{background:#35171b;border-color:#65262d;color:#ffb1b7}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{height:36px;padding:0 10px;border:1px solid #343a40;background:#20242a;color:#dce0e4;border-radius:5px;cursor:pointer;font-weight:750}.btn.danger{background:#2a1518;border-color:#6a282f;color:#ffabb2}.btn.primary{background:var(--red);border-color:#a9232d;color:#fff}.empty,.error{background:var(--panel);border:1px dashed #343a40;border-radius:7px;padding:28px;text-align:center;color:var(--muted)}.loading{opacity:.65;pointer-events:none}@media(max-width:850px){.toolbar{grid-template-columns:1fr}.filters{overflow:auto}.filter{flex:none}.row{display:block}.actions{justify-content:stretch;margin-top:12px}.actions .btn{flex:1;min-width:120px}}@media(max-width:600px){.page{padding-bottom:0}.stats{grid-template-columns:1fr 1fr}.row{padding:11px}.meta{max-width:calc(100vw - 95px)}.actions .btn{min-width:0;font-size:11px;padding:0 7px}}</style></head><body><main class="page"><header class="head"><div class="eyebrow">Administração</div><div class="title">Usuários</div><div class="subtitle">Pesquise contas e aplique medidas de moderação com validação no servidor.</div></header><section class="stats"><div class="stat"><b id="total">—</b><span>Total carregado</span></div><div class="stat"><b id="active">—</b><span>Ativos</span></div><div class="stat"><b id="suspended">—</b><span>Suspensos</span></div><div class="stat"><b id="banned">—</b><span>Banidos</span></div></section><section class="toolbar"><input class="search" id="search" placeholder="Pesquisar nome, @usuário, Roblox ou ID" autocomplete="off"><div class="filters"><button class="filter active" data-filter="ALL">Todos</button><button class="filter" data-filter="ACTIVE">Ativos</button><button class="filter" data-filter="SUSPENDED">Suspensos</button><button class="filter" data-filter="BANNED">Banidos</button></div></section><section class="list" id="list"><div class="empty">Carregando usuários...</div></section></main><script>let users=[],currentFilter='ALL',loading=false;const $=id=>document.getElementById(id),safe=v=>adminEsc(v);function statusOf(x){const until=x.suspended_until?new Date(x.suspended_until):null;if(x.account_status==='SUSPENDED'&&until&&until<=new Date())return 'ACTIVE';return x.account_status||'ACTIVE'}function initials(name){return safe((name||'U').trim().slice(0,2).toUpperCase())}function renderStats(){const s=users.map(statusOf);$('total').textContent=users.length;$('active').textContent=s.filter(x=>x==='ACTIVE').length;$('suspended').textContent=s.filter(x=>x==='SUSPENDED').length;$('banned').textContent=s.filter(x=>x==='BANNED').length}function render(){const q=$('search').value.trim().toLowerCase();const arr=users.filter(x=>{const status=statusOf(x),hay=[x.display_name,x.username,x.roblox_username,x.id].filter(Boolean).join(' ').toLowerCase();return(!q||hay.includes(q))&&(currentFilter==='ALL'||status===currentFilter)});$('list').innerHTML=arr.length?arr.map(x=>{const status=statusOf(x),until=x.suspended_until?new Date(x.suspended_until):null,name=x.display_name||x.username||'Usuário',avatar=x.avatar_url?'<img src="'+safe(x.avatar_url)+'" alt="">':initials(name);return '<article class="row"><div class="identity"><span class="avatar">'+avatar+'</span><div><div class="name">'+safe(name)+'</div><div class="meta">@'+safe(x.username||'—')+' · Roblox: '+safe(x.roblox_username||'—')+' · ID: '+safe(x.id)+'</div><div class="badges"><span class="badge '+(status==='BANNED'?'red':'')+'">'+safe(status)+'</span>'+(until&&status==='SUSPENDED'?'<span class="badge">até '+safe(until.toLocaleString('pt-BR'))+'</span>':'')+(x.moderation_reason?'<span class="badge">Motivo: '+safe(x.moderation_reason)+'</span>':'')+'</div></div></div><div class="actions"><button class="btn" onclick="openProfile('+JSON.stringify(x.id)+')">Ver perfil</button>'+(status==='BANNED'?'<button class="btn primary" onclick="moderate('+JSON.stringify(x.id)+',\'ACTIVE\')">Reativar</button>':'<button class="btn danger" onclick="moderate('+JSON.stringify(x.id)+',\'BANNED\')">Banir</button>')+(status==='SUSPENDED'?'<button class="btn" onclick="moderate('+JSON.stringify(x.id)+',\'ACTIVE\')">Encerrar suspensão</button>':'<button class="btn" onclick="suspend('+JSON.stringify(x.id)+')">Suspender</button>')+'</div></article>'}).join(''):'<div class="empty">Nenhum usuário encontrado com esses filtros.</div>'}async function load(){if(loading||!await requireAdmin())return;loading=true;$('list').classList.add('loading');try{const d=await adminGet('/api/admin-users');users=Array.isArray(d.users)?d.users:[];renderStats();render()}catch(e){$('list').innerHTML='<div class="error">'+safe(e.message)+'</div>'}finally{loading=false;$('list').classList.remove('loading')}}function openProfile(id){location.href='/profile.html?id='+encodeURIComponent(id)}async function moderate(id,status){if(id===adminUser.id)return adminToast('Você não pode moderar sua própria conta.');const reason=prompt(status==='BANNED'?'Motivo do banimento:':'Motivo da alteração:');if(!reason?.trim())return;try{await adminRequest('/api/admin-moderate-user',{method:'POST',body:{target:id,new_status:status,reason:reason.trim(),until_at:null}});adminToast(status==='BANNED'?'Usuário banido.':'Usuário reativado.',true);await load()}catch(e){adminToast(e.message)}}async function suspend(id){if(id===adminUser.id)return adminToast('Você não pode suspender sua própria conta.');const reason=prompt('Motivo da suspensão:');if(!reason?.trim())return;const days=Number(prompt('Duração em dias (1 a 365):','7'));if(!Number.isInteger(days)||days<1||days>365)return adminToast('Informe uma duração entre 1 e 365 dias.');try{await adminRequest('/api/admin-moderate-user',{method:'POST',body:{target:id,new_status:'SUSPENDED',reason:reason.trim(),until_at:new Date(Date.now()+days*86400000).toISOString()}});adminToast('Usuário suspenso.',true);await load()}catch(e){adminToast(e.message)}}let timer;function schedule(){clearTimeout(timer);timer=setTimeout(render,120)}$('search').oninput=schedule;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});load();setInterval(load,30000)</script></body></html>
