<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro Financeiro • Admin</title><style>body{margin:0;background:#080a0c;color:#f4f6f8;font:14px system-ui}.wrap{max-width:1180px;margin:auto;padding:24px 16px}.card{background:#14171a;border:1px solid #2b3137;border-radius:10px;padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#0f1214;border:1px solid #292f35;border-radius:8px;padding:13px}.stat b{display:block;font-size:20px;margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #292f35}.muted{color:#929aa3}.bad{color:#ff6b73}.good{color:#4bd08f}.btn{background:#e3343f;color:#fff;border:0;border-radius:7px;padding:10px 13px;font-weight:800;cursor:pointer}.empty{text-align:center;padding:25px;color:#929aa3}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div id="root"><div class="card"><b>Centro financeiro</b><p class="muted">Verificação de carteiras, saques, MEDs e inconsistências.</p><button class="btn" id="refresh">Atualizar</button></div><div class="card"><div class="grid" id="stats"></div></div><div class="card"><h2>Inconsistências recentes</h2><div id="checks" class="empty">Carregando...</div></div><div class="card"><h2>MEDs recentes</h2><div id="med" class="empty">Carregando...</div></div><div class="card"><h2>Saques recentes</h2><div id="withdrawals" class="empty">Carregando...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-common.js"></script><script>async function load(){try{if(!(await requireAdmin()))return;if(!hasAdminRole('LIDER','ADMINISTRADOR'))throw Error('Acesso insuficiente.');const d=await adminGet('/api/admin-wallet');const s=d.summary||{};document.querySelector('#stats').innerHTML=[['Contas',s.accounts],['Saldo total',`R$ ${Number(s.totalBalance||0).toFixed(2).replace('.',',')}`],['Contas negativas',s.negativeAccounts],['Saques pendentes',s.pendingWithdrawals],['MEDs pendentes',s.pendingMed]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');const bad=(d.checks||[]).filter(x=>x.status!=='OK');document.querySelector('#checks').innerHTML=bad.length?bad.map(x=>`<div class="row"><div><b class="bad">${x.status}</b><div class="muted">${x.user_id} • ${new Date(x.checked_at).toLocaleString('pt-BR')}</div></div><strong>${Number(x.difference||0).toFixed(2)}</strong></div>`).join(''):'<div class="empty"><span class="good">✓ Nenhuma inconsistência recente.</span></div>';document.querySelector('#med').innerHTML=(d.med||[]).length?(d.med||[]).map(x=>`<div class="row"><div><b>${x.id}</b><div class="muted">${x.user_id} • R$ ${Number(x.amount).toFixed(2)} • ${String(x.reason||'')}</div></div><span>${x.status}</span></div>`).join(''):'<div class="empty">Nenhum MED encontrado.</div>';document.querySelector('#withdrawals').innerHTML=(d.withdrawals||[]).length?(d.withdrawals||[]).map(x=>`<div class="row"><div><b>${x.id}</b><div class="muted">${x.user_id} • R$ ${Number(x.amount).toFixed(2)} + R$ ${Number(x.fee||0).toFixed(2)}</div></div><span>${x.status}</span></div>`).join(''):'<div class="empty">Nenhum saque encontrado.</div>'}catch(e){adminToast(e.message||'Erro',false)}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
