<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Administração</title><style>body{margin:0;background:#050505;color:#eee;font:14px system-ui}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.muted{color:#888}.toolbar{display:flex;gap:8px;margin:22px 0;align-items:center}.btn{border:1px solid #292929;background:#111;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.table{background:#0b0b0d;border:1px solid #222;border-radius:12px;overflow:auto}.row{min-width:1050px;display:grid;grid-template-columns:170px 110px 100px 120px 160px 180px 1fr;gap:12px;padding:14px;border-top:1px solid #202020;align-items:center}.head{font-size:11px;color:#888;text-transform:uppercase;border-top:0}.pill{font-size:11px;background:#18181d;padding:5px 8px;border-radius:6px;display:inline-block}.action{background:#fff;color:#050505;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}.action:disabled{opacity:.5;cursor:wait}.link{color:#aaa}.error{display:none;color:#ff7b7b;margin:10px 0;padding:10px;border:1px solid #452020;background:#180b0b;border-radius:8px}.success{display:none;color:#8fe0ad;margin:10px 0;padding:10px;border:1px solid #1d4930;background:#0a180f;border-radius:8px}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux · Administração</div><button class="btn" onclick="location.href='/account.html'">Voltar</button></nav><div class="toolbar"><button class="btn" id="refreshBtn" onclick="load()">Atualizar</button><span id="info" class="muted"></span></div><div id="errorBox" class="error"></div><div id="successBox" class="success"></div><div class="table"><div class="row head"><div>Pedido</div><div>Robux</div><div>Tipo</div><div>Valor</div><div>Roblox</div><div>Status</div><div>Ação</div></div><div id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id);function showError(message){$('errorBox').textContent=message;$('errorBox').style.display='block'}function clearMessages(){$('errorBox').textContent='';$('errorBox').style.display='none';$('successBox').textContent='';$('successBox').style.display='none'}function showSuccess(message){$('successBox').textContent=message;$('successBox').style.display='block'}async function init(){try{const response=await fetch('/api/config',{cache:'no-store'});const c=await response.json();if(!response.ok||!c.supabaseUrl||!c.supabaseAnonKey)throw Error('Configuração da aplicação indisponível.');sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await sb.auth.getSession();if(!s.data.session)return location.href='/login.html';await load()}catch(e){showError(e.message||'Não foi possível iniciar o painel.')}}async function load(){clearMessages();$('info').textContent='Carregando...';$('refreshBtn').disabled=true;try{const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='/login.html';const r=await fetch('/api/admin-orders',{headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'});let d={};try{d=await r.json()}catch{d={error:'Resposta inválida do servidor.'}}if(!r.ok){showError(d.error||`Erro ${r.status} ao carregar pedidos.`);$('info').textContent='';return}const orders=Array.isArray(d.orders)?d.orders:[];$('info').textContent=`${orders.length} pedidos`;if(!orders.length){$('list').innerHTML='<div style="padding:18px;color:#888">Nenhum pedido encontrado.</div>';return}$('list').innerHTML=orders.map(o=>`<div class="row"><div>${esc(o.id)}</div><div>${Number(o.robux||0).toLocaleString('pt-BR')}</div><div>${esc(o.method)}</div><div>R$ ${Number(o.amount||0).toFixed(2).replace('.',',')}</div><div>${esc(o.roblox_username)}${o.gamepass_url?`<br><a class="link" href="${esc(o.gamepass_url)}" target="_blank" rel="noopener noreferrer">Gamepass</a>`:''}</div><div><span class="pill">${esc(o.status)}</span></div><div>${o.status==='PAID'?`<button class="action" onclick="deliver('${esc(o.id)}',this)">Confirmar entrega</button>`:o.status==='DELIVERED'?'Entregue':'—'}</div></div>`).join('')}catch(e){console.error(e);showError(e.message||'Erro interno ao carregar o painel.');$('info').textContent=''}finally{$('refreshBtn').disabled=false}}async function deliver(id,button){const note=prompt('Observação da entrega (opcional):');if(note===null)return;button.disabled=true;button.textContent='Processando...';try{const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='/login.html';const r=await fetch('/api/admin-deliver',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({orderId:id,deliveryNote:note})});let d={};try{d=await r.json()}catch{d={error:'Resposta inválida do servidor.'}}if(!r.ok)throw Error(d.error||`Erro ${r.status}`);showSuccess('Entrega confirmada.');await load()}catch(e){showError(e.message||'Não foi possível confirmar a entrega.');button.disabled=false;button.textContent='Confirmar entrega'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
