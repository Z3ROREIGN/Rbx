<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/site-nav.js" defer></script><style>*{box-sizing:border-box}body{margin:0;background:#070709;color:#eee;font:14px system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:32px 18px 100px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.card,.panel{background:#101013;border:1px solid #27272d;border-radius:16px;padding:16px}.card b{display:block;font-size:26px;margin-top:6px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button,button{border:1px solid #2b2b31;background:#16161a;color:#eee;border-radius:10px;padding:10px 13px;cursor:pointer}.tabs button.active,button.primary{background:#fff;color:#050505}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #222228}.row:last-child{border:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#1d1d22;color:#bbb;font-size:11px}.danger{border-color:#6b3030;color:#ffaaa9}.notice{position:fixed;right:16px;top:16px;z-index:10050;max-width:420px;background:#17171b;border:1px solid #36363e;border-radius:12px;padding:12px 14px;box-shadow:0 15px 45px #000b}.notice.ok{border-color:#385e43}.error{color:#ff9f9f}.search{width:100%;margin:8px 0;padding:11px;background:#0b0b0e;border:1px solid #292930;border-radius:10px;color:#fff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div><div class="muted">Best Robux</div><h1>Painel de administração</h1><div class="muted">Moderação, pedidos, denúncias, conversas e logs.</div></div><button onclick="location.href='/'">Ir para o site</button></header><section class="grid"><div class="card">Denúncias<b id="reportsCount">—</b></div><div class="card">Usuários<b id="usersCount">—</b></div><div class="card">Pedidos<b id="ordersCount">—</b></div><div class="card">Admins<b id="adminsCount">—</b></div><div class="card">Logs<b id="logsCount">—</b></div></section><nav class="tabs"><button class="active" data-tab="reports">🚨 Denúncias</button><button data-tab="orders">🛒 Pedidos</button><button data-tab="users">👥 Usuários</button><button data-tab="chats">💬 Conversas</button><button data-tab="admins">🛡️ Admins</button><button data-tab="logs">📋 Logs</button></nav><section id="reports" class="panel"></section><section id="orders" class="panel" hidden></section><section id="users" class="panel" hidden></section><section id="chats" class="panel" hidden></section><section id="admins" class="panel" hidden></section><section id="logs" class="panel" hidden></section></main><script>const URL='https://anlwpqwjjswkqncltcdl.supabase.co',KEY='sb_publishable_r3GoKwcOEaXySt7fFOM_0A_rNOc7Mq7',OWNER='willianwca2011@gmail.com',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});let me=null,isOwner=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const err=e=>e?.message||'Não foi possível concluir a ação.';function toast(t,ok=false){const n=document.createElement('div');n.className='notice '+(ok?'ok':'');n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),3500)}async function init(){const {data:{session},error}=await sb.auth.getSession();if(error||!session)return location.replace('/login.html?redirect=/admin.html');const {data:admin,error:ae}=await sb.rpc('is_admin',{uid:session.user.id});if(ae||!admin){document.querySelector('main').innerHTML='<section class="panel"><h2>Acesso negado</h2><p class="muted">Sua conta não possui permissão administrativa.</p><button onclick="location.href=\'/\'">Voltar</button></section>';return}isOwner=(session.user.email||'').toLowerCase()===OWNER;const {data:p}=await sb.from('profiles').select('id,display_name,username,is_admin,account_status').eq('id',session.user.id).maybeSingle();me=p||{id:session.user.id};await refresh()}async function refresh(){const [r,u,o,a,l]=await Promise.all([sb.from('reports').select('id,category,description,status,created_at,reported_user_id').order('created_at',{ascending:false}).limit(100),sb.from('profiles').select('id,display_name,username,roblox_username,is_admin,account_status,suspended_until,moderation_reason').order('created_at',{ascending:false}).limit(200),sb.from('orders').select('id,user_id,robux,method,amount,status,roblox_username,gamepass_url,created_at,updated_at').order('created_at',{ascending:false}).limit(100),sb.from('admin_roles').select('user_id,created_at').order('created_at',{ascending:false}),sb.from('admin_audit_logs').select('admin_id,action,target_user_id,metadata,created_at').order('created_at',{ascending:false}).limit(100)]);document.getElementById('reportsCount').textContent=r.error?'!':r.data?.length??0;document.getElementById('usersCount').textContent=u.error?'!':u.data?.length??0;document.getElementById('ordersCount').textContent=o.error?'!':o.data?.length??0;document.getElementById('adminsCount').textContent=a.error?'!':a.data?.length??0;document.getElementById('logsCount').textContent=l.error?'!':l.data?.length??0;renderReports(r.data||[],r.error);renderOrders(o.data||[],o.error);renderUsers(u.data||[],u.error);renderAdmins(a.data||[],a.error);renderLogs(l.data||[],l.error);loadChats()}function box(title,body){return '<h2>'+title+'</h2>'+body}function renderReports(rows,e){document.getElementById('reports').innerHTML=box('Denúncias',e?'<p class="error">'+esc(err(e))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.category)}</b> <span class="tag">${esc(x.status)}</span><div class="muted">${esc(x.description||'Sem descrição')}</div></div><div class="actions"><button onclick="reportStatus('${x.id}','REVIEWING')">Analisar</button><button onclick="reportStatus('${x.id}','RESOLVED')">Resolver</button><button onclick="reportStatus('${x.id}','REJECTED')">Rejeitar</button></div></div>`).join(''):'<p class="muted">Nenhuma denúncia.</p>')}async function reportStatus(id,status){const note=prompt('Observação (opcional):');if(note===null)return;const {error}=await sb.rpc('update_report_status',{report_id:id,new_status:status,note:note.trim()||null});if(error)return toast('Denúncia: '+err(error));toast('Denúncia atualizada.',true);refresh()}function renderOrders(rows,e){document.getElementById('orders').innerHTML=box('Pedidos',e?'<p class="error">'+esc(err(e))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${x.robux.toLocaleString('pt-BR')} Robux · ${esc(x.method)}</b><div class="muted">R$ ${Number(x.amount).toFixed(2).replace('.',',')} · ${esc(x.roblox_username)} · ${new Date(x.created_at).toLocaleString('pt-BR')}</div><span class="tag">${esc(x.status)}</span></div><div class="actions">${x.status==='PAID'?`<button class="primary" onclick="setOrder('${x.id}','PROCESSING')">Em processamento</button>`:''}${x.status==='PROCESSING'?`<button class="primary" onclick="setOrder('${x.id}','DELIVERED')">Marcar entregue</button>`:''}${['PENDING','PAID','PROCESSING'].includes(x.status)?`<button class="danger" onclick="setOrder('${x.id}','CANCELLED')">Cancelar</button>`:''}${x.gamepass_url?`<a href="${esc(x.gamepass_url)}" target="_blank" rel="noopener" style="padding:10px">Gamepass ↗</a>`:''}</div></div>`).join(''):'<p class="muted">Nenhum pedido.</p>')}async function setOrder(id,status){if(!confirm('Confirmar alteração para '+status+'?'))return;const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString(),...(status==='DELIVERED'?{delivered_at:new Date().toISOString(),delivered_by:me.id}: {})}).eq('id',id);if(error)return toast('Pedido: '+err(error));toast('Pedido atualizado.',true);refresh()}function renderUsers(rows,e){document.getElementById('users').innerHTML=box('Usuários',e?'<p class="error">'+esc(err(e))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.display_name||x.username||'Usuário')}</b><div class="muted">@${esc(x.username||'sem username')} · Roblox: ${esc(x.roblox_username||'—')}</div><span class="tag">${esc(x.account_status||'ACTIVE')}</span></div><div class="actions">${x.account_status==='BANNED'?`<button onclick="moderate('${x.id}','ACTIVE')">Desbanir</button>`:`<button class="danger" onclick="moderate('${x.id}','BANNED')">Banir</button>`}${x.account_status==='SUSPENDED'?`<button onclick="moderate('${x.id}','ACTIVE')">Reativar</button>`:`<button onclick="moderate('${x.id}','SUSPENDED')">Suspender</button>`}</div></div>`).join(''):'<p class="muted">Nenhum usuário.</p>')}async function moderate(id,status){if(id===me.id)return toast('Você não pode moderar sua própria conta.');const reason=prompt('Motivo:');if(reason===null||!reason.trim())return;const until=status==='SUSPENDED'?new Date(Date.now()+7*86400000).toISOString():null;const {error}=await sb.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:until});if(error)return toast('Moderação: '+err(error));toast('Usuário atualizado.',true);refresh()}async function loadChats(){const boxEl=document.getElementById('chats');const {data,error}=await sb.from('direct_conversations').select('id,user_a,user_b,updated_at').order('updated_at',{ascending:false}).limit(50);if(error){boxEl.innerHTML=box('Conversas','<p class="error">'+esc(err(error))+'</p>');return}boxEl.innerHTML=box('Conversas','<p class="muted">E-mails não são exibidos.</p>'+(data?.length?data.map(x=>`<div class="row"><div><b>Conversa ${esc(x.id.slice(0,8))}</b><div class="muted">${esc(x.user_a.slice(0,8))} ↔ ${esc(x.user_b.slice(0,8))}</div></div><button onclick="openChat('${x.id}')">Analisar</button></div>`).join(''):'<p class="muted">Nenhuma conversa.</p>')}async function openChat(id){const {data,error}=await sb.from('direct_messages').select('sender_id,body,created_at').eq('conversation_id',id).order('created_at');if(error)return toast('Conversa: '+err(error));const n=document.createElement('div');n.className='notice';n.style.whiteSpace='pre-wrap';n.style.maxHeight='75vh';n.style.overflow='auto';n.textContent=(data||[]).map(x=>`[${new Date(x.created_at).toLocaleString('pt-BR')}] ${x.sender_id.slice(0,8)}: ${x.body}`).join('\n')||'Sem mensagens.';document.body.appendChild(n);setTimeout(()=>n.remove(),20000)}function renderAdmins(rows,e){document.getElementById('admins').innerHTML=box('Administradores',e?'<p class="error">'+esc(err(e))+'</p>':'<p class="muted">Somente o proprietário pode alterar administradores.</p>'+(rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.user_id.slice(0,8))}</b><div class="muted">ID interno</div></div>${isOwner&&x.user_id!==me.id?`<button class="danger" onclick="setAdmin('${x.user_id}',false)">Remover</button>`:'<span class="tag">Administrador</span>'}</div>`).join(''):'<p class="muted">Nenhum administrador.</p>')+(isOwner?'<div class="row"><input id="adminTarget" class="search" placeholder="UUID do usuário"><button class="primary" onclick="addAdmin()">Adicionar</button></div>':'')}async function addAdmin(){if(!isOwner)return toast('Somente o proprietário pode alterar administradores.');const id=document.getElementById('adminTarget').value.trim();if(!id)return toast('Informe o UUID.');const {error}=await sb.rpc('set_admin',{target:id,make_admin:true});if(error)return toast('Admin: '+err(error));toast('Administrador adicionado.',true);refresh()}async function setAdmin(id,v){if(!isOwner||id===me.id)return;const {error}=await sb.rpc('set_admin',{target:id,make_admin:v});if(error)return toast('Admin: '+err(error));toast('Administrador removido.',true);refresh()}function renderLogs(rows,e){document.getElementById('logs').innerHTML=box('Logs administrativos',e?'<p class="error">'+esc(err(e))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.action)}</b><div class="muted">Admin: ${esc((x.admin_id||'').slice(0,8))} · Alvo: ${esc((x.target_user_id||'').slice(0,8))} · ${new Date(x.created_at).toLocaleString('pt-BR')}</div></div></div>`).join(''):'<p class="muted">Nenhum log ainda.</p>')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab)});init();</script></body></html>
