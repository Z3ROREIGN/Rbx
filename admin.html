<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/site-nav.js" defer></script><style>body{margin:0;background:#08080a;color:#eee;font:14px system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:34px 20px 110px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}.muted{color:#8d8d98}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#111114;border:1px solid #25252b;border-radius:18px;padding:18px}.card b{display:block;font-size:28px;margin-top:7px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button,button{border:1px solid #292930;background:#151519;color:#eee;border-radius:10px;padding:10px 13px;cursor:pointer}.tabs button.active,button.primary{background:#eee;color:#08080a}.panel{margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #222228}.row:last-child{border-bottom:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#1c1c21;color:#bbb;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.danger{border-color:#5a2525!important;color:#ff9b9b!important}input,select,textarea{background:#0c0c0f;color:#eee;border:1px solid #292930;border-radius:10px;padding:10px}textarea{min-width:260px;min-height:70px}.notice{position:fixed;top:18px;right:18px;z-index:10020;max-width:min(420px,calc(100vw - 36px));background:#17171b;border:1px solid #34343c;border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px #0009}.notice.err{border-color:#6a3030}.notice.ok{border-color:#3a5b42}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.head{display:block}.row{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><div class="muted">Best Robux</div><h1>Painel de administração</h1><div class="muted">Moderação, denúncias, conversas e segurança. E-mails nunca são exibidos aqui.</div></div><button onclick="location.href='/'">Ir para o site</button></header><section class="grid"><div class="card">Denúncias<b id="reportsCount">—</b></div><div class="card">Usuários<b id="usersCount">—</b></div><div class="card">Pedidos pendentes<b id="ordersCount">—</b></div><div class="card">Administradores<b id="adminsCount">—</b></div></section><nav class="tabs"><button class="active" data-tab="reports">🚨 Denúncias</button><button data-tab="users">👥 Usuários</button><button data-tab="chats">💬 Conversas</button><button data-tab="admins">🛡️ Administradores</button><button data-tab="logs">📋 Logs</button></nav><section id="reports" class="panel"></section><section id="users" class="panel" hidden></section><section id="chats" class="panel" hidden></section><section id="admins" class="panel" hidden></section><section id="logs" class="panel" hidden></section></main><script>const URL='https://anlwpqwjjswkqncltcdl.supabase.co',KEY='sb_publishable_r3GoKwcOEaXySt7fFOM_0A_rNOc7Mq7',OWNER_EMAIL='willianwca2011@gmail.com',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});let me=null,owner=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=e=>e?.message||'Não foi possível concluir esta ação.';function notice(text,ok=false){const n=document.createElement('div');n.className='notice '+(ok?'ok':'err');n.textContent=text;document.body.appendChild(n);setTimeout(()=>n.remove(),3500)}async function init(){const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace('/login.html?redirect=/admin.html');return}owner=(session.user.email||'').toLowerCase()===OWNER_EMAIL;const {data:p,error:pe}=await sb.from('profiles').select('id,display_name,username,roblox_username,is_admin,account_status').eq('id',session.user.id).maybeSingle();if(pe){document.querySelector('main').innerHTML='<div class="panel"><h2>Erro ao carregar o administrador</h2><p class="muted">'+esc(msg(pe))+'</p></div>';return}if(!p?.is_admin){document.querySelector('main').innerHTML='<div class="panel"><h2>Acesso negado</h2><p class="muted">Esta área é restrita.</p><button onclick="location.href=\'/\'">Voltar</button></div>';return}me=p;loadAll()}async function loadAll(){try{const [r,u,o,a,l]=await Promise.all([sb.from('reports').select('id,category,description,status,created_at,reported_user_id,message_id,conversation_id').order('created_at',{ascending:false}).limit(50),sb.from('profiles').select('id,display_name,username,roblox_username,is_admin,account_status,suspended_until,moderation_reason').order('created_at',{ascending:false}).limit(100),sb.from('orders').select('id,status').eq('status','PENDING'),sb.from('profiles').select('id,is_admin,display_name,username').eq('is_admin',true),sb.from('admin_audit_logs').select('action,target_user_id,metadata,created_at').order('created_at',{ascending:false}).limit(100)]);document.getElementById('reportsCount').textContent=r.error?'!':r.data?.length??0;document.getElementById('usersCount').textContent=u.error?'!':u.data?.length??0;document.getElementById('ordersCount').textContent=o.error?'!':o.data?.length??0;document.getElementById('adminsCount').textContent=a.error?'!':a.data?.length??0;renderReports(r.data||[],r.error);renderUsers(u.data||[],u.error);renderAdmins(a.data||[],a.error);renderLogs(l.data||[],l.error);loadChats()}catch(e){notice(msg(e))}}function renderReports(rows,error){document.getElementById('reports').innerHTML='<h2>Denúncias</h2>'+(error?'<p class="muted">Erro: '+esc(msg(error))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.category)}</b> <span class="tag">${esc(x.status)}</span><div class="muted">${esc(x.description||'Sem descrição')}</div><small class="muted">${new Date(x.created_at).toLocaleString('pt-BR')}</small></div><div class="actions"><button onclick="reportStatus('${x.id}','REVIEWING')">Analisar</button><button onclick="reportStatus('${x.id}','RESOLVED')">Resolver</button><button onclick="reportStatus('${x.id}','REJECTED')">Rejeitar</button></div></div>`).join(''):'<p class="muted">Nenhuma denúncia.</p>')}async function reportStatus(id,status){const note=prompt('Observação da moderação (opcional):')??'';const {error}=await sb.rpc('update_report_status',{report_id:id,new_status:status,note:note.trim()||null});if(error){notice('Denúncia: '+msg(error));return}notice('Denúncia atualizada.',true);loadAll()}function renderUsers(rows,error){document.getElementById('users').innerHTML='<h2>Usuários</h2>'+(error?'<p class="muted">Erro: '+esc(msg(error))+'</p>':rows.map(x=>`<div class="row"><div><b>${esc(x.display_name||x.username||'Usuário')}</b><div class="muted">@${esc(x.username||'sem username')} · Roblox: ${esc(x.roblox_username||'—')}</div><span class="tag">${esc(x.account_status||'ACTIVE')}</span></div><div class="actions">${x.account_status==='BANNED'?`<button onclick="moderate('${x.id}','ACTIVE')">Desbanir</button>`:`<button class="danger" onclick="moderate('${x.id}','BANNED')">Banir</button>`}${x.account_status==='SUSPENDED'?`<button onclick="moderate('${x.id}','ACTIVE')">Reativar</button>`:`<button onclick="moderate('${x.id}','SUSPENDED')">Suspender</button>`}</div></div>`).join('')||'<p class="muted">Nenhum usuário.</p>')}async function moderate(id,status){if(id===me.id)return notice('Você não pode moderar sua própria conta.');const reason=prompt('Motivo da moderação:');if(reason===null||!reason.trim())return;const until=status==='SUSPENDED'?new Date(Date.now()+7*86400000).toISOString():null;const {error}=await sb.rpc('moderate_user',{target:id,new_status:status,reason:reason.trim(),until_at:until});if(error){notice('Moderação: '+msg(error));return}notice('Ação concluída.',true);loadAll()}async function loadChats(){const box=document.getElementById('chats');const {data:c,error}=await sb.from('direct_conversations').select('id,user_a,user_b,created_at,updated_at').order('updated_at',{ascending:false}).limit(50);if(error){box.innerHTML='<h2>Conversas</h2><p class="muted">Erro ao carregar: '+esc(msg(error))+'</p>';return}box.innerHTML='<h2>Conversas</h2><p class="muted">Acesso restrito à moderação. E-mails não são exibidos.</p>'+(c?.length?c.map(x=>`<div class="row"><div><b>Conversa ${esc(x.id.slice(0,8))}</b><div class="muted">${esc(x.user_a.slice(0,8))} ↔ ${esc(x.user_b.slice(0,8))}</div></div><button onclick="openChat('${x.id}')">Analisar</button></div>`).join(''):'<p class="muted">Nenhuma conversa.</p>')}async function openChat(id){const {data:m,error}=await sb.from('direct_messages').select('sender_id,body,created_at').eq('conversation_id',id).order('created_at');if(error){notice('Conversa: '+msg(error));return}const box=document.createElement('div');box.className='notice';box.style.whiteSpace='pre-wrap';box.style.maxHeight='70vh';box.style.overflow='auto';box.textContent=(m||[]).map(x=>`[${new Date(x.created_at).toLocaleString('pt-BR')}] ${x.sender_id.slice(0,8)}: ${x.body}`).join('\n')||'Sem mensagens.';document.body.appendChild(box);setTimeout(()=>box.remove(),15000)}function renderAdmins(rows,error){document.getElementById('admins').innerHTML='<h2>Administradores</h2>'+(error?'<p class="muted">Erro: '+esc(msg(error))+'</p>':'<p class="muted">Somente o proprietário pode adicionar/remover administradores. E-mails não são exibidos.</p>'+(rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.display_name||x.username||'Usuário')}</b><div class="muted">@${esc(x.username||'')}</div></div>${owner&&x.id!==me.id?`<button class="danger" onclick="setAdmin('${x.id}',false)">Remover</button>`:x.id===me.id?'<span class="tag">Proprietário / administrador</span>':'<span class="tag">Administrador</span>'}</div>`).join(''):'<p class="muted">Nenhum administrador.</p>')+(owner?'<div class="row"><div><input id="adminTarget" placeholder="ID do usuário para promover"></div><button class="primary" onclick="addAdmin()">Adicionar administrador</button></div>':'')}async function addAdmin(){if(!owner)return notice('Somente o proprietário pode adicionar administradores.');const id=document.getElementById('adminTarget').value.trim();if(!id)return notice('Informe o ID do usuário.');const {error}=await sb.rpc('set_admin',{target:id,make_admin:true});if(error){notice('Administrador: '+msg(error));return}notice('Administrador adicionado.',true);loadAll()}async function setAdmin(id,v){if(!owner)return notice('Somente o proprietário pode remover administradores.');if(id===me.id)return;const {error}=await sb.rpc('set_admin',{target:id,make_admin:v});if(error){notice('Administrador: '+msg(error));return}notice('Administrador removido.',true);loadAll()}function renderLogs(rows,error){document.getElementById('logs').innerHTML='<h2>Logs administrativos</h2>'+(error?'<p class="muted">Erro: '+esc(msg(error))+'</p>':rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.action)}</b><div class="muted">Alvo: ${esc(x.target_user_id||'—')} · ${new Date(x.created_at).toLocaleString('pt-BR')}</div></div></div>`).join(''):'<p class="muted">Nenhum log ainda. Ações administrativas futuras aparecerão aqui automaticamente.</p>')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab)});init();</script></body></html>
