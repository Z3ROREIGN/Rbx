<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Administração</title><style>body{margin:0;background:#050505;color:#eee;font:14px system-ui}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}.nav{height:70px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.muted{color:#888}.toolbar{display:flex;gap:8px;margin:22px 0}.btn{border:1px solid #292929;background:#111;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.table{background:#0b0b0d;border:1px solid #222;border-radius:12px;overflow:auto}.row{min-width:1050px;display:grid;grid-template-columns:170px 110px 100px 120px 160px 180px 1fr;gap:12px;padding:14px;border-top:1px solid #202020;align-items:center}.head{font-size:11px;color:#888;text-transform:uppercase;border-top:0}.pill{font-size:11px;background:#18181d;padding:5px 8px;border-radius:6px;display:inline-block}.action{background:#fff;color:#050505;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}.link{color:#aaa}.error{color:#ff7b7b;margin:10px 0}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux · Administração</div><button class="btn" onclick="location.href='/account.html'">Voltar</button></nav><div class="toolbar"><button class="btn" onclick="load()">Atualizar</button><span id="info" class="muted"></span></div><div id="error" class="error"></div><div class="table"><div class="row head"><div>Pedido</div><div>Robux</div><div>Tipo</div><div>Valor</div><div>Roblox</div><div>Status</div><div>Ação</div></div><div id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function init(){const c=await(await fetch('/api/config')).json();sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await sb.auth.getSession();if(!s.data.session)return location.href='/login.html';await load()}async function load(){error.textContent='';const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='/login.html';const r=await fetch('/api/admin-orders',{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(!r.ok){error.textContent=d.error||'Acesso negado.';return}info.textContent=`${d.orders.length} pedidos`;list.innerHTML=d.orders.map(o=>`<div class="row"><div>${o.id}</div><div>${Number(o.robux).toLocaleString('pt-BR')}</div><div>${o.method}</div><div>R$ ${Number(o.amount).toFixed(2).replace('.',',')}</div><div>${esc(o.roblox_username)}${o.gamepass_url?`<br><a class="link" href="${esc(o.gamepass_url)}" target="_blank" rel="noopener">Gamepass</a>`:''}</div><div><span class="pill">${esc(o.status)}</span></div><div>${o.status==='PAID'?`<button class="action" onclick="deliver('${o.id}')">Confirmar entrega</button>`:o.status==='DELIVERED'?'Entregue':'—'}</div></div>`).join('')}async function deliver(id){const note=prompt('Observação da entrega (opcional):')??'';const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/admin-deliver',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({orderId:id,deliveryNote:note})});const d=await r.json();if(!r.ok)return alert(d.error||'Erro');await load()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
