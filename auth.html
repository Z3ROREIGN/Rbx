<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Conta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.box{width:min(430px,calc(100% - 30px));padding:28px;background:#0b0b0d;border:1px solid #24242a;border-radius:16px;box-shadow:0 30px 100px #000}.brand{font-size:22px;font-weight:800}.muted{color:#85858e;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#070709;border:1px solid #202026;border-radius:10px;margin:22px 0 18px}.tabs button{border:0;background:none;color:#888;padding:10px;border-radius:7px;cursor:pointer}.tabs .on{background:#fff;color:#050505;font-weight:700}.field{margin:14px 0}.field label{display:block;color:#888;font-size:11px;margin-bottom:7px}.field input{width:100%;height:43px;padding:0 12px;border-radius:8px;border:1px solid #28282f;background:#060607;color:#fff;outline:0}.field input:focus{border-color:#7568d8}.btn{width:100%;height:43px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:750;cursor:pointer;margin-top:7px}.secondary{background:#121216;color:#ddd;border:1px solid #292930}.msg{min-height:20px;margin-top:14px;color:#aaa;font-size:12px;line-height:1.5}.error{color:#ff8585}.success{color:#80d7a2}.back{display:block;text-align:center;color:#777;margin-top:18px;font-size:12px}</style></head><body><main class="box"><div class="brand">Best Robux</div><p class="muted">Entre na sua conta para comprar e acompanhar seus pedidos.</p><div class="tabs"><button id="loginTab" class="on" onclick="mode('login')">Entrar</button><button id="signupTab" onclick="mode('signup')">Criar conta</button></div><form id="form"><div class="field" id="usernameWrap" style="display:none"><label>USUÁRIO</label><input id="username" maxlength="30" autocomplete="username" placeholder="Como quer ser chamado?"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></div><div class="field" id="confirmWrap" style="display:none"><label>CONFIRMAR SENHA</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Digite a senha novamente"></div><button class="btn" id="submit">Entrar</button></form><button class="btn secondary" id="forgot" onclick="forgot()">Esqueci minha senha</button><div id="msg" class="msg"></div><a class="back" href="index.html">← Voltar para a loja</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,kind='login';const $=id=>document.getElementById(id);async function boot(){try{const c=await(await fetch('/api/config')).json();if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(s.data.session)location.href='account.html'}catch(e){setMsg('Não foi possível carregar a autenticação.','error')}}boot();function setMsg(t,c=''){msg.textContent=t;msg.className='msg '+c}function mode(v){kind=v;loginTab.className=v==='login'?'on':'';signupTab.className=v==='signup'?'on':'';usernameWrap.style.display=v==='signup'?'block':'none';confirmWrap.style.display=v==='signup'?'block':'none';forgot.style.display=v==='login'?'block':'none';submit.textContent=v==='login'?'Entrar':'Criar conta';setMsg('')}form.onsubmit=async e=>{e.preventDefault();setMsg('');if(!client)return setMsg('Autenticação indisponível.','error');const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(kind==='login'){const {error}=await client.auth.signInWithPassword({email,password});if(error){if(/not confirmed/i.test(error.message))return setMsg('Confirme seu e-mail antes de entrar.','error');return setMsg('E-mail ou senha inválidos.','error')}location.href='account.html';return}const username=$('username').value.trim(),confirm=$('confirm').value;if(!/^[A-Za-z0-9_]{3,30}$/.test(username))return setMsg('Use de 3 a 30 caracteres, letras, números ou _.','error');if(password!==confirm)return setMsg('As senhas não coincidem.','error');const {data,error}=await client.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+'/account.html'}});if(error){if(/rate/i.test(error.message))return setMsg('Muitas tentativas. Aguarde alguns minutos antes de tentar novamente.','error');return setMsg(error.message,'error')}if(data.session)location.href='account.html';else setMsg('Conta criada. Verifique seu e-mail para ativá-la.','success')};async function forgot(){if(!client)return;const email=$('email').value.trim().toLowerCase();if(!email)return setMsg('Digite seu e-mail primeiro.','error');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset.html'});setMsg(error?'Não foi possível enviar o e-mail de recuperação.':'Enviamos as instruções de recuperação para seu e-mail.',error?'error':'success')}</script></body></html>
