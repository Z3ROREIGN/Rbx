<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Conta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.box{width:min(430px,calc(100% - 30px));padding:28px;background:#0b0b0d;border:1px solid #24242a;border-radius:16px;box-shadow:0 30px 100px #000}.brand{font-size:22px;font-weight:800}.muted{color:#85858e;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;padding:4px;background:#070709;border:1px solid #202026;border-radius:10px;margin:22px 0 18px}.tabs button{border:0;background:none;color:#888;padding:10px;border-radius:7px;cursor:pointer}.tabs .on{background:#fff;color:#050505;font-weight:700}.field{margin:14px 0}.field label{display:block;color:#888;font-size:11px;margin-bottom:7px}.field input{width:100%;height:43px;padding:0 12px;border-radius:8px;border:1px solid #28282f;background:#060607;color:#fff;outline:0}.field input:focus{border-color:#7568d8}.btn{width:100%;height:43px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:750;cursor:pointer;margin-top:7px}.msg{min-height:20px;margin-top:14px;color:#aaa;font-size:12px;line-height:1.5}.error{color:#ff8585}.success{color:#80d7a2}.back{display:block;text-align:center;color:#777;margin-top:18px;font-size:12px}</style></head><body><main class="box"><div class="brand">Best Robux</div><p class="muted">Entre ou crie sua conta rapidamente. A criação da conta não exige confirmação por e-mail.</p><div class="tabs"><button id="loginTab" class="on" onclick="mode('login')">Entrar</button><button id="signupTab" onclick="mode('signup')">Criar</button><button id="recoveryTab" onclick="mode('recovery')">Recuperar</button></div><form id="form"><div class="field" id="usernameWrap" style="display:none"><label>USUÁRIO</label><input id="username" maxlength="30" autocomplete="username" placeholder="Como quer ser chamado?"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div class="field" id="passwordWrap"><label>SENHA</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></div><div class="field" id="confirmWrap" style="display:none"><label>CONFIRMAR SENHA</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Digite a senha novamente"></div><button class="btn" id="submit">Entrar</button></form><div id="msg" class="msg"></div><a class="back" href="index.html">← Voltar para a loja</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,kind='login';const $=id=>document.getElementById(id),msg=$('msg');async function boot(){try{const c=await(await fetch('/api/config')).json();if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const s=await client.auth.getSession();if(s.data.session)location.href='account.html'}catch(e){setMsg('Não foi possível carregar a autenticação.','error')}}function setMsg(t,c=''){msg.textContent=t;msg.className='msg '+c}function mode(v){kind=v;$('loginTab').className=v==='login'?'on':'';$('signupTab').className=v==='signup'?'on':'';$('recoveryTab').className=v==='recovery'?'on':'';$('usernameWrap').style.display=v==='signup'?'block':'none';$('confirmWrap').style.display=v==='signup'?'block':'none';$('passwordWrap').style.display=v==='recovery'?'none':'block';$('submit').textContent=v==='login'?'Entrar':v==='signup'?'Criar conta':'Enviar recuperação';setMsg('')}$('form').onsubmit=async e=>{e.preventDefault();if(!client)return setMsg('Autenticação indisponível.','error');const email=$('email').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setMsg('Informe um e-mail válido.','error');if(kind==='signup'){const username=$('username').value.trim(),password=$('password').value,confirm=$('confirm').value;if(!/^[A-Za-z0-9_]{3,30}$/.test(username))return setMsg('Use de 3 a 30 caracteres, letras, números ou _.','error');if(password.length<8)return setMsg('A senha precisa ter pelo menos 8 caracteres.','error');if(password!==confirm)return setMsg('As senhas não coincidem.','error');const {data,error}=await client.auth.signUp({email,password,options:{data:{username}}});if(error)return setMsg(/already registered|already exists/i.test(error.message)?'Este e-mail já possui uma conta.':'Não foi possível criar a conta.','error');if(!data.session)return setMsg('O Supabase ainda está exigindo confirmação de e-mail. Desative "Confirm email" em Authentication → Providers → Email para o cadastro ser imediato.','error');return location.href='account.html'}if(kind==='login'){const password=$('password').value;if(password.length<8)return setMsg('Informe sua senha.','error');const {error}=await client.auth.signInWithPassword({email,password});if(error)return setMsg(/not confirmed/i.test(error.message)?'A confirmação de e-mail ainda está ativada no Supabase.':'E-mail ou senha inválidos.','error');return location.href='account.html'}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset.html'});if(error)return setMsg('Não foi possível enviar a recuperação.','error');setMsg('Se a conta existir, as instruções de recuperação foram enviadas.','success')};boot();</script></body></html>
