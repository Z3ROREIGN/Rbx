<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Entrar</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui;min-height:100vh;display:grid;place-items:center}.box{width:min(410px,calc(100% - 32px));background:#0d0d10;border:1px solid #26262d;border-radius:22px;padding:28px;box-shadow:0 30px 90px #000}.brand{font-size:24px;font-weight:900;margin-bottom:8px}.muted{color:#92929d;font-size:14px}.tabs{display:flex;background:#08080a;border:1px solid #25252c;padding:4px;border-radius:11px;margin:24px 0}.tabs button{flex:1;border:0;background:none;color:#999;padding:11px;border-radius:8px;cursor:pointer}.tabs .on{background:#fff;color:#080808;font-weight:800}label{display:block;font-size:12px;color:#aaa;margin:15px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #292930;background:#08080a;color:#fff;outline:0}input:focus{border-color:#8b5cf6}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#a78bfa,#7c3aed);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:15px;font-size:13px;color:#a7f3d0;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#888;font-size:13px}</style></head><body><main class="box"><div class="brand">Best Robux</div><div class="muted">Acesse sua conta para comprar e acompanhar pedidos.</div><div class="tabs"><button id="loginTab" class="on" onclick="mode('login')">Entrar</button><button id="signupTab" onclick="mode('signup')">Criar conta</button></div><form onsubmit="submitForm(event)"><div id="usernameWrap" style="display:none"><label>USUÁRIO</label><input id="username" autocomplete="username" placeholder="Como quer ser chamado?"></div><label>E-MAIL</label><input id="email" type="email" required autocomplete="email" placeholder="voce@email.com"><label>SENHA</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"><button class="submit" id="submit">Entrar</button></form><div id="msg" class="msg"></div><a class="back" href="index.html">← Voltar para a loja</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client=null,kind='login';async function boot(){const r=await fetch('/api/config');const c=await r.json();if(c.supabaseUrl&&c.supabaseAnonKey)client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);else msg.textContent='Configuração do Supabase não encontrada.'}boot();function mode(v){kind=v;loginTab.className=v==='login'?'on':'';signupTab.className=v==='signup'?'on':'';usernameWrap.style.display=v==='signup'?'block':'none';submit.textContent=v==='login'?'Entrar':'Criar conta';msg.textContent=''}async function submitForm(e){e.preventDefault();if(!client){msg.textContent='Aguarde a configuração carregar.';return}const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(kind==='login'){const r=await client.auth.signInWithPassword({email,password});if(r.error){msg.textContent='E-mail ou senha inválidos.';return}location.href='account.html'}else{const username=document.getElementById('username').value.trim();if(!username){msg.textContent='Informe um nome de usuário.';return}const r=await client.auth.signUp({email,password,options:{data:{username}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent=r.data.session?'Conta criada.':'Conta criada. Verifique seu e-mail para continuar.'}}</script></body></html>
