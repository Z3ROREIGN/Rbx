<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Conta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.box{width:min(430px,calc(100% - 30px));padding:28px;background:#0b0b0d;border:1px solid #24242a;border-radius:16px;box-shadow:0 30px 100px #000}.brand{font-size:22px;font-weight:800}.muted{color:#85858e;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;padding:4px;background:#070709;border:1px solid #202026;border-radius:10px;margin:22px 0 18px}.tabs button{border:0;background:none;color:#888;padding:10px;border-radius:7px;cursor:pointer}.tabs .on{background:#fff;color:#050505;font-weight:700}.field{margin:14px 0}.field label{display:block;color:#888;font-size:11px;margin-bottom:7px}.field input{width:100%;height:43px;padding:0 12px;border-radius:8px;border:1px solid #28282f;background:#060607;color:#fff;outline:0}.field input:focus{border-color:#7568d8}.btn{width:100%;height:43px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:750;cursor:pointer;margin-top:7px}.secondary{background:#121216;color:#ddd;border:1px solid #292930}.msg{min-height:20px;margin-top:14px;color:#aaa;font-size:12px;line-height:1.5}.error{color:#ff8585}.success{color:#80d7a2}.back{display:block;text-align:center;color:#777;margin-top:18px;font-size:12px}.code{letter-spacing:7px;text-align:center;font-size:22px;font-weight:800}.hidden{display:none!important}</style></head><body><main class="box"><div class="brand">Best Robux</div><p class="muted">Acesse sua conta, confirme seu e-mail por código e acompanhe seus pedidos.</p><div class="tabs"><button id="loginTab" class="on" onclick="mode('login')">Entrar</button><button id="signupTab" onclick="mode('signup')">Criar</button><button id="recoveryTab" onclick="mode('recovery')">Recuperar</button></div><section id="credentials"><form id="form"><div class="field" id="usernameWrap" style="display:none"><label>USUÁRIO</label><input id="username" maxlength="30" autocomplete="username" placeholder="Como quer ser chamado?"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div class="field" id="passwordWrap"><label>SENHA</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></div><div class="field" id="confirmWrap" style="display:none"><label>CONFIRMAR SENHA</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Digite a senha novamente"></div><button class="btn" id="submit">Enviar código</button></form></section><section id="codeStep" class="hidden"><div class="field"><label>CÓDIGO ENVIADO PARA SEU E-MAIL</label><input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><button class="btn" id="verifyBtn" onclick="verifyCode()">Verificar código</button><button class="btn secondary" onclick="sendCode(true)">Reenviar código</button></section><section id="newPasswordStep" class="hidden"><div class="field"><label>NOVA SENHA</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>CONFIRMAR SENHA</label><input id="newConfirm" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" onclick="changePassword()">Salvar senha</button></section><div id="msg" class="msg"></div><a class="back" href="index.html">← Voltar para a loja</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,kind='login',pendingEmail='',pendingMode='';const $=id=>document.getElementById(id);async function boot(){try{const c=await(await fetch('/api/config')).json();if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(s.data.session)location.href='account.html'}catch(e){setMsg('Não foi possível carregar a autenticação.','error')}}boot();function setMsg(t,c=''){msg.textContent=t;msg.className='msg '+c}function mode(v){kind=v;loginTab.className=v==='login'?'on':'';signupTab.className=v==='signup'?'on':'';recoveryTab.className=v==='recovery'?'on':'';usernameWrap.style.display=v==='signup'?'block':'none';confirmWrap.style.display=v==='signup'?'block':'none';passwordWrap.style.display=v==='recovery'?'none':'block';submit.textContent=v==='recovery'?'Enviar código':'Enviar código';setMsg('');credentials.classList.remove('hidden');codeStep.classList.add('hidden');newPasswordStep.classList.add('hidden')}form.onsubmit=async e=>{e.preventDefault();if(!client)return setMsg('Autenticação indisponível.','error');pendingEmail=$('email').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(pendingEmail))return setMsg('Informe um e-mail válido.','error');if(kind==='signup'){const username=$('username').value.trim(),password=$('password').value,confirm=$('confirm').value;if(!/^[A-Za-z0-9_]{3,30}$/.test(username))return setMsg('Use de 3 a 30 caracteres, letras, números ou _.','error');if(password.length<8)return setMsg('A senha precisa ter pelo menos 8 caracteres.','error');if(password!==confirm)return setMsg('As senhas não coincidem.','error');const {error}=await client.auth.signUp({email:pendingEmail,password,options:{data:{username},emailRedirectTo:location.origin+'/account.html'}});if(error)return setMsg(/rate/i.test(error.message)?'Muitas tentativas. Aguarde alguns minutos.':'Não foi possível criar a conta.','error');pendingMode='signup';showCode('Enviamos um código de 6 dígitos para confirmar seu cadastro.');return}if(kind==='login'){const password=$('password').value;if(password.length<8)return setMsg('Informe sua senha.','error');const {error}=await client.auth.signInWithPassword({email:pendingEmail,password});if(error)return setMsg(/not confirmed/i.test(error.message)?'Sua conta ainda precisa ser confirmada. Use o código enviado por e-mail.':'E-mail ou senha inválidos.','error');pendingMode='login';const {error:otpError}=await client.auth.signInWithOtp({email:pendingEmail,options:{shouldCreateUser:false}});if(otpError)return setMsg('Não foi possível enviar o código.','error');showCode('Enviamos um código de segurança para seu e-mail.');return}const {error}=await client.auth.resetPasswordForEmail(pendingEmail,{redirectTo:location.origin+'/reset.html'});if(error)return setMsg('Não foi possível enviar o código de recuperação.','error');pendingMode='recovery';showCode('Enviamos o código de recuperação para seu e-mail.')}function showCode(text){credentials.classList.add('hidden');codeStep.classList.remove('hidden');newPasswordStep.classList.add('hidden');setMsg(text,'success');$('code').focus()}async function verifyCode(){const token=$('code').value.replace(/\D/g,'').slice(0,6);if(token.length!==6)return setMsg('Digite os 6 dígitos do código.','error');let type=pendingMode==='signup'?'signup':pendingMode==='recovery'?'recovery':'email';const {data,error}=await client.auth.verifyOtp({email:pendingEmail,token,type});if(error)return setMsg('Código inválido ou expirado.','error');if(pendingMode==='recovery'){codeStep.classList.add('hidden');newPasswordStep.classList.remove('hidden');setMsg('Código confirmado. Defina sua nova senha.','success');return}location.href='account.html'}async function sendCode(resend=false){if(!pendingEmail)return;let error;if(pendingMode==='recovery'){({error}=await client.auth.resetPasswordForEmail(pendingEmail,{redirectTo:location.origin+'/reset.html'}))}else{({error}=await client.auth.signInWithOtp({email:pendingEmail,options:{shouldCreateUser:false}}))}setMsg(error?'Não foi possível reenviar o código.':'Novo código enviado.',''+(error?'error':'success'))}async function changePassword(){const a=$('newPassword').value,b=$('newConfirm').value;if(a.length<8)return setMsg('A senha precisa ter pelo menos 8 caracteres.','error');if(a!==b)return setMsg('As senhas não coincidem.','error');const {error}=await client.auth.updateUser({password:a});if(error)return setMsg('Não foi possível alterar a senha.','error');setMsg('Senha alterada com sucesso.','success');setTimeout(()=>location.href='account.html',800)}$('code').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));</script></body></html>
