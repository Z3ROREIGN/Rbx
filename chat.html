<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Best Robux — Mensagens</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.nav a{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:24px 0}.panel{background:#0b0b0d;border:1px solid #222229;border-radius:14px;overflow:hidden}.search{padding:14px;border-bottom:1px solid #222229}.search input{width:100%;height:40px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:0 10px}.users{max-height:620px;overflow:auto}.user{padding:11px 13px;border-bottom:1px solid #18181d;cursor:pointer;display:flex;gap:10px;align-items:center}.user:hover,.user.active{background:#121216}.user b{display:block}.muted{color:#85858f;font-size:12px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#17171c;flex:0 0 42px}.chat{height:620px;display:flex;flex-direction:column}.chathead{padding:12px 15px;border-bottom:1px solid #222229;display:flex;align-items:center;gap:10px}.chathead .avatar{width:38px;height:38px;flex-basis:38px}.messages{flex:1;overflow:auto;padding:18px}.msgrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:9px}.msgrow.mine{justify-content:flex-end}.msgrow.mine .avatar{display:none}.bubble{max-width:78%;padding:10px 12px;border-radius:12px;background:#17171c}.mine .bubble{background:#fff;color:#050505}.time{font-size:10px;opacity:.55;margin-top:4px}.composer{padding:12px;border-top:1px solid #222229;display:flex;gap:8px}.composer textarea{flex:1;resize:none;height:44px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:12px}.composer button{border:0;border-radius:8px;padding:0 17px;background:#fff;color:#000;font-weight:700}.empty{padding:25px;color:#777}.error{color:#ff8585;padding:10px 0}@media(max-width:750px){.layout{grid-template-columns:1fr}.chat{height:560px}.users{max-height:250px}}</style></head><body><div class="wrap"><nav class="nav"><b class="brand">Best Robux</b><a href="/account.html">Minha conta</a></nav><div class="layout"><section class="panel"><div class="search"><input id="search" placeholder="Buscar membros..."></div><div id="users" class="users"><div class="empty">Carregando...</div></div></section><section class="panel chat"><div id="head" class="chathead"><b>Mensagens</b><div class="muted">Selecione um membro para conversar.</div></div><div id="messages" class="messages"><div class="empty">Suas conversas ficam salvas na sua conta.</div></div><div class="composer"><textarea id="body" maxlength="2000" placeholder="Escreva uma mensagem..." disabled></textarea><button id="send" disabled>Enviar</button></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user,myProfile,selected,conversation,liveChannel;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c));const fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2242%22 height=%2242%22%3E%3Ccircle cx=%2221%22 cy=%2221%22 r=%2221%22 fill=%22%2317171c%22/%3E%3Ccircle cx=%2221%22 cy=%2216%22 r=%228%22 fill=%22%23888%22/%3E%3Cpath d=%22M7 39c2-10 8-15 14-15s12 5 14 15%22 fill=%22%23888%22/%3E%3C/svg%3E';function img(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:fallback}catch{return fallback}}function renderMessage(m){if(document.querySelector('[data-message-id="'+m.id+'"]'))return;const mine=m.sender_id===user.id;const av=mine?myProfile?.avatar_url:selected?.avatar_url;const row=document.createElement('div');row.className='msgrow '+(mine?'mine':'');row.dataset.messageId=m.id;row.innerHTML=(mine?'':'<img class="avatar" src="'+esc(img(av))+'" alt="">')+'<div class="bubble">'+esc(m.body)+'<div class="time">'+new Date(m.created_at).toLocaleString('pt-BR')+'</div></div>';$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}async function boot(){const cfg=await fetch('/api/config',{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Configuração indisponível');return d});client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=await client.auth.getSession();if(!s.data.session)return location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));user=s.data.session.user;const p=await client.from('profiles').select('id,username,display_name,avatar_url,bio').eq('id',user.id).maybeSingle();myProfile=p.data||{};await search();$('search').oninput=search}async function search(){const q=$('search').value.trim();const r=await client.rpc('search_public_profiles',{p_query:q});if(r.error){$('users').innerHTML='<div class="empty">Não foi possível carregar membros.</div>';return}const seen=new Set();const rows=(r.data||[]).filter(u=>u.id!==user.id&&!seen.has(u.id)&&seen.add(u.id));$('users').innerHTML=rows.map(u=>`<div class="user ${selected?.id===u.id?'active':''}" onclick='openUser(${JSON.stringify(u).replace(/</g,'\\u003c')})'><img class="avatar" src="${esc(img(u.avatar_url))}" alt=""><div><b>${esc(u.display_name||u.username||'Membro')}</b><span class="muted">@${esc(u.username||'')}</span></div></div>`).join('')||'<div class="empty">Nenhum membro encontrado.</div>'}async function openUser(u){selected=u;await search();$('head').innerHTML='<img class="avatar" src="'+esc(img(u.avatar_url))+'" alt=""><div><b>'+esc(u.display_name||u.username||'Membro')+'</b><div class="muted">@'+esc(u.username||'')+'</div></div>';if(liveChannel){await client.removeChannel(liveChannel);liveChannel=null}const r=await client.rpc('get_or_create_direct_conversation',{other_user:u.id});if(r.error){$('messages').innerHTML='<div class="error">Não foi possível abrir a conversa: '+esc(r.error.message)+'</div>';return}conversation=r.data;$('body').disabled=false;$('send').disabled=false;await loadMessages();liveChannel=client.channel('dm-'+conversation).on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+conversation},payload=>{if(payload.new)renderMessage(payload.new)}).subscribe()}async function loadMessages(){if(!conversation)return;const r=await client.from('direct_messages').select('id,sender_id,body,created_at').eq('conversation_id',conversation).order('created_at',{ascending:true}).limit(200);if(r.error){$('messages').innerHTML='<div class="error">Não foi possível carregar as mensagens.</div>';return}$('messages').innerHTML='';(r.data||[]).forEach(renderMessage)}async function send(){const text=$('body').value.trim();if(!text||!conversation)return;$('send').disabled=true;const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:text}).select('id,sender_id,body,created_at').single();if(!r.error){$('body').value='';renderMessage(r.data)}else $('messages').insertAdjacentHTML('beforeend','<div class="error">Não foi possível enviar: '+esc(r.error.message)+'</div>');$('send').disabled=false}$('send').onclick=send;$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('beforeunload',()=>{if(liveChannel)client.removeChannel(liveChannel)});boot().catch(e=>{$('users').innerHTML='<div class="error">'+esc(e.message)+'</div>'});</script><script src="/site-nav.js"></script></body></html>
