<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Mensagens</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px system-ui}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.nav a{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:24px 0}.panel{background:#0b0b0d;border:1px solid #222229;border-radius:14px;overflow:hidden}.search{padding:14px;border-bottom:1px solid #222229}.search input{width:100%;height:40px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:0 10px}.users{max-height:620px;overflow:auto}.user{padding:11px 13px;border-bottom:1px solid #18181d;cursor:pointer;display:flex;gap:10px;align-items:center}.user:hover,.user.active{background:#121216}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#17171c;flex:0 0 42px}.dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;margin-left:5px}.dot.on{background:#53df86}.muted{color:#85858f;font-size:12px}.chat{height:650px;display:flex;flex-direction:column}.chathead{padding:12px 15px;border-bottom:1px solid #222229;display:flex;align-items:center;gap:10px}.chathead .avatar{width:38px;height:38px;flex-basis:38px}.messages{flex:1;overflow:auto;padding:18px}.msgrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:9px}.msgrow.mine{justify-content:flex-end}.msgrow.mine .avatar{display:none}.bubble{max-width:78%;padding:10px 12px;border-radius:12px;background:#17171c}.mine .bubble{background:#fff;color:#050505}.bubble img{max-width:260px;max-height:260px;border-radius:10px;display:block;margin-bottom:5px}.time{font-size:10px;opacity:.55;margin-top:4px}.typing{height:20px;padding:0 18px;color:#888;font-size:12px}.composer{padding:12px;border-top:1px solid #222229;display:flex;gap:8px;align-items:center}.composer textarea{flex:1;resize:none;height:44px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:12px}.composer button{border:0;border-radius:8px;padding:0 15px;height:44px;background:#fff;color:#000;font-weight:700}.attach{width:44px;background:#17171b!important;color:#fff!important;border:1px solid #292930!important}.empty{padding:25px;color:#777}.error{color:#ff8585;padding:10px 0}@media(max-width:750px){.layout{grid-template-columns:1fr}.chat{height:570px}.users{max-height:240px}}
</style></head><body><div class="wrap"><nav class="nav"><b class="brand">Best Robux</b><a href="/account.html">Minha conta</a></nav><div class="layout"><section class="panel"><div class="search"><input id="search" placeholder="Buscar membros..."></div><div id="users" class="users"><div class="empty">Carregando...</div></div></section><section class="panel chat"><div id="head" class="chathead"><b>Mensagens</b><div class="muted">Selecione um membro para conversar.</div></div><div id="messages" class="messages"><div class="empty">Suas conversas ficam salvas na sua conta.</div></div><div id="typing" class="typing"></div><div class="composer"><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><button class="attach" id="attach" disabled title="Enviar imagem">📷</button><textarea id="body" maxlength="2000" placeholder="Escreva uma mensagem..." disabled></textarea><button id="send" disabled>Enviar</button></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user,myProfile,selected,conversation,liveChannel,presenceChannel,typingTimer,onlineState={};const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c));const fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2242%22 height=%2242%22%3E%3Ccircle cx=%2221%22 cy=%2221%22 r=%2221%22 fill=%22%2317171c%22/%3E%3Ccircle cx=%2221%22 cy=%2216%22 r=%228%22 fill=%22%23888%22/%3E%3Cpath d=%22M7 39c2-10 8-15 14-15s12 5 14 15%22 fill=%22%23888%22/%3E%3C/svg%3E';function img(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:fallback}catch{return fallback}}function renderMessage(m){if(document.querySelector('[data-message-id="'+m.id+'"]'))return;const mine=m.sender_id===user.id;const av=mine?myProfile?.avatar_url:selected?.avatar_url;const row=document.createElement('div');row.className='msgrow '+(mine?'mine':'');row.dataset.messageId=m.id;let body='';if(m.image_url)body+='<img src="'+esc(m.image_url)+'" alt="Imagem enviada">';if(m.body)body+='<div>'+esc(m.body)+'</div>';row.innerHTML=(mine?'':'<img class="avatar" src="'+esc(img(av))+'" alt="">')+'<div class="bubble">'+body+'<div class="time">'+new Date(m.created_at).toLocaleString('pt-BR')+'</div></div>';$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}function updateTyping(){if(!presenceChannel||!conversation)return;presenceChannel.track({user_id:user.id,typing:$('body').value.length>0})}async function boot(){const cfg=await fetch('/api/config',{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Configuração indisponível');return d});client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=await client.auth.getSession();if(!s.data.session)return location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));user=s.data.session.user;const p=await client.from('profiles').select('id,username,display_name,avatar_url,bio').eq('id',user.id).maybeSingle();myProfile=p.data||{};presenceChannel=client.channel('presence-global',{config:{presence:{key:user.id}}});presenceChannel.on('presence', {event:'sync'},()=>{const state=presenceChannel.presenceState();onlineState={};Object.values(state).flat().forEach(x=>onlineState[x.user_id]=true);search()}).subscribe(async status=>{if(status==='SUBSCRIBED')await presenceChannel.track({user_id:user.id,typing:false})});await search();$('search').oninput=search}async function search(){const q=$('search').value.trim();const r=await client.rpc('search_public_profiles',{p_query:q});if(r.error){$('users').innerHTML='<div class="empty">Não foi possível carregar membros.</div>';return}const seen=new Set();const rows=(r.data||[]).filter(u=>u.id!==user.id&&!seen.has(u.id)&&seen.add(u.id));$('users').innerHTML=rows.map(u=>`<div class="user ${selected?.id===u.id?'active':''}" onclick='openUser(${JSON.stringify(u).replace(/</g,'\\u003c')})'><img class="avatar" src="${esc(img(u.avatar_url))}" alt=""><div><b>${esc(u.display_name||u.username||'Membro')}<span class="dot ${onlineState[u.id]?'on':''}"></span></b><span class="muted">@${esc(u.username||'')} · ${onlineState[u.id]?'Online':'Offline'}</span></div></div>`).join('')||'<div class="empty">Nenhum membro encontrado.</div>'}async function openUser(u){selected=u;await search();$('head').innerHTML='<img class="avatar" src="'+esc(img(u.avatar_url))+'" alt=""><div><b>'+esc(u.display_name||u.username||'Membro')+'</b><div class="muted">@'+esc(u.username||'')+' · '+(onlineState[u.id]?'Online':'Offline')+'</div></div>';if(liveChannel){await client.removeChannel(liveChannel);liveChannel=null}if(presenceChannel){await client.removeChannel(presenceChannel)}presenceChannel=client.channel('dm-presence-'+u.id,{config:{presence:{key:user.id}}});presenceChannel.on('presence',{event:'sync'},()=>{const state=presenceChannel.presenceState();const other=Object.values(state).flat().find(x=>x.user_id===u.id);$('typing').textContent=other?.typing?'Digitando...':''}).subscribe(async status=>{if(status==='SUBSCRIBED')await presenceChannel.track({user_id:user.id,typing:false})});const r=await client.rpc('get_or_create_direct_conversation',{other_user:u.id});if(r.error){$('messages').innerHTML='<div class="error">Não foi possível abrir a conversa: '+esc(r.error.message)+'</div>';return}conversation=r.data;$('body').disabled=false;$('send').disabled=false;$('attach').disabled=false;await loadMessages();liveChannel=client.channel('dm-'+conversation).on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+conversation},payload=>{if(payload.new)renderMessage(payload.new)}).subscribe()}async function loadMessages(){const r=await client.from('direct_messages').select('id,sender_id,body,created_at,image_url').eq('conversation_id',conversation).order('created_at',{ascending:true}).limit(200);if(r.error){$('messages').innerHTML='<div class="error">Não foi possível carregar as mensagens.</div>';return}$('messages').innerHTML='';(r.data||[]).forEach(renderMessage)}async function send(){const text=$('body').value.trim();if(!text||!conversation)return;$('send').disabled=true;const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:text}).select('id,sender_id,body,created_at,image_url').single();if(!r.error){$('body').value='';updateTyping();renderMessage(r.data)}else $('messages').insertAdjacentHTML('beforeend','<div class="error">Não foi possível enviar: '+esc(r.error.message)+'</div>');$('send').disabled=false}async function sendImage(file){if(!conversation||!file)return;if(file.size>5*1024*1024)return alert('A imagem deve ter no máximo 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await client.storage.from('chat-images').upload(path,file,{contentType:file.type,upsert:false});if(up.error)return alert(up.error.message);const signed=await client.storage.from('chat-images').createSignedUrl(path,60*60*24*7);if(signed.error)return alert(signed.error.message);const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:'📷 Imagem',image_url:signed.data.signedUrl}).select('id,sender_id,body,created_at,image_url').single();if(r.error)alert(r.error.message);else renderMessage(r.data)}$('send').onclick=send;$('attach').onclick=()=>$('file').click();$('file').onchange=e=>sendImage(e.target.files?.[0]);$('body').addEventListener('input',()=>{updateTyping();clearTimeout(typingTimer);typingTimer=setTimeout(()=>{$('body').value.length=0;updateTyping()},1500)});$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('beforeunload',()=>{if(liveChannel)client.removeChannel(liveChannel);if(presenceChannel)client.removeChannel(presenceChannel)});boot().catch(e=>{$('users').innerHTML='<div class="error">'+esc(e.message)+'</div>'});</script><script src="/site-nav.js"></script></body></html>
