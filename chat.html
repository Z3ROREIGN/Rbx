<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Mensagens</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.nav a{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;text-decoration:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:24px 0}.panel{background:#0b0b0d;border:1px solid #222229;border-radius:14px;overflow:hidden}.search{padding:14px;border-bottom:1px solid #222229}.search input{width:100%;height:40px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:0 10px}.users{max-height:620px;overflow:auto}.user{padding:13px 15px;border-bottom:1px solid #18181d;cursor:pointer}.user:hover,.user.active{background:#121216}.user b{display:block}.muted{color:#85858f;font-size:12px}.chat{height:620px;display:flex;flex-direction:column}.chathead{padding:15px;border-bottom:1px solid #222229}.messages{flex:1;overflow:auto;padding:18px}.bubble{max-width:78%;padding:10px 12px;border-radius:12px;margin-bottom:9px;background:#17171c}.mine{margin-left:auto;background:#fff;color:#050505}.time{font-size:10px;opacity:.55;margin-top:4px}.composer{padding:12px;border-top:1px solid #222229;display:flex;gap:8px}.composer textarea{flex:1;resize:none;height:44px;background:#070708;border:1px solid #292930;border-radius:8px;color:#fff;padding:12px}.composer button{border:0;border-radius:8px;padding:0 17px;background:#fff;color:#000;font-weight:700}.empty{padding:25px;color:#777}.error{color:#ff8585;padding:10px 0}@media(max-width:750px){.layout{grid-template-columns:1fr}.chat{height:560px}.users{max-height:250px}}</style></head><body><div class="wrap"><nav class="nav"><b class="brand">Best Robux</b><a href="account.html">Minha conta</a></nav><div class="layout"><section class="panel"><div class="search"><input id="search" placeholder="Buscar membros..."></div><div id="users" class="users"><div class="empty">Carregando...</div></div></section><section class="panel chat"><div id="head" class="chathead"><b>Mensagens</b><div class="muted">Selecione um membro para conversar.</div></div><div id="messages" class="messages"><div class="empty">Suas conversas ficam salvas na sua conta.</div></div><div class="composer"><textarea id="body" maxlength="2000" placeholder="Escreva uma mensagem..." disabled></textarea><button id="send" disabled>Enviar</button></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user,selected,conversation;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c));async function boot(){const c=await(await fetch('/api/config')).json();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(!s.data.session)return location.href='login.html';user=s.data.session.user;await search();$('search').oninput=search;client.channel('dm-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages'},()=>conversation&&loadMessages()).subscribe()}async function search(){const q=$('search').value.trim();const r=await client.rpc('search_public_profiles',{p_query:q});if(r.error){$('users').innerHTML='<div class="empty">Não foi possível carregar membros.</div>';return}$('users').innerHTML=r.data.length?r.data.map(u=>`<div class="user ${selected?.id===u.id?'active':''}" onclick='openUser(${JSON.stringify(u)})'><b>${esc(u.display_name||u.username||'Membro')}</b><span class="muted">@${esc(u.username||'')}</span></div>`).join(''):'<div class="empty">Nenhum membro encontrado.</div>'}async function openUser(u){selected=u;await search();$('head').innerHTML=`<b>${esc(u.display_name||u.username||'Membro')}</b><div class="muted">@${esc(u.username||'')}</div>`;const r=await client.rpc('get_or_create_conversation',{p_other:u.id});if(r.error){$('messages').innerHTML='<div class="error">Não foi possível abrir a conversa.</div>';return}conversation=r.data;$('body').disabled=false;$('send').disabled=false;await loadMessages()}async function loadMessages(){if(!conversation)return;const r=await client.from('direct_messages').select('id,sender_id,body,created_at').eq('conversation_id',conversation).order('created_at',{ascending:true}).limit(200);if(r.error)return;$('messages').innerHTML=r.data.length?r.data.map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleString('pt-BR')}</div></div>`).join(''):'<div class="empty">Comece a conversa.</div>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){const text=$('body').value.trim();if(!text||!conversation)return;$('send').disabled=true;const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:text});if(!r.error)$('body').value='';else alert('Não foi possível enviar a mensagem.');$('send').disabled=false;await loadMessages()}$('send').onclick=send;$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});boot();</script></body></html>
