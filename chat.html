<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Mensagens — Best Robux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f6;font:14px Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 24px));margin:auto}.nav{height:66px;border-bottom:1px solid #25292e;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:900}.nav a,.back{display:inline-flex;align-items:center;gap:8px;border:1px solid #30353b;background:#151719;color:#fff;padding:9px 12px;border-radius:6px;text-decoration:none;font-weight:800}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.layout{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:18px 0}.panel{background:#101214;border:1px solid #292e34;border-radius:7px;overflow:hidden}.search{padding:12px;border-bottom:1px solid #25292e}.search input{width:100%;height:40px;background:#0b0d0f;border:1px solid #30353b;border-radius:6px;color:#fff;padding:0 10px}.users{max-height:620px;overflow:auto}.user{padding:11px 12px;border-bottom:1px solid #20242a;cursor:pointer;display:flex;gap:10px;align-items:center}.user:hover,.user.active{background:#181b1f}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#191c20;flex:0 0 42px}.dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block;margin-left:6px}.dot.on{background:#55df88}.muted{color:#858c94;font-size:12px}.chat{height:650px;display:flex;flex-direction:column}.chathead{padding:11px 14px;border-bottom:1px solid #25292e;display:flex;align-items:center;gap:10px}.chathead .avatar{width:38px;height:38px;flex-basis:38px}.messages{flex:1;overflow:auto;padding:16px}.msgrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:9px}.msgrow.mine{justify-content:flex-end}.msgrow.mine .avatar{display:none}.bubble{max-width:78%;padding:10px 12px;border-radius:7px;background:#181b1f}.mine .bubble{background:#f1f2f3;color:#090a0c}.bubble img{max-width:280px;max-height:280px;border-radius:6px;display:block;margin-bottom:6px}.time{font-size:10px;opacity:.55;margin-top:4px}.typing{height:20px;padding:0 16px;color:#858c94;font-size:12px}.composer{padding:11px;border-top:1px solid #25292e;display:flex;gap:7px;align-items:center}.composer textarea{flex:1;resize:none;height:44px;background:#0b0d0f;border:1px solid #30353b;border-radius:6px;color:#fff;padding:11px}.composer button{border:1px solid #30353b;border-radius:6px;height:44px;background:#df3340;color:#fff;font-weight:900;padding:0 14px;cursor:pointer}.attach{width:44px;padding:0!important;background:#151719!important}.empty{padding:24px;color:#777f87}.error{color:#ff8585;padding:10px}@media(max-width:750px){.layout{grid-template-columns:1fr}.users{max-height:230px}.chat{height:570px}.bubble{max-width:88%}}</style></head><body><div class="wrap"><nav class="nav"><b class="brand">Best Robux</b><a href="/account.html"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>Minha conta</a></nav><div class="layout"><section class="panel"><div class="search"><input id="search" placeholder="Buscar membros..."></div><div id="users" class="users"><div class="empty">Carregando membros...</div></div></section><section class="panel chat"><div id="head" class="chathead"><b>Mensagens</b><span class="muted">Selecione um membro.</span></div><div id="messages" class="messages"><div class="empty">Suas conversas ficam salvas na sua conta.</div></div><div id="typing" class="typing"></div><div class="composer"><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><button class="attach" id="attach" disabled title="Enviar imagem"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.5"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg></button><textarea id="body" maxlength="2000" placeholder="Escreva uma mensagem..." disabled></textarea><button id="send" disabled>Enviar</button></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user,myProfile,selected,conversation,liveChannel,presenceChannel,typingTimer,onlineState={};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]||c)),fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2242%22 height=%2242%22%3E%3Ccircle cx=%2221%22 cy=%2221%22 r=%2221%22 fill=%22%23191c20%22/%3E%3Ccircle cx=%2221%22 cy=%2216%22 r=%228%22 fill=%22%23888%22/%3E%3Cpath d=%22M7 39c2-10 8-15 14-15s12 5 14 15%22 fill=%22%23888%22/%3E%3C/svg%3E';function img(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:fallback}catch{return fallback}}function renderMessage(m){if(document.querySelector('[data-message-id="'+m.id+'"]'))return;const mine=m.sender_id===user.id, av=mine?myProfile?.avatar_url:selected?.avatar_url,row=document.createElement('div');row.className='msgrow '+(mine?'mine':'');row.dataset.messageId=m.id;let body='';if(m.image_url)body+='<img src="'+esc(m.image_url)+'" alt="Imagem enviada">';if(m.body)body+='<div>'+esc(m.body)+'</div>';row.innerHTML=(mine?'':'<img class="avatar" src="'+esc(img(av))+'" alt="">')+'<div class="bubble">'+body+'<div class="time">'+new Date(m.created_at).toLocaleString('pt-BR')+'</div></div>';$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}function trackTyping(){if(presenceChannel&&conversation)presenceChannel.track({user_id:user.id,typing:$('body').value.length>0})}async function boot(){const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=await client.auth.getSession();if(!s.data.session)return location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));user=s.data.session.user;const p=await client.from('profiles').select('id,username,display_name,avatar_url,bio').eq('id',user.id).maybeSingle();myProfile=p.data||{};presenceChannel=client.channel('presence-global',{config:{presence:{key:user.id}}});presenceChannel.on('presence',{event:'sync'},()=>{const state=presenceChannel.presenceState();onlineState={};Object.values(state).flat().forEach(x=>onlineState[x.user_id]=true);search()}).subscribe(async status=>{if(status==='SUBSCRIBED')await presenceChannel.track({user_id:user.id,typing:false})});await search();$('search').oninput=search}async function search(){const q=$('search').value.trim(),r=await client.rpc('search_public_profiles',{p_query:q});if(r.error)return $('users').innerHTML='<div class="empty">Não foi possível carregar membros.</div>';const seen=new Set(),rows=(r.data||[]).filter(u=>u.id!==user.id&&!seen.has(u.id)&&seen.add(u.id));$('users').innerHTML=rows.map(u=>`<div class="user ${selected?.id===u.id?'active':''}" onclick='openUser(${JSON.stringify(u).replace(/</g,'\\u003c')})'><img class="avatar" src="${esc(img(u.avatar_url))}" alt=""><div><b>${esc(u.display_name||u.username||'Membro')}<span class="dot ${onlineState[u.id]?'on':''}"></span></b><span class="muted">@${esc(u.username||'')} · ${onlineState[u.id]?'Online':'Offline'}</span></div></div>`).join('')||'<div class="empty">Nenhum membro encontrado.</div>'}async function openUser(u){selected=u;await search();$('head').innerHTML='<img class="avatar" src="'+esc(img(u.avatar_url))+'" alt=""><div><b>'+esc(u.display_name||u.username||'Membro')+'</b><div class="muted">@'+esc(u.username||'')+' · '+(onlineState[u.id]?'Online':'Offline')+'</div></div>';if(liveChannel)await client.removeChannel(liveChannel);if(presenceChannel)await client.removeChannel(presenceChannel);presenceChannel=client.channel('dm-presence-'+u.id,{config:{presence:{key:user.id}}});presenceChannel.on('presence',{event:'sync'},()=>{const other=Object.values(presenceChannel.presenceState()).flat().find(x=>x.user_id===u.id);$('typing').textContent=other?.typing?'Digitando...':''}).subscribe(async status=>{if(status==='SUBSCRIBED')await presenceChannel.track({user_id:user.id,typing:false})});const r=await client.rpc('get_or_create_direct_conversation',{other_user:u.id});if(r.error)return $('messages').innerHTML='<div class="error">Não foi possível abrir a conversa.</div>';conversation=r.data;$('body').disabled=false;$('send').disabled=false;$('attach').disabled=false;await loadMessages();liveChannel=client.channel('dm-'+conversation).on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+conversation},p=>p.new&&renderMessage(p.new)).subscribe()}async function loadMessages(){const r=await client.from('direct_messages').select('id,sender_id,body,created_at,image_url').eq('conversation_id',conversation).order('created_at',{ascending:true}).limit(200);if(r.error)return $('messages').innerHTML='<div class="error">Não foi possível carregar as mensagens.</div>';$('messages').innerHTML='';(r.data||[]).forEach(renderMessage)}async function send(){const text=$('body').value.trim();if(!text||!conversation)return;$('send').disabled=true;const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:text}).select('id,sender_id,body,created_at,image_url').single();if(!r.error){$('body').value='';trackTyping();renderMessage(r.data)}$('send').disabled=false}async function sendImage(file){if(!conversation||!file)return;if(file.size>5*1024*1024)return alert('A imagem deve ter no máximo 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+crypto.randomUUID()+'.'+ext,up=await client.storage.from('chat-images').upload(path,file,{contentType:file.type,upsert:false});if(up.error)return alert(up.error.message);const signed=await client.storage.from('chat-images').createSignedUrl(path,604800);if(signed.error)return alert(signed.error.message);const r=await client.from('direct_messages').insert({conversation_id:conversation,sender_id:user.id,body:'Imagem enviada',image_url:signed.data.signedUrl}).select('id,sender_id,body,created_at,image_url').single();if(r.error)alert(r.error.message);else renderMessage(r.data)}$('send').onclick=send;$('attach').onclick=()=>$('file').click();$('file').onchange=e=>sendImage(e.target.files?.[0]);$('body').addEventListener('input',()=>{trackTyping();clearTimeout(typingTimer);typingTimer=setTimeout(()=>{$('body').value='';trackTyping()},1500)});$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});boot().catch(()=>{$('users').innerHTML='<div class="error">Não foi possível carregar as mensagens.</div>'});</script><script src="/site-nav.js"></script></body></html>
