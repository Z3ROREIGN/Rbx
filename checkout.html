<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#070709;color:#eee;font:14px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.back,button{border:1px solid #292930;background:#151518;color:#eee;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none}.brand{font-weight:800}.box{background:#101013;border:1px solid #292930;border-radius:18px;padding:22px}.summary{background:#08080b;border:1px solid #25252b;border-radius:14px;padding:16px;margin-bottom:20px}.summary strong{font-size:25px;display:block;margin-top:6px}.field{margin:14px 0}.field label{display:block;font-size:11px;color:#8b8b93;margin-bottom:7px}.field input{width:100%;height:44px;border:1px solid #2a2a31;border-radius:10px;background:#08080b;color:#fff;padding:0 12px}.help{font-size:12px;color:#777;margin-top:6px}.primary{width:100%;background:#fff;color:#050505;font-weight:800}.error{margin-top:12px;color:#ff9d9d}.pix{display:none;margin-top:20px;border-top:1px solid #292930;padding-top:20px}.pix img{max-width:300px;width:100%;display:block;margin:15px auto}.copy{width:100%;word-break:break-all}.ok{color:#8ee6a5}.loading{opacity:.6;pointer-events:none}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← Voltar</a><span class="brand">Best Robux · Checkout</span></div><section class="box"><div class="summary"><span id="type">Gamepass</span><strong id="quantity">1.000 Robux</strong><span id="amount">R$ 26,00</span></div><form id="form"><div class="field"><label>NOME COMPLETO</label><input id="name" autocomplete="name" required></div><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></div><div class="field"><label>USUÁRIO DO ROBLOX</label><input id="roblox" maxlength="20" required></div><div class="field" id="gamepassField"><label>LINK DA GAMEPASS</label><input id="gamepassUrl" type="url" placeholder="https://www.roblox.com/game-pass/..." required><div class="help">Envie o link da Gamepass que será usada na entrega.</div></div><div class="field" id="plusField" hidden><label>CONFIRME O NOME DO ROBLOX</label><input id="confirmRoblox" maxlength="20"><div class="help">Digite exatamente o mesmo nome informado acima.</div></div><div class="field"><label>E-MAIL DA CONTA</label><input id="email" readonly></div><button class="primary" id="submit" type="submit">Gerar PIX</button><div id="error" class="error"></div></form><div id="pix" class="pix"><h2>Pagamento PIX</h2><p class="ok">Cobrança criada. Pague para liberar o pedido.</p><img id="qr" alt="QR Code PIX"><textarea id="copy" class="copy" rows="5" readonly></textarea><button type="button" onclick="copyPix()">Copiar PIX</button><p id="order" class="help"></p></div></section></main><script>let sb;const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let type=params.get('type')==='Robux Plus'?'Robux Plus':'Gamepass',qty=Math.max(1000,Math.min(50000,Number(params.get('qty')||1000)));qty=Math.floor(qty/1000)*1000;$('type').textContent=type;$('quantity').textContent=qty.toLocaleString('pt-BR')+' Robux';$('amount').textContent='R$ '+(qty/1000*(type==='Gamepass'?26:40)).toFixed(2).replace('.',',');$('gamepassField').hidden=type!=='Gamepass';$('plusField').hidden=type!=='Robux Plus';$('gamepassUrl').required=type==='Gamepass';$('confirmRoblox').required=type==='Robux Plus';function mask(v){let d=String(v).replace(/\D/g,'').slice(0,11);if(d.length>9)return d.replace(/(\d{3})(\d{3})(\d{3})(\d)/,'$1.$2.$3-$4');if(d.length>6)return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');if(d.length>3)return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');return d}$('cpf').oninput=e=>e.target.value=mask(e.target.value);function validCPF(v){let d=String(v).replace(/\D/g,'');if(d.length!==11||/^(\d)\1+$/.test(d))return false;let s=0;for(let i=0;i<9;i++)s+=+d[i]*(10-i);let r=s*10%11;if(r===10)r=0;if(r!==+d[9])return false;s=0;for(let i=0;i<10;i++)s+=+d[i]*(11-i);r=s*10%11;if(r===10)r=0;return r===+d[10]}function validGP(v){try{const u=new URL(v);const h=u.hostname.toLowerCase();return (u.protocol==='https:'||u.protocol==='http:')&&(h==='roblox.com'||h.endsWith('.roblox.com'))&&(/game[- ]?pass|gamepass|passes/i.test(u.pathname))&&/\d+/.test(u.pathname)}catch{return false}}async function init(){const c=await fetch('/api/config',{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Configuração indisponível');return d});sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search);return}$('email').value=session.user.email||''}async function copyPix(){try{await navigator.clipboard.writeText($('copy').value);$('copy').select()}catch{$('copy').select();document.execCommand('copy')}}$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search);const name=$('name').value.trim(),cpf=$('cpf').value,roblox=$('roblox').value.trim(),gp=$('gamepassUrl').value.trim(),confirm=$('confirmRoblox').value.trim();if(name.split(/\s+/).length<2)return $('error').textContent='Informe o nome completo.';if(!validCPF(cpf))return $('error').textContent='Informe um CPF válido.';if(!/^[A-Za-z0-9_]{3,20}$/.test(roblox))return $('error').textContent='Informe um usuário Roblox válido.';if(type==='Gamepass'&&!validGP(gp))return $('error').textContent='Informe um link válido da Gamepass.';if(type==='Robux Plus'&&confirm.toLowerCase()!==roblox.toLowerCase())return $('error').textContent='Os nomes do Roblox não coincidem.';$('submit').disabled=true;$('submit').textContent='Gerando PIX...';document.body.classList.add('loading');try{const r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({name,cpf,email:session.user.email,robloxUsername:roblox,quantity:qty,type,gamepassUrl:type==='Gamepass'?gp:'',confirmRobloxName:type==='Robux Plus'?confirm:''})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível criar o pedido.');$('pix').style.display='block';$('form').style.display='none';const qr=d.payment?.qr_code||'';if(qr.startsWith('data:image/')||qr.startsWith('http://')||qr.startsWith('https://'))$('qr').src=qr;else if(qr)$('qr').src='data:image/png;base64,'+qr;else $('qr').style.display='none';$('copy').value=d.payment?.copy_paste||'';$('order').textContent='Pedido: '+d.order.id;sessionStorage.setItem('bestrobux_last_payment',JSON.stringify(d))}catch(err){$('error').textContent=err.message}finally{document.body.classList.remove('loading');$('submit').disabled=false;$('submit').textContent='Gerar PIX'}};init().catch(e=>$('error').textContent='Não foi possível carregar o checkout: '+e.message);</script></body></html>
