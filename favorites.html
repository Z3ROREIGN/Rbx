<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0b"><title>Favoritos — Best Robux</title><style>body{margin:0;background:#090a0b;color:#f2f3f5;font:14px Inter,system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 24px));margin:auto;padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back,.btn{padding:10px 12px;border:1px solid #30343a;background:#151719;color:#fff;border-radius:6px;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{background:#151719;border:1px solid #292d32;border-radius:7px;padding:16px}.card h3{margin:0 0 6px}.muted{color:#9298a0;font-size:12px}.price{font-size:22px;font-weight:900;margin:12px 0}.buy{display:block;text-align:center;background:#e3343f;border-color:#b82732}.empty{padding:30px;text-align:center;border:1px dashed #30343a;color:#9298a0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← Loja</a><h1 style="margin:0">Favoritos</h1><a class="back" href="/orders.html">Pedidos</a></div><section id="list" class="grid"><div class="empty">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));async function boot(){const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='/login.html?redirect=/favorites.html';const f=await sb.from('product_favorites').select('product_id').eq('user_id',session.user.id);if(f.error)return $('list').innerHTML='<div class="empty">Não foi possível carregar seus favoritos.</div>';const ids=(f.data||[]).map(x=>x.product_id);if(!ids.length)return $('list').innerHTML='<div class="empty">Você ainda não salvou nenhum produto.</div>';const p=await sb.from('products').select('id,name,method,robux,price,description').in('id',ids).eq('active',true);$('list').innerHTML=(p.data||[]).map(x=>`<article class="card"><h3>${esc(x.name)}</h3><span class="muted">${esc(x.method)} · ${Number(x.robux).toLocaleString('pt-BR')} Robux</span><div class="price">R$ ${Number(x.price).toFixed(2).replace('.',',')}</div><a class="btn buy" href="/checkout.html?type=${encodeURIComponent(x.method)}&qty=${x.robux}">Comprar novamente</a></article>`).join('')||'<div class="empty">Os produtos favoritos não estão disponíveis no momento.</div>'}boot()</script><script src="/site-nav.js"></script></body></html>
