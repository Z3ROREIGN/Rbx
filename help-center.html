<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de ajuda — Best Robux</title><style>body{margin:0;background:#08090b;color:#f5f6f7;font:14px system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 18px}.search{width:100%;padding:13px;border-radius:10px;border:1px solid #2a2e36;background:#111317;color:#fff;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.card{background:#111317;border:1px solid #252932;border-radius:15px;padding:17px}.card h3{margin-top:0}.muted{color:#858b94}.link{color:#fff;text-decoration:none}</style></head><body><main class="wrap"><h1>Central de ajuda</h1><p class="muted">Encontre rapidamente a área certa para resolver seu problema.</p><input id="q" class="search" placeholder="Pesquisar ajuda..." autocomplete="off"><div id="grid" class="grid"></div></main><script>const items=[['Carteira','Saldo, PIX, depósitos, saques e extrato.','/wallet.html'],['Pedidos','Acompanhe compras, pagamentos e entregas.','/orders.html'],['Marketplace','Produtos, vendas e atendimento de compras.','/marketplace.html'],['Notificações','Avisos, atualizações e notificações da conta.','/notifications.html'],['Minha conta','Perfil, segurança e configurações.','/account.html'],['Suporte','Abra e acompanhe solicitações de atendimento.','/support.html'],['Quero vender','Cadastro e central do vendedor.','/seller-register.html'],['Status do sistema','Confira o estado dos principais serviços.','/system-status.html']];const grid=document.getElementById('grid'),q=document.getElementById('q');function render(){const s=q.value.trim().toLowerCase();grid.innerHTML=items.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s)).map(x=>`<a class="card link" href="${x[2]}"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></a>`).join('')||'<div class="card">Nenhum resultado encontrado.</div>'}q.addEventListener('input',render);render()</script><script src="/site-nav.js"></script></body></html>
