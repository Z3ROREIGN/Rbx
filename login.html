<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>Conta — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><style>body{margin:0;background:#0b0d0f;color:#eee;font:14px Inter,system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.box{width:min(430px,calc(100% - 24px));background:#17191c;border:1px solid #292e34;border-radius:7px;padding:25px;box-sizing:border-box}.mark{display:grid;place-items:center;width:34px;height:34px;background:#df3340;color:#fff;border-radius:5px;font-weight:900}h1{font-size:25px;margin:18px 0 7px}.muted{color:#9299a2;line-height:1.6}.field{margin:16px 0}.field label{display:block;color:#777f88;font-size:10px;margin-bottom:7px;font-weight:800}.field input{width:100%;height:44px;box-sizing:border-box;background:#0d0f11;border:1px solid #343a42;border-radius:5px;color:#fff;padding:0 12px;outline:none}.field input:focus{border-color:#df3340}.btn{width:100%;height:44px;border:1px solid #b82732;border-radius:5px;background:#df3340;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.links{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.links button{background:none;border:0;color:#ff9da5;cursor:pointer}.msg{margin:12px 0;color:#aaa;min-height:18px}.err{color:#ff8585}.success{color:#8fdda9}</style></head><body><main class="box"><span class="mark">R</span><h1 id="title">Entrar</h1><p class="muted" id="desc">Entre com seu e-mail e senha.</p><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><div class="field confirm" style="display:none"><label>CONFIRMAR SENHA</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repita sua senha"></div><div id="msg" class="msg"></div><button id="main" class="btn">Entrar</button><div class="links"><button id="signup">Criar conta</button><button id="forgot">Esqueci a senha</button></div></main><script>const sb=window.bestRobuxSupabase,$=id=>document.getElementById(id);let mode='login',signupCooldown=0;const params=new URLSearchParams(location.search);const requested=params.get('redirect');const destination=requested&&requested.startsWith('/')&&!requested.startsWith('//')?requested:'/account.html';function msg(t,type=''){$('msg').textContent=t;$('msg').className='msg '+type}function render(){const s=mode==='signup';$('title').textContent=s?'Criar conta':'Entrar';$('desc').textContent=s?'Crie sua conta usando e-mail e senha.':'Entre com seu e-mail e senha.';$('confirm').parentElement.style.display=s?'block':'none';$('password').autocomplete=s?'new-password':'current-password';$('main').textContent=s?'Criar conta':'Entrar';$('signup').textContent=s?'Voltar para entrar':'Criar conta';msg('')}function go(m){mode=m;render()}(async()=>{try{const session=await window.bestRobuxAuthReady;if(session&&!params.has('force'))location.replace(destination)}catch{}})();$('signup').onclick=()=>go(mode==='signup'?'login':'signup');$('forgot').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return msg('Informe seu e-mail para recuperar a senha.','err');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});if(r.error)return msg('Não foi possível enviar a recuperação agora. Tente novamente mais tarde.','err');msg('Enviamos as instruções de recuperação para seu e-mail.','success')};$('main').onclick=async()=>{if(signupCooldown>Date.now())return msg('Aguarde alguns segundos antes de tentar criar outra conta.','err');const email=$('email').value.trim().toLowerCase(),pass=$('password').value;if(!/^\S+@\S+\.\S+$/.test(email))return msg('Informe um e-mail válido.','err');if(pass.length<8)return msg('A senha deve ter pelo menos 8 caracteres.','err');if(mode==='signup'&&pass!==$('confirm').value)return msg('As senhas não coincidem.','err');const btn=$('main');btn.disabled=true;msg('');try{const r=mode==='signup'?await sb.auth.signUp({email,password:pass,options:{data:{signup_source:'web'}}}):await sb.auth.signInWithPassword({email,password:pass});if(r.error){const e=(r.error.message||'').toLowerCase();if(r.error.status===429||e.includes('rate limit')||e.includes('too many')){signupCooldown=Date.now()+65000;return msg('O sistema de cadastro está temporariamente limitado pelo provedor. Tente novamente em instantes.','err')}if(e.includes('already registered')||e.includes('already exists'))return msg('Este e-mail já possui uma conta. Tente entrar.','err');if(e.includes('email not confirmed'))return msg('Esta conta ainda precisa de confirmação de e-mail.','err');return msg(mode==='signup'?'Não foi possível criar a conta. Verifique os dados.':'E-mail ou senha incorretos.','err')}if(r.data.session){location.replace(destination);return}if(mode==='signup'&&r.data.user&&!r.data.session){msg('Conta criada. Confirme o e-mail para continuar.','success');return}location.replace(destination)}catch(e){msg('Não foi possível concluir a operação. Tente novamente.','err')}finally{btn.disabled=false}};render();</script></body></html>
