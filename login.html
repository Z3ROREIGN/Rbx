<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#050505;color:#eee;font:14px system-ui;display:grid;min-height:100vh;place-items:center}.box{width:min(430px,calc(100% - 32px));background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:28px;box-sizing:border-box}.mark{display:grid;place-items:center;width:30px;height:30px;background:#fff;color:#050505;border-radius:8px;font-weight:900}h1{font-size:25px;margin:18px 0 7px}.muted{color:#777;line-height:1.6}.field{margin:16px 0}.field label{display:block;color:#777;font-size:11px;margin-bottom:7px}.field input{width:100%;height:44px;box-sizing:border-box;background:#050505;border:1px solid #252525;border-radius:8px;color:#fff;padding:0 12px;outline:none}.btn{width:100%;height:44px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.links{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.links button{background:none;border:0;color:#9c91ff;cursor:pointer}.msg{margin:12px 0;color:#aaa;min-height:18px}.err{color:#ff7676}.success{color:#7ed4a0}.code,.pass{display:none}</style></head><body><main class="box"><span class="mark">R</span><h1 id="title">Entrar</h1><p class="muted" id="desc">Digite seu e-mail. Enviaremos um código de 6 dígitos.</p><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div><div class="field pass"><label>SENHA</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div class="field code"><label>CÓDIGO DE 6 DÍGITOS</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><div class="field newpass" style="display:none"><label>NOVA SENHA</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div id="msg" class="msg"></div><button id="main" class="btn">Enviar código</button><div class="links"><button id="signup">Criar conta</button><button id="forgot">Recuperar conta</button></div></main><script>const sb=window.supabase.createClient('https://anlwpqwjjswkqncltcdl.supabase.co','sb_publishable_r3GoKwcOEaXySt7fFOM_0A_rNOc7Mq7');let mode='login',step='email';const $=id=>document.getElementById(id);function msg(t,type=''){ $('msg').textContent=t;$('msg').className='msg '+type }function render(){const s=mode==='signup',f=mode==='forgot';$('title').textContent=s?'Criar conta':f?'Recuperar conta':'Entrar';$('desc').textContent=step==='otp'?(f?'Digite o código enviado para recuperar sua conta.':s?'Digite o código de confirmação enviado para seu e-mail.':'Digite o código de acesso enviado para seu e-mail.'):(s?'Informe seu e-mail e crie uma senha.':f?'Informe seu e-mail para receber o código de recuperação.':'Informe seu e-mail para receber um código de acesso.');$('password').parentElement.style.display=s&&step==='email'?'block':'none';$('otp').parentElement.style.display=step==='otp'?'block':'none';$('newPassword').parentElement.style.display=f&&step==='otp'?'block':'none';$('main').textContent=step==='otp'?(f?'Definir nova senha':s?'Confirmar cadastro':'Entrar'):'Enviar código';$('signup').textContent=s?'Voltar para entrar':'Criar conta';$('forgot').textContent=f?'Voltar para entrar':'Recuperar conta';msg('')}function go(m){mode=m;step='email';render()}$('signup').onclick=()=>go(mode==='signup'?'login':'signup');$('forgot').onclick=()=>go(mode==='forgot'?'login':'forgot');$('main').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return msg('Informe um e-mail válido.','err');const btn=$('main');btn.disabled=true;try{if(step==='email'){if(mode==='signup'){const pass=$('password').value;if(pass.length<8)return msg('Use pelo menos 8 caracteres.','err');const r=await sb.auth.signUp({email,password:pass});if(r.error)return msg(r.error.message,'err')}else{const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)return msg(mode==='forgot'?'Não encontramos uma conta com esse e-mail.':'Não foi possível enviar o código.','err')}step='otp';render();return msg('Código enviado. Confira sua caixa de entrada.','success')}const token=$('otp').value.replace(/\D/g,'');if(token.length!==6)return msg('Digite os 6 dígitos.','err');const r=await sb.auth.verifyOtp({email,token,type:'email'});if(r.error)return msg('Código inválido ou expirado.','err');if(mode==='forgot'){const pass=$('newPassword').value;if(pass.length<8)return msg('Use pelo menos 8 caracteres.','err');if(pass.length>72)return msg('A senha deve ter no máximo 72 caracteres.','err');const u=await sb.auth.updateUser({password:pass});if(u.error)return msg('Não foi possível alterar a senha.','err');await sb.auth.signOut();msg('Senha alterada. Faça login novamente.','success');setTimeout(()=>go('login'),900);return}location.href='/account.html'}finally{btn.disabled=false}};render();</script></body></html>
