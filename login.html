<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#050505;color:#eee;font:14px system-ui;display:grid;min-height:100vh;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:28px;box-sizing:border-box}h1{font-size:24px}.muted{color:#777;line-height:1.6}.field{margin:16px 0}.field label{display:block;color:#777;font-size:11px;margin-bottom:7px}.field input{width:100%;height:44px;box-sizing:border-box;background:#050505;border:1px solid #252525;border-radius:8px;color:#fff;padding:0 12px;outline:none}.btn{width:100%;height:44px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:700;cursor:pointer}.links{display:flex;justify-content:space-between;margin-top:16px}.links button{background:none;border:0;color:#9c91ff;cursor:pointer}.msg{margin:12px 0;color:#aaa}.err{color:#ff7676}.code{display:none}.mark{display:inline-grid;place-items:center;width:30px;height:30px;background:#fff;color:#050505;border-radius:8px;margin-bottom:14px;font-weight:900}</style></head><body><main class="box"><span class="mark">R</span><h1 id="title">Entrar</h1><p class="muted" id="desc">Entre na sua conta Best Robux.</p><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="email"></div><div class="field pass"><label>SENHA</label><input id="password" type="password" autocomplete="current-password"></div><div class="field code"><label>CÓDIGO DE 6 DÍGITOS</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><div id="msg" class="msg"></div><button id="main" class="btn">Entrar</button><div class="links"><button id="signup">Criar conta</button><button id="forgot">Esqueci a senha</button></div></main><script>const sb=window.supabase.createClient('https://anlwpqwjjswkqncltcdl.supabase.co','sb_publishable_r3GoKwcOEaXySt7fFOM_0A_rNOc7Mq7');let mode='login',step='form';const $=id=>document.getElementById(id);function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}function render(){const signup=mode==='signup',forgot=mode==='forgot';$('title').textContent=signup?'Criar conta':forgot?'Recuperar conta':'Entrar';$('desc').textContent=signup?'Crie sua conta com e-mail e senha.':forgot?'Receba um código para redefinir sua senha.':'Entre na sua conta Best Robux.';$('password').parentElement.style.display=forgot?'none':'block';$('signup').textContent=signup?'Voltar para entrar':'Criar conta';$('forgot').textContent=forgot?'Voltar para entrar':'Esqueci a senha';$('otp').parentElement.style.display='none';$('main').textContent=forgot?'Enviar código':signup?'Criar conta':'Entrar';step='form';msg('')}function go(m){mode=m;render()}$('signup').onclick=()=>go(mode==='signup'?'login':'signup');$('forgot').onclick=()=>go(mode==='forgot'?'login':'forgot');$('main').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),pass=$('password').value;if(!email)return msg('Informe seu e-mail.',true);if(step==='otp'){const token=$('otp').value.replace(/\D/g,'');if(token.length!==6)return msg('Informe o código de 6 dígitos.',true);const r=await sb.auth.verifyOtp({email,token,type:mode==='forgot'?'recovery':'email'});if(r.error)return msg('Código inválido ou expirado.',true);if(mode==='forgot')return location.href='/reset-password.html';return location.href='/account.html'}if(mode==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});if(r.error)return msg(r.error.message,true);step='otp';$('otp').parentElement.style.display='block';$('main').textContent='Confirmar código';return msg('Confira seu e-mail e informe o código.')}if(mode==='signup'){if(pass.length<8)return msg('Use uma senha com pelo menos 8 caracteres.',true);const r=await sb.auth.signUp({email,password:pass});if(r.error)return msg(r.error.message,true);step='otp';$('otp').parentElement.style.display='block';$('main').textContent='Confirmar código';return msg('Enviamos um código para seu e-mail.')}const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)return msg('E-mail ou senha incorretos.',true);location.href='/account.html'};render();</script></body></html>
