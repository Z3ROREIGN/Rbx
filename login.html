<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta — Best Robux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><style>body{margin:0;background:#050505;color:#eee;font:14px system-ui;display:grid;min-height:100vh;place-items:center}.box{width:min(430px,calc(100% - 32px));background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:28px;box-sizing:border-box}.mark{display:grid;place-items:center;width:30px;height:30px;background:#fff;color:#050505;border-radius:8px;font-weight:900}h1{font-size:25px;margin:18px 0 7px}.muted{color:#777;line-height:1.6}.field{margin:16px 0}.field label{display:block;color:#777;font-size:11px;margin-bottom:7px}.field input{width:100%;height:44px;box-sizing:border-box;background:#050505;border:1px solid #252525;border-radius:8px;color:#fff;padding:0 12px;outline:none}.btn{width:100%;height:44px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.links{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.links button{background:none;border:0;color:#9c91ff;cursor:pointer}.msg{margin:12px 0;color:#aaa;min-height:18px}.err{color:#ff7676}.success{color:#7ed4a0}</style></head><body><main class="box"><span class="mark">R</span><h1 id="title">Entrar</h1><p class="muted" id="desc">Entre com seu e-mail e senha.</p><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><div class="field confirm" style="display:none"><label>CONFIRMAR SENHA</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repita sua senha"></div><div id="msg" class="msg"></div><button id="main" class="btn">Entrar</button><div class="links"><button id="signup">Criar conta</button><button id="forgot">Esqueci a senha</button></div></main><script>const sb=window.bestRobuxSupabase, $=id=>document.getElementById(id);let mode='login';function msg(t,type=''){ $('msg').textContent=t;$('msg').className='msg '+type }function render(){const s=mode==='signup';$('title').textContent=s?'Criar conta':'Entrar';$('desc').textContent=s?'Crie sua conta usando e-mail e senha.':'Entre com seu e-mail e senha.';$('confirm').parentElement.style.display=s?'block':'none';$('password').autocomplete=s?'new-password':'current-password';$('main').textContent=s?'Criar conta':'Entrar';$('signup').textContent=s?'Voltar para entrar':'Criar conta';msg('')}function go(m){mode=m;render()}(async()=>{const session=await window.bestRobuxAuthReady;if(session&&!location.search.includes('force=1'))location.replace('/account.html')})();$('signup').onclick=()=>go(mode==='signup'?'login':'signup');$('forgot').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return msg('Informe seu e-mail para recuperar a senha.','err');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});if(r.error)return msg('Não foi possível enviar o e-mail de recuperação.','err');msg('Enviamos as instruções de recuperação para seu e-mail.','success')};$('main').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),pass=$('password').value;if(!/^\S+@\S+\.\S+$/.test(email))return msg('Informe um e-mail válido.','err');if(pass.length<8)return msg('A senha deve ter pelo menos 8 caracteres.','err');if(mode==='signup'&&pass!==$('confirm').value)return msg('As senhas não coincidem.','err');const btn=$('main');btn.disabled=true;msg('');try{const r=mode==='signup'?await sb.auth.signUp({email,password:pass}):await sb.auth.signInWithPassword({email,password:pass});if(r.error)return msg(mode==='signup'?'Não foi possível criar a conta. Verifique os dados.':'E-mail ou senha incorretos.','err');if(mode==='signup'&&r.data.user&&!r.data.session)return msg('Conta criada. Verifique seu e-mail se a confirmação estiver ativada.','success');location.replace('/account.html')}catch(e){msg('Não foi possível concluir a operação. Tente novamente.','err')}finally{btn.disabled=false}};render();</script></body></html>
