<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Finalizar compra • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f5f6f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px 18px 70px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24272b}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand i{font-style:normal;color:#e3343f}.back{color:#a6abb2;text-decoration:none}.steps{display:flex;gap:8px;align-items:center;color:#70767e;font-size:12px}.step{padding:7px 10px;border:1px solid #292d32;border-radius:999px}.step.active{color:#fff;border-color:#e3343f;background:#e3343f14}.hero{padding:34px 0 22px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:#f0525b}.hero h1{margin:7px 0;font-size:clamp(30px,5vw,46px);letter-spacing:-1px}.hero p{margin:0;color:#8f969e}.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:18px}.card{background:#121416;border:1px solid #272b30;border-radius:16px;box-shadow:0 18px 60px #0000002b}.product{padding:20px}.product-main{display:grid;grid-template-columns:180px 1fr;gap:20px}.photo{height:180px;border-radius:12px;overflow:hidden;background:#0c0e10;border:1px solid #2b3035;display:grid;place-items:center;color:#656c74}.photo img{width:100%;height:100%;object-fit:cover}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#e3343f14;color:#ff6970;font-size:10px;font-weight:900;text-transform:uppercase}.title{margin:10px 0 7px;font-size:28px;line-height:1.08}.description{margin:0;color:#9da4ac;line-height:1.55;white-space:pre-wrap}.seller{margin-top:16px;padding-top:15px;border-top:1px solid #272b30;color:#858c94;font-size:12px}.summary{margin-top:20px;padding:20px;border-top:1px solid #272b30}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;color:#9da4ac}.row strong{color:#fff}.total{display:flex;justify-content:space-between;gap:15px;padding-top:17px;margin-top:5px;border-top:1px solid #30343a;font-size:22px;font-weight:900}.pay{padding:20px}.pay-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.pay h2{margin:0;font-size:21px}.secure{color:#7bdca0;font-size:11px;font-weight:800}.pixbox{margin-top:18px;border:1px solid #2c3238;background:#0d1012;border-radius:14px;padding:18px;text-align:center}.qr{width:250px;height:250px;max-width:100%;margin:4px auto 16px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr canvas,.qr img{width:100%!important;height:100%!important;display:block;object-fit:contain}.qr-fallback{color:#333;font-weight:800;padding:20px}.copy-label{text-align:left;font-size:11px;font-weight:900;color:#aeb5bc;margin-bottom:6px}.copy{width:100%;height:86px;resize:none;border:1px solid #30353a;background:#080a0b;color:#e8eaec;border-radius:9px;padding:11px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.btn{height:46px;border-radius:9px;border:1px solid #343a40;background:#24292e;color:#fff;font-weight:900;cursor:pointer}.primary{background:#e3343f;border-color:#e3343f}.status{margin-top:14px;padding:12px;border-radius:9px;background:#101315;color:#a4abb2;font-size:12px;line-height:1.45}.success{color:#7be0a1}.error{color:#ff7b82}.loading{padding:50px;text-align:center;color:#9299a1}.mini{font-size:12px;color:#777f87;margin-top:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}.product-main{grid-template-columns:120px 1fr}.photo{height:120px}.title{font-size:23px}.steps{display:none}}@media(max-width:500px){.wrap{padding:12px 12px 50px}.top{height:56px}.product-main{grid-template-columns:1fr}.photo{height:220px}.actions{grid-template-columns:1fr}.qr{width:230px;height:230px}.hero{padding-top:25px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><div class="steps"><span class="step active">1 • Pagamento</span><span>→</span><span class="step">2 • Confirmação</span></div><a class="back" href="/marketplace.html">Voltar</a></header><section class="hero"><div class="eyebrow">CHECKOUT SEGURO</div><h1>Finalize sua compra</h1><p>Confira o produto e pague via PIX. A confirmação é automática.</p></section><div id="app"><div class="card loading">Preparando seu checkout…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>let sb;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error('Configuração do checkout indisponível.');sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Faça login para continuar.');const p=new URLSearchParams(location.search),productId=p.get('product'),orderId=p.get('order'),qty=Math.min(100,Math.max(1,parseInt(p.get('quantity')||'1',10)||1));if(orderId)await existing(orderId);else if(productId)await create(productId,qty);else throw Error('Produto não informado.')}catch(e){showError(e.message)}}async function api(body){const session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Sua sessão expirou.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error||'Não foi possível concluir o checkout.');return d}async function create(productId,quantity){const d=await api({action:'buy',productId,quantity});await render(d.order,d.payment)}async function existing(id){const d=await api({action:'orders'}),o=(d.orders||[]).find(x=>x.id===id);if(!o)throw Error('Pedido não encontrado.');await render(o,null)}function showError(msg){document.querySelector('#app').innerHTML='<div class="card loading error">'+esc(msg)+'</div>'}async function render(o,payment){const product=o.marketplace_products||{};const title=product.title||'Produto';const image=product.image_url?'<img src="'+esc(product.image_url)+'" alt="'+esc(title)+'">':'Imagem não disponível';const qty=Number(o.quantity||1),unit=Number(o.unit_price||0),subtotal=Number(o.subtotal||unit*qty),fee=Number(o.platform_fee||0),total=subtotal+fee;document.querySelector('#app').innerHTML='<div class="grid"><section class="card product"><div class="product-main"><div class="photo">'+image+'</div><div><span class="tag">'+esc(product.category||'Marketplace')+'</span><h2 class="title">'+esc(title)+'</h2><p class="description">'+esc(product.description||'Sem descrição disponível.')+'</p><div class="seller">Compra protegida pelo sistema BestRobux Marketplace</div></div></div><div class="summary"><div class="row"><span>Preço unitário</span><strong>'+money(unit)+'</strong></div><div class="row"><span>Quantidade</span><strong>'+qty+'</strong></div><div class="row"><span>Subtotal</span><strong>'+money(subtotal)+'</strong></div><div class="row"><span>Taxa da plataforma</span><strong>'+money(fee)+'</strong></div><div class="total"><span>Total</span><span>'+money(total)+'</span></div></div></section><aside class="card pay"><div class="pay-head"><div><span class="tag">PIX</span><h2 style="margin-top:9px">Pagamento</h2></div><span class="secure">● Seguro</span></div><p class="description" style="margin-top:8px">Escaneie o QR Code com seu banco ou use o PIX copia e cola.</p><div id="payArea">'+(payment?paymentMarkup(payment):'<div class="status">Este pedido já foi criado. Consulte seus pedidos para acompanhar o pagamento.</div>')+'</div><button class="btn" style="width:100%;margin-top:10px" onclick="location.href=\'/product-chat.html\'">Acompanhar pedido</button></aside></div>';if(payment)drawQr(payment)}function paymentMarkup(p){return '<div class="pixbox"><div id="qr" class="qr"><span class="qr-fallback">Gerando QR Code…</span></div><div class="copy-label">PIX copia e cola</div><textarea id="copy" class="copy" readonly>'+esc(p.copyPaste||'')+'</textarea><div class="actions"><button class="btn primary" onclick="copyPix()">Copiar PIX</button><button class="btn" onclick="downloadQr()">Baixar QR</button></div><div class="status"><span class="success">✓ Pedido criado</span><br>Aguardando confirmação automática do pagamento.</div></div>'}function normalizePixQr(v){if(!v)return null;const s=String(v);if(/^data:image\//i.test(s))return s;if(/^https?:\/\//i.test(s))return s;if(s.startsWith('<svg')||s.startsWith('<?xml'))return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);return 'data:image/png;base64,'+s}function drawQr(p){const value=p.copyPaste||'';const raw=normalizePixQr(p.qrCode);const box=document.querySelector('#qr');if(raw){const img=new Image();img.onload=()=>{box.innerHTML='';box.appendChild(img)};img.onerror=()=>generateQr(value);img.src=raw}else generateQr(value)}function generateQr(value){const box=document.querySelector('#qr');if(!value){box.innerHTML='<span class="qr-fallback">PIX indisponível</span>';return}if(!window.QRCode){box.innerHTML='<span class="qr-fallback">QR Code indisponível</span>';return}const canvas=document.createElement('canvas');box.innerHTML='';box.appendChild(canvas);QRCode.toCanvas(canvas,value,{width:250,margin:2,errorCorrectionLevel:'M'},e=>{if(e)box.innerHTML='<span class="qr-fallback">Não foi possível gerar o QR Code.</span>'})}async function copyPix(){const el=document.querySelector('#copy');if(!el||!el.value)return;try{await navigator.clipboard.writeText(el.value)}catch{el.select();document.execCommand('copy')}const s=document.querySelector('.status');if(s)s.innerHTML='<span class="success">✓ PIX copiado para a área de transferência.</span>'}function downloadQr(){const canvas=document.querySelector('#qr canvas');const img=document.querySelector('#qr img');const src=canvas?canvas.toDataURL('image/png'):img?.src;if(!src)return;const a=document.createElement('a');a.href=src;a.download='pix-bestrobux.png';a.click()}boot();</script></body></html>
