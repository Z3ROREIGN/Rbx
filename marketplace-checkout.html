<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • BestRobux</title><style>body{margin:0;background:#08090a;color:#fff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#121315;border:1px solid #292b30;border-radius:14px;padding:20px;margin-top:16px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#e3343f;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.muted{color:#92959b}.row{display:flex;justify-content:space-between;padding:9px 0}.qr{width:240px;height:240px;margin:15px auto;background:#fff;display:grid;place-items:center}.copy{width:100%;height:90px;background:#08090a;color:#fff;border:1px solid #333;border-radius:8px;padding:8px}.error{color:#ff7b82}</style></head><body><main class="wrap"><a href="/marketplace.html" class="muted">Voltar ao Marketplace</a><div id="app" class="card">Carregando checkout...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>(async()=>{const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wait=(p,n=9000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite de conexão.')),n))]);let sb,user,product,order,qty=1;async function session(){await wait(window.bestRobuxAuthReady||Promise.resolve(null));sb=window.bestRobuxSupabase;let r=await wait(sb.auth.getSession());if(!r.data.session){r=await wait(sb.auth.refreshSession())}if(!r.data.session)throw Error('Faça login para comprar.');user=r.data.session.user;return r.data.session}async function api(body){const s=await session();const r=await wait(fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Operação não concluída.');return d}async function boot(){try{await session();const p=new URLSearchParams(location.search);if(p.get('order')){const d=await api({action:'orders'});order=(d.orders||[]).find(x=>x.id===p.get('order'));if(!order)throw Error('Pedido não encontrado.');product=order.marketplace_products;return payment(null)}const id=p.get('product');if(!id)throw Error('Produto não informado.');const r=await wait(fetch('/api/marketplace?product='+encodeURIComponent(id),{cache:'no-store'}));const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar o produto.');product=(d.products||[]).find(x=>String(x.id)===String(id));if(!product)throw Error('Produto indisponível.');qty=Math.max(1,Math.min(Number(product.quantity),parseInt(p.get('quantity')||'1',10)||1));view()}catch(e){fail(e.message)}}function view(){$('app').innerHTML=`<h1>${esc(product.title)}</h1><p class="muted">${esc(product.description||'')}</p><div class="row"><span>Preço</span><b>R$ ${Number(product.price).toFixed(2).replace('.',',')}</b></div><div class="row"><span>Quantidade</span><input id="qty" type="number" min="1" max="${Number(product.quantity)}" value="${qty}"></div><div class="row"><b>Total</b><b id="total">R$ ${(Number(product.price)*qty).toFixed(2).replace('.',',')}</b></div><button id="buy" class="btn">Gerar PIX</button>`;$('qty').onchange=()=>{qty=Math.max(1,Math.min(Number(product.quantity),parseInt($('qty').value,10)||1));$('qty').value=qty;$('total').textContent='R$ '+(Number(product.price)*qty).toFixed(2).replace('.',',')};$('buy').onclick=buy}async function buy(){const b=$('buy');b.disabled=true;try{const d=await api({action:'buy',productId:product.id,quantity:qty});order=d.order;payment(d.payment)}catch(e){b.disabled=false;fail(e.message)}}function payment(p){const total=Number(order.subtotal||0)+Number(order.platform_fee||0);$('app').innerHTML=`<h1>Pagamento PIX</h1><p class="muted">Pedido ${esc(order.id)}</p><div class="row"><span>Total</span><b>R$ ${total.toFixed(2).replace('.',',')}</b></div><div id="pay">${p?pix(p):'<p class="muted">Pagamento já criado. Reabra o pedido para consultar o status.</p>'}</div>`}function pix(p){const cp=p.copyPaste||'';setTimeout(()=>{const q=$('qr');if(q&&cp&&window.QRCode)QRCode.toDataURL(cp,{width:240,margin:1},(e,u)=>{if(!e)q.innerHTML='<img style="width:100%;height:100%" src="'+u+'">'})},0);return `<div class="qr" id="qr">Gerando QR...</div><textarea class="copy" readonly>${esc(cp)}</textarea><button class="btn" style="margin-top:10px;background:#25272b" onclick="navigator.clipboard.writeText(document.querySelector('.copy').value)">Copiar PIX</button>`}function fail(m){$('app').innerHTML='<div class="error">'+esc(m)+'</div><button class="btn" onclick="location.reload()">Tentar novamente</button>'}boot()})()</script></body></html>
