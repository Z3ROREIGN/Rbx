<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • BestRobux Marketplace</title><style>*{box-sizing:border-box}body{margin:0;background:#08090a;color:#f6f7f8;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292d31;padding:12px 0 20px}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:21px}.brand span{color:#e3343f}.back{color:#aeb4bb;text-decoration:none}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:28px}.card{background:#141619;border:1px solid #292d31;border-radius:14px;padding:22px}.product{display:grid;grid-template-columns:140px 1fr;gap:18px}.image{height:140px;border-radius:10px;background:#0d0f10;overflow:hidden;display:grid;place-items:center;color:#777}.image img{width:100%;height:100%;object-fit:cover}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#ff5962;font-weight:900}.title{font-size:27px;margin:6px 0}.desc{color:#a1a7ae;line-height:1.55}.price{font-size:27px;font-weight:900;margin-top:14px}.line{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #292d31;color:#b8bec5}.line strong{color:#fff}.total{font-size:23px;font-weight:900;padding-top:17px;display:flex;justify-content:space-between}.pix{margin-top:20px;text-align:center;background:#0d1012;border:1px solid #30353a;border-radius:12px;padding:18px}.qr{width:220px;height:220px;max-width:100%;margin:15px auto;background:#fff;border-radius:8px;display:grid;place-items:center;overflow:hidden}.qr img{width:100%;height:100%;object-fit:contain}.copy{width:100%;min-height:80px;resize:none;background:#090b0c;border:1px solid #353a40;color:#fff;border-radius:8px;padding:12px;font-size:13px}.btn{width:100%;height:48px;border:0;border-radius:8px;background:#e3343f;color:#fff;font-weight:900;cursor:pointer;margin-top:12px}.btn.secondary{background:#252a2e}.status{padding:13px;border-radius:8px;background:#101315;color:#aeb4bb;line-height:1.5;margin-top:14px}.error{color:#ff7b82}.success{color:#7de2a3}@media(max-width:760px){.layout{grid-template-columns:1fr}.product{grid-template-columns:90px 1fr}.image{height:90px}.title{font-size:21px}.qr{width:190px;height:190px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <span>Marketplace</span></a><a class="back" href="/marketplace.html">← Voltar</a></header><div id="app"><div class="card" style="margin-top:28px">Carregando checkout...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,orderId=null,payment=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login para continuar.');const params=new URLSearchParams(location.search);orderId=params.get('order');const productId=params.get('product');const qty=Math.max(1,Number(params.get('quantity')||1));if(orderId){await showOrder(orderId)}else if(productId){await create(productId,qty)}else throw Error('Checkout inválido.')}catch(e){document.querySelector('#app').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sessão expirada.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível concluir a operação.');return d}async function create(productId,quantity){const d=await api({action:'buy',productId,quantity});orderId=d.order?.id;payment=d.payment;await renderCheckout(d.order,null,d.payment)}async function showOrder(id){const d=await api({action:'orders'}),o=(d.orders||[]).find(x=>x.id===id);if(!o)throw Error('Pedido não encontrado ou sem acesso.');await renderCheckout(o,o.marketplace_products,null)}async function renderCheckout(o,payProduct,pay){const product=payProduct||o.marketplace_products||{};const title=product.title||'Produto do Marketplace';const image=product.image_url?'<img src="'+esc(product.image_url)+'" alt="'+esc(title)+'">':'Sem imagem';const price=Number(o.unit_price||0),qty=Number(o.quantity||1),subtotal=Number(o.subtotal||price*qty),fee=Number(o.platform_fee||0),total=subtotal+fee;document.querySelector('#app').innerHTML='<div class="layout"><section class="card"><div class="product"><div class="image">'+image+'</div><div><div class="label">Seu produto</div><h1 class="title">'+esc(title)+'</h1><p class="desc">'+esc(product.description||'Compra realizada pelo Marketplace BestRobux.')+'</p><div class="price">R$ '+price.toFixed(2).replace('.',',')+'</div></div></div><div style="margin-top:25px"><div class="line"><span>Quantidade</span><strong>'+qty+'</strong></div><div class="line"><span>Subtotal</span><strong>R$ '+subtotal.toFixed(2).replace('.',',')+'</strong></div><div class="line"><span>Taxa da plataforma</span><strong>R$ '+fee.toFixed(2).replace('.',',')+'</strong></div><div class="total"><span>Total</span><span>R$ '+total.toFixed(2).replace('.',',')+'</span></div></div></section><aside class="card"><div class="label">Pagamento PIX</div><h2 style="margin:7px 0">Finalize seu pedido</h2><p class="desc">Escaneie o QR Code ou copie o código PIX. Após a confirmação, acompanhe o pedido em Produtos Comprados.</p><div id="paymentArea">'+(pay?paymentHtml(pay):'<div class="status">Este pedido já existe. Se o pagamento ainda estiver pendente, volte para o Marketplace e consulte seus pedidos.</div>')+'</div><button class="btn secondary" onclick="location.href=\'/product-chat.html\'">Ver meus pedidos</button></aside></div>'}function paymentHtml(p){const qr=p.qrCode?'<img src="data:image/png;base64,'+esc(p.qrCode)+'" alt="QR Code PIX">':'QR Code indisponível';return '<div class="pix"><div class="qr">'+qr+'</div><textarea class="copy" id="copy" readonly>'+esc(p.copyPaste||'')+'</textarea><button class="btn" onclick="copyPix()">Copiar código PIX</button><div class="status"><b>Pedido criado</b><br>O pagamento será confirmado automaticamente.</div></div>'}async function copyPix(){const e=document.querySelector('#copy');if(!e)return;await navigator.clipboard.writeText(e.value);e.select();document.querySelector('.status').innerHTML='<span class="success">Código PIX copiado!</span>'}boot();</script></body></html>
