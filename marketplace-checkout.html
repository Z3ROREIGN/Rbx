<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f5f6f7;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #292d32}.brand{color:#fff;text-decoration:none;font-weight:900}.brand i{color:#e3343f;font-style:normal}.back{color:#aeb5bc}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:24px}.card{background:#121416;border:1px solid #292d32;border-radius:15px;padding:20px}.product{display:grid;grid-template-columns:190px 1fr;gap:20px}.photo{height:190px;border-radius:12px;background:#0b0d0f;display:grid;place-items:center;color:#777;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#e3343f22;color:#ff6b73;font-size:10px;font-weight:900}.title{font-size:28px;margin:10px 0}.desc{color:#9da4ac;line-height:1.55;white-space:pre-wrap}.row,.total{display:flex;justify-content:space-between;padding:10px 0;color:#a2a9b0}.total{border-top:1px solid #30353a;margin-top:8px;color:#fff;font-size:22px;font-weight:900}.qty{margin-top:16px;padding:14px;background:#0d1012;border:1px solid #2b3136;border-radius:10px}.qctrl{display:grid;grid-template-columns:44px 1fr 44px;gap:7px;margin-top:8px}.qctrl>*{height:44px;background:#191d20;border:1px solid #343a40;color:#fff;border-radius:8px;text-align:center;font-weight:900}.qctrl button{font-size:20px}.buy{width:100%;height:46px;margin-top:10px;background:#e3343f;border:1px solid #e3343f;border-radius:9px;color:#fff;font-weight:900}.buy:disabled{opacity:.5}.timer{margin:16px 0;padding:16px;border:1px solid #a65328;background:#2a170e;border-radius:12px}.timer small{display:block;color:#d0a084}.timer b{font-size:34px;color:#ffb16b;font-variant-numeric:tabular-nums}.pix{text-align:center;border:1px solid #2b3136;background:#0d1012;border-radius:12px;padding:15px}.qr{width:240px;height:240px;margin:auto;background:#fff;border-radius:9px;display:grid;place-items:center;overflow:hidden}.qr img,.qr canvas{width:100%!important;height:100%!important;object-fit:contain}.copy{width:100%;height:85px;margin-top:12px;background:#080a0b;color:#fff;border:1px solid #30353a;border-radius:8px;padding:9px;font:12px monospace}.btn{height:43px;padding:0 14px;background:#24292e;border:1px solid #343a40;border-radius:8px;color:#fff;font-weight:800}.status{margin-top:10px;padding:10px;border-radius:8px;background:#101315;color:#9da4ac;font-size:12px}.ok{color:#7be0a1}.err{color:#ff7b82}.expired{text-align:center;max-width:650px;margin:70px auto}.expired .icon{font-size:52px}.expired h1{font-size:32px}@media(max-width:760px){.grid{grid-template-columns:1fr}.product{grid-template-columns:1fr}.photo{height:230px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><a class="back" href="/marketplace.html">Voltar</a></header><div id="app"><div class="card">Carregando…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>let sb,product,order,qty=1,timer,watch;const TEN=600000;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login para continuar.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Operação não concluída.');return d}async function boot(){try{const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const u=new URLSearchParams(location.search),pid=u.get('product'),oid=u.get('order');if(oid){order=(await api({action:'orders'})).orders.find(x=>x.id===oid);if(!order)throw Error('Pedido não encontrado.');product=order.marketplace_products;return payment(null)}if(!pid)throw Error('Produto não informado.');const r=await fetch('/api/marketplace?product='+encodeURIComponent(pid)),d=await r.json();product=(d.products||[]).find(x=>String(x.id)===String(pid));if(!product)throw Error('Produto não encontrado ou indisponível.');qty=Math.max(1,Math.min(Number(product.quantity||1),Number(u.get('quantity')||1)));productView()}catch(e){fail(e.message)}}function productView(){const max=Math.max(1,Number(product.quantity||0));document.querySelector('#app').innerHTML='<div class="grid"><section class="card"><div class="product"><div class="photo">'+(product.image_url?'<img src="'+esc(product.image_url)+'">':'Imagem não cadastrada')+'</div><div><span class="tag">'+esc(product.category||'Marketplace')+'</span><h1 class="title">'+esc(product.title)+'</h1><p class="desc">'+esc(product.description||'Sem descrição disponível.')+'</p></div></div><div class="row"><span>Preço unitário</span><b>'+money(product.price)+'</b></div><div class="total"><span>Total</span><b id="total">'+money(product.price*qty)+'</b></div></section><aside class="card"><span class="tag">COMPRA</span><div class="qty"><div>Quantidade • '+max+' disponível(is)</div><div class="qctrl"><button onclick="setQty(qty-1)">−</button><input id="q" value="'+qty+'" type="number" min="1" max="'+max+'" onchange="setQty(this.value)"><button onclick="setQty(qty+1)">+</button></div></div><button id="buy" class="buy" onclick="buy()">Continuar para pagamento • '+money(product.price*qty)+'</button></aside></div>'}function setQty(v){qty=Math.max(1,Math.min(Number(product.quantity||1),parseInt(v,10)||1));document.querySelector('#q').value=qty;document.querySelector('#total').textContent=money(product.price*qty);document.querySelector('#buy').textContent='Continuar para pagamento • '+money(product.price*qty)}async function buy(){const b=document.querySelector('#buy');b.disabled=true;try{const d=await api({action:'buy',productId:product.id,quantity:qty});order=d.order;payment(d.payment)}catch(e){b.disabled=false;fail(e.message)}}function payment(p){const q=product||{},sub=Number(order.subtotal||0),fee=Number(order.platform_fee||0),total=sub+fee;document.querySelector('#app').innerHTML='<div class="grid"><section class="card"><div class="product"><div class="photo">'+(q.image_url?'<img src="'+esc(q.image_url)+'">':'Imagem não cadastrada')+'</div><div><span class="tag">PIX</span><h1 class="title">'+esc(q.title||'Produto')+'</h1><p class="desc">'+esc(q.description||'Sem descrição disponível.')+'</p></div></div><div class="row"><span>Quantidade</span><b>'+order.quantity+'</b></div><div class="row"><span>Subtotal</span><b>'+money(sub)+'</b></div><div class="row"><span>Taxa</span><b>'+money(fee)+'</b></div><div class="total"><span>Total</span><b>'+money(total)+'</b></div></section><aside class="card"><span class="tag">PAGAMENTO PENDENTE</span><h2>Aguardando PIX</h2><div id="timer" class="timer"><small>Você tem 10 minutos para pagar</small><b>10:00</b><small>Após o prazo, o checkout será recusado.</small></div><div id="pay">'+(p?pix(p):'<div class="status">Pedido pendente. Abra o checkout original para obter o QR Code.</div>')+'</div></aside></div>';startTimer()}function pix(p){const cp=p.copyPaste||'';setTimeout(()=>{const q=document.querySelector('#qr');if(q&&cp&&window.QRCode)QRCode.toDataURL(cp,{width:240,margin:1},(e,url)=>{if(!e)q.innerHTML='<img src="'+url+'">'})},0);return '<div class="pix"><div id="qr" class="qr">Gerando QR Code…</div><textarea id="copy" class="copy" readonly>'+esc(cp)+'</textarea><button class="btn" style="width:100%;margin-top:8px" onclick="copyPix()">Copiar PIX</button><div class="status"><span class="ok">✓ Pedido criado.</span><br>O chat só aparece depois que o pagamento for confirmado.</div></div>'}function startTimer(){clearInterval(timer);clearInterval(watch);const end=new Date(order.created_at).getTime()+TEN;const tick=()=>{const left=end-Date.now(),el=document.querySelector('#timer');if(left<=0){clearInterval(timer);expired();return}if(el)el.querySelector('b').textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left/1000)%60).padStart(2,'0')};tick();timer=setInterval(tick,1000);watch=setInterval(async()=>{try{const x=(await api({action:'orders'})).orders.find(o=>o.id===order.id);if(x&&x.status==='PAID'){clearInterval(watch);location.href='/product-chat.html'}}catch{}},5000)}function expired(){clearInterval(timer);clearInterval(watch);document.querySelector('#app').innerHTML='<section class="card expired"><div class="icon">⌛</div><span class="tag">PAGAMENTO EXPIRADO</span><h1>Checkout recusado</h1><p>Os 10 minutos para efetuar o pagamento terminaram. O pedido será encerrado e o estoque reservado será liberado.</p><button class="buy" onclick="location.href=\'/marketplace.html\'">Voltar ao Marketplace</button></section>'}async function copyPix(){const x=document.querySelector('#copy');if(!x)return;try{await navigator.clipboard.writeText(x.value)}catch{x.select();document.execCommand('copy')}}function fail(m){document.querySelector('#app').innerHTML='<div class="card err">'+esc(m)+'</div>'}boot()</script></body></html>
