<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f5f6f7;font:14px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 16px 70px}.top{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #292d32}.brand{color:#fff;text-decoration:none;font-weight:900}.brand i{color:#e3343f;font-style:normal}.back{color:#aeb5bc;text-decoration:none}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:24px}.card{background:#121416;border:1px solid #292d32;border-radius:16px;padding:20px}.product{display:grid;grid-template-columns:190px 1fr;gap:20px}.photo{height:190px;border-radius:12px;background:#0b0d0f;display:grid;place-items:center;color:#777;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#e3343f22;color:#ff737b;font-size:10px;font-weight:900}.title{font-size:28px;margin:10px 0}.desc{color:#9da4ac;line-height:1.55;white-space:pre-wrap}.row,.total{display:flex;justify-content:space-between;padding:10px 0;color:#a2a9b0}.total{border-top:1px solid #30353a;margin-top:8px;color:#fff;font-size:22px;font-weight:900}.buy{width:100%;height:46px;margin-top:10px;background:#e3343f;border:1px solid #e3343f;border-radius:9px;color:#fff;font-weight:900}.buy:disabled{opacity:.5}.qctrl{display:grid;grid-template-columns:44px 1fr 44px;gap:7px;margin-top:8px}.qctrl>*{height:44px;background:#191d20;border:1px solid #343a40;color:#fff;border-radius:8px;text-align:center;font-weight:900}.qctrl button{font-size:20px}.qty{margin-top:16px;padding:14px;background:#0d1012;border:1px solid #2b3136;border-radius:10px}.timer{margin:16px 0;padding:16px;border:1px solid #a65328;background:#2a170e;border-radius:12px}.timer small{display:block;color:#d0a084}.timer b{font-size:34px;color:#ffb16b;font-variant-numeric:tabular-nums}.pix{text-align:center;border:1px solid #2b3136;background:#0d1012;border-radius:12px;padding:15px}.qr{width:240px;height:240px;margin:auto;background:#fff;border-radius:9px;display:grid;place-items:center;overflow:hidden;color:#333}.qr img{width:100%;height:100%;object-fit:contain}.copy{width:100%;height:85px;margin-top:12px;background:#080a0b;color:#fff;border:1px solid #30353a;border-radius:8px;padding:9px;font:12px monospace}.btn{height:43px;padding:0 14px;background:#24292e;border:1px solid #343a40;border-radius:8px;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:10px;padding:10px;border-radius:8px;background:#101315;color:#9da4ac}.ok{color:#7be0a1}.err{color:#ff7b82}.empty{padding:50px 20px;text-align:center}.seller{margin-top:14px;padding:12px;border:1px solid #292d32;border-radius:10px;background:#0e1012}.seller b{display:block}.loading{padding:30px;text-align:center;color:#9da4ac}@media(max-width:760px){.grid{grid-template-columns:1fr}.product{grid-template-columns:1fr}.photo{height:230px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><a class="back" href="/marketplace.html">Voltar</a></header><div id="app"><div class="loading">Carregando produto...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>let sb,product,order,qty=1,timer,watch;const TEN=600000,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',','),withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite de conexão excedido.')),ms))]);async function session(){let x=await withTimeout(sb.auth.getSession(),6000),s=x.data?.session;if(!s){x=await withTimeout(sb.auth.refreshSession(),6000);s=x.data?.session}if(!s)throw Error('Faça login para continuar.');return s}async function api(body){const s=await session(),r=await withTimeout(fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'}),20000),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Operação não concluída.');return d}async function boot(){try{const c=await withTimeout(fetch('/api/config',{cache:'no-store'}),6000).then(r=>r.json());if(!c.supabaseUrl)throw Error('Serviço de conexão indisponível.');sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const u=new URLSearchParams(location.search),pid=u.get('product'),oid=u.get('order');if(oid){order=(await api({action:'orders'})).orders.find(x=>x.id===oid);if(!order)throw Error('Pedido não encontrado.');product=order.marketplace_products;return payment(null)}if(!pid)throw Error('Produto não informado.');const r=await withTimeout(fetch('/api/marketplace?product='+encodeURIComponent(pid),{cache:'no-store'}),10000),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar o produto.');product=(d.products||[]).find(x=>String(x.id)===String(pid));if(!product)throw Error('Produto não encontrado ou indisponível.');qty=Math.max(1,Math.min(Number(product.quantity||1),Number(u.get('quantity')||1)));productView()}catch(e){fail(e.message)}}function sellerBlock(){if(!product.seller_name)return '';return '<div class="seller"><span class="muted">Vendido por</span><b>'+esc(product.seller_name)+'</b><span class="muted">'+Number(product.sales_count||0)+' venda(s) realizadas com este produto</span></div>'}function productView(){const max=Math.max(1,Number(product.quantity||0));document.querySelector('#app').innerHTML='<div class="grid"><section class="card"><div class="product"><div class="photo">'+(product.image_url?'<img src="'+esc(product.image_url)+'" alt="'+esc(product.title)+'">':'Imagem não cadastrada')+'</div><div><span class="tag">'+esc(product.category||'Marketplace')+'</span><h1 class="title">'+esc(product.title)+'</h1><p class="desc">'+esc(product.description||'Sem descrição disponível.')+'</p>'+sellerBlock()+'</div></div><div class="row"><span>Preço unitário</span><b>'+money(product.price)+'</b></div><div class="total"><span>Total</span><b id="total">'+money(product.price*qty)+'</b></div></section><aside class="card"><span class="tag">COMPRA SEGURA</span><div class="qty"><div>Quantidade • '+max+' disponível(is)</div><div class="qctrl"><button onclick="setQty(qty-1)">−</button><input id="q" value="'+qty+'" type="number" min="1" max="'+max+'" onchange="setQty(this.value)"><button onclick="setQty(qty+1)">+</button></div></div><button id="buy" class="buy" onclick="buy()">Continuar para pagamento • '+money(product.price*qty)+'</button></aside></div>'}function setQty(v){qty=Math.max(1,Math.min(Number(product.quantity||1),parseInt(v,10)||1));document.querySelector('#q').value=qty;document.querySelector('#total').textContent=money(product.price*qty);document.querySelector('#buy').textContent='Continuar para pagamento • '+money(product.price*qty)}async function buy(){const b=document.querySelector('#buy');b.disabled=true;b.textContent='Criando pagamento...';try{const d=await api({action:'buy',productId:product.id,quantity:qty});order=d.order;payment(d.payment)}catch(e){b.disabled=false;b.textContent='Tentar novamente';fail(e.message)}}function payment(p){const q=product||{},sub=Number(order.subtotal||0),fee=Number(order.platform_fee||0),total=sub+fee;document.querySelector('#app').innerHTML='<div class="grid"><section class="card"><div class="product"><div class="photo">'+(q.image_url?'<img src="'+esc(q.image_url)+'" alt="'+esc(q.title||'Produto')+'">':'Imagem não cadastrada')+'</div><div><span class="tag">PIX</span><h1 class="title">'+esc(q.title||'Produto')+'</h1>'+sellerBlock()+'</div></div><div class="row"><span>Quantidade</span><b>'+order.quantity+'</b></div><div class="row"><span>Subtotal</span><b>'+money(sub)+'</b></div><div class="row"><span>Taxa</span><b>'+money(fee)+'</b></div><div class="total"><span>Total</span><b>'+money(total)+'</b></div></section><aside class="card"><span class="tag">PAGAMENTO PENDENTE</span><h2>Aguardando PIX</h2><div id="timer" class="timer"><small>Você tem 10 minutos para pagar</small><b>10:00</b></div><div id="pay">'+(p?pix(p):'<div class="status">Pagamento ainda não possui dados PIX.</div>')+'</div></aside></div>';startTimer()}function pix(p){const cp=p.copyPaste||p.copy_paste||'',qr=p.qrCode||p.qr_code_base64||p.qrcodeUrl||'';setTimeout(()=>{const q=document.querySelector('#qr');if(!q)return;if(qr){q.innerHTML='<img alt="QR Code PIX" src="'+esc(qr.startsWith('data:')||qr.startsWith('http')?qr:'data:image/png;base64,'+qr)+'">'}else if(cp&&window.QRCode){QRCode.toDataURL(cp,{width:240,margin:1},(e,url)=>{if(!e)q.innerHTML='<img alt="QR Code PIX" src="'+url+'">'})}},0);return '<div class="pix">'+(qr||cp?'<div id="qr" class="qr">Gerando QR Code...</div>':'<div class="status err">O gateway não retornou o QR Code.</div>')+(cp?'<textarea id="copy" class="copy" readonly>'+esc(cp)+'</textarea><button class="btn" id="copyBtn" style="width:100%;margin-top:8px">Copiar PIX</button>':'')+'<div class="status"><span class="ok">✓ Pedido criado.</span><br>O chat será liberado após a confirmação do pagamento.</div></div>'}function startTimer(){clearInterval(timer);clearInterval(watch);const end=new Date(order.created_at).getTime()+TEN;const tick=()=>{const left=end-Date.now(),el=document.querySelector('#timer');if(left<=0){clearInterval(timer);expired();return}if(el)el.querySelector('b').textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left/1000)%60).padStart(2,'0')};tick();timer=setInterval(tick,1000);watch=setInterval(async()=>{try{const x=(await api({action:'orders'})).orders.find(o=>o.id===order.id);if(x&&x.status==='PAID'){clearInterval(watch);location.href='/product-chat.html'}}catch{}},5000);document.addEventListener('click',async e=>{if(e.target.id==='copyBtn'){const x=document.querySelector('#copy');try{await navigator.clipboard.writeText(x.value);e.target.textContent='PIX copiado ✓'}catch{x.select();document.execCommand('copy')}}},{once:false})}function expired(){clearInterval(timer);clearInterval(watch);document.querySelector('#app').innerHTML='<section class="card empty"><h1>Pagamento expirado</h1><p>O prazo do checkout terminou e o pedido foi encerrado.</p><button class="buy" onclick="location.href=\'/marketplace.html\'">Voltar ao Marketplace</button></section>'}function fail(m){document.querySelector('#app').innerHTML='<section class="card empty err">'+esc(m)+'<br><button class="btn" style="margin-top:12px" onclick="location.reload()">Tentar novamente</button></section>'}boot()</script></body></html>
