<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f7f8fa;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.back{color:#9da4ae;text-decoration:none}.card{background:#111317;border:1px solid #292e36;border-radius:16px;padding:22px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #252932}.row:last-child{border:0}.muted{color:#969ca8;line-height:1.55}.btn{width:100%;min-height:44px;padding:11px;border:1px solid #e3343f;border-radius:10px;background:#e3343f;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.qr{width:240px;height:240px;margin:18px auto;background:#fff;border-radius:8px;display:grid;place-items:center;color:#222}.copy{width:100%;min-height:90px;background:#08090b;color:#fff;border:1px solid #30343c;border-radius:9px;padding:10px}.error{color:#ff777f}.success{color:#63d49a}</style></head><body><main class="wrap"><a class="back" href="/marketplace.html">← Marketplace</a><div id="app" class="card"><div class="muted">Carregando checkout...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>(async()=>{const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let product=null,order=null,qty=1;const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');async function api(body){return window.bestRobuxApi('/api/marketplace',{method:'POST',body:JSON.stringify(body)})}async function boot(){try{const s=await window.bestRobuxGetSession();if(!s)throw Error('Faça login para comprar.');const p=new URLSearchParams(location.search),oid=p.get('order'),pid=p.get('product');if(oid){const d=await api({action:'orders'});order=(d.orders||[]).find(x=>String(x.id)===oid);if(!order)throw Error('Pedido não encontrado.');product=order.marketplace_products;return payment(null)}if(!pid)throw Error('Produto não informado.');const r=await fetch('/api/marketplace?product='+encodeURIComponent(pid),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível carregar o produto.');product=(d.products||[]).find(x=>String(x.id)===String(pid));if(!product)throw Error('Produto indisponível.');qty=Math.max(1,Math.min(Number(product.quantity||1),parseInt(p.get('quantity')||'1',10)||1));view()}catch(e){fail(e.message)}}function view(){$('app').innerHTML='<h1>'+esc(product.title)+'</h1><p class="muted">'+esc(product.description||'')+'</p><div class="row"><span>Preço unitário</span><b>'+money(product.price)+'</b></div><div class="row"><label>Quantidade</label><input id="qty" type="number" min="1" max="'+Number(product.quantity)+'" value="'+qty+'"></div><div class="row"><b>Total</b><b id="total">'+money(Number(product.price)*qty)+'</b></div><button id="buy" class="btn">Gerar PIX</button>';$('qty').onchange=()=>{qty=Math.max(1,Math.min(Number(product.quantity),parseInt($('qty').value,10)||1));$('qty').value=qty;$('total').textContent=money(Number(product.price)*qty)};$('buy').onclick=buy}async function buy(){const b=$('buy');b.disabled=true;b.textContent='Criando pedido...';try{const d=await api({action:'buy',productId:product.id,quantity:qty});order=d.order;payment(d.payment)}catch(e){b.disabled=false;b.textContent='Gerar PIX';fail(e.message)}}function payment(p){const total=Number(order.subtotal||0)+Number(order.platform_fee||0);$('app').innerHTML='<h1>Pagamento PIX</h1><p class="muted">Pedido '+esc(order.id)+'</p><div class="row"><span>Total</span><b>'+money(total)+'</b></div><div id="pay">'+(p?pix(p):'<p class="muted">Pagamento já criado. Consulte o pedido para acompanhar o status.</p>')+'</div>'}function pix(p){const cp=p.copyPaste||'';setTimeout(()=>{const q=$('qr');if(q&&cp&&window.QRCode)QRCode.toDataURL(cp,{width:240,margin:1},(e,u)=>{if(!e)q.innerHTML='<img alt="QR Code PIX" style="width:100%;height:100%" src="'+u+'">'})},0);return '<div class="qr" id="qr">Gerando QR Code...</div>'+(cp?'<textarea class="copy" readonly>'+esc(cp)+'</textarea><button class="btn" style="margin-top:10px;background:#25282e;border-color:#25282e" id="copy">Copiar PIX</button>':'')}function fail(m){$('app').innerHTML='<div class="error">'+esc(m||'Não foi possível concluir a operação.')+'</div><button class="btn" style="margin-top:12px" id="retry">Tentar novamente</button>'}$('app').addEventListener('click',e=>{if(e.target.id==='copy')navigator.clipboard?.writeText(document.querySelector('.copy').value).then(()=>e.target.textContent='Copiado').catch(()=>{});if(e.target.id==='retry')location.reload()});boot()})()</script><script src="/site-nav.js"></script></body></html>
