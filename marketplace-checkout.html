<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Finalizar compra • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f5f6f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px 16px 70px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #25292d}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand i{font-style:normal;color:#e3343f}.back{color:#aeb5bc;text-decoration:none}.hero{padding:32px 0 22px}.eyebrow{color:#f0525b;font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(30px,5vw,46px);margin:7px 0}.hero p,.muted{color:#9299a1}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:18px}.card{background:#121416;border:1px solid #282d32;border-radius:16px;overflow:hidden}.product,.pay{padding:20px}.product-main{display:grid;grid-template-columns:180px 1fr;gap:20px}.photo{height:180px;border-radius:12px;background:#0c0e10;border:1px solid #2b3035;overflow:hidden;display:grid;place-items:center;color:#737b84}.photo img{width:100%;height:100%;object-fit:cover}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#e3343f18;color:#ff6970;font-size:10px;font-weight:900;text-transform:uppercase}.title{font-size:28px;line-height:1.1;margin:10px 0}.description{white-space:pre-wrap;color:#9da4ac;line-height:1.55}.summary{margin-top:20px;padding-top:14px;border-top:1px solid #282d32}.row,.total{display:flex;justify-content:space-between;gap:15px;padding:10px 0}.row{color:#9da4ac}.row strong,.total{color:#fff}.total{border-top:1px solid #30353a;margin-top:5px;padding-top:16px;font-size:22px;font-weight:900}.qtybox{margin-top:18px;padding:15px;border:1px solid #2c3238;background:#0d1012;border-radius:12px}.qtycontrol{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:8px}.qtycontrol>*{height:44px;border:1px solid #343a40;border-radius:8px;background:#181c20;color:#fff;text-align:center;font-weight:900}.qtycontrol button{font-size:20px;cursor:pointer}.qtycontrol input{font-size:16px}.buybtn,.btn{width:100%;height:46px;border:1px solid #343a40;border-radius:9px;background:#24292e;color:#fff;font-weight:900;cursor:pointer}.buybtn{margin-top:10px;background:#e3343f;border-color:#e3343f}.buybtn:disabled{opacity:.5}.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px;border:1px solid #6d3a22;background:#28180f;border-radius:10px}.timer b{font-size:25px;color:#ffb16b;font-variant-numeric:tabular-nums}.timer small{display:block;color:#c89b7c}.expired{max-width:620px;margin:60px auto;text-align:center;padding:45px 25px}.expired .icon{font-size:54px}.expired h2{font-size:32px;margin:12px 0}.expired p{color:#969da5;line-height:1.6}.danger{color:#ff7b82}.pixbox{margin-top:18px;border:1px solid #2c3238;background:#0d1012;border-radius:14px;padding:18px;text-align:center}.qr{width:250px;height:250px;max-width:100%;margin:4px auto 16px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr canvas,.qr img{width:100%!important;height:100%!important;object-fit:contain}.copy{width:100%;height:85px;resize:none;border:1px solid #30353a;background:#080a0b;color:#eee;border-radius:9px;padding:10px;font:12px/1.45 monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.primary{background:#e3343f;border-color:#e3343f}.status{margin-top:12px;padding:11px;border-radius:9px;background:#101315;color:#9ea6ae;font-size:12px;line-height:1.45}.success{color:#7be0a1}.error{color:#ff7b82}.loading{text-align:center;padding:60px;color:#9299a1}@media(max-width:820px){.grid{grid-template-columns:1fr}.product-main{grid-template-columns:120px 1fr}.photo{height:120px}}@media(max-width:500px){.product-main{grid-template-columns:1fr}.photo{height:220px}.actions{grid-template-columns:1fr}.qr{width:230px;height:230px}.wrap{padding:12px 12px 50px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><a class="back" href="/marketplace.html">Voltar</a></header><section class="hero"><div class="eyebrow">CHECKOUT SEGURO</div><h1>Finalize sua compra</h1><p>Confira o produto, escolha a quantidade e conclua o pagamento via PIX.</p></section><div id="app"><div class="card loading">Carregando produto…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>let sb,product=null,quantity=1,order=null,timer=null;const LIMIT=10*60*1000;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const u=new URLSearchParams(location.search),oid=u.get('order'),pid=u.get('product');if(oid){if(!(await sb.auth.getSession()).data.session)throw Error('Faça login para continuar.');return existing(oid)}if(!pid)throw Error('Produto não informado.');const r=await fetch('/api/marketplace?product='+encodeURIComponent(pid),{cache:'no-store'}),d=await r.json();product=(d.products||[]).find(x=>String(x.id)===String(pid));if(!product)throw Error('Produto não encontrado ou indisponível.');quantity=Math.min(Number(product.quantity||1),Math.max(1,parseInt(u.get('quantity')||'1',10)||1));renderProduct()}catch(e){error(e.message)}}async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sua sessão expirou.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível concluir a operação.');return d}function renderProduct(){const max=Math.max(1,Number(product.quantity||0)),sub=Number(product.price)*quantity;document.querySelector('#app').innerHTML='<div class="grid"><section class="card product"><div class="product-main"><div class="photo">'+(product.image_url?'<img src="'+esc(product.image_url)+'" alt="'+esc(product.title)+'">':'Imagem não cadastrada')+'</div><div><span class="tag">'+esc(product.category||'Marketplace')+'</span><h2 class="title">'+esc(product.title)+'</h2><p class="description">'+esc(product.description||'Sem descrição disponível.')+'</p></div></div><div class="summary"><div class="row"><span>Preço unitário</span><strong>'+money(product.price)+'</strong></div><div class="row"><span>Quantidade</span><strong id="qs">'+quantity+'</strong></div><div class="total"><span>Total</span><span id="ts">'+money(sub)+'</span></div></div></section><aside class="card pay"><span class="tag">PIX</span><h2>Pagamento</h2><div class="qtybox"><div class="muted">Quantidade • '+max+' disponível(is)</div><div class="qtycontrol"><button onclick="setQty(quantity-1)">−</button><input id="qty" type="number" min="1" max="'+max+'" value="'+quantity+'" onchange="setQty(this.value)"><button onclick="setQty(quantity+1)">+</button></div></div><button id="buy" class="buybtn" onclick="buy()">Continuar para pagamento • '+money(sub)+'</button><div id="paymentArea"></div></aside></div>'}function setQty(v){const max=Math.max(1,Number(product.quantity||0));quantity=Math.min(max,Math.max(1,parseInt(v,10)||1));const sub=Number(product.price)*quantity;document.querySelector('#qty').value=quantity;document.querySelector('#qs').textContent=quantity;document.querySelector('#ts').textContent=money(sub);document.querySelector('#buy').textContent='Continuar para pagamento • '+money(sub)}async function buy(){const b=document.querySelector('#buy');b.disabled=true;try{const d=await api({action:'buy',productId:product.id,quantity});order=d.order;renderPayment(d.payment)}catch(e){b.disabled=false;error(e.message)}}async function existing(id){const d=await api({action:'orders'});order=(d.orders||[]).find(x=>x.id===id);if(!order)throw Error('Pedido não encontrado.');product=order.marketplace_products;if(['CANCELLED','REFUNDED'].includes(String(order.status||'').toUpperCase()))return expired();renderPayment(null)}function renderPayment(payment){const p=product||{},unit=Number(order.unit_price||p.price||0),sub=Number(order.subtotal||unit*Number(order.quantity||quantity)),fee=Number(order.platform_fee||0),total=sub+fee;document.querySelector('#app').innerHTML='<div class="grid"><section class="card product"><div class="product-main"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'">':'Imagem não cadastrada')+'</div><div><span class="tag">'+esc(p.category||'Marketplace')+'</span><h2 class="title">'+esc(p.title||'Produto')+'</h2><p class="description">'+esc(p.description||'Sem descrição disponível.')+'</p></div></div><div class="summary"><div class="row"><span>Quantidade</span><strong>'+Number(order.quantity||quantity)+'</strong></div><div class="row"><span>Subtotal</span><strong>'+money(sub)+'</strong></div><div class="row"><span>Taxa</span><strong>'+money(fee)+'</strong></div><div class="total"><span>Total</span><span>'+money(total)+'</span></div></div></section><aside class="card pay"><span class="tag">PAGAMENTO PENDENTE</span><h2>Aguardando PIX</h2><div id="timer" class="timer"><div><small>Você tem</small><b>10:00</b><small>para efetuar o pagamento</small></div><span>⏱</span></div><div id="paymentArea">'+(payment?pix(payment):'<div class="status">Este pedido já existe. O QR Code desta sessão não está disponível nesta abertura.</div>')+'</div></aside></div>';startTimer()}function pix(p){return '<div class="pixbox"><div id="qr" class="qr">Gerando QR Code…</div><textarea id="copy" class="copy" readonly>'+esc(p.copyPaste||'')+'</textarea><div class="actions"><button class="btn primary" onclick="copyPix()">Copiar PIX</button><button class="btn" onclick="location.href=\'/product-chat.html\'">Meus pedidos</button></div><div class="status"><span class="success">✓ Pedido criado</span><br>O chat será liberado somente após a confirmação do pagamento.</div></div>'}function startTimer(){clearInterval(timer);const created=new Date(order.created_at||Date.now()).getTime();const expires=created+LIMIT;const tick=async()=>{const left=expires-Date.now(),el=document.querySelector('#timer');if(left<=0){clearInterval(timer);await expire();return}if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.querySelector('b').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}};tick();timer=setInterval(tick,1000)}async function expire(){try{await api({action:'expire_order',orderId:order.id})}catch{}expired()}function expired(){clearInterval(timer);document.querySelector('#app').innerHTML='<section class="card expired"><div class="icon">⌛</div><span class="tag">PAGAMENTO EXPIRADO</span><h2>Checkout recusado</h2><p>O prazo de <b>10 minutos</b> para efetuar o pagamento terminou. Este pedido foi encerrado e o estoque reservado foi liberado.</p><p class="danger">Não é possível pagar este pedido novamente.</p><button class="buybtn" onclick="location.href=\'/marketplace.html\'">Voltar ao Marketplace</button></section>'}async function copyPix(){const x=document.querySelector('#copy');if(!x?.value)return;try{await navigator.clipboard.writeText(x.value)}catch{x.select();document.execCommand('copy')}const s=document.querySelector('.status');if(s)s.innerHTML='<span class="success">✓ PIX copiado.</span>'}function error(m){document.querySelector('#app').innerHTML='<div class="card loading error">'+esc(m)+'</div>'}boot();</script></body></html>
