<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0b;color:#f4f4f5;font-family:Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 24px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #29292b}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.brand span{color:#e3343f}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid #343437;background:#171718;color:#fff;border-radius:8px;text-decoration:none;font-weight:800;cursor:pointer}.btn:hover{border-color:#e3343f}.primary{background:#e3343f;border-color:#e3343f}.hero{padding:44px 0 26px;display:grid;grid-template-columns:1fr auto;gap:25px;align-items:end}.eyebrow{color:#ff4a53;font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0 12px;letter-spacing:-1.5px}.muted{color:#929297;line-height:1.55}.stats{display:flex;gap:9px;justify-content:flex-end}.stat{min-width:125px;padding:13px 15px;background:#151516;border:1px solid #29292b;border-radius:9px}.stat b{display:block;margin-top:4px}.tools{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:8px 0 24px}.tools input,.tools select{height:48px;padding:0 14px;border-radius:8px;border:1px solid #343437;background:#101011;color:#fff;outline:0}.tools input:focus,.tools select:focus{border-color:#e3343f;box-shadow:0 0 0 3px #e3343f18}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:#151516;border:1px solid #29292b;border-radius:10px;overflow:hidden;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-2px);border-color:#454548}.pic{height:180px;background:#101011;display:grid;place-items:center;color:#69696e;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.category{color:#ff4a53;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.body h3{margin:7px 0;font-size:18px}.description{height:43px;overflow:hidden;font-size:13px}.price{font-size:25px;font-weight:900;margin:15px 0 5px}.qty{font-size:12px;color:#929297}.buy{width:100%;margin-top:14px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;background:#111112;border:1px dashed #333;border-radius:10px;color:#929297}@media(max-width:800px){.shell{padding:18px 14px 105px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav .btn{flex:1}.hero{grid-template-columns:1fr;padding-top:30px}.stats{justify-content:flex-start}.stat{flex:1;min-width:0}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:135px}.body{padding:13px}.body h3{font-size:16px}.price{font-size:21px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:180px}.stats{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><main class="shell"><header class="top"><a class="brand" href="/">BestRobux <span>Marketplace</span></a><nav class="nav"><a class="btn" href="/wallet.html">Carteira</a><a class="btn" href="/seller-register.html">Quero vender</a><a class="btn" href="/product-chat.html">Pedidos</a></nav></header><section class="hero"><div><div class="eyebrow">BESTROBUX • MARKETPLACE</div><h1>Compre. Venda. Confie.</h1><p class="muted">Encontre produtos de usuários, acompanhe o estoque e finalize suas compras com pagamento PIX e acompanhamento do pedido.</p></div><div class="stats"><div class="stat"><span class="muted">Produtos</span><b id="count">—</b></div><div class="stat"><span class="muted">Estoque</span><b id="stock">—</b></div></div></section><section class="tools"><input id="q" aria-label="Pesquisar" placeholder="Pesquisar por produto..."><select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select></section><main id="grid" class="grid"><div class="empty">Carregando marketplace...</div></main></main><script>let products=[];async function load(){try{const r=await fetch('/api/marketplace',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar o Marketplace.');products=Array.isArray(d.products)?d.products:[];document.querySelector('#count').textContent=products.length;document.querySelector('#stock').textContent=products.reduce((n,p)=>n+Number(p.quantity||0),0);render()}catch(e){document.querySelector('#grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function render(){const q=document.querySelector('#q').value.trim().toLowerCase(),c=document.querySelector('#cat').value,arr=products.filter(p=>(!q||String(p.title||'').toLowerCase().includes(q)||String(p.description||'').toLowerCase().includes(q))&&(!c||p.category===c));document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.title)}" loading="lazy">`:'Sem imagem'}</div><div class="body"><div class="category">${esc(p.category||'Outros')}</div><h3>${esc(p.title)}</h3><p class="muted description">${esc(p.description||'Sem descrição')}</p><div class="price">R$ ${Number(p.price||0).toFixed(2).replace('.',',')}</div><div class="qty">${Number(p.quantity||0)} unidade(s) disponíveis</div><button class="btn primary buy" onclick="go('${escAttr(p.id)}')">Comprar agora</button></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}function go(id){const p=products.find(x=>x.id===id);if(!p)return;location.href='/marketplace-checkout.html?product='+encodeURIComponent(p.id)+'&quantity=1'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}document.querySelector('#q').addEventListener('input',render);document.querySelector('#cat').addEventListener('change',render);load();</script><script src="/site-nav.js"></script></body></html>
