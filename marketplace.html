<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0b"><title>Marketplace • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#1a1b20,#0a0a0b 48%);color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.shell{width:min(1240px,calc(100% - 28px));margin:auto;padding:22px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #292b30;padding:10px 0 18px}.brand{font-size:21px;font-weight:900;color:#fff;text-decoration:none}.brand span{color:#e3343f}.nav{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid #343437;background:#171718;color:#fff;border-radius:9px;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:#e3343f;border-color:#e3343f}.hero{padding:45px 0 25px}.eyebrow{color:#ff4a53;font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0 12px}.muted{color:#929297;line-height:1.55}.stats{display:flex;gap:9px;margin-top:20px}.stat{min-width:140px;padding:13px 15px;background:#151516;border:1px solid #29292b;border-radius:10px}.stat b{display:block;margin-top:4px}.tools{display:grid;grid-template-columns:1fr 210px;gap:10px;margin-bottom:20px}.tools input,.tools select{height:48px;padding:0 14px;border-radius:9px;border:1px solid #343437;background:#101011;color:#fff;outline:0}.tools input:focus,.tools select:focus{border-color:#e3343f}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}.card{background:#151516;border:1px solid #29292b;border-radius:11px;overflow:hidden;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#454548}.pic{height:180px;background:#101011;display:grid;place-items:center;color:#69696e;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.category{color:#ff4a53;font-size:11px;font-weight:900;text-transform:uppercase}.body h3{margin:7px 0;font-size:18px}.description{height:43px;overflow:hidden;font-size:13px}.price{font-size:25px;font-weight:900;margin:15px 0 5px}.qty{font-size:12px;color:#929297}.buy{width:100%;margin-top:14px}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;background:#111112;border:1px dashed #333;border-radius:11px;color:#929297}.error{color:#ff777f}@media(max-width:700px){.top{flex-direction:column;align-items:stretch}.nav .btn{flex:1}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pic{height:140px}.body{padding:13px}.body h3{font-size:16px}.price{font-size:21px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:180px}}</style></head><body><main class="shell"><header class="top"><a class="brand" href="/">BestRobux <span>Marketplace</span></a><nav class="nav"><a class="btn" href="/wallet.html">Carteira</a><a class="btn" href="/seller-register.html">Quero vender</a><a class="btn" href="/orders.html">Pedidos</a></nav></header><section class="hero"><div class="eyebrow">BESTROBUX • MARKETPLACE</div><h1>Compre. Venda. Confie.</h1><p class="muted">Produtos digitais e ofertas de usuários, com estoque, pedido e pagamento PIX integrados.</p><div class="stats"><div class="stat"><span class="muted">Produtos</span><b id="count">—</b></div><div class="stat"><span class="muted">Unidades</span><b id="stock">—</b></div></div></section><section class="tools"><input id="q" aria-label="Pesquisar" placeholder="Pesquisar por produto..."><select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select></section><section id="grid" class="grid"><div class="empty">Carregando marketplace...</div></section></main><script>let products=[],loading=false;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),escAttr=s=>esc(s).replace(/`/g,'&#96;');async function load(){if(loading)return;loading=true;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000),r=await fetch('/api/marketplace',{cache:'no-store',signal:c.signal});clearTimeout(t);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível carregar o Marketplace.');products=Array.isArray(d.products)?d.products:[];$('count').textContent=products.length;$('stock').textContent=products.reduce((n,p)=>n+Number(p.quantity||0),0);render()}catch(e){$('grid').innerHTML='<div class="empty error">Não foi possível conectar ao Marketplace.<br><button class="btn" style="margin-top:10px" onclick="load()">Tentar novamente</button></div>'}finally{loading=false}}function render(){const q=$('q').value.trim().toLowerCase(),c=$('cat').value,a=products.filter(p=>(!q||String(p.title||'').toLowerCase().includes(q)||String(p.description||'').toLowerCase().includes(q))&&(!c||p.category===c));$('grid').innerHTML=a.length?a.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.title)}" loading="lazy">`:'Sem imagem'}</div><div class="body"><div class="category">${esc(p.category||'Outros')}</div><h3>${esc(p.title)}</h3><p class="muted description">${esc(p.description||'Sem descrição')}</p><div class="price">R$ ${Number(p.price||0).toFixed(2).replace('.',',')}</div><div class="qty">${Number(p.quantity||0)} unidade(s) disponíveis</div><button class="btn primary buy" onclick="go('${escAttr(p.id)}')">Comprar agora</button></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}function go(id){if(products.some(p=>String(p.id)===String(id)))location.href='/marketplace-checkout.html?product='+encodeURIComponent(id)+'&quantity=1'}$('q').addEventListener('input',render);$('cat').addEventListener('change',render);load();</script><script src="/site-nav.js"></script></body></html>
