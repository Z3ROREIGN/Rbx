<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f6;font:14px system-ui,sans-serif}.shell{max-width:1240px;margin:auto;padding:22px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 18px;border-bottom:1px solid #292d33}.brand{font-size:21px;font-weight:950;color:#fff;text-decoration:none}.brand span{color:#e3343f}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid #343941;background:#16181b;color:#fff;border-radius:9px;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:#df3540;border-color:#df3540}.hero{padding:42px 0 24px;display:grid;grid-template-columns:1fr auto;gap:25px;align-items:end}.eyebrow{color:#ff6972;font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(36px,5vw,58px);line-height:1;margin:8px 0 12px;letter-spacing:-2px}.muted{color:#949aa2;line-height:1.5}.stats{display:flex;gap:9px;justify-content:flex-end}.stat{min-width:125px;padding:13px 15px;background:#15171a;border:1px solid #292d33;border-radius:10px}.stat b{display:block;margin-top:4px}.tools{display:grid;grid-template-columns:1fr 210px 170px 170px;gap:9px;margin:8px 0 24px}.tools input,.tools select{height:48px;padding:0 14px;border-radius:9px;border:1px solid #343941;background:#101214;color:#fff;outline:0}.tools input:focus,.tools select:focus{border-color:#df3540}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:#151719;border:1px solid #292d33;border-radius:12px;overflow:hidden;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#464b52}.pic{height:180px;background:#101214;display:grid;place-items:center;color:#696f77;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.category{color:#ff6972;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.body h3{margin:7px 0;font-size:18px}.description{height:43px;overflow:hidden;font-size:13px}.price{font-size:25px;font-weight:950;margin:14px 0 4px}.qty{font-size:12px;color:#9298a0}.seller{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:#c6cbd0}.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#292d33}.seller b{color:#fff}.sales{font-size:11px;color:#858c94;margin-top:4px}.buy{width:100%;margin-top:13px}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;background:#111315;border:1px dashed #343941;border-radius:12px;color:#9298a0}.loading{display:flex;align-items:center;justify-content:center;gap:9px;min-height:180px}.spin{width:16px;height:16px;border:2px solid #4a4f56;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.tools{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.stats{justify-content:flex-start}}@media(max-width:650px){.shell{padding:16px 13px 80px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav .btn{flex:1}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pic{height:140px}.body{padding:12px}.price{font-size:21px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:180px}}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="/">BestRobux <span>Marketplace</span></a><nav class="nav"><a class="btn" href="/wallet.html">Carteira</a><a class="btn" href="/seller-register.html">Quero vender</a><a class="btn" href="/product-chat.html">Pedidos</a></nav></header><section class="hero"><div><div class="eyebrow">BESTROBUX • MARKETPLACE</div><h1>Compre. Venda. Confie.</h1><p class="muted">Produtos digitais e serviços de usuários, com estoque, vendedor identificado, histórico de vendas e checkout PIX.</p></div><div class="stats"><div class="stat"><span class="muted">Produtos</span><b id="count">—</b></div><div class="stat"><span class="muted">Estoque</span><b id="stock">—</b></div></div></section><section class="tools"><input id="q" aria-label="Pesquisar" placeholder="Pesquisar produto, descrição ou vendedor..."><select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option></select><select id="sort" aria-label="Ordenar"><option value="new">Mais recentes</option><option value="price-asc">Menor preço</option><option value="price-desc">Maior preço</option><option value="sales">Mais vendidos</option><option value="stock">Maior estoque</option></select><select id="delivery" aria-label="Entrega"><option value="">Todas as entregas</option><option value="DIGITAL">Digital</option><option value="CHAT">Atendimento</option></select></section><section id="grid" class="grid"><div class="empty loading"><span class="spin"></span> Carregando marketplace...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let products=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),escAttr=s=>esc(s).replace(/`/g,'&#96;'),timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite excedido.')),ms))]);async function enrich(){try{const c=await timeout(fetch('/api/config',{cache:'no-store'}),5000).then(r=>r.json());if(!c.supabaseUrl)return;const sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:false}});const ids=[...new Set(products.map(p=>p.seller_id).filter(Boolean))];if(!ids.length)return;const pr=await timeout(sb.from('profiles').select('id,username,display_name,avatar_url,public_profile').in('id',ids),5000);const map=new Map((pr.data||[]).map(x=>[x.id,x]));const sales=await Promise.all(products.map(async p=>{try{const x=await timeout(sb.from('marketplace_orders').select('id',{count:'exact',head:true}).eq('product_id',p.id).in('status',['PAID','DELIVERING','BUYER_CONFIRMED','SELLER_CONFIRMED','COMPLETED']),5000);return [p.id,x.count||0]}catch{return [p.id,0]}}));const sm=new Map(sales);products=products.map(p=>({...p,seller:map.get(p.seller_id)||null,sales_count:sm.get(p.id)||0}));render()}catch{products=products.map(p=>({...p,sales_count:p.sales_count||0}));render()}}async function load(){const grid=document.querySelector('#grid');grid.innerHTML='<div class="empty loading"><span class="spin"></span> Carregando produtos...</div>';try{const r=await timeout(fetch('/api/marketplace',{cache:'no-store'}),10000),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar o Marketplace.');products=Array.isArray(d.products)?d.products:[];document.querySelector('#count').textContent=products.length;document.querySelector('#stock').textContent=products.reduce((n,p)=>n+Number(p.quantity||0),0);const cats=[...new Set(products.map(p=>String(p.category||'Outros')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));document.querySelector('#cat').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>'<option value="'+escAttr(c)+'">'+esc(c)+'</option>').join('');render();enrich()}catch(e){grid.innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="btn primary" style="margin-top:12px" onclick="load()">Tentar novamente</button></div>'}}function render(){const q=document.querySelector('#q').value.trim().toLowerCase(),c=document.querySelector('#cat').value,d=document.querySelector('#delivery').value,s=document.querySelector('#sort').value;let arr=products.filter(p=>{const seller=p.seller?.display_name||p.seller?.username||'';return(!q||[p.title,p.description,seller].some(v=>String(v||'').toLowerCase().includes(q)))&&(!c||p.category===c)&&(!d||p.delivery_type===d)});arr.sort((a,b)=>s==='price-asc'?Number(a.price)-Number(b.price):s==='price-desc'?Number(b.price)-Number(a.price):s==='sales'?Number(b.sales_count||0)-Number(a.sales_count||0):s==='stock'?Number(b.quantity||0)-Number(a.quantity||0):new Date(b.created_at)-new Date(a.created_at));document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>{const seller=p.seller?.display_name||p.seller?.username||'Vendedor';return '<article class="card"><div class="pic">'+(p.image_url?'<img src="'+escAttr(p.image_url)+'" alt="'+escAttr(p.title)+'" loading="lazy">':'Sem imagem')+'</div><div class="body"><div class="category">'+esc(p.category||'Outros')+'</div><h3>'+esc(p.title)+'</h3><p class="muted description">'+esc(p.description||'Sem descrição')+'</p><div class="seller">'+(p.seller?.avatar_url?'<img class="avatar" src="'+escAttr(p.seller.avatar_url)+'" alt="">':'<span class="avatar"></span>')+'<span>Vendido por <b>'+esc(seller)+'</b></span></div><div class="sales">'+Number(p.sales_count||0)+' venda(s) realizada(s) • '+Number(p.quantity||0)+' disponível(is)</div><div class="price">R$ '+Number(p.price||0).toFixed(2).replace('.',',')+'</div><button class="btn primary buy" onclick="go(\''+escAttr(p.id)+'\')">Comprar agora</button></div></article>'}).join(''):'<div class="empty">Nenhum produto encontrado com esses filtros.</div>'}function go(id){const p=products.find(x=>x.id===id);if(p)location.href='/marketplace-checkout.html?product='+encodeURIComponent(p.id)+'&quantity=1'}['q','cat','sort','delivery'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='q'?'input':'change',render));load();</script><script src="/site-nav.js"></script></body></html>
