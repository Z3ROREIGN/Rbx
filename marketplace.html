<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#090a0b;color:#f5f6f7}header{position:sticky;top:0;z-index:5;background:#0f1113;border-bottom:1px solid #292e33;padding:16px 5%;display:flex;gap:16px;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:22px;color:#fff}.logo span{color:#e3343f}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #3b4148;background:#171a1d;color:#fff;border-radius:6px;padding:10px 14px;cursor:pointer}.primary{background:#e3343f;border-color:#ff4b55}.hero{padding:50px 5% 28px;max-width:1250px;margin:auto}.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 10px}.muted{color:#929aa3}.tools{display:flex;gap:10px;margin:20px 0}.tools input,.tools select{flex:1;min-width:180px;padding:14px;border-radius:6px;border:1px solid #353a40;background:#0d0f11;color:#fff}.grid{max-width:1250px;margin:auto;padding:20px 5% 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:#151719;border:1px solid #292e33;border-radius:8px;overflow:hidden}.pic{height:170px;background:#1b1e21;display:grid;place-items:center;color:#777f88}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.price{font-size:24px;font-weight:900;margin:10px 0}.qty{font-size:13px;color:#929aa3}.empty{text-align:center;grid-column:1/-1;padding:70px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.box{width:min(520px,100%);background:#151719;border:1px solid #383d43;border-radius:8px;padding:24px}.box input,.box textarea,.box select{width:100%;margin:7px 0;padding:12px;border-radius:6px;border:1px solid #353a40;background:#0d0f11;color:#fff}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.notice{padding:12px;border-radius:6px;background:#32171b;border:1px solid #62272e;margin-top:10px}</style></head><body><header><a class="logo" href="/">BestRobux <span>Marketplace</span></a><nav class="nav"><a class="btn" href="/wallet.html">Carteira</a><a class="btn" href="/seller-register.html">Vender</a><a class="btn" href="/product-chat.html">Produtos comprados/vendidos</a></nav></header><section class="hero"><div class="muted">Marketplace seguro • pagamento PIX • estoque em tempo real</div><h1>Compre e venda com confiança.</h1><p class="muted">Produtos de usuários, quantidade controlada e entrega acompanhada por um chat exclusivo.</p><div class="tools"><input id="q" placeholder="Pesquisar produtos..."><select id="cat"><option value="">Todas as categorias</option><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select></div></section><main id="grid" class="grid"><div class="empty">Carregando marketplace...</div></main><div id="modal" class="modal"><div class="box"><h2 id="mtitle">Comprar</h2><p id="mdesc" class="muted"></p><label>Quantidade</label><input id="mqty" type="number" min="1" value="1"><div id="notice"></div><div class="row"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="buy()">Pagar com PIX</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,products=[],selected;async function boot(){const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});await load()}async function token(){return (await sb.auth.getSession()).data.session?.access_token}async function api(body){const t=await token();if(!t)throw Error('Faça login para comprar.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function load(){const r=await fetch('/api/marketplace',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar o Marketplace.');products=Array.isArray(d.products)?d.products:[];render()}function render(){const q=document.querySelector('#q').value.toLowerCase(),c=document.querySelector('#cat').value;const arr=products.filter(p=>(!q||String(p.title).toLowerCase().includes(q))&&(!c||p.category===c));document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="">`:'Sem imagem'}</div><div class="body"><div class="muted">${esc(p.category)}</div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description||'').slice(0,120)}</p><div class="price">R$ ${Number(p.price).toFixed(2).replace('.',',')}</div><div class="qty">${p.quantity} unidade(s) disponíveis</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="openM('${escAttr(p.id)}')">Comprar</button></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}function openM(id){selected=products.find(p=>p.id===id);if(!selected)return;document.querySelector('#mtitle').textContent=selected.title;document.querySelector('#mdesc').textContent=`R$ ${Number(selected.price).toFixed(2)} por unidade • ${selected.quantity} disponíveis`;document.querySelector('#mqty').max=selected.quantity;document.querySelector('#modal').classList.add('open')}function closeM(){document.querySelector('#modal').classList.remove('open')}async function buy(){try{const q=Number(document.querySelector('#mqty').value);const d=await api({action:'buy',productId:selected.id,quantity:q});document.querySelector('#notice').innerHTML=`<div class="notice">PIX criado. Copie e pague:<br><b>${esc(d.payment?.copyPaste||'Abra o QR Code informado pelo provedor.')}</b></div>`}catch(e){document.querySelector('#notice').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}document.querySelector('#q').oninput=render;document.querySelector('#cat').onchange=render;boot().catch(e=>document.querySelector('#grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>');</script><script src="/site-nav.js"></script></body></html>
