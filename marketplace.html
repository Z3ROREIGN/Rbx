<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#07101d;color:#f7fbff}header{position:sticky;top:0;z-index:5;background:#0b1626eF;backdrop-filter:blur(18px);border-bottom:1px solid #20314a;padding:18px 5%;display:flex;gap:16px;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}.logo{font-weight:900;font-size:22px}.nav{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #2a405e;background:#112139;color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.primary{background:#6d5dfc;border-color:#7e70ff}.hero{padding:54px 5% 28px;max-width:1250px;margin:auto}.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 10px}.muted{color:#9db0c8}.tools{display:flex;gap:10px;margin:20px 0}.tools input{flex:1;min-width:180px;padding:14px;border-radius:12px;border:1px solid #2a405e;background:#0c1828;color:#fff}.grid{max-width:1250px;margin:auto;padding:20px 5% 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:#0d1a2b;border:1px solid #20324b;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px #0003}.pic{height:170px;background:#13243b;display:grid;place-items:center;color:#8298b3}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.price{font-size:24px;font-weight:900;margin:10px 0}.qty{font-size:13px;color:#8ea4be}.empty{text-align:center;grid-column:1/-1;padding:70px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.box{width:min(520px,100%);background:#0c1828;border:1px solid #29405d;border-radius:20px;padding:24px}.box input,.box textarea,.box select{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #2a405e;background:#081321;color:#fff}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.notice{padding:12px;border-radius:10px;background:#12243b;margin-top:10px}</style></head><body><header><a class="logo" href="/">BestRobux <span style="color:#8a7dff">Marketplace</span></a><nav class="nav"><a class="btn" href="/wallet.html">Carteira</a><a class="btn" href="/seller-register.html">Vender</a><a class="btn" href="/product-chat.html">Produtos comprados/vendidos</a></nav></header><section class="hero"><div class="muted">Marketplace seguro • pagamento PIX • estoque em tempo real</div><h1>Compre e venda com confiança.</h1><p class="muted">Produtos de usuários, quantidade controlada e entrega acompanhada por um chat exclusivo.</p><div class="tools"><input id="q" placeholder="Pesquisar produtos..."><select id="cat" class="btn"><option value="">Todas as categorias</option><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select></div></section><main id="grid" class="grid"><div class="empty">Carregando marketplace...</div></main><div id="modal" class="modal"><div class="box"><h2 id="mtitle">Comprar</h2><p id="mdesc" class="muted"></p><label>Quantidade</label><input id="mqty" type="number" min="1" value="1"><div id="notice"></div><div class="row"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="buy()">Pagar com PIX</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,products=[],selected;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);await load()}async function token(){const {data}=await sb.auth.getSession();return data.session?.access_token}async function api(body){const t=await token();if(!t)throw Error('Faça login para comprar.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}async function load(){const d=await fetch('/api/marketplace').then(r=>r.json());products=d.products||[];render()}function render(){const q=document.querySelector('#q').value.toLowerCase(),c=document.querySelector('#cat').value;const arr=products.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(!c||p.category===c));document.querySelector('#grid').innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${p.image_url}" alt="">`:'Sem imagem'}</div><div class="body"><div class="muted">${p.category}</div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description).slice(0,120)}</p><div class="price">R$ ${Number(p.price).toFixed(2).replace('.',',')}</div><div class="qty">${p.quantity} unidade(s) disponíveis</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="openM('${p.id}')">Comprar</button></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function openM(id){selected=products.find(p=>p.id===id);document.querySelector('#mtitle').textContent=selected.title;document.querySelector('#mdesc').textContent=`R$ ${Number(selected.price).toFixed(2)} por unidade • ${selected.quantity} disponíveis`;document.querySelector('#mqty').max=selected.quantity;document.querySelector('#modal').classList.add('open')}function closeM(){document.querySelector('#modal').classList.remove('open')}async function buy(){try{const q=Number(document.querySelector('#mqty').value);const d=await api({action:'buy',productId:selected.id,quantity:q});document.querySelector('#notice').innerHTML=`<div class="notice">PIX criado. Copie e pague: <br><b>${d.payment.copyPaste||'Abra o QR Code informado pelo provedor.'}</b></div>`;alert('Pagamento criado. Após a confirmação, o pedido aparecerá em Produtos comprados/vendidos.')}catch(e){document.querySelector('#notice').innerHTML='<div class="notice">'+e.message+'</div>'}}document.querySelector('#q').oninput=render;document.querySelector('#cat').onchange=render;boot().catch(e=>document.querySelector('#grid').innerHTML='<div class="empty">'+e.message+'</div>');</script><script src="/site-nav.js"></script></body></html>
