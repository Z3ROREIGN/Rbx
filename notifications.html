<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.links{display:flex;gap:8px}.btn{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.55;cursor:wait}.hero{padding:34px 0 20px}.muted{color:#85858f;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.list{display:grid;gap:10px;padding-bottom:40px}.notice{background:#0b0b0d;border:1px solid #222229;border-radius:14px;padding:17px}.unread{border-color:#393040}.title{font-weight:750}.dot{width:8px;height:8px;background:#8b7cf6;border-radius:50%;display:inline-block;margin-right:7px}.type{font-size:10px;text-transform:uppercase;color:#888}.message{color:#b6b6be;margin-top:8px;white-space:pre-wrap;line-height:1.6}.date{color:#666;font-size:11px;margin-top:10px}.empty{text-align:center;padding:40px;border:1px dashed #292930;border-radius:14px;color:#777}.error{color:#ff8585}</style></head><body><div class="wrap"><nav class="nav"><b>Best Robux</b><div class="links"><a class="btn" href="/account.html">Minha conta</a><a class="btn" href="/index.html">Início</a></div></nav><section class="hero"><h1>Notificações</h1><div class="muted">Avisos da sua conta, pedidos, carteira e Marketplace.</div></section><div class="toolbar"><span id="count" class="muted">Conectando...</span><button id="readAll" class="btn">Marcar todas como lidas</button></div><div id="error" class="error"></div><main id="list" class="list"><div class="empty">Carregando notificações...</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const $=id=>document.getElementById(id),timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite excedido.')),ms))]),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sb,user,loading=false;async function init(){const r=await timeout(fetch('/api/config',{cache:'no-store'}),5000),c=await r.json();if(!r.ok)throw Error('Serviço de conexão indisponível.');sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});let x=await timeout(sb.auth.getSession(),5000),s=x.data?.session;if(!s){x=await timeout(sb.auth.refreshSession(),5000);s=x.data?.session}if(!s)throw Error('Sessão expirada.');user=s.user}async function load(){if(loading)return;loading=true;$('error').textContent='';try{const r=await timeout(sb.from('notifications').select('id,title,message,type,order_id,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100),8000);if(r.error)throw r.error;const n=r.data||[],u=n.filter(x=>!x.read_at).length;$('count').textContent=`${u} não lida${u===1?'':'s'} · ${n.length} no total`;$('list').innerHTML=n.length?n.map(x=>`<article class="notice ${x.read_at?'':'unread'}"><div class="title">${x.read_at?'':'<span class="dot"></span>'}${esc(x.title)}</div><div class="type">${esc(x.type)}</div><div class="message">${esc(x.message)}</div><div class="date">${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''} · ${x.read_at?'Lida':'Não lida'}</div>${x.read_at?'':'<button class="btn mark" data-id="${esc(x.id)}" style="margin-top:10px">Marcar como lida</button>'}</article>`).join(''):'<div class="empty">Nenhuma notificação encontrada.</div>'}catch(e){console.error(e);$('count').textContent='Não foi possível carregar';$('list').innerHTML='<div class="empty error">'+esc(e.message)+'<br><button class="btn" id="retry" style="margin-top:12px">Tentar novamente</button></div>'}finally{loading=false}}async function mark(id,b){if(b)b.disabled=true;try{const r=await timeout(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id).is('read_at',null),8000);if(r.error)throw r.error;await load()}catch(e){$('error').textContent='Não foi possível atualizar a notificação. '+e.message;if(b)b.disabled=false}}$('readAll').onclick=async()=>{const b=$('readAll');b.disabled=true;try{const r=await timeout(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null),8000);if(r.error)throw r.error;await load()}catch(e){$('error').textContent='Não foi possível atualizar as notificações. '+e.message}finally{b.disabled=false}};document.addEventListener('click',e=>{const b=e.target.closest('.mark');if(b)mark(b.dataset.id,b);if(e.target.id==='retry')load()});try{await init();await load();sb.channel('notifications-live-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},load).subscribe()}catch(e){console.error(e);$('count').textContent='Serviço indisponível';$('list').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}})()</script><script src="/site-nav.js"></script></body></html>
