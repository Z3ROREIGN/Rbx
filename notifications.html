<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Best Robux — Notificações</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.links{display:flex;gap:8px}.btn{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.55;cursor:wait}.hero{padding:34px 0 20px}.muted{color:#85858f;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.list{display:grid;gap:10px;padding-bottom:40px}.notice{background:#0b0b0d;border:1px solid #222229;border-radius:14px;padding:17px}.notice.unread{border-color:#393040;background:#0d0b10}.top{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750}.dot{width:8px;height:8px;background:#8b7cf6;border-radius:50%;display:inline-block;margin-right:7px}.type{font-size:10px;text-transform:uppercase;color:#888}.message{color:#b6b6be;margin-top:8px;line-height:1.6;white-space:pre-wrap}.date{color:#666;font-size:11px;margin-top:10px}.empty{padding:40px;text-align:center;border:1px dashed #292930;border-radius:14px;color:#777}.error{color:#ff8585;margin:10px 0}.retry{margin-top:10px}@media(max-width:600px){.links a:first-child{display:none}}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux</div><div class="links"><a class="btn" href="/account.html">Minha conta</a><a class="btn" href="/index.html">Início</a></div></nav><section class="hero"><h1>Notificações</h1><div class="muted">Acompanhe avisos da sua conta, pedidos e entregas.</div></section><div class="toolbar"><span id="count" class="muted">Carregando...</span><button class="btn" id="readAll" type="button">Marcar todas como lidas</button></div><div id="error" class="error"></div><main id="list" class="list"></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://anlwpqwjjswkqncltcdl.supabase.co',SUPABASE_KEY='sb_publishable_r3GoKwcOEaXySt7fFOM_0A_rNOc7Mq7';let sb,loading=false;const $=id=>document.getElementById(id);const withTimeout=(p,ms=8000)=>Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo limite excedido.')),ms))]);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function session(){const s=await withTimeout(sb.auth.getSession(),8000);return s.data?.session||null}async function api(method='GET',body){const s=await session();if(!s){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));throw Error('Sessão expirada.')}const opt={method,headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'};if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const r=await withTimeout(fetch('/api/notifications',opt),9000);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Não foi possível atualizar as notificações.');return d}async function load(){if(loading)return;loading=true;$('error').textContent='';try{const d=await api();const n=Array.isArray(d.notifications)?d.notifications:[];const unread=n.filter(x=>!x.read_at).length;$('count').textContent=unread?`${unread} não lida${unread===1?'':'s'} · ${n.length} no total`:`${n.length} notificação${n.length===1?'':'ões'}`;$('list').innerHTML=n.length?n.map(x=>`<article class="notice ${x.read_at?'':'unread'}"><div class="top"><div class="title">${x.read_at?'':'<span class="dot"></span>'}${esc(x.title)}</div><span class="type">${esc(x.type)}</span></div><div class="message">${esc(x.message)}</div><div class="date">${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}${x.read_at?' · Lida':' · Não lida'}</div>${x.read_at?'':'<button class="btn one" type="button" data-id="'+esc(x.id)+'" style="margin-top:10px">Marcar como lida</button>'}</article>`).join(''):'<div class="empty">Você não possui notificações.</div>'}catch(e){console.error(e);$('count').textContent='Não foi possível carregar';$('list').innerHTML='<div class="empty error">Não foi possível carregar as notificações agora.<div><button class="btn retry" type="button" id="retry">Tentar novamente</button></div></div>'}finally{loading=false}}async function readOne(id,button){if(!id||button?.disabled)return;if(button)button.disabled=true;try{await api('PATCH',{id});await load()}catch(e){console.error(e);$('error').textContent=e.message||'Não foi possível atualizar a notificação.';if(button)button.disabled=false}}document.addEventListener('click',e=>{const b=e.target.closest('.one');if(b)readOne(b.dataset.id,b);if(e.target.id==='retry')load()});$('readAll').onclick=async()=>{const b=$('readAll');if(b.disabled)return;b.disabled=true;$('error').textContent='';try{await api('PATCH',{all:true});await load()}catch(e){console.error(e);$('error').textContent=e.message||'Não foi possível atualizar as notificações.'}finally{b.disabled=false}};async function init(){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const s=await session();if(!s)return location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));await load()}catch(e){console.error(e);$('count').textContent='Não foi possível carregar';$('list').innerHTML='<div class="empty error">Sua sessão não pôde ser carregada. Entre novamente e tente outra vez.</div>'}}init();</script><script src="/site-nav.js"></script></body></html>
