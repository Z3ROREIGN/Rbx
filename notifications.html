<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações • BestRobux</title><style>body{margin:0;background:#070708;color:#fff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding-bottom:18px}.btn{background:#151518;color:#fff;border:1px solid #303035;border-radius:9px;padding:10px 14px;cursor:pointer}.list{display:grid;gap:10px;margin-top:20px}.item{padding:18px;background:#111114;border:1px solid #29292e;border-radius:12px}.unread{border-color:#51466d}.muted{color:#888}.error{color:#ff777f}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9b86ff;margin-right:7px}</style></head><body><main class="wrap"><header class="bar"><b>Notificações</b><div><button class="btn" id="all">Marcar todas</button> <a class="btn" href="/">Início</a></div></header><p id="status" class="muted">Conectando...</p><section id="list" class="list"><div class="item">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>(async()=>{const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sb,user,busy=false;const wait=(p,n=7000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite de conexão.')),n))]);async function boot(){await wait(window.bestRobuxAuthReady||Promise.resolve(null));sb=window.bestRobuxSupabase;if(!sb)throw Error('Serviço de conexão indisponível.');let s=await wait(sb.auth.getSession());if(!s.data.session){const r=await wait(sb.auth.refreshSession());s=r.data}if(!s.session)throw Error('Sessão expirada. Faça login novamente.');user=s.session.user;await load();sb.channel('notifications-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>load()).subscribe()}async function load(){if(busy)return;busy=true;try{const r=await wait(sb.from('notifications').select('id,title,message,type,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100));if(r.error)throw r.error;const a=r.data||[],u=a.filter(x=>!x.read_at).length;$('status').textContent=`${u} não lida${u===1?'':'s'} · ${a.length} total`;$('list').innerHTML=a.length?a.map(x=>`<article class="item ${x.read_at?'':'unread'}"><b>${x.read_at?'':'<span class="dot"></span>'}${esc(x.title||'Notificação')}</b><div class="muted">${esc(x.type||'aviso')} · ${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</div><p>${esc(x.message||'')}</p>${x.read_at?'':'<button class="btn mark" data-id="'+esc(x.id)+'">Marcar como lida</button>'}</article>`).join(''):'<div class="item muted">Nenhuma notificação.</div>'}catch(e){$('status').innerHTML='<span class="error">Não foi possível carregar.</span>';$('list').innerHTML='<div class="item error">'+esc(e.message)+'<br><button class="btn" onclick="location.reload()">Tentar novamente</button></div>'}finally{busy=false}}async function mark(id){const r=await wait(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id).is('read_at',null));if(r.error)throw r.error;load()}document.addEventListener('click',async e=>{const b=e.target.closest('.mark');if(!b)return;b.disabled=true;try{await mark(b.dataset.id)}catch(x){$('status').textContent='Não foi possível atualizar a notificação.';b.disabled=false}});$('all').onclick=async()=>{const b=$('all');b.disabled=true;try{const r=await wait(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null));if(r.error)throw r.error;await load()}catch(e){$('status').textContent='Não foi possível atualizar as notificações.'}finally{b.disabled=false}};try{await boot()}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';$('list').innerHTML='<div class="item"><button class="btn" onclick="location.href=\'/login.html\'">Entrar novamente</button></div>'}})()</script></body></html>
