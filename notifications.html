<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f6f7f9;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #252932;padding:12px 0 18px}.brand{color:#fff;text-decoration:none;font-weight:900}.actions{display:flex;gap:8px}.btn{border:1px solid #30343c;background:#15171b;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;text-decoration:none;font-weight:750}.btn:disabled{opacity:.5}.hero{padding:30px 0 10px}.muted{color:#969ca8}.status{margin:10px 0}.list{display:grid;gap:10px;margin-top:18px}.item{padding:18px;background:#111317;border:1px solid #282c34;border-radius:14px}.unread{border-color:#51466d}.title{font-weight:800}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9b86ff;margin-right:7px}.meta{color:#737a85;font-size:11px;margin-top:5px}.message{color:#c1c5cc;line-height:1.55;white-space:pre-wrap;margin:10px 0}.error{color:#ff777f}.empty{text-align:center;padding:45px 20px;color:#858b95;border:1px dashed #30343c;border-radius:14px}</style></head><body><main class="wrap"><header class="bar"><a class="brand" href="/">BestRobux</a><div class="actions"><button class="btn" id="all">Marcar todas</button><a class="btn" href="/">Início</a></div></header><section class="hero"><h1>Notificações</h1><div class="muted">Avisos, atualizações e eventos importantes da sua conta.</div></section><div id="status" class="status muted">Conectando...</div><section id="list" class="list"><div class="empty">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>(async()=>{const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sb,user,busy=false,channel=null;async function boot(){const s=await window.bestRobuxGetSession();if(!s)throw Error('AUTH_REQUIRED');sb=window.bestRobuxSupabase;user=s.user;await load();channel=sb.channel('br-notifications-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>load()).subscribe()}async function load(){if(busy)return;busy=true;$('status').textContent='Atualizando...';try{const r=await Promise.race([sb.from('notifications').select('id,title,message,type,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100),new Promise((_,rej)=>setTimeout(()=>rej(Error('TIMEOUT')),9000))]);if(r.error)throw r.error;const a=r.data||[],u=a.filter(x=>!x.read_at).length;$('status').textContent=`${u} não lida${u===1?'':'s'} · ${a.length} total`;$('list').innerHTML=a.length?a.map(x=>`<article class="item ${x.read_at?'':'unread'}"><div class="title">${x.read_at?'':'<span class="dot"></span>'}${esc(x.title||'Notificação')}</div><div class="meta">${esc(x.type||'Aviso')} · ${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</div><div class="message">${esc(x.message||'')}</div>${x.read_at?'':'<button class="btn mark" data-id="'+esc(x.id)+'">Marcar como lida</button>'}</article>`).join(''):'<div class="empty">Nenhuma notificação no momento.</div>'}catch(e){$('status').innerHTML='<span class="error">Não foi possível carregar as notificações.</span>';$('list').innerHTML='<div class="empty error">'+esc(e.message==='TIMEOUT'?'O servidor demorou para responder.':'Verifique sua conexão.')+'<br><button class="btn" style="margin-top:10px" id="retry">Tentar novamente</button></div>'}finally{busy=false}}async function mark(id){const r=await Promise.race([sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id).is('read_at',null),new Promise((_,rej)=>setTimeout(()=>rej(Error('TIMEOUT')),9000))]);if(r.error)throw r.error;await load()}document.addEventListener('click',async e=>{const b=e.target.closest('.mark');if(b){b.disabled=true;try{await mark(b.dataset.id)}catch{$('status').innerHTML='<span class="error">Não foi possível atualizar a notificação.</span>';b.disabled=false}}if(e.target.closest('#retry'))load()});$('all').onclick=async()=>{const b=$('all');b.disabled=true;try{const r=await Promise.race([sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null),new Promise((_,rej)=>setTimeout(()=>rej(Error('TIMEOUT')),9000))]);if(r.error)throw r.error;await load()}catch{$('status').innerHTML='<span class="error">Não foi possível atualizar as notificações.</span>'}finally{b.disabled=false}};try{await boot()}catch(e){$('status').innerHTML='<span class="error">Sessão expirada. Entre novamente.</span>';$('list').innerHTML='<div class="empty"><a class="btn" href="/login.html">Entrar novamente</a></div>'}})()</script><script src="/site-nav.js"></script></body></html>
