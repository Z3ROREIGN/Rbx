<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Best Robux — Notificações</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.links{display:flex;gap:8px}.btn{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.55;cursor:wait}.hero{padding:34px 0 20px}.muted{color:#85858f;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.list{display:grid;gap:10px;padding-bottom:40px}.notice{background:#0b0b0d;border:1px solid #222229;border-radius:14px;padding:17px}.notice.unread{border-color:#393040;background:#0d0b10}.top{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750}.dot{width:8px;height:8px;background:#8b7cf6;border-radius:50%;display:inline-block;margin-right:7px}.type{font-size:10px;text-transform:uppercase;color:#888}.message{color:#b6b6be;margin-top:8px;line-height:1.6;white-space:pre-wrap}.date{color:#666;font-size:11px;margin-top:10px}.empty{padding:40px;text-align:center;border:1px dashed #292930;border-radius:14px;color:#777}.error{color:#ff8585;margin:10px 0}.retry{margin-top:10px}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux</div><div class="links"><a class="btn" href="/account.html">Minha conta</a><a class="btn" href="/index.html">Início</a></div></nav><section class="hero"><h1>Notificações</h1><div class="muted">Acompanhe avisos da sua conta, pedidos e entregas.</div></section><div class="toolbar"><span id="count" class="muted">Iniciando...</span><button class="btn" id="readAll" type="button">Marcar todas como lidas</button></div><div id="error" class="error"></div><main id="list" class="list"><div class="empty">Carregando notificações...</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__sbFailed=true"></script><script>(async()=>{const $=id=>document.getElementById(id);let sb,loading=false;const race=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite excedido.')),ms))]);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fail(msg){$('count').textContent='Não foi possível carregar';$('list').innerHTML='<div class="empty error">'+esc(msg)+'<br><button class="btn retry" type="button" id="retry">Tentar novamente</button></div>'}async function getSession(){const r=await race(sb.auth.getSession(),6000);if(r.error)throw r.error;if(r.data?.session)return r.data.session;const rr=await race(sb.auth.refreshSession(),6000);if(rr.error)return null;return rr.data?.session||null}async function load(){if(loading)return;loading=true;$('error').textContent='';try{if(!sb)throw Error('Serviço de notificações indisponível.');const s=await getSession();if(!s){location.replace('/login.html?redirect='+encodeURIComponent('/notifications.html'));return}const r=await race(sb.from('notifications').select('id,title,message,type,order_id,read_at,created_at').eq('user_id',s.user.id).order('created_at',{ascending:false}).limit(100),7000);if(r.error)throw r.error;const n=r.data||[],u=n.filter(x=>!x.read_at).length;$('count').textContent=u?`${u} não lida${u===1?'':'s'} · ${n.length} no total`:`${n.length} notificação${n.length===1?'':'ões'}`;$('list').innerHTML=n.length?n.map(x=>`<article class="notice ${x.read_at?'':'unread'}"><div class="top"><div class="title">${x.read_at?'':'<span class="dot"></span>'}${esc(x.title)}</div><span class="type">${esc(x.type)}</span></div><div class="message">${esc(x.message)}</div><div class="date">${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}${x.read_at?' · Lida':' · Não lida'}</div>${x.read_at?'':'<button class="btn one" type="button" data-id="'+esc(x.id)+'" style="margin-top:10px">Marcar como lida</button>'}</article>`).join(''):'<div class="empty">Você não possui notificações.</div>'}catch(e){console.error(e);fail(e.message||'Não foi possível carregar as notificações.')}finally{loading=false}}async function mark(id,b){if(!id||b?.disabled)return;if(b)b.disabled=true;try{const s=await getSession();if(!s)throw Error('Sessão expirada.');const r=await race(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',s.user.id).is('read_at',null),7000);if(r.error)throw r.error;await load()}catch(e){$('error').textContent='Não foi possível atualizar a notificação. Tente novamente.';if(b)b.disabled=false}}$('readAll').onclick=async()=>{const b=$('readAll');if(b.disabled)return;b.disabled=true;try{const s=await getSession();if(!s)throw Error('Sessão expirada.');const r=await race(sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',s.user.id).is('read_at',null),7000);if(r.error)throw r.error;await load()}catch(e){$('error').textContent='Não foi possível atualizar as notificações. Tente novamente.'}finally{b.disabled=false}};document.addEventListener('click',e=>{const b=e.target.closest('.one');if(b)mark(b.dataset.id,b);if(e.target.id==='retry')load()});async function init(){try{if(window.__sbFailed||!window.supabase)throw Error('Biblioteca de autenticação não carregou.');const cr=await race(fetch('/api/config',{cache:'no-store'}),6000);const c=await cr.json();if(!cr.ok||!c.supabaseUrl||!c.supabaseAnonKey)throw Error('Configuração indisponível.');sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});await load()}catch(e){console.error(e);fail(e.message||'Serviço indisponível.')}}init()})();</script><script src="/site-nav.js"></script></body></html>
