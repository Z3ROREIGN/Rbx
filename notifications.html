<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Best Robux — Notificações</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.links{display:flex;gap:8px}.btn{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;text-decoration:none}.hero{padding:34px 0 20px}.muted{color:#85858f;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0}.list{display:grid;gap:10px;padding-bottom:40px}.notice{background:#0b0b0d;border:1px solid #222229;border-radius:14px;padding:17px;transition:.15s}.notice.unread{border-color:#393040;background:#0d0b10}.top{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750}.dot{width:8px;height:8px;background:#8b7cf6;border-radius:50%;display:inline-block;margin-right:7px}.type{font-size:10px;text-transform:uppercase;color:#888}.message{color:#b6b6be;margin-top:8px;line-height:1.6;white-space:pre-wrap}.date{color:#666;font-size:11px;margin-top:10px}.empty{padding:40px;text-align:center;border:1px dashed #292930;border-radius:14px;color:#777}.error{color:#ff8585;margin:10px 0}@media(max-width:600px){.links a:first-child{display:none}}</style></head><body><div class="wrap"><nav class="nav"><div class="brand">Best Robux</div><div class="links"><a class="btn" href="/account.html">Minha conta</a><a class="btn" href="/index.html">Início</a></div></nav><section class="hero"><h1>Notificações</h1><div class="muted">Acompanhe avisos da sua conta, pedidos e entregas.</div></section><div class="toolbar"><span id="count" class="muted">Carregando...</span><button class="btn" id="readAll">Marcar todas como lidas</button></div><div id="error" class="error"></div><main id="list" class="list"></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){try{const c=await(await fetch('/api/config',{cache:'no-store'})).json();sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='/login.html';await load()}catch(e){$('error').textContent=e.message||'Não foi possível carregar.'}}async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='/login.html';const r=await fetch('/api/notifications',{headers:{Authorization:'Bearer '+s.access_token},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível carregar as notificações.');const n=d.notifications||[];const unread=n.filter(x=>!x.read_at).length;$('count').textContent=unread?`${unread} não lida${unread===1?'':'s'} · ${n.length} no total`:`${n.length} notificação${n.length===1?'':'ões'}`;$('list').innerHTML=n.length?n.map(x=>`<article class="notice ${x.read_at?'':'unread'}" data-id="${esc(x.id)}"><div class="top"><div class="title">${x.read_at?'':'<span class="dot"></span>'}${esc(x.title)}</div><span class="type">${esc(x.type)}</span></div><div class="message">${esc(x.message)}</div><div class="date">${new Date(x.created_at).toLocaleString('pt-BR')}${x.read_at?' · Lida':' · Não lida'}</div>${x.read_at?'':'<button class="btn" style="margin-top:10px" onclick="readOne(\''+esc(x.id)+'\')">Marcar como lida</button>'}</article>`).join(''):'<div class="empty">Você não possui notificações.</div>'}async function readOne(id){const s=(await sb.auth.getSession()).data.session;await fetch('/api/notifications',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({id})});await load()}$('readAll').onclick=async()=>{const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/notifications',{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();for(const n of (d.notifications||[]).filter(x=>!x.read_at))await fetch('/api/notifications',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({id:n.id})});await load()};init();setInterval(()=>load().catch(()=>{}),30000)</script></body></html>
