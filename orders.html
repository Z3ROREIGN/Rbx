<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Meus pedidos — Best Robux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f6;font:14px Inter,system-ui,sans-serif}.wrap{width:min(940px,calc(100% - 24px));margin:auto;padding:22px 0 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.brand{font-weight:900;font-size:20px}.back,.action{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #30353b;border-radius:6px;background:#151719;color:#fff;text-decoration:none;font-weight:750}.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero h1{font-size:30px;margin:0 0 5px}.muted{color:#858c94}.list{margin-top:20px}.card{background:#121416;border:1px solid #292e34;border-radius:7px;padding:17px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.title{font-weight:850}.sub{font-size:12px;color:#777f88;margin-top:5px}.amount{font-size:20px;font-weight:900}.badge{display:inline-block;border:1px solid #384049;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:800}.empty{padding:45px 20px;text-align:center;background:#101214;border:1px dashed #30353b;border-radius:7px;color:#7d858e}.error{color:#ff9292}.note{margin-top:10px;padding:10px;background:#181a1d;border-left:2px solid #d9333f;color:#c4c8cc}@media(max-width:560px){.top{align-items:flex-start}.row{align-items:flex-start;flex-direction:column}.amount{font-size:18px}.hero h1{font-size:26px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/account.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Conta</a><span class="brand">Best Robux</span><a class="action" href="/support.html">Suporte</a></div><section class="hero"><h1>Meus pedidos</h1><p class="muted">Acompanhe compras, pagamentos e entregas da sua conta.</p></section><section id="list" class="list"><div class="empty">Carregando pedidos...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());if(!c.supabaseUrl||!c.supabaseAnonKey)throw Error('Configuração indisponível.');sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session)return location.replace('/login.html?redirect='+encodeURIComponent('/orders.html'));await load(session.user.id);sb.channel('orders-live-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'user_id=eq.'+session.user.id},()=>load(session.user.id)).subscribe()}catch(e){$('list').innerHTML='<div class="empty error">Não foi possível carregar seus pedidos.</div>'}}async function load(uid){const {data,error}=await sb.from('orders').select('id,robux,method,amount,roblox_username,status,created_at,updated_at,delivery_note,delivered_at').eq('user_id',uid).order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty error">Não foi possível carregar seus pedidos.</div>';return}if(!data?.length){$('list').innerHTML='<div class="empty">Você ainda não possui pedidos.</div>';return}$('list').innerHTML=data.map(o=>'<article class="card"><div class="row"><div><div class="title">'+esc(Number(o.robux||0).toLocaleString('pt-BR'))+' Robux · '+esc(o.method)+'</div><div class="sub">Pedido #'+esc(String(o.id).slice(0,8))+' · '+new Date(o.created_at).toLocaleString('pt-BR')+'</div></div><div class="amount">'+money(o.amount)+'</div></div><div class="row" style="margin-top:14px"><span class="sub">Roblox: '+esc(o.roblox_username)+'</span><span class="badge">'+esc(o.status)+'</span></div>'+(o.delivery_note?'<div class="note">'+esc(o.delivery_note)+'</div>':'')+'</article>').join('')}boot()</script><script src="/site-nav.js"></script></body></html>
