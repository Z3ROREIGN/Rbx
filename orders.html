<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:16px;margin:10px 0}.muted{color:#888}.status{font-weight:800}.empty{text-align:center;padding:50px;color:#888}a{color:#fff;text-decoration:none}</style></head><body><main class="wrap"><a href="/">‹ Voltar</a><h1>📦 Meus pedidos</h1><div id="list">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/orders.html');await load(session.user.id);sb.channel('orders-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'user_id=eq.'+session.user.id},()=>load(session.user.id)).subscribe()}async function load(uid){const {data,error}=await sb.from('orders').select('id,robux,method,amount,roblox_username,status,created_at,updated_at,delivery_note,delivered_at').eq('user_id',uid).order('created_at',{ascending:false});if(error)return list.innerHTML='<div class="card">'+error.message+'</div>';if(!data?.length)return list.innerHTML='<div class="empty">Você ainda não possui pedidos.</div>';list.innerHTML=data.map(o=>`<article class="card"><b>${o.robux} Robux — ${o.method}</b><div class="muted">Pedido ${o.id.slice(0,8)} · ${new Date(o.created_at).toLocaleString('pt-BR')}</div><p>Roblox: ${o.roblox_username}</p><div class="status">${o.status}</div>${o.delivery_note?'<p>'+o.delivery_note+'</p>':''}</article>`).join('')}boot()</script><script src="/site-nav.js"></script></body></html>
