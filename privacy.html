<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacidade</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:720px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:20px;margin:10px 0}label{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #222}select{background:#111115;color:#fff;border:1px solid #303039;padding:9px;border-radius:8px}button{margin-top:18px;padding:11px 15px;border-radius:9px;border:1px solid #303039;background:#fff;color:#000;font-weight:700;cursor:pointer}.muted{color:#888}#msg{min-height:20px}.ok{color:#8fe0ad}.err{color:#ff8585}</style></head><body><main class="wrap"><a href="/settings.html" style="color:#fff">‹ Voltar</a><h1>🔒 Privacidade</h1><p class="muted">Controle o que outros membros podem ver e como podem interagir com você.</p><div class="card"><label>Quem pode enviar mensagens<select id="messages"><option value="everyone">Todos</option><option value="following">Quem eu sigo</option><option value="nobody">Ninguém</option></select></label><label>Mostrar status online<input id="online" type="checkbox"></label><label>Mostrar perfil publicamente<input id="profile" type="checkbox"></label><label>Mostrar seguidores<input id="followers" type="checkbox"></label><button id="save">Salvar configurações</button><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id);async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/privacy.html');const {data,error}=await sb.rpc('get_privacy_settings');if(error)throw error;const p=Array.isArray(data)?data[0]:data;if(p){$('messages').value=p.allow_messages||'everyone';$('online').checked=p.show_online!==false;$('profile').checked=p.show_profile!==false;$('followers').checked=p.show_followers!==false}else{$('messages').value='everyone';$('online').checked=true;$('profile').checked=true;$('followers').checked=true}}catch(e){$('msg').className='err';$('msg').textContent='Não foi possível carregar: '+e.message}}$('save').onclick=async()=>{const b=$('save');b.disabled=true;b.textContent='Salvando...';try{const allow=$('messages').value;const {data,error}=await sb.rpc('update_privacy_settings',{p_allow_messages:allow,p_show_online:$('online').checked,p_show_profile:$('profile').checked,p_show_followers:$('followers').checked});if(error)throw error;const p=Array.isArray(data)?data[0]:data;if(p&&p.allow_messages!==allow)throw Error('A configuração não foi confirmada pelo banco.');$('msg').className='ok';$('msg').textContent='✓ Configurações salvas.'}catch(e){$('msg').className='err';$('msg').textContent='Não foi possível salvar: '+e.message}finally{b.disabled=false;b.textContent='Salvar configurações'}};boot()</script><script src="/site-nav.js"></script></body></html>
