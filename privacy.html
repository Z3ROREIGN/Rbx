<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacidade</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:700px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:20px;margin:10px 0}label{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #222}.row{display:flex;gap:10px;align-items:center}select{background:#111115;color:#fff;border:1px solid #303039;padding:9px;border-radius:8px}button{padding:11px 15px;border-radius:9px;border:1px solid #303039;background:#fff;color:#000;font-weight:700;cursor:pointer}</style></head><body><main class="wrap"><a href="/settings.html" style="color:#fff">‹ Voltar</a><h1>🔒 Privacidade</h1><div class="card"><label>Quem pode enviar mensagens<select id="messages"><option value="everyone">Todos</option><option value="following">Quem eu sigo</option><option value="nobody">Ninguém</option></select></label><label>Mostrar status online<input id="online" type="checkbox"></label><label>Mostrar perfil publicamente<input id="profile" type="checkbox"></label><label>Mostrar seguidores<input id="followers" type="checkbox"></label><button id="save">Salvar configurações</button><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,uid;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/privacy.html');uid=session.user.id;let {data}=await sb.from('privacy_settings').select('*').eq('user_id',uid).maybeSingle();if(!data){await sb.from('privacy_settings').insert({user_id:uid});data={allow_messages:'everyone',show_online:true,show_profile:true,show_followers:true}}messages.value=data.allow_messages;online.checked=data.show_online;profile.checked=data.show_profile;followers.checked=data.show_followers}save.onclick=async()=>{save.disabled=true;const {error}=await sb.from('privacy_settings').upsert({user_id:uid,allow_messages:messages.value,show_online:online.checked,show_profile:profile.checked,show_followers:followers.checked,updated_at:new Date().toISOString()});save.disabled=false;msg.textContent=error?error.message:'✓ Privacidade atualizada.'}boot()</script><script src="/site-nav.js"></script></body></html>
