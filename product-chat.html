<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0b"><title>Produtos • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 16px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0 18px;border-bottom:1px solid #25292d}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand i{font-style:normal;color:#e3343f}.back{color:#aeb5bc;text-decoration:none}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-top:18px}.card{background:#121416;border:1px solid #282d32;border-radius:14px;overflow:hidden}.orders{min-height:620px}.orders-head{padding:17px;border-bottom:1px solid #282d32}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.tab{height:38px;border:1px solid #30353a;border-radius:8px;background:#191c1f;color:#aeb5bc;font-weight:800;cursor:pointer}.tab.active{background:#e3343f;border-color:#e3343f;color:#fff}.list{max-height:680px;overflow:auto}.order{padding:15px;border-bottom:1px solid #252a2f;cursor:pointer}.order:hover,.order.active{background:#1a1e22}.order-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;margin-top:7px;padding:4px 7px;border-radius:999px;background:#242a2f;color:#aeb5bc;font-size:10px;font-weight:900}.chat{display:flex;flex-direction:column;min-height:620px}.chat-head{display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid #282d32}.thumb{width:52px;height:52px;border-radius:9px;background:#0b0d0f;overflow:hidden;display:grid;place-items:center;color:#666}.thumb img{width:100%;height:100%;object-fit:cover}.head-info{min-width:0}.head-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{flex:1;min-height:420px;padding:18px;overflow:auto;background:radial-gradient(circle at 50% 0,#171a1d55,transparent 55%)}.empty{text-align:center;color:#777f87;padding:60px 20px}.msg{max-width:min(75%,520px);padding:10px 13px;border-radius:12px;background:#20252a;margin:8px 0;line-height:1.45;word-break:break-word}.mine{margin-left:auto;background:#5b1f25;border:1px solid #783039}.time{font-size:10px;color:#818991;margin-top:5px}.confirm{margin:0 18px 10px;padding:12px;border-radius:9px;background:#173a27;border:1px solid #356d49;color:#d9ffe5;cursor:pointer;font-weight:900}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #282d32}.composer input{flex:1;min-width:0;height:45px;padding:0 13px;border-radius:9px;border:1px solid #353b41;background:#0c0f11;color:#fff;outline:0}.composer input:focus{border-color:#e3343f}.btn{height:45px;padding:0 17px;border-radius:9px;border:1px solid #e3343f;background:#e3343f;color:#fff;font-weight:900;cursor:pointer}.status{padding:10px 16px;background:#0e1012;color:#8e969e;font-size:12px}.error{color:#ff7b82}@media(max-width:820px){.layout{grid-template-columns:1fr}.orders{min-height:0}.list{max-height:280px}.chat{min-height:600px}.messages{min-height:420px}.wrap{padding:14px 12px 45px}.top{align-items:flex-start}.back{font-size:13px}}@media(max-width:470px){.composer{padding:9px}.composer .btn{padding:0 12px}.msg{max-width:88%}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><a class="back" href="/marketplace.html">← Voltar</a></header><div class="layout"><aside class="card orders"><div class="orders-head"><b>Pedidos</b><div class="tabs"><button id="bought" class="tab active" onclick="setMode('bought')">Comprados</button><button id="sold" class="tab" onclick="setMode('sold')">Vendidos</button></div></div><div id="orders" class="list"><div class="empty">Carregando pedidos…</div></div></aside><section class="card chat"><div id="head" class="chat-head"><div class="thumb">—</div><div class="head-info"><div class="head-title">Selecione um pedido</div><div class="muted">Seu chat de produtos aparecerá aqui.</div></div></div><div id="messages" class="messages"><div class="empty">Selecione uma compra ou venda para abrir o chat.</div></div><button id="confirm" class="confirm" style="display:none" onclick="confirmOrder()">✓ Confirmar que a entrega foi concluída</button><div id="status" class="status">Os chats são vinculados ao pedido e ficam disponíveis somente para comprador e vendedor.</div><form id="composer" class="composer" onsubmit="send();return false"><input id="text" maxlength="4000" autocomplete="off" placeholder="Escreva uma mensagem…" disabled><button class="btn" type="submit">Enviar</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,user,orders=[],selected=null,mode='bought';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const escAttr=s=>esc(s).replace(/`/g,'&#96;');async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sua sessão expirou. Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível concluir a ação.');return d}async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});user=(await sb.auth.getUser()).data.user;if(!user){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){setListError(e.message)}}async function load(){try{const d=await api({action:'orders'});orders=Array.isArray(d.orders)?d.orders:[];renderList()}catch(e){setListError(e.message)}}function setMode(m){mode=m;document.querySelector('#bought').classList.toggle('active',m==='bought');document.querySelector('#sold').classList.toggle('active',m==='sold');selected=null;document.querySelector('#messages').innerHTML='<div class="empty">Selecione um pedido para abrir o chat.</div>';document.querySelector('#text').disabled=true;renderList()}function renderList(){const arr=orders.filter(o=>mode==='bought'?o.buyer_id===user.id:o.seller_id===user.id);document.querySelector('#orders').innerHTML=arr.length?arr.map(o=>`<div class="order ${selected?.id===o.id?'active':''}" onclick="openOrder('${escAttr(o.id)}')"><div class="order-title">${esc(o.marketplace_products?.title||'Produto')}</div><span class="muted">R$ ${Number(o.subtotal||0).toFixed(2).replace('.',',')} • ${Number(o.quantity||1)} unidade(s)</span><br><span class="badge">${esc(o.status||'PENDING')}</span></div>`).join(''):'<div class="empty">Nenhum pedido nesta seção.</div>'}async function openOrder(id){try{const local=orders.find(o=>o.id===id);if(!local)return;selected=local;renderList();const p=selected.marketplace_products||{};document.querySelector('#head').innerHTML='<div class="thumb">'+(p.image_url?'<img src="'+escAttr(p.image_url)+'" alt="">':'—')+'</div><div class="head-info"><div class="head-title">'+esc(p.title||'Produto')+'</div><div class="muted">'+esc(selected.status||'')+' • '+Number(selected.quantity||1)+' unidade(s)</div></div>';const d=await api({action:'messages',orderId:id});document.querySelector('#messages').innerHTML=(d.messages||[]).length?(d.messages||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleString('pt-BR')}</div></div>`).join(''):'<div class="empty">Nenhuma mensagem ainda. Envie a primeira.</div>';const box=document.querySelector('#messages');box.scrollTop=box.scrollHeight;document.querySelector('#text').disabled=false;document.querySelector('#confirm').style.display=['PAID','DELIVERING','BUYER_CONFIRMED','SELLER_CONFIRMED'].includes(selected.status)?'block':'none'}catch(e){document.querySelector('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}async function send(){if(!selected)return;const t=document.querySelector('#text'),body=t.value.trim();if(!body)return;t.disabled=true;try{await api({action:'message',orderId:selected.id,body});t.value='';await openOrder(selected.id)}catch(e){document.querySelector('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{t.disabled=false}}async function confirmOrder(){if(!selected||!confirm('Confirma que a entrega foi concluída?'))return;try{await api({action:'confirm',orderId:selected.id});await load();const latest=orders.find(o=>o.id===selected.id);if(latest){selected=latest;await openOrder(latest.id)}}catch(e){document.querySelector('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}function setListError(m){document.querySelector('#orders').innerHTML='<div class="empty error">'+esc(m)+'</div>'}boot();</script><script src="/site-nav.js"></script></body></html>
