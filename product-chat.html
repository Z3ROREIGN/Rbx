<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos comprados e vendidos • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 5%}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.card{background:#151719;border:1px solid #292e33;border-radius:8px;overflow:hidden}.orders{max-height:75vh;overflow:auto}.order{padding:16px;border-bottom:1px solid #292e33;cursor:pointer}.order:hover{background:#1b1e21}.chat{display:flex;flex-direction:column;min-height:70vh}.messages{flex:1;padding:20px;overflow:auto}.msg{max-width:75%;padding:10px 13px;border-radius:8px;background:#202428;margin:8px 0}.mine{margin-left:auto;background:#5b1f25;border:1px solid #783039}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #292e33}.composer input{flex:1;padding:13px;border-radius:6px;border:1px solid #353a40;background:#0d0f11;color:#fff}.btn{padding:12px 15px;border-radius:6px;border:1px solid #ff4b55;background:#e3343f;color:#fff;font-weight:800;cursor:pointer}.confirm{margin:12px 20px;padding:14px;border-radius:6px;background:#173a27;border:1px solid #356d49;color:#d9ffe5;cursor:pointer}.muted{color:#929aa3}.back{color:#ff5962;text-decoration:none;font-weight:700}@media(max-width:800px){.layout{grid-template-columns:1fr}.orders{max-height:35vh}.chat{min-height:55vh}.wrap{padding:25px 4%}}</style></head><body><main class="wrap"><a class="back" href="/marketplace.html">← Marketplace</a><h1>Produtos comprados e vendidos</h1><p class="muted">Converse somente sobre pedidos em andamento. Após a conclusão, a conversa é arquivada para auditoria administrativa.</p><div class="layout"><div class="card orders" id="orders">Carregando pedidos...</div><div class="card chat"><div id="head" style="padding:18px;border-bottom:1px solid #292e33">Selecione um pedido</div><div class="messages" id="messages"></div><button class="confirm" id="confirm" style="display:none" onclick="confirmOrder()">✓ Confirmar que a entrega foi concluída</button><div class="composer"><input id="text" placeholder="Escreva para a outra parte..."><button class="btn" onclick="send()">Enviar</button></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,orders=[],selected,user;async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});user=(await sb.auth.getUser()).data.user;if(!user){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){document.querySelector('#orders').textContent=e.message}}async function load(){const d=await api({action:'orders'});orders=Array.isArray(d.orders)?d.orders:[];document.querySelector('#orders').innerHTML=orders.length?orders.map(o=>`<div class="order" onclick="openOrder('${escAttr(o.id)}')"><b>${esc(o.marketplace_products?.title||'Produto')}</b><br><span class="muted">R$ ${Number(o.subtotal).toFixed(2).replace('.',',')} • ${esc(o.status)}</span></div>`).join(''):'Nenhum pedido.'}async function openOrder(id){selected=orders.find(o=>o.id===id);if(!selected)return;document.querySelector('#head').innerHTML='<b>'+esc(selected.marketplace_products?.title||'Produto')+'</b><br><span class="muted">'+esc(selected.status)+'</span>';const d=await api({action:'messages',orderId:id});document.querySelector('#messages').innerHTML=(d.messages||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div class="muted" style="font-size:11px;margin-top:4px">${new Date(m.created_at).toLocaleString('pt-BR')}</div></div>`).join('');document.querySelector('#confirm').style.display=['PAID','DELIVERING','BUYER_CONFIRMED','SELLER_CONFIRMED'].includes(selected.status)?'block':'none'}async function send(){if(!selected)return;const t=document.querySelector('#text');if(!t.value.trim())return;await api({action:'message',orderId:selected.id,body:t.value.trim()});t.value='';await openOrder(selected.id)}async function confirmOrder(){if(!selected||!confirm('Confirma que a entrega foi concluída?'))return;await api({action:'confirm',orderId:selected.id});await load();await openOrder(selected.id)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}boot()</script><script src="/site-nav.js"></script></body></html>
