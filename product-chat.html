<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f5f6f7;font-family:system-ui,Arial}.wrap{max-width:1150px;margin:auto;padding:20px 14px}.top{display:flex;justify-content:space-between;padding:12px 0 18px;border-bottom:1px solid #292d32}.brand{color:#fff;text-decoration:none;font-weight:900}.brand i{color:#e3343f;font-style:normal}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:18px}.card{background:#121416;border:1px solid #292d32;border-radius:14px;overflow:hidden}.head{padding:16px;border-bottom:1px solid #292d32}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.tab,.refresh,.send{border:1px solid #343a40;background:#191c20;color:#fff;border-radius:8px;height:40px;font-weight:800}.tab.active,.send{background:#e3343f;border-color:#e3343f}.refresh{padding:0 10px;margin-left:auto}.orders{min-height:620px}.list{max-height:680px;overflow:auto}.order{padding:14px;border-bottom:1px solid #252a2f;cursor:pointer}.order.active,.order:hover{background:#1a1e22}.muted{color:#8d959d;font-size:12px}.badge{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:99px;background:#252a2f;font-size:10px}.chat{min-height:620px;display:flex;flex-direction:column}.chathead{display:flex;gap:12px;padding:14px;border-bottom:1px solid #292d32}.thumb{width:52px;height:52px;background:#0b0d0f;border-radius:8px;overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.messages{flex:1;min-height:430px;padding:18px;overflow:auto}.empty{text-align:center;color:#777f87;padding:60px 15px}.msg{max-width:75%;margin:7px 0;padding:10px 12px;border-radius:12px;background:#20252a;word-break:break-word}.mine{margin-left:auto;background:#5b1f25}.time{font-size:10px;color:#818991;margin-top:5px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #292d32}.composer input{flex:1;height:44px;border:1px solid #353b41;border-radius:8px;background:#0c0f11;color:#fff;padding:0 12px}.status{padding:11px 14px;background:#0e1012;color:#9299a1;font-size:12px}.warn{color:#ffd27a}.error{color:#ff7b82}.ok{color:#7be0a1}@media(max-width:800px){.layout{grid-template-columns:1fr}.orders{min-height:0}.list{max-height:280px}.chat{min-height:600px}.msg{max-width:88%}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/marketplace.html">BestRobux <i>Marketplace</i></a><a href="/marketplace.html" class="muted">Voltar</a></header><div class="layout"><aside class="card orders"><div class="head"><div style="display:flex;align-items:center"><b>Pedidos</b><button class="refresh" onclick="load()">Atualizar</button></div><div class="tabs"><button id="b" class="tab active" onclick="mode='bought';reset()">Comprados</button><button id="s" class="tab" onclick="mode='sold';reset()">Vendidos</button></div></div><div id="list" class="list"><div class="empty">Carregando…</div></div></aside><section class="card chat"><div id="chathead" class="chathead"><div class="thumb">—</div><div><b>Chat de produtos</b><div class="muted">O chat aparece somente após o pagamento.</div></div></div><div id="messages" class="messages"><div class="empty">Selecione um pedido pago para abrir a conversa.</div></div><div id="status" class="status">🔒 O chat é liberado somente quando o pagamento estiver confirmado.</div><form class="composer" onsubmit="send();return false"><input id="text" disabled maxlength="4000" placeholder="Escreva uma mensagem…"><button class="send" type="submit">Enviar</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,user,orders=[],selected=null,mode='bought';const paid=['PAID','DELIVERING','BUYER_CONFIRMED','SELLER_CONFIRMED'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function token(){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Sessão expirada.');return s.access_token}async function api(action,extra={}){const t=await token(),r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({action,...extra}),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro.');return d}async function boot(){try{const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});user=(await sb.auth.getUser()).data.user;if(!user)return location.href='/login.html';await load();setInterval(()=>load(true),7000)}catch(e){document.querySelector('#list').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}async function load(silent=false){try{const d=await api('orders');orders=d.orders||[];render();if(selected){const f=orders.find(o=>o.id===selected.id);if(f&&f.status!==selected.status){selected=f;openOrder(f.id)}}}catch(e){if(!silent)document.querySelector('#list').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}function reset(){selected=null;document.querySelector('#b').classList.toggle('active',mode==='bought');document.querySelector('#s').classList.toggle('active',mode==='sold');document.querySelector('#messages').innerHTML='<div class="empty">Selecione um pedido pago para abrir a conversa.</div>';document.querySelector('#text').disabled=true;document.querySelector('#status').innerHTML='🔒 O chat é liberado somente quando o pagamento estiver confirmado.';render()}function render(){const a=orders.filter(o=>mode==='bought'?o.buyer_id===user.id:o.seller_id===user.id);document.querySelector('#list').innerHTML=a.length?a.map(o=>{const can=paid.includes(String(o.status||'').toUpperCase());return `<div class="order ${selected?.id===o.id?'active':''}" onclick="openOrder('${esc(o.id)}')"><b>${esc(o.marketplace_products?.title||'Produto')}</b><div class="muted">${Number(o.quantity||1)} unidade(s) • R$ ${Number(o.subtotal||0).toFixed(2).replace('.',',')}</div><span class="badge">${esc(o.status)}</span>${!can?'<div class="muted" style="margin-top:5px">🔒 Chat indisponível até pagamento</div>':''}</div>`}).join(''):'<div class="empty">Nenhum pedido.</div>'}async function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;selected=o;render();const p=o.marketplace_products||{};document.querySelector('#chathead').innerHTML='<div class="thumb">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'—')+'</div><div><b>'+esc(p.title||'Produto')+'</b><div class="muted">'+esc(o.status)+' • '+o.quantity+' unidade(s)</div></div>';const state=String(o.status||'').toUpperCase();if(!paid.includes(state)){document.querySelector('#messages').innerHTML='<div class="empty"><div class="warn">🔒 Chat bloqueado</div><br>O bate-papo não aparece enquanto o pagamento estiver pendente.<br><br>Assim que o PIX for confirmado, o chat será liberado automaticamente.</div>';document.querySelector('#status').innerHTML='<span class="warn">🔒 Pagamento ainda não confirmado.</span>';document.querySelector('#text').disabled=true;return}try{const d=await api('messages',{orderId:id});document.querySelector('#messages').innerHTML=(d.messages||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleString('pt-BR')}</div></div>`).join('')||'<div class="empty">Nenhuma mensagem ainda.</div>';document.querySelector('#text').disabled=false;document.querySelector('#status').innerHTML='<span class="ok">✓ Pagamento confirmado. Chat liberado.</span>';const box=document.querySelector('#messages');box.scrollTop=box.scrollHeight}catch(e){document.querySelector('#messages').innerHTML='<div class="empty error">'+esc(e.message)+'</div>';document.querySelector('#text').disabled=true}}async function send(){if(!selected||!paid.includes(String(selected.status||'').toUpperCase()))return;const x=document.querySelector('#text'),body=x.value.trim();if(!body)return;x.disabled=true;try{await api('message',{orderId:selected.id,body});x.value='';await openOrder(selected.id)}catch(e){document.querySelector('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{x.disabled=false}}boot()</script></body></html>
