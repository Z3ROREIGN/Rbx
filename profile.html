<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Perfil</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.panel{background:#0d0d10;border:1px solid #292930;border-radius:18px;padding:22px}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:18px}.field{margin:14px 0}.field label{display:block;color:#999;margin-bottom:6px;font-size:12px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;background:#101014;border:1px solid #303039;color:#fff}.field textarea{min-height:110px;resize:vertical}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#17171c}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:12px}.ok{color:#8fe0ad}.err{color:#ff8585}</style></head><body><main class="wrap"><a class="back" href="/settings.html">← Voltar</a><div class="panel"><h1>Editar perfil</h1><img id="avatar" class="avatar" alt="Foto"><div class="field"><label>Nome de exibição</label><input id="displayName" maxlength="60"></div><div class="field"><label>Usuário Roblox</label><input id="roblox" maxlength="30"></div><div class="field"><label>Foto do perfil (URL)</label><input id="avatarUrl" type="url" maxlength="500"></div><div class="field"><label>Biografia</label><textarea id="bio" maxlength="300"></textarea></div><button id="save" class="btn">Salvar alterações</button><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id);function avatar(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}async function main(){try{const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Configuração do banco indisponível');sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session)return location.replace('/login.html?redirect=/profile.html');const {data,error}=await sb.from('profiles').select('display_name,username,roblox_username,avatar_url,bio').eq('id',session.user.id).maybeSingle();if(error)throw error;if(data){$('displayName').value=data.display_name||data.username||'';$('roblox').value=data.roblox_username||'';$('avatarUrl').value=data.avatar_url||'';$('bio').value=data.bio||''}$('avatar').src=avatar($('avatarUrl').value)}catch(e){$('msg').className='msg err';$('msg').textContent='Erro ao carregar: '+(e.message||e)}}$('avatarUrl').addEventListener('input',()=>{$('avatar').src=avatar($('avatarUrl').value)});$('save').onclick=async()=>{const btn=$('save'),msg=$('msg');btn.disabled=true;btn.textContent='Salvando...';msg.className='msg';msg.textContent='';try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sua sessão expirou. Entre novamente.');const args={p_display_name:$('displayName').value.trim()||null,p_username:$('displayName').value.trim()||null,p_roblox_username:$('roblox').value.trim()||null,p_avatar_url:avatar($('avatarUrl').value.trim())||null,p_bio:$('bio').value.trim()||null};const {error}=await sb.rpc('update_own_profile',args);if(error)throw error;const check=await sb.from('profiles').select('display_name,username,roblox_username,avatar_url,bio').eq('id',session.user.id).single();if(check.error)throw check.error;if(check.data){$('displayName').value=check.data.display_name||check.data.username||'';$('roblox').value=check.data.roblox_username||'';$('avatarUrl').value=check.data.avatar_url||'';$('bio').value=check.data.bio||'';$('avatar').src=avatar($('avatarUrl').value)}msg.className='msg ok';msg.textContent='✓ Alterações salvas com sucesso.'}catch(e){msg.className='msg err';msg.textContent='Não foi possível salvar: '+(e.message||'erro desconhecido')}finally{btn.disabled=false;btn.textContent='Salvar alterações'}};main();</script><script src="/site-nav.js"></script></body></html>
