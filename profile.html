<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Editar perfil — Best Robux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f6;font:14px Inter,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #30353b;background:#151719;color:#fff;border-radius:6px;text-decoration:none;font-weight:800}.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.panel{background:#121416;border:1px solid #292e34;border-radius:7px;padding:22px}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#191c20;border:1px solid #30353b;display:block;margin-bottom:18px}.field{margin:14px 0}.field label{display:block;color:#8d959d;margin-bottom:6px;font-size:10px;font-weight:900}.field input,.field textarea{width:100%;padding:12px;border-radius:6px;background:#0b0d0f;border:1px solid #30353b;color:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#df3340}.btn{width:100%;padding:12px;border:1px solid #b82732;border-radius:6px;background:#df3340;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:20px;margin-top:12px}.ok{color:#8fe0ad}.err{color:#ff8585}.muted{color:#858c94;font-size:12px}@media(max-width:520px){.panel{padding:16px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/settings.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Configurações</a><b>Best Robux</b></div><section class="panel"><h1>Editar perfil</h1><p class="muted">Atualize as informações que aparecem no seu perfil público.</p><img id="avatar" class="avatar" alt="Foto do perfil"><div class="field"><label>NOME DE EXIBIÇÃO</label><input id="displayName" maxlength="60" placeholder="Como seu nome será mostrado"></div><div class="field"><label>USUÁRIO ROBLOX</label><input id="roblox" maxlength="30" placeholder="Seu usuário Roblox"></div><div class="field"><label>FOTO DO PERFIL</label><input id="avatarUrl" type="url" maxlength="500" placeholder="URL https://..."></div><div class="field"><label>BIOGRAFIA</label><textarea id="bio" maxlength="300" placeholder="Fale um pouco sobre você"></textarea></div><button id="save" class="btn">Salvar alterações</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id),fallback='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2296%22 height=%2296%22 viewBox=%220 0 96 96%22%3E%3Crect width=%2296%22 height=%2296%22 rx=%2248%22 fill=%22%23191c20%22/%3E%3Ccircle cx=%2248%22 cy=%2236%22 r=%2217%22 fill=%22%238b9299%22/%3E%3Cpath d=%22M18 82c5-19 16-28 30-28s25 9 30 28%22 fill=%22%238b9299%22/%3E%3C/svg%3E';function avatar(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:fallback}catch{return fallback}}async function main(){try{const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error();sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session},error:se}=await sb.auth.getSession();if(se)throw se;if(!session)return location.replace('/login.html?redirect=/profile.html');const {data,error}=await sb.from('profiles').select('display_name,username,roblox_username,avatar_url,bio').eq('id',session.user.id).maybeSingle();if(error)throw error;if(data){$('displayName').value=data.display_name||data.username||'';$('roblox').value=data.roblox_username||'';$('avatarUrl').value=data.avatar_url||'';$('bio').value=data.bio||''}$('avatar').src=avatar($('avatarUrl').value)}catch(e){$('msg').className='msg err';$('msg').textContent='Não foi possível carregar o perfil.'}}$('avatarUrl').addEventListener('input',()=>{$('avatar').src=avatar($('avatarUrl').value)});$('save').onclick=async()=>{const btn=$('save'),msg=$('msg');btn.disabled=true;btn.textContent='Salvando...';msg.textContent='';try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error();const {error}=await sb.rpc('update_own_profile',{p_display_name:$('displayName').value.trim()||null,p_username:$('displayName').value.trim()||null,p_roblox_username:$('roblox').value.trim()||null,p_avatar_url:avatar($('avatarUrl').value.trim())===fallback?null:$('avatarUrl').value.trim()||null,p_bio:$('bio').value.trim()||null});if(error)throw error;const check=await sb.from('profiles').select('display_name,username,roblox_username,avatar_url,bio').eq('id',session.user.id).single();if(check.error)throw check.error;$('displayName').value=check.data.display_name||check.data.username||'';$('roblox').value=check.data.roblox_username||'';$('avatarUrl').value=check.data.avatar_url||'';$('bio').value=check.data.bio||'';$('avatar').src=avatar($('avatarUrl').value);msg.className='msg ok';msg.textContent='Alterações salvas com sucesso.'}catch(e){msg.className='msg err';msg.textContent='Não foi possível salvar as alterações.'}finally{btn.disabled=false;btn.textContent='Salvar alterações'}};main()</script><script src="/site-nav.js"></script></body></html>
