<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Perfil</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:72px;border-bottom:1px solid #1b1b20;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.links{display:flex;gap:8px}.links a,.btn{border:1px solid #292930;background:#111115;color:#fff;padding:9px 13px;border-radius:9px;text-decoration:none;cursor:pointer}.hero{padding:32px 0 18px}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#0b0b0d;border:1px solid #222229;border-radius:16px;padding:20px}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#17171c;display:block;margin:4px auto 15px}.preview{text-align:center}.muted{color:#85858f;line-height:1.55}.field{margin-top:15px}.field label{display:block;color:#92929b;font-size:11px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #292930;background:#070708;color:#fff;outline:0}.field textarea{min-height:120px;resize:vertical}.primary{width:100%;margin-top:18px;background:#fff;color:#050505;border:0;font-weight:750}.msg{margin-top:12px;font-size:13px}.ok{color:#8fe0ad}.err{color:#ff8585}@media(max-width:700px){.grid{grid-template-columns:1fr}.links{display:none}}</style></head><body><div class="wrap"><nav class="nav"><b class="brand">Best Robux</b><div class="links"><a href="account.html">Conta</a><a href="chat.html">Mensagens</a><a href="updates.html">Updates</a></div></nav><section class="hero"><h1>Seu perfil</h1><div class="muted">Personalize como outros membros veem você.</div></section><div class="grid"><section class="panel preview"><img id="avatar" class="avatar" alt="Foto do perfil"><b id="previewName">Seu nome</b><p id="previewBio" class="muted">Sua biografia aparecerá aqui.</p></section><section class="panel"><div class="field"><label>NOME DE EXIBIÇÃO</label><input id="displayName" maxlength="40" placeholder="Como você quer ser chamado?"></div><div class="field"><label>FOTO DO PERFIL</label><input id="avatarUrl" maxlength="500" type="url" placeholder="https://..."></div><div class="field"><label>BIOGRAFIA</label><textarea id="bio" maxlength="180" placeholder="Conte um pouco sobre você..."></textarea></div><div class="field"><label>USUÁRIO ROBLOX</label><input id="roblox" maxlength="20" placeholder="Seu usuário Roblox"></div><button id="save" class="btn primary">Salvar alterações</button><div id="msg" class="msg"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client,user;const $=x=>document.getElementById(x);function render(){const n=$('displayName').value.trim()||user?.email?.split('@')[0]||'Usuário';$('previewName').textContent=n;$('previewBio').textContent=$('bio').value.trim()||'Sua biografia aparecerá aqui.';const u=$('avatarUrl').value.trim();$('avatar').src=u||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22 viewBox=%220 0 110 110%22%3E%3Crect width=%22110%22 height=%22110%22 rx=%2255%22 fill=%22%2317171c%22/%3E%3Ccircle cx=%2255%22 cy=%2243%22 r=%2220%22 fill=%22%23888%22/%3E%3Cpath d=%22M20 100c4-25 18-36 35-36s31 11 35 36%22 fill=%22%23888%22/%3E%3C/svg%3E'}$('displayName').oninput=render;$('avatarUrl').oninput=render;$('bio').oninput=render}async function boot(){const c=await(await fetch('/api/config')).json();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(!s.data.session)return location.href='login.html';user=s.data.session.user;const r=await client.from('profiles').select('username,roblox_username,display_name,avatar_url,bio').eq('id',user.id).maybeSingle();if(r.data){$('displayName').value=r.data.display_name||r.data.username||'';$('avatarUrl').value=r.data.avatar_url||'';$('bio').value=r.data.bio||'';$('roblox').value=r.data.roblox_username||''}render()}async function save(){const s=await client.auth.getSession();if(!s.data.session)return location.href='login.html';$('save').disabled=true;$('save').textContent='Salvando...';$('msg').textContent='';const r=await client.from('profiles').update({display_name:$('displayName').value.trim()||null,avatar_url:$('avatarUrl').value.trim()||null,bio:$('bio').value.trim()||null,roblox_username:$('roblox').value.trim()||null,updated_at:new Date().toISOString()}).eq('id',user.id);$('msg').className='msg '+(r.error?'err':'ok');$('msg').textContent=r.error?'Não foi possível salvar as alterações.':'Perfil atualizado.';$('save').disabled=false;$('save').textContent='Salvar alterações';render()}$('save').onclick=save;boot();</script></body></html>
