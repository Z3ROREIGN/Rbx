<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Meu perfil — Best Robux</title><style>:root{--bg:#090a0c;--panel:#121416;--line:#292e34;--text:#f3f4f5;--muted:#90979f;--red:#df3340}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{width:min(820px,calc(100% - 24px));margin:auto;padding:24px 0 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.back,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #30353b;background:#17191c;color:#fff;border-radius:6px;padding:10px 13px;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:var(--red);border-color:#b82732}.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}.preview{background:#0d0f11;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:20px}.banner{height:110px;background:#191c20}.previewBody{padding:16px;display:flex;gap:14px;align-items:center}.avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#191c20;border:4px solid var(--panel);margin-top:-48px}.field{margin:14px 0}.field label{display:block;color:#90979f;margin-bottom:6px;font-size:10px;font-weight:900;letter-spacing:.06em}.field input,.field textarea{width:100%;padding:12px;border-radius:6px;background:#0b0d0f;border:1px solid #30353b;color:#fff;outline:0}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--red)}.btn{width:100%}.msg{min-height:20px;margin-top:12px}.ok{color:#8fe0ad}.err{color:#ff8585}.muted{color:var(--muted);font-size:12px;line-height:1.55}.links{display:flex;gap:8px;margin-top:12px}.links .btn{flex:1}@media(max-width:520px){.wrap{width:calc(100% - 16px);padding-top:16px}.panel{padding:16px}.previewBody{align-items:flex-end}.links{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/account.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Conta</a><span class="muted">Meu perfil</span></div><section class="panel"><h1>Meu perfil</h1><p class="muted">Estas informações aparecem no seu perfil público.</p><div class="preview"><div class="banner" id="banner"></div><div class="previewBody"><img id="avatar" class="avatar" alt=""><div><b id="previewName">Usuário</b><div id="previewUser" class="muted">@usuario</div></div></div></div><div class="field"><label>NOME DE EXIBIÇÃO</label><input id="displayName" maxlength="60" placeholder="Como seu nome será mostrado"></div><div class="field"><label>USUÁRIO</label><input id="username" maxlength="30" placeholder="Seu nome de usuário"></div><div class="field"><label>USUÁRIO ROBLOX</label><input id="roblox" maxlength="30" placeholder="Seu usuário Roblox"></div><div class="field"><label>FOTO DO PERFIL</label><input id="avatarUrl" type="url" maxlength="500" placeholder="https://..."></div><div class="field"><label>BIOGRAFIA</label><textarea id="bio" maxlength="300" placeholder="Fale um pouco sobre você"></textarea></div><button id="save" class="btn primary">Salvar alterações</button><div class="links"><a id="public" class="btn" href="#">Ver perfil público</a><a class="btn" href="/privacy.html">Privacidade</a></div><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,session;const $=id=>document.getElementById(id),fallback='/logo.png';const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:fallback}catch{return fallback}};const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('TIMEOUT')),ms))]);function preview(){const n=$('displayName').value.trim()||$('username').value.trim()||'Usuário',u=$('username').value.trim()||'usuario',$av=safe($('avatarUrl').value.trim());$('previewName').textContent=n;$('previewUser').textContent='@'+u;$('avatar').src=$av}async function boot(){try{const c=await timeout(fetch('/api/config',{cache:'no-store'}).then(r=>r.json()),7000);sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});session=(await timeout(sb.auth.getSession(),7000)).data.session;if(!session)return location.replace('/login.html?redirect=/profile.html');const r=await timeout(sb.from('profiles').select('display_name,username,roblox_username,avatar_url,bio').eq('id',session.user.id).maybeSingle(),7000);if(r.error)throw r.error;if(r.data){$('displayName').value=r.data.display_name||'';$('username').value=r.data.username||'';$('roblox').value=r.data.roblox_username||'';$('avatarUrl').value=r.data.avatar_url||'';$('bio').value=r.data.bio||''}$('public').href='/public-profile.html?id='+encodeURIComponent(session.user.id);preview()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message==='TIMEOUT'?'O carregamento demorou demais. Tente novamente.':'Não foi possível carregar seu perfil.'}}$('avatarUrl').addEventListener('input',preview);$('displayName').addEventListener('input',preview);$('username').addEventListener('input',preview);$('save').onclick=async()=>{const b=$('save');b.disabled=true;b.textContent='Salvando...';$('msg').textContent='';try{const r=await timeout(sb.rpc('update_own_profile',{p_display_name:$('displayName').value.trim()||null,p_username:$('username').value.trim()||null,p_roblox_username:$('roblox').value.trim()||null,p_avatar_url:safe($('avatarUrl').value.trim())===fallback?null:$('avatarUrl').value.trim()||null,p_bio:$('bio').value.trim()||null}),8000);if(r.error)throw r.error;$('msg').className='msg ok';$('msg').textContent='Perfil atualizado com sucesso.';preview()}catch(e){$('msg').className='msg err';$('msg').textContent='Não foi possível salvar o perfil.'}finally{b.disabled=false;b.textContent='Salvar alterações'}};boot()</script><script src="/site-nav.js"></script></body></html>
