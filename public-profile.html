<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:700px;margin:auto;padding:30px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:18px;padding:24px;text-align:center}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#17171b}.muted{color:#888}.btn{padding:11px 16px;border:1px solid #303039;border-radius:10px;background:#17171b;color:#fff;cursor:pointer;margin:4px}.primary{background:#fff;color:#000}</style></head><body><main class="wrap"><a href="/" style="color:#fff">‹ Voltar</a><div id="profile" class="card">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,me;const id=new URLSearchParams(location.search).get('id');async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();me=session?.user?.id;if(!id)return profile.textContent='Perfil não encontrado.';const {data:p,error}=await sb.from('profiles').select('id,username,display_name,avatar_url,bio,created_at').eq('id',id).maybeSingle();if(error||!p)return profile.textContent='Perfil não encontrado.';const {data:privacy}=await sb.from('privacy_settings').select('show_profile,show_followers').eq('user_id',id).maybeSingle();if(privacy?.show_profile===false&&me!==id)return profile.textContent='Este perfil é privado.';const {count}=await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('following_id',id);const {data:f}=me?await sb.from('user_follows').select('follower_id').eq('follower_id',me).eq('following_id',id):{data:[]};profile.innerHTML=`<img class="avatar" src="${p.avatar_url||'/logo.png'}"><h1>${p.display_name||p.username||'Usuário'}</h1><div class="muted">@${p.username||'—'}</div><p>${p.bio||'Sem biografia.'}</p>${privacy?.show_followers!==false?`<p class="muted">${count||0} seguidores</p>`:''}${me&&me!==id?`<button class="btn primary" onclick="follow(${!f?.length})">${f?.length?'Deixar de seguir':'Seguir'}</button><button class="btn" onclick="block()">Bloquear</button>`:''}<button class="btn" onclick="location.href='/chat.html?user=${id}'">💬 Mensagem</button>`}async function follow(add){const q=add?sb.from('user_follows').insert({follower_id:me,following_id:id}):sb.from('user_follows').delete().eq('follower_id',me).eq('following_id',id);const {error}=await q;if(error)alert(error.message);else boot()}async function block(){if(!confirm('Bloquear este usuário?'))return;const {error}=await sb.from('user_blocks').insert({blocker_id:me,blocked_id:id});if(error)alert(error.message);else location.href='/chat.html'}boot()</script><script src="/site-nav.js"></script></body></html>
