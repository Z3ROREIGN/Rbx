<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil público</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:760px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:18px;padding:24px}.head{display:flex;gap:18px;align-items:center}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#17171b}.muted{color:#888}.btn{padding:10px 15px;border:1px solid #303039;border-radius:10px;background:#17171b;color:#fff;cursor:pointer;margin:4px}.primary{background:#fff;color:#000}.stats{display:flex;gap:24px;margin:22px 0}.stat b{display:block;font-size:20px}.search{display:flex;gap:8px;margin:15px 0}.search input{flex:1;background:#111;color:#fff;border:1px solid #303039;border-radius:9px;padding:11px}</style></head><body><main class="wrap"><a href="/" style="color:#fff">‹ Voltar</a><div id="profile" class="card" style="margin-top:15px">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,me;const box=document.getElementById('profile');const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();me=session?.user?.id;if(!id)return box.innerHTML='<h2>Perfil não encontrado</h2>';const {data:p,error}=await sb.from('profiles').select('id,username,display_name,avatar_url,bio,created_at').eq('id',id).maybeSingle();if(error||!p)return box.innerHTML='<h2>Perfil não encontrado</h2>';const {data:privacy}=await sb.from('privacy_settings').select('show_profile,show_followers').eq('user_id',id).maybeSingle();if(privacy?.show_profile===false&&me!==id)return box.innerHTML='<h2>🔒 Perfil privado</h2><p class="muted">Este usuário escolheu não exibir o perfil publicamente.</p>';const {count}=await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('following_id',id);const {count:following}=await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('follower_id',id);let isFollowing=false;if(me&&me!==id){const q=await sb.from('user_follows').select('following_id').eq('follower_id',me).eq('following_id',id).maybeSingle();isFollowing=!!q.data}box.innerHTML=`<div class="head"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><h1>${esc(p.display_name||p.username||'Usuário')}</h1><div class="muted">@${esc(p.username||'—')}</div></div></div><p>${esc(p.bio||'Sem biografia.')}</p><div class="stats">${privacy?.show_followers!==false?`<div class="stat"><b>${count||0}</b><span class="muted">seguidores</span></div>`:''}<div class="stat"><b>${following||0}</b><span class="muted">seguindo</span></div></div>${me&&me!==id?`<button class="btn primary" onclick="toggleFollow()">${isFollowing?'Deixar de seguir':'Seguir'}</button><button class="btn" onclick="blockUser()">Bloquear</button><button class="btn" onclick="location.href='/chat.html?user=${id}'">💬 Mensagem</button>`:''}<div style="margin-top:18px"><button class="btn" onclick="location.href='/reports.html?user=${id}'">🚨 Denunciar</button></div>`}async function toggleFollow(){if(!me)return location.href='/login.html?redirect='+encodeURIComponent(location.href);const q=await sb.from('user_follows').select('following_id').eq('follower_id',me).eq('following_id',id).maybeSingle();let error;if(q.data){({error}=await sb.from('user_follows').delete().eq('follower_id',me).eq('following_id',id))}else{const r=await sb.rpc('follow_user',{p_user_id:id});error=r.error}if(error)alert(error.message);else boot()}async function blockUser(){if(!me)return;if(!confirm('Bloquear este usuário? Ele não poderá iniciar uma conversa com você.'))return;const {error}=await sb.from('user_blocks').insert({blocker_id:me,blocked_id:id});if(error)alert(error.message);else location.href='/'}boot()</script><script src="/site-nav.js"></script></body></html>
