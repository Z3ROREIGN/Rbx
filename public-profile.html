<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Perfil público — Best Robux</title><style>:root{--bg:#090a0c;--panel:#121416;--line:#292e34;--text:#f3f4f5;--muted:#8f969e;--red:#df3340}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{width:min(860px,calc(100% - 24px));margin:auto;padding:28px 0 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.back,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #30353b;background:#17191c;color:#fff;border-radius:6px;padding:10px 13px;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:var(--red);border-color:#b82732}.danger{color:#ff9aa2;background:#281114;border-color:#61242b}.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.banner{height:170px;background:#17191c center/cover no-repeat}.body{padding:22px}.head{display:flex;gap:16px;align-items:center;margin-top:-62px}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#1a1d20;border:5px solid var(--panel)}h1{margin:0 0 4px;font-size:28px;letter-spacing:-.03em}.username,.muted{color:var(--muted)}.bio{margin:18px 0;line-height:1.7;color:#c1c6cb}.stats{display:flex;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:18px 0}.stat{min-width:110px}.stat b{display:block;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{display:inline-flex;align-items:center;gap:7px;color:#aeb5bc;font-size:11px;margin-top:7px}.dot{width:7px;height:7px;border-radius:50%;background:#5b636b}.dot.online{background:#45c77b}.notice{padding:20px;text-align:center}.notice h2{margin:0 0 7px}.loading{min-height:340px;display:grid;place-items:center;color:#8f969e}.error{color:#ff9aa2}.meta{margin-top:18px;color:#747c85;font-size:11px}@media(max-width:560px){.wrap{width:calc(100% - 16px);padding-top:16px}.banner{height:125px}.body{padding:16px}.head{margin-top:-48px;align-items:flex-end}.avatar{width:84px;height:84px}.head h1{font-size:22px}.stats{gap:20px}.stat{min-width:0}.actions .btn{flex:1}.actions .btn:last-child{flex-basis:100%}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← Voltar</a><span class="muted">Perfil público</span></div><section id="profile" class="card"><div class="loading">Carregando perfil...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,me,profile,privacy,isFollowing=false;const box=document.getElementById('profile'),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));const avatar=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'/logo.png'}catch{return '/logo.png'}};const wait=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('TIMEOUT')),ms))]);function message(text){location.href='/chat.html?user='+encodeURIComponent(id)}async function boot(){try{const cfg=await wait(fetch('/api/config',{cache:'no-store'}).then(r=>r.json()),7000);if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error();sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const session=(await wait(sb.auth.getSession(),7000)).data.session;me=session?.user?.id||null;if(!id){box.innerHTML='<div class="notice"><h2>Perfil não encontrado</h2><p class="muted">O usuário informado não existe.</p></div>';return}const p=await wait(sb.from('profiles').select('id,username,display_name,avatar_url,bio,created_at').eq('id',id).maybeSingle(),7000);if(p.error||!p.data)throw Error('NOT_FOUND');profile=p.data;const pr=await wait(sb.from('privacy_settings').select('show_profile,show_followers').eq('user_id',id).maybeSingle(),5000);privacy=pr.data||{};if(privacy.show_profile===false&&me!==id){box.innerHTML='<div class="notice"><h2>Perfil privado</h2><p class="muted">Este usuário optou por não exibir o perfil publicamente.</p></div>';return}let followers=0,following=0;if(privacy.show_followers!==false){const r=await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('following_id',id);followers=r.count||0}const f=await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('follower_id',id);following=f.count||0;if(me&&me!==id){const q=await sb.from('user_follows').select('following_id').eq('follower_id',me).eq('following_id',id).maybeSingle();isFollowing=!!q.data}render(followers,following)}catch(e){box.innerHTML='<div class="notice"><h2>Não foi possível carregar</h2><p class="muted">O perfil demorou para responder. Tente novamente.</p><button class="btn primary" onclick="location.reload()">Tentar novamente</button></div>'}}function render(followers,following){const name=profile.display_name||profile.username||'Usuário';box.innerHTML=`<div class="banner" id="banner"></div><div class="body"><div class="head"><img class="avatar" src="${esc(avatar(profile.avatar_url))}" onerror="this.src='/logo.png'" alt=""><div><h1>${esc(name)}</h1><div class="username">@${esc(profile.username||'usuario')}</div><div class="status"><span class="dot" id="dot"></span><span id="statusText">Offline</span></div></div></div><div class="bio">${esc(profile.bio||'Este usuário ainda não adicionou uma biografia.')}</div><div class="stats">${privacy.show_followers!==false?`<div class="stat"><b>${followers}</b><span class="muted">Seguidores</span></div>`:''}<div class="stat"><b>${following}</b><span class="muted">Seguindo</span></div></div>${me&&me!==id?`<div class="actions"><button class="btn primary" id="followBtn" onclick="toggleFollow()">${isFollowing?'Deixar de seguir':'Seguir'}</button><button class="btn" onclick="message()">Mensagem</button><button class="btn danger" onclick="blockUser()">Bloquear</button><a class="btn" href="/reports.html?user=${encodeURIComponent(id)}">Denunciar</a></div>`:''}<div class="meta">Membro desde ${profile.created_at?new Date(profile.created_at).toLocaleDateString('pt-BR'):'—'}</div></div>`;loadOnline()}async function loadOnline(){try{const r=await sb.from('profiles').select('last_seen').eq('id',id).maybeSingle();const online=r.data?.last_seen&&Date.now()-new Date(r.data.last_seen).getTime()<120000;document.getElementById('dot').classList.toggle('online',!!online);document.getElementById('statusText').textContent=online?'Online agora':'Offline'}catch{}}async function toggleFollow(){if(!me)return location.href='/login.html?redirect='+encodeURIComponent(location.href);const btn=document.getElementById('followBtn');btn.disabled=true;try{if(isFollowing){const r=await sb.from('user_follows').delete().eq('follower_id',me).eq('following_id',id);if(r.error)throw r.error;isFollowing=false}else{const r=await sb.rpc('follow_user',{p_user_id:id});if(r.error)throw r.error;isFollowing=true}btn.textContent=isFollowing?'Deixar de seguir':'Seguir'}catch(e){alert('Não foi possível alterar o seguimento.')}finally{btn.disabled=false}}async function blockUser(){if(!me)return location.href='/login.html?redirect='+encodeURIComponent(location.href);if(!confirm('Bloquear este usuário?'))return;const r=await sb.from('user_blocks').upsert({blocker_id:me,blocked_id:id},{onConflict:'blocker_id,blocked_id'});if(r.error)alert('Não foi possível bloquear este usuário.');else location.href='/'}boot()</script><script src="/site-nav.js"></script></body></html>
