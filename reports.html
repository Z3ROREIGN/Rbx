<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denunciar — Best Robux</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:700px;margin:40px auto;padding:16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:18px;padding:22px}label{display:block;margin:15px 0 6px;color:#aaa}select,textarea,input{width:100%;box-sizing:border-box;background:#111115;color:#fff;border:1px solid #303039;border-radius:10px;padding:12px}textarea{min-height:130px}button,a{display:inline-block;margin-top:16px;padding:12px 16px;border-radius:10px;border:1px solid #303039;background:#17171b;color:#fff;text-decoration:none;cursor:pointer}button{background:#fff;color:#000;font-weight:700}.msg{margin-top:12px}.ok{color:#8fe0ad}.err{color:#ff8585}</style></head><body><div class="wrap"><a href="/account.html">← Voltar</a><div class="card"><h1>🚨 Denunciar</h1><p style="color:#999">Envie uma denúncia para a equipe de moderação. Não compartilhe senhas ou dados sensíveis.</p><label>Usuário denunciado</label><input id="user" maxlength="60" placeholder="Nome ou usuário"><label>Categoria</label><select id="category"><option value="harassment">Assédio ou ofensas</option><option value="scam">Golpe ou fraude</option><option value="spam">Spam</option><option value="sexual_content">Conteúdo impróprio</option><option value="impersonation">Falsificação de identidade</option><option value="hate">Discurso de ódio</option><option value="privacy">Violação de privacidade</option><option value="other">Outro</option></select><label>Descrição</label><textarea id="description" maxlength="1000" placeholder="Explique o que aconteceu..."></textarea><button id="send">Enviar denúncia</button><div id="msg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=x=>document.getElementById(x);async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Configuração indisponível');return d});sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/reports.html')}catch(e){$('msg').className='msg err';$('msg').textContent='Não foi possível iniciar: '+e.message}}boot();$('send').onclick=async()=>{const target=$('user').value.trim(),description=$('description').value.trim();if(!target||description.length<5){$('msg').className='msg err';$('msg').textContent='Preencha o usuário e uma descrição com pelo menos 5 caracteres.';return}const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/reports.html');$('send').disabled=true;$('send').textContent='Enviando...';const {data:profile,error:pError}=await sb.from('profiles').select('id').or('username.eq.'+target+',display_name.eq.'+target+',roblox_username.eq.'+target).limit(1).maybeSingle();let error;if(pError)error=pError;else{const r=await sb.rpc('create_report',{p_reported_user_id:profile?.id||null,p_message_id:null,p_conversation_id:null,p_category:$('category').value,p_description:description});error=r.error}$('send').disabled=false;$('send').textContent='Enviar denúncia';if(error){$('msg').className='msg err';$('msg').textContent='Não foi possível enviar: '+error.message}else{$('msg').className='msg ok';$('msg').textContent='✓ Denúncia enviada para análise.';$('description').value='';$('user').value=''}};</script><script src="/site-nav.js"></script></body></html>
