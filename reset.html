<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Best Robux — Nova senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font:14px Inter,system-ui}.box{width:min(410px,calc(100% - 30px));padding:26px;background:#0b0b0d;border:1px solid #24242a;border-radius:15px}.muted{color:#85858f;line-height:1.6}label{display:block;color:#888;font-size:11px;margin:15px 0 7px}input{width:100%;height:43px;background:#060607;border:1px solid #292930;border-radius:8px;color:#fff;padding:0 11px}.btn{width:100%;height:43px;margin-top:18px;border:0;border-radius:8px;background:#fff;color:#050505;font-weight:750}.msg{margin-top:12px;font-size:12px;color:#aaa}.error{color:#ff8585}.success{color:#7ed4a0}</style></head><body><main class="box"><h2>Nova senha</h2><p class="muted">Escolha uma nova senha para sua conta.</p><form id="form"><label>NOVA SENHA</label><input id="password" type="password" minlength="8" required><label>CONFIRMAR SENHA</label><input id="confirm" type="password" minlength="8" required><button class="btn">Salvar senha</button></form><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let client;async function boot(){const c=await(await fetch('/api/config')).json();client=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const s=await client.auth.getSession();if(!s.data.session)msg.textContent='Link de recuperação inválido ou expirado.'}boot();form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value)return msg.className='msg error',msg.textContent='As senhas não coincidem.';const {error}=await client.auth.updateUser({password:password.value});if(error){msg.className='msg error';msg.textContent=error.message;return}msg.className='msg success';msg.textContent='Senha alterada com sucesso.';setTimeout(()=>location.href='account.html',900)}</script></body></html>
