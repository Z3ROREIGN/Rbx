<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segurança da conta</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:700px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:18px;margin:10px 0}button{padding:11px 15px;border-radius:9px;border:1px solid #303039;background:#17171b;color:#fff;cursor:pointer}.danger{color:#ff8b8b}</style></head><body><main class="wrap"><a href="/settings.html" style="color:#fff">‹ Voltar</a><h1>🔐 Segurança da conta</h1><div class="card"><h3>Sessão atual</h3><p id="session">Verificando...</p></div><div class="card"><h3>Atividade de segurança</h3><div id="events">Carregando...</div></div><div class="card"><h3>Ações</h3><button onclick="reset()">Enviar link para redefinir senha</button><button class="danger" onclick="signout()">Encerrar sessão</button><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,user;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/security.html');user=session.user;sessionEl.textContent='Sessão ativa · '+(user.email||'conta protegida');const {data}=await sb.from('security_events').select('event_type,metadata,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);events.innerHTML=data?.length?data.map(x=>`<p>${x.event_type}<br><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></p>`).join(''):'Nenhuma atividade registrada.'}async function reset(){const {error}=await sb.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+'/settings.html'});msg.textContent=error?error.message:'Link de redefinição enviado.'}async function signout(){await sb.auth.signOut();location.href='/'}boot()</script><script src="/site-nav.js"></script></body></html>
