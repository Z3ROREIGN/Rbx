<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central do vendedor • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:35px 5%}.card{background:#151719;border:1px solid #292e33;border-radius:8px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.product{padding:14px 0;border-bottom:1px solid #292e33}.actions{display:flex;gap:8px;margin-top:10px}.small{padding:9px 12px;border-radius:6px;border:1px solid #ff4b55;background:#e3343f;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#25292d;border-color:#444}.danger{background:#9f1f28}.stock{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #292e33}input,textarea,select{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #353a40;background:#0d0f11;color:#fff;border-radius:6px}.btn{padding:12px 16px;border-radius:6px;border:1px solid #ff4b55;background:#e3343f;color:#fff;font-weight:800;cursor:pointer;width:100%}.notice{padding:12px;border-radius:7px;background:#0d0f11;border:1px solid #292e33;margin-top:10px}.muted{color:#929aa3}.back{color:#ff5962;text-decoration:none;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:25px 4%}.actions{flex-direction:column}}</style></head><body><main class="wrap"><a class="back" href="/marketplace.html">← Marketplace</a><h1>Central do vendedor</h1><p class="muted">Gerencie seus produtos, estoque e vendas.</p><div class="grid"><section class="card"><h2>Novo produto</h2><form id="f"><input id="title" placeholder="Nome do produto" required><textarea id="description" placeholder="Descrição" rows="4"></textarea><select id="category"><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select><input id="price" type="number" step="0.01" min="0.01" placeholder="Preço (R$)" required><input id="quantity" type="number" min="0" placeholder="Quantidade"><input id="imageUrl" placeholder="URL da imagem (opcional)"><select id="deliveryType"><option value="CHAT">Entrega pelo chat</option><option value="DIGITAL">Produto digital — adicionar contas agora</option></select><div id="digitalBox" style="display:none"><label>Contas/itens do estoque <span class="muted">(uma conta por linha)</span></label><textarea id="digitalItems" rows="7" placeholder="usuario1:senha1\nusuario2:senha2\nusuario3:senha3"></textarea><div class="notice">Para publicar um produto digital é obrigatório adicionar as contas agora. Depois você poderá repor e gerenciar o estoque.</div></div><button class="btn" type="submit">Publicar produto</button></form><p id="msg" class="muted"></p></section><section class="card"><h2>Meus produtos</h2><div id="products" class="muted">Carregando...</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,editing=null;const endpoint='/api/marketplace';async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login novamente.');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){const d=await api({action:'my-products'}),p=Array.isArray(d.products)?d.products:[];document.querySelector('#products').innerHTML=p.length?p.map(x=>`<div class="product"><b>${esc(x.title)}</b><br>R$ ${Number(x.price).toFixed(2).replace('.',',')} • ${x.quantity} unidade(s) • ${x.delivery_type==='DIGITAL'?'Digital':'Chat'} • ${x.active?'Ativo':'Inativo'}<div class="actions"><button class="small secondary" onclick="editProduct('${x.id}')">Editar</button><button class="small danger" onclick="deleteProduct('${x.id}')">Excluir</button>${x.delivery_type==='DIGITAL'?`<button class="small secondary" onclick="toggleStock('${x.id}')">Gerenciar estoque</button>`:''}</div>${x.delivery_type==='DIGITAL'?`<div id="stock-${x.id}" class="stock"><b>Repor estoque digital</b><textarea id="items-${x.id}" rows="6" placeholder="Uma conta por linha"></textarea><button class="btn" onclick="addStock('${x.id}')">Adicionar ao estoque</button><div id="stockmsg-${x.id}" class="notice">Você pode repor o estoque quando quiser.</div></div>`:''}</div>`).join(''):'Você ainda não publicou produtos.'}window.toggleStock=id=>{const e=document.getElementById('stock-'+id);e.style.display=e.style.display==='block'?'none':'block'};window.addStock=async id=>{const ta=document.getElementById('items-'+id),msg=document.getElementById('stockmsg-'+id),items=ta.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(!items.length){msg.textContent='Adicione pelo menos uma conta.';return}try{const d=await api({action:'add-digital-stock',productId:id,items});ta.value='';msg.textContent=d.added+' conta(s) adicionada(s).';await load()}catch(e){msg.textContent=e.message}};window.editProduct=async id=>{const d=await api({action:'my-products'}),x=(d.products||[]).find(v=>v.id===id);if(!x)return;document.querySelector('#title').value=x.title;document.querySelector('#description').value=x.description||'';document.querySelector('#category').value=x.category||'Outros';document.querySelector('#price').value=x.price;document.querySelector('#quantity').value=x.quantity;document.querySelector('#imageUrl').value=x.image_url||'';document.querySelector('#deliveryType').value=x.delivery_type||'CHAT';editing=id;document.querySelector('#f button').textContent='Salvar alterações';document.querySelector('#digitalBox').style.display=x.delivery_type==='DIGITAL'?'block':'none';window.scrollTo({top:0,behavior:'smooth'})};window.deleteProduct=async id=>{if(!confirm('Tem certeza que deseja excluir este produto?'))return;try{await api({action:'delete-product',productId:id});document.querySelector('#msg').textContent='Produto excluído.';await load()}catch(e){document.querySelector('#msg').textContent=e.message}};document.querySelector('#deliveryType').addEventListener('change',()=>{document.querySelector('#digitalBox').style.display=document.querySelector('#deliveryType').value==='DIGITAL'?'block':'none'});document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{const digital=document.querySelector('#deliveryType').value==='DIGITAL',items=document.querySelector('#digitalItems').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(digital&&!editing&&!items.length)throw Error('Para criar um produto digital, adicione pelo menos uma conta ao estoque.');const data={title:document.querySelector('#title').value,description:document.querySelector('#description').value,category:document.querySelector('#category').value,price:document.querySelector('#price').value,quantity:digital?(items.length||document.querySelector('#quantity').value):document.querySelector('#quantity').value,imageUrl:document.querySelector('#imageUrl').value,deliveryType:document.querySelector('#deliveryType').value};if(editing){data.action='update-product';data.productId=editing;await api(data);document.querySelector('#msg').textContent='Produto atualizado com sucesso.';editing=null;btn.textContent='Publicar produto'}else{data.action='create-product';const r=await api(data);if(digital&&r.product?.id)await api({action:'add-digital-stock',productId:r.product.id,items});document.querySelector('#msg').textContent='Produto publicado com sucesso.'}e.currentTarget.reset();document.querySelector('#digitalBox').style.display='none';await load()}catch(x){document.querySelector('#msg').textContent=x.message}finally{btn.disabled=false}});async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});if(!(await sb.auth.getUser()).data.user){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){document.querySelector('#products').textContent=e.message}}boot()</script><script src="/site-nav.js"></script></body></html>
