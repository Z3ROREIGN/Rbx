<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central do vendedor • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Inter,system-ui}.wrap{max-width:1000px;margin:auto;padding:35px 5%}.card{background:#0d1a2b;border:1px solid #253a55;border-radius:20px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,textarea,select{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #2a405e;background:#081321;color:#fff;border-radius:10px}.btn{padding:12px 16px;border-radius:11px;border:1px solid #8175ff;background:#6d5dfc;color:#fff;font-weight:800;cursor:pointer}.muted{color:#9db0c8}.product{padding:14px 0;border-bottom:1px solid #20324b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/marketplace.html">← Marketplace</a><h1>Central do vendedor</h1><div class="grid"><section class="card"><h2>Novo produto</h2><form id="f"><input id="title" placeholder="Nome do produto" required><textarea id="description" placeholder="Descrição" rows="4"></textarea><select id="category"><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select><input id="price" type="number" step="0.01" min="0.01" placeholder="Preço (R$)" required><input id="quantity" type="number" min="1" placeholder="Quantidade em estoque" required><input id="imageUrl" placeholder="URL da imagem (opcional)"><select id="deliveryType"><option value="CHAT">Entrega pelo chat</option><option value="DIGITAL">Entrega digital</option></select><button class="btn">Publicar produto</button></form><p id="msg"></p></section><section class="card"><h2>Meus produtos</h2><div id="products" class="muted">Carregando...</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);if(!(await sb.auth.getUser()).data.user)location.href='/login.html';load()}async function api(body){const t=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{const d=await api({action:'my-products'});document.querySelector('#products').innerHTML=d.products.length?d.products.map(p=>`<div class="product"><b>${p.title}</b><br>R$ ${Number(p.price).toFixed(2)} • ${p.quantity} unidade(s) • ${p.active?'Ativo':'Inativo'}</div>`).join(''):'Você ainda não publicou produtos.'}catch(e){document.querySelector('#products').textContent=e.message}}document.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await api({action:'create-product',title:title.value,description:description.value,category:category.value,price:price.value,quantity:quantity.value,imageUrl:imageUrl.value,deliveryType:deliveryType.value});document.querySelector('#msg').textContent='Produto publicado com sucesso.';e.target.reset();load()}catch(x){document.querySelector('#msg').textContent=x.message}}boot()</script><script src="/site-nav.js"></script></body></html>
