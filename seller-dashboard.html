<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central do vendedor • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:35px 5%}.card{background:#151719;border:1px solid #292e33;border-radius:8px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,textarea,select{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #353a40;background:#0d0f11;color:#fff;border-radius:6px}input:focus,textarea:focus,select:focus{outline:1px solid #e3343f;border-color:#e3343f}.btn{padding:12px 16px;border-radius:6px;border:1px solid #ff4b55;background:#e3343f;color:#fff;font-weight:800;cursor:pointer;width:100%}.btn:hover{background:#f0444d}.muted{color:#929aa3}.product{padding:14px 0;border-bottom:1px solid #292e33}.back{color:#ff5962;text-decoration:none;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:25px 4%}}</style></head><body><main class="wrap"><a class="back" href="/marketplace.html">← Marketplace</a><h1>Central do vendedor</h1><p class="muted">Gerencie seus produtos, estoque e vendas.</p><div class="grid"><section class="card"><h2>Novo produto</h2><form id="f"><input id="title" placeholder="Nome do produto" required><textarea id="description" placeholder="Descrição" rows="4"></textarea><select id="category"><option>Roblox</option><option>Games</option><option>Contas</option><option>Itens</option><option>Outros</option></select><input id="price" type="number" step="0.01" min="0.01" placeholder="Preço (R$)" required><input id="quantity" type="number" min="1" placeholder="Quantidade em estoque" required><input id="imageUrl" placeholder="URL da imagem (opcional)"><select id="deliveryType"><option value="CHAT">Entrega pelo chat</option><option value="DIGITAL">Entrega digital</option></select><button class="btn" type="submit">Publicar produto</button></form><p id="msg" class="muted"></p></section><section class="card"><h2>Meus produtos</h2><div id="products" class="muted">Carregando...</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});if(!(await sb.auth.getUser()).data.user){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return}await load()}catch(e){document.querySelector('#products').textContent=e.message}}async function load(){const d=await api({action:'my-products'});const p=Array.isArray(d.products)?d.products:[];document.querySelector('#products').innerHTML=p.length?p.map(x=>`<div class="product"><b>${esc(x.title)}</b><br>R$ ${Number(x.price).toFixed(2).replace('.',',')} • ${x.quantity} unidade(s) • ${x.active?'Ativo':'Inativo'}</div>`).join(''):'Você ainda não publicou produtos.'}document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api({action:'create-product',title:document.querySelector('#title').value,description:document.querySelector('#description').value,category:document.querySelector('#category').value,price:document.querySelector('#price').value,quantity:document.querySelector('#quantity').value,imageUrl:document.querySelector('#imageUrl').value,deliveryType:document.querySelector('#deliveryType').value});document.querySelector('#msg').textContent='Produto publicado com sucesso.';e.currentTarget.reset();await load()}catch(x){document.querySelector('#msg').textContent=x.message}finally{b.disabled=false}});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot()</script><script src="/site-nav.js"></script></body></html>
