<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quero vender • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:34px 24px 110px}.panel{background:#151516;border:1px solid #29292b;border-radius:12px;padding:30px;box-shadow:0 12px 35px #0006}.eyebrow{color:#ff454d;font-size:12px;font-weight:800;letter-spacing:.12em}.muted{color:#96969b;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #363638;background:#0f0f10;color:#fff;border-radius:8px;outline:none}input:focus{border-color:#e9363f;box-shadow:0 0 0 3px #e9363f18}.btn{width:100%;padding:14px;border:0;border-radius:8px;background:#e62d38;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.back{display:inline-block;margin-bottom:18px;color:#ff4b54;text-decoration:none;font-weight:700}.status{margin-top:18px;padding:14px;background:#1b1b1d;border:1px solid #303034;border-left:3px solid #e62d38;border-radius:8px}.status.ok{border-left-color:#36b37e}.notice{padding:14px;border-radius:8px;background:#111112;border:1px solid #29292b;margin-bottom:20px}@media(max-width:680px){.wrap{padding:20px 14px 100px}.panel{padding:20px;border-radius:10px}.grid{grid-template-columns:1fr}h1{font-size:27px}.btn{min-height:48px}} </style></head><body><main class="wrap"><a class="back" href="/marketplace.html">← Voltar ao Marketplace</a><section class="panel"><div class="eyebrow">BESTROBUX • MARKETPLACE</div><h1>Quero vender</h1><p class="muted">Cadastre-se como vendedor para publicar produtos e acompanhar suas vendas. Sua solicitação será analisada pela equipe.</p><div class="notice"><b>Antes de enviar</b><br><span class="muted">Confira seus dados. Depois da aprovação, a Central do vendedor ficará disponível na sua conta.</span></div><form id="sellerForm"><div class="grid"><div class="field"><label for="sellerName">Nome completo</label><input id="sellerName" autocomplete="name" required></div><div class="field"><label for="sellerBirth">Data de nascimento</label><input id="sellerBirth" type="date" required></div><div class="field"><label for="sellerCpf">CPF</label><input id="sellerCpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></div><div class="field"><label for="sellerPhone">Telefone</label><input id="sellerPhone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" required></div><div class="field" style="grid-column:1/-1"><label for="sellerEmail">E-mail da conta</label><input id="sellerEmail" type="email" readonly></div></div><button id="submitSeller" class="btn" type="submit">Enviar solicitação</button></form><div id="sellerStatus"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function getSession(){const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/login.html?redirect='+encodeURIComponent('/seller-register.html'));return null}return s}async function api(body){const s=await getSession();if(!s)throw Error('Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível concluir a operação.');return d}async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});const u=(await sb.auth.getUser()).data.user;if(!u){location.replace('/login.html?redirect='+encodeURIComponent('/seller-register.html'));return}document.querySelector('#sellerEmail').value=u.email||'';const d=await api({action:'seller-status'});if(d.application){document.querySelector('#sellerStatus').innerHTML='<div class="status '+(d.application.status==='APPROVED'?'ok':'')+'">Status: <b>'+escapeHtml(d.application.status)+'</b>'+(d.application.rejection_reason?' — '+escapeHtml(d.application.rejection_reason):'')+'</div>';if(d.application.status==='PENDING'||d.application.status==='APPROVED')document.querySelector('#submitSeller').disabled=true}}catch(e){document.querySelector('#sellerStatus').innerHTML='<div class="status">'+escapeHtml(e.message)+'</div>'}}document.querySelector('#sellerForm').addEventListener('submit',async e=>{e.preventDefault();const b={action:'apply-seller',fullName:document.querySelector('#sellerName').value.trim(),birthDate:document.querySelector('#sellerBirth').value,cpf:document.querySelector('#sellerCpf').value.trim(),email:document.querySelector('#sellerEmail').value,phone:document.querySelector('#sellerPhone').value.trim()};const btn=document.querySelector('#submitSeller');btn.disabled=true;try{await api(b);document.querySelector('#sellerStatus').innerHTML='<div class="status ok">Solicitação enviada com sucesso. Aguarde a análise da equipe.</div>'}catch(x){btn.disabled=false;document.querySelector('#sellerStatus').innerHTML='<div class="status">'+escapeHtml(x.message)+'</div>'}});function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot()</script><script src="/site-nav.js"></script></body></html>
