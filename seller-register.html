<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torne-se vendedor • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Inter,system-ui}.wrap{max-width:720px;margin:50px auto;padding:24px}.card{background:#0d1a2b;border:1px solid #253a55;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0004}input{width:100%;padding:14px;margin:7px 0 14px;border:1px solid #2a405e;background:#081321;color:#fff;border-radius:11px}.btn{padding:13px 18px;border-radius:12px;border:1px solid #8175ff;background:#6d5dfc;color:#fff;font-weight:800;cursor:pointer;width:100%}.muted{color:#9db0c8}.status{margin-top:18px;padding:14px;border-radius:12px;background:#12243b}</style></head><body><main class="wrap"><a href="/marketplace.html">← Voltar ao Marketplace</a><div class="card"><p class="muted">BESTROBUX MARKETPLACE</p><h1>Quero vender</h1><p class="muted">Preencha seus dados. A equipe administrativa analisará sua solicitação antes de liberar as vendas.</p><form id="f"><label>Nome completo</label><input id="name" required><label>Data de nascimento</label><input id="birth" type="date" required><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14" required><label>E-mail</label><input id="email" type="email" required><label>Telefone</label><input id="phone" inputmode="tel" required><button class="btn">Enviar solicitação</button></form><div id="status"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const {data}=await sb.auth.getUser();if(!data.user){location.href='/login.html?redirect=/seller-register.html';return}document.querySelector('#email').value=data.user.email||'';const t=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({action:'seller-status'})});const d=await r.json();if(d.application)document.querySelector('#status').innerHTML='<div class="status">Status: <b>'+d.application.status+'</b>'+(d.application.rejection_reason?' — '+d.application.rejection_reason:'')+'</div>'}document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const t=(await sb.auth.getSession()).data.session?.access_token;const b={action:'apply-seller',fullName:name.value,birthDate:birth.value,cpf:cpf.value,email:email.value,phone:phone.value};const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(b)});const d=await r.json();document.querySelector('#status').innerHTML='<div class="status">'+(d.error||'Solicitação enviada. Aguarde a análise da equipe.')+'</div>'};boot()</script><script src="/site-nav.js"></script></body></html>
