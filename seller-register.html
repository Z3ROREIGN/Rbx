<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quero vender • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:50px auto;padding:24px}.card{background:#141414;border:1px solid #2b2b2b;border-radius:14px;padding:28px;box-shadow:0 20px 60px #0008}input{width:100%;padding:14px;margin:7px 0 14px;border:1px solid #333;background:#0d0d0d;color:#fff;border-radius:9px}.btn{padding:13px 18px;border-radius:9px;border:1px solid #ff3333;background:#e51f2b;color:#fff;font-weight:800;cursor:pointer;width:100%}.muted{color:#aaa}.status{margin-top:18px;padding:14px;border-radius:10px;background:#1b1b1b;border-left:3px solid #e51f2b}a{color:#ff4a52}</style></head><body><main class="wrap"><a href="/marketplace.html">← Voltar ao Marketplace</a><div class="card"><p class="muted">BESTROBUX MARKETPLACE</p><h1>Quero vender</h1><p class="muted">Preencha seus dados. A equipe analisará sua solicitação antes de liberar as vendas.</p><form id="sellerForm"><label>Nome completo</label><input id="sellerName" required><label>Data de nascimento</label><input id="sellerBirth" type="date" required><label>CPF</label><input id="sellerCpf" inputmode="numeric" maxlength="14" required><label>E-mail</label><input id="sellerEmail" type="email" required readonly><label>Telefone</label><input id="sellerPhone" inputmode="tel" required><button class="btn" type="submit">Enviar solicitação</button></form><div id="sellerStatus"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function api(body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro na solicitação.');return d}async function boot(){try{const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const u=(await sb.auth.getUser()).data.user;if(!u){location.href='/login.html?redirect='+encodeURIComponent('/seller-register.html');return}document.querySelector('#sellerEmail').value=u.email||'';const d=await api({action:'seller-status'});if(d.application)document.querySelector('#sellerStatus').innerHTML='<div class="status">Status: <b>'+d.application.status+'</b>'+(d.application.rejection_reason?' — '+d.application.rejection_reason:'')+'</div>'}catch(e){document.querySelector('#sellerStatus').innerHTML='<div class="status">'+e.message+'</div>'}}document.querySelector('#sellerForm').addEventListener('submit',async e=>{e.preventDefault();const b={action:'apply-seller',fullName:document.querySelector('#sellerName').value,birthDate:document.querySelector('#sellerBirth').value,cpf:document.querySelector('#sellerCpf').value,email:document.querySelector('#sellerEmail').value,phone:document.querySelector('#sellerPhone').value};try{await api(b);document.querySelector('#sellerStatus').innerHTML='<div class="status">Solicitação enviada com sucesso. Aguarde a análise da equipe.</div>';e.target.querySelector('button').disabled=true}catch(x){document.querySelector('#sellerStatus').innerHTML='<div class="status">'+x.message+'</div>'}});boot()</script><script src="/site-nav.js"></script></body></html>
