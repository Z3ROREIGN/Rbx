<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:850px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:18px;margin:10px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #303039;background:#111115;color:#fff;margin-top:7px}textarea{min-height:100px}button{background:#fff;color:#000;font-weight:800;cursor:pointer}.muted{color:#888}.ticket{cursor:pointer}.msg{padding:9px;background:#17171b;border-radius:10px;margin:7px 0}</style></head><body><main class="wrap"><a href="/" style="color:#fff">‹ Voltar</a><h1>🛟 Central de suporte</h1><section class="card"><h3>Novo chamado</h3><input id="subject" maxlength="120" placeholder="Assunto"><select id="category"><option value="order">Pedido</option><option value="payment">Pagamento</option><option value="account">Conta</option><option value="delivery">Entrega</option><option value="technical">Problema técnico</option><option value="other">Outro</option></select><textarea id="body" maxlength="3000" placeholder="Explique seu problema"></textarea><button id="create">Abrir chamado</button><div id="msg"></div></section><div id="tickets">Carregando...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,uid;const $=x=>document.getElementById(x);async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/support.html');uid=session.user.id;await load();sb.channel('support-live').on('postgres_changes',{event:'*',schema:'public',table:'support_tickets',filter:'user_id=eq.'+uid},load).subscribe()}async function load(){const {data,error}=await sb.from('support_tickets').select('*').eq('user_id',uid).order('created_at',{ascending:false});if(error)return $('tickets').textContent=error.message;$('tickets').innerHTML='<h2>Meus chamados</h2>'+(data?.length?data.map(t=>`<article class="card ticket"><b>${t.subject}</b><div class="muted">${t.category} · ${new Date(t.created_at).toLocaleString('pt-BR')}</div><div>${t.status}</div></article>`).join(''):'<div class="card muted">Nenhum chamado aberto.</div>')}$('create').onclick=async()=>{const subject=$('subject').value.trim(),body=$('body').value.trim();if(subject.length<3||body.length<5)return $('msg').textContent='Preencha assunto e descrição.';$('create').disabled=true;const {data,error}=await sb.from('support_tickets').insert({user_id:uid,subject,category:$('category').value}).select('id').single();if(!error){const r=await sb.from('support_messages').insert({ticket_id:data.id,sender_id:uid,body});if(r.error)error=r.error}$('create').disabled=false;if(error)$('msg').textContent=error.message;else{$('msg').textContent='Chamado aberto.';$('subject').value='';$('body').value='';load()}};boot()</script><script src="/site-nav.js"></script></body></html>
