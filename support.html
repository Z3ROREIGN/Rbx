<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.card{background:#0d0d10;border:1px solid #292930;border-radius:16px;padding:18px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #303039;background:#111115;color:#fff;margin-top:7px}textarea{min-height:100px}button{background:#fff;color:#000;font-weight:800;cursor:pointer}.muted{color:#888}.ticket{cursor:pointer}.msg{padding:11px;background:#17171b;border-radius:12px;margin:8px 0;max-width:82%}.mine{margin-left:auto;background:#eee;color:#111}.person{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222}.tag{font-size:11px;border:1px solid #444;border-radius:999px;padding:3px 7px;color:#aaa}.hidden{display:none}.reply{display:flex;gap:8px}.reply textarea{flex:1}.reply button{width:auto;padding:0 18px}.back{color:#fff;text-decoration:none}.ok{color:#8fe0ad}.err{color:#ff8585}@media(max-width:600px){.reply{display:block}.reply button{width:100%;padding:11px}.msg{max-width:92%}}</style></head><body><main class="wrap"><a class="back" href="/">‹ Voltar</a><h1>🛟 Central de suporte</h1><section class="card"><h3>Novo chamado</h3><input id="subject" maxlength="120" placeholder="Assunto"><select id="category"><option value="order">Pedido</option><option value="payment">Pagamento</option><option value="account">Conta</option><option value="delivery">Entrega</option><option value="technical">Problema técnico</option><option value="other">Outro</option></select><textarea id="body" maxlength="3000" placeholder="Explique seu problema"></textarea><button id="create">Abrir chamado</button><div id="msg"></div></section><section id="tickets"></section><section id="conversation" class="card hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,uid,profile,tickets=[];const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/support.html');uid=session.user.id;const p=await sb.from('profiles').select('id,display_name,username,avatar_url').eq('id',uid).maybeSingle();profile=p.data||{};await load();sb.channel('support-user-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'support_tickets',filter:'user_id=eq.'+uid},async()=>{await load();if(window.currentTicket)openTicket(window.currentTicket,false)}).on('postgres_changes',{event:'*',schema:'public',table:'support_messages'},async p=>{if(window.currentTicket&&(p.new?.ticket_id===window.currentTicket||p.old?.ticket_id===window.currentTicket))openTicket(window.currentTicket,false)}).subscribe()}catch(e){$('msg').textContent=e.message;$('msg').className='err'}}async function load(){const {data,error}=await sb.from('support_tickets').select('id,subject,category,status,created_at,updated_at').eq('user_id',uid).order('updated_at',{ascending:false});if(error)return $('tickets').innerHTML='<div class="card err">'+esc(error.message)+'</div>';tickets=data||[];$('tickets').innerHTML='<h2>Meus chamados</h2>'+(tickets.length?tickets.map(t=>`<article class="card ticket" onclick="openTicket('${t.id}')"><div class="top"><b>${esc(t.subject)}</b><span class="tag">${esc(t.status)}</span></div><div class="muted">${esc(t.category)} · ${new Date(t.updated_at).toLocaleString('pt-BR')}</div></article>`).join(''):'<div class="card muted">Nenhum chamado aberto.</div>')}async function openTicket(id,scroll=true){window.currentTicket=id;const t=tickets.find(x=>x.id===id);if(!t)return;const {data:msgs,error}=await sb.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});if(error)return $('conversation').innerHTML='<p class="err">'+esc(error.message)+'</p>';const ids=[...new Set((msgs||[]).map(m=>m.sender_id))];const pr=ids.length?await sb.from('profiles').select('id,display_name,username,avatar_url').in('id',ids):{data:[]};const pm=new Map((pr.data||[]).map(p=>[p.id,p]));pm.set(uid,profile);$('conversation').classList.remove('hidden');$('conversation').innerHTML=`<div><a href="#" onclick="closeTicket();return false" class="back">‹ Voltar aos chamados</a><h2>${esc(t.subject)}</h2><span class="muted">${esc(t.category)} · ${esc(t.status)}</span></div><hr style="border-color:#222">${(msgs||[]).map(m=>{const p=pm.get(m.sender_id)||{};const mine=m.sender_id===uid;return `<div class="msg ${mine?'mine':''}"><div class="person"><img class="avatar" src="${esc(p.avatar_url||'/logo.png')}" onerror="this.src='/logo.png'"><div><b>${esc(mine?(profile.display_name||profile.username||'Você'):(p.display_name||p.username||'Equipe de suporte'))}</b><br><span class="muted">${mine?'Você':'🛟 Suporte'} · ${new Date(m.created_at).toLocaleString('pt-BR')}</span></div></div><div style="margin-top:8px">${esc(m.body)}</div></div>`}).join('')||'<p class="muted">Ainda não há mensagens.</p>'}<div class="reply"><textarea id="replyBody" maxlength="3000" placeholder="Responder ao suporte..."></textarea><button id="sendReply" onclick="sendReply('${id}')">Enviar</button></div><p id="replyMsg" class="muted"></p>`;if(scroll)$('conversation').scrollIntoView({behavior:'smooth'})}function closeTicket(){window.currentTicket=null;$('conversation').classList.add('hidden')}async function sendReply(id){const box=$('replyBody'),button=$('sendReply'),body=box.value.trim();if(!body)return $('replyMsg').textContent='Digite uma mensagem.';button.disabled=true;button.textContent='Enviando...';const {error}=await sb.from('support_messages').insert({ticket_id:id,sender_id:uid,body});if(error){$('replyMsg').className='err';$('replyMsg').textContent='Não foi possível responder: '+error.message}else{box.value='';$('replyMsg').className='ok';$('replyMsg').textContent='✓ Mensagem enviada.';await openTicket(id,false);await load()}button.disabled=false;button.textContent='Enviar'}$('create').onclick=async()=>{const subject=$('subject').value.trim(),body=$('body').value.trim();if(subject.length<3||body.length<5)return $('msg').textContent='Preencha assunto e descrição.';$('create').disabled=true;const {data,error}=await sb.from('support_tickets').insert({user_id:uid,subject,category:$('category').value,status:'OPEN'}).select('id').single();if(!error){const r=await sb.from('support_messages').insert({ticket_id:data.id,sender_id:uid,body});if(r.error)error=r.error}$('create').disabled=false;if(error)$('msg').textContent=error.message;else{$('msg').textContent='Chamado aberto.';$('subject').value='';$('body').value='';await load()}};boot()</script><script src="/site-nav.js"></script></body></html>
