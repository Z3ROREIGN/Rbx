<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Central de suporte — Best Robux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f6;font:14px Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:22px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.brand{font-weight:900;font-size:20px}.back,.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #30353b;background:#151719;color:#fff;border-radius:6px;text-decoration:none;font-weight:800}.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card{background:#121416;border:1px solid #292e34;border-radius:7px;padding:18px;margin:10px 0}.muted{color:#858c94}.fields{display:grid;grid-template-columns:1fr 210px;gap:9px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:6px;border:1px solid #30353b;background:#0b0d0f;color:#fff;margin-top:7px;outline:none}textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}.primary{width:100%;background:#df3340;border-color:#b82732;color:#fff;font-weight:900;margin-top:12px}.ticket{cursor:pointer}.ticket:hover{border-color:#444a51}.ticketTop{display:flex;justify-content:space-between;gap:12px}.tag{font-size:11px;border:1px solid #3b4249;border-radius:5px;padding:4px 7px;color:#aeb4ba}.person{display:flex;align-items:center;gap:9px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#191c20}.msg{padding:11px;background:#181a1d;border-radius:7px;margin:8px 0;max-width:82%}.mine{margin-left:auto;background:#eee;color:#111}.reply{display:flex;gap:8px;align-items:flex-end}.reply textarea{flex:1}.reply button{width:auto;padding:0 18px;height:44px}.hidden{display:none}.ok{color:#8fe0ad}.err{color:#ff8585;min-height:20px}@media(max-width:600px){.fields{grid-template-columns:1fr}.reply{display:block}.reply button{width:100%;margin-top:7px}.msg{max-width:94%}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/account.html"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Conta</a><span class="brand">Best Robux</span><a class="back" href="/orders.html">Pedidos</a></div><section class="card"><h1 style="margin:0 0 6px">Central de suporte</h1><p class="muted">Abra um chamado e acompanhe a conversa com a equipe.</p><div class="fields"><div><label>ASSUNTO</label><input id="subject" maxlength="120" placeholder="Ex.: problema com meu pedido"></div><div><label>CATEGORIA</label><select id="category"><option value="order">Pedido</option><option value="payment">Pagamento</option><option value="account">Conta</option><option value="delivery">Entrega</option><option value="technical">Problema técnico</option><option value="other">Outro</option></select></div><div class="wide"><label>DESCRIÇÃO</label><textarea id="body" maxlength="3000" placeholder="Explique o que aconteceu..."></textarea></div></div><button id="create" class="btn primary">Abrir chamado</button><div id="msg" class="err"></div></section><section id="tickets"></section><section id="conversation" class="card hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb,uid,profile,tickets=[];const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));const avatar=v=>v||'/logo.png';async function boot(){try{const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bestrobux-auth'}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('/login.html?redirect=/support.html');uid=session.user.id;const p=await sb.from('profiles').select('id,display_name,username,avatar_url').eq('id',uid).maybeSingle();profile=p.data||{};await load();sb.channel('support-user-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'support_tickets',filter:'user_id=eq.'+uid},load).on('postgres_changes',{event:'*',schema:'public',table:'support_messages'},async p=>{if(window.currentTicket&&(p.new?.ticket_id===window.currentTicket||p.old?.ticket_id===window.currentTicket))openTicket(window.currentTicket,false)}).subscribe()}catch(e){$('msg').textContent='Não foi possível carregar o suporte.'}}async function load(){const {data,error}=await sb.from('support_tickets').select('id,subject,category,status,created_at,updated_at').eq('user_id',uid).order('updated_at',{ascending:false});if(error)return $('tickets').innerHTML='<div class="card err">Não foi possível carregar os chamados.</div>';tickets=data||[];$('tickets').innerHTML='<h2>Meus chamados</h2>'+(tickets.length?tickets.map(t=>`<article class="card ticket" onclick="openTicket('${t.id}')"><div class="ticketTop"><b>${esc(t.subject)}</b><span class="tag">${esc(t.status)}</span></div><div class="muted" style="margin-top:7px">${esc(t.category)} · ${new Date(t.updated_at).toLocaleString('pt-BR')}</div></article>`).join(''):'<div class="card muted">Nenhum chamado aberto.</div>')}async function openTicket(id,scroll=true){window.currentTicket=id;const t=tickets.find(x=>x.id===id);if(!t)return;const {data:msgs,error}=await sb.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});if(error)return $('conversation').innerHTML='<p class="err">Não foi possível carregar a conversa.</p>';const ids=[...new Set((msgs||[]).map(m=>m.sender_id))];const pr=ids.length?await sb.from('profiles').select('id,display_name,username,avatar_url').in('id',ids):{data:[]};const pm=new Map((pr.data||[]).map(p=>[p.id,p]));pm.set(uid,profile);$('conversation').classList.remove('hidden');$('conversation').innerHTML=`<a href="#" onclick="closeTicket();return false" class="back">Voltar aos chamados</a><h2>${esc(t.subject)}</h2><span class="muted">${esc(t.category)} · ${esc(t.status)}</span><hr style="border-color:#24282d;margin:16px 0">${(msgs||[]).map(m=>{const p=pm.get(m.sender_id)||{};const mine=m.sender_id===uid;return `<div class="msg ${mine?'mine':''}"><div class="person"><img class="avatar" src="${esc(avatar(p.avatar_url))}" onerror="this.src='/logo.png'"><div><b>${esc(mine?(profile.display_name||profile.username||'Você'):(p.display_name||p.username||'Equipe de suporte'))}</b><div class="muted">${mine?'Você':'Atendimento'} · ${new Date(m.created_at).toLocaleString('pt-BR')}</div></div></div><div style="margin-top:8px">${esc(m.body)}</div></div>`}).join('')||'<p class="muted">Ainda não há mensagens.</p>'}<div class="reply"><textarea id="replyBody" maxlength="3000" placeholder="Responder ao atendimento..."></textarea><button id="sendReply" class="btn primary" onclick="sendReply('${id}')">Enviar</button></div><p id="replyMsg" class="muted"></p>`;if(scroll)$('conversation').scrollIntoView({behavior:'smooth'})}function closeTicket(){window.currentTicket=null;$('conversation').classList.add('hidden')}async function sendReply(id){const box=$('replyBody'),button=$('sendReply'),body=box.value.trim();if(!body)return $('replyMsg').textContent='Digite uma mensagem.';button.disabled=true;button.textContent='Enviando...';const {error}=await sb.from('support_messages').insert({ticket_id:id,sender_id:uid,body});if(error){$('replyMsg').className='err';$('replyMsg').textContent='Não foi possível responder.'}else{box.value='';await openTicket(id,false);await load()}button.disabled=false;button.textContent='Enviar'}$('create').onclick=async()=>{const subject=$('subject').value.trim(),body=$('body').value.trim();if(subject.length<3||body.length<5)return $('msg').textContent='Preencha assunto e descrição.';$('create').disabled=true;const {data,error}=await sb.from('support_tickets').insert({user_id:uid,subject,category:$('category').value,status:'OPEN'}).select('id').single();if(!error){const r=await sb.from('support_messages').insert({ticket_id:data.id,sender_id:uid,body});if(r.error)error=r.error}$('create').disabled=false;if(error)$('msg').textContent='Não foi possível abrir o chamado.';else{$('msg').className='ok';$('msg').textContent='Chamado aberto.';$('subject').value='';$('body').value='';await load()}};boot()</script><script src="/site-nav.js"></script></body></html>
