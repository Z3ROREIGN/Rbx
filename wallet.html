<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carteira • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Inter,system-ui}.wrap{max-width:1050px;margin:auto;padding:40px 5%}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.card{background:#0d1a2b;border:1px solid #253a55;border-radius:20px;padding:24px}.balance{font-size:42px;font-weight:900}.muted{color:#9db0c8}input{width:100%;padding:13px;margin:8px 0;border:1px solid #2a405e;background:#081321;color:#fff;border-radius:11px}.btn{padding:12px 15px;border-radius:11px;border:1px solid #8175ff;background:#6d5dfc;color:#fff;font-weight:800;cursor:pointer}.tx{padding:13px 0;border-bottom:1px solid #20324b}.fee{font-size:13px;color:#9db0c8}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><a href="/marketplace.html">← Marketplace</a><h1>Carteira</h1></div><a class="btn" href="/product-chat.html">Pedidos</a></div><section class="grid"><div class="card"><div class="muted">Saldo disponível</div><div class="balance" id="bal">R$ 0,00</div><p class="fee">Taxa para sacar: R$ 2,00</p><h3>Sacar</h3><input id="amount" type="number" step="0.01" min="0" placeholder="Valor"><input id="pix" placeholder="Chave PIX"><button class="btn" onclick="withdraw()">Solicitar saque</button><p id="msg"></p></div><div class="card"><h3>Histórico de transações</h3><div id="tx" class="muted">Carregando...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function boot(){const c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);load()}async function api(body){const t=(await sb.auth.getSession()).data.session?.access_token;if(!t){location.href='/login.html';return}const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{const d=await api({action:'wallet'});document.querySelector('#bal').textContent='R$ '+Number(d.account.balance).toFixed(2).replace('.',',');document.querySelector('#tx').innerHTML=d.transactions.length?d.transactions.map(x=>`<div class="tx"><b>${x.type}</b><br>R$ ${Number(x.amount).toFixed(2).replace('.',',')}<br><span class="muted">${x.description||''} • ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div>`).join(''):'Nenhuma transação ainda.'}catch(e){document.querySelector('#msg').textContent=e.message}}async function withdraw(){try{await api({action:'withdraw',amount:document.querySelector('#amount').value,pixKey:document.querySelector('#pix').value});document.querySelector('#msg').textContent='Saque solicitado. A equipe irá processar.';load()}catch(e){document.querySelector('#msg').textContent=e.message}}boot()</script></body></html>
