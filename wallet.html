<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carteira • BestRobux</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#f5f6f7;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:40px 5%}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.card{background:#151719;border:1px solid #292e33;border-radius:8px;padding:24px}.balance{font-size:42px;font-weight:900}.muted{color:#929aa3}input{width:100%;padding:13px;margin:8px 0;border:1px solid #353a40;background:#0d0f11;color:#fff;border-radius:6px}.btn{padding:12px 15px;border-radius:6px;border:1px solid #ff4b55;background:#e3343f;color:#fff;font-weight:800;cursor:pointer}.tx{padding:13px 0;border-bottom:1px solid #292e33}.fee{font-size:13px;color:#929aa3}.notice{padding:12px;background:#32171b;border:1px solid #62272e;border-radius:6px;margin-top:10px;word-break:break-all}.back{color:#ff5962;text-decoration:none;font-weight:700}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:25px 4%}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/marketplace.html">← Marketplace</a><h1>Carteira</h1></div><a class="btn" href="/product-chat.html">Pedidos</a></div><section class="grid"><div class="card"><div class="muted">Saldo disponível</div><div class="balance" id="bal">R$ 0,00</div><h3>Adicionar saldo</h3><input id="deposit" type="number" step="0.01" min="1" placeholder="Valor para gerar PIX"><button class="btn" onclick="deposit()">Gerar pagamento PIX</button><div id="pay"></div><hr style="border-color:#292e33;margin:24px 0"><p class="fee">Taxa para sacar: R$ 2,00</p><h3>Sacar</h3><input id="amount" type="number" step="0.01" min="0" placeholder="Valor"><input id="pix" placeholder="Chave PIX"><button class="btn" onclick="withdraw()">Solicitar saque</button><p id="msg" class="muted"></p></div><div class="card"><h3>Histórico de transações</h3><div id="tx" class="muted">Carregando...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function token(){const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));return null}return s.access_token}async function api(body){const t=await token();if(!t)throw Error('Faça login novamente.');const r=await fetch('/api/marketplace',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ação não concluída.');return d}async function boot(){const c=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'bestrobux-auth'}});await load()}async function load(){try{const d=await api({action:'wallet'});document.querySelector('#bal').textContent='R$ '+Number(d.account?.balance||0).toFixed(2).replace('.',',');const tx=Array.isArray(d.transactions)?d.transactions:[];document.querySelector('#tx').innerHTML=tx.length?tx.map(x=>`<div class="tx"><b>${esc(x.type)}</b><br>R$ ${Number(x.amount).toFixed(2).replace('.',',')}<br><span class="muted">${esc(x.description||'')} • ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div>`).join(''):'Nenhuma transação ainda.'}catch(e){document.querySelector('#msg').textContent=e.message}}async function deposit(){try{const d=await api({action:'wallet-payment',amount:document.querySelector('#deposit').value});document.querySelector('#pay').innerHTML=`<div class="notice"><b>PIX gerado</b><br>${esc(d.payment?.copyPaste||'Use o QR Code retornado pelo provedor.')}</div>`}catch(e){document.querySelector('#pay').textContent=e.message}}async function withdraw(){try{await api({action:'withdraw',amount:document.querySelector('#amount').value,pixKey:document.querySelector('#pix').value});document.querySelector('#msg').textContent='Saque solicitado. A equipe irá processar.';await load()}catch(e){document.querySelector('#msg').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}boot().catch(e=>document.querySelector('#msg').textContent=e.message)</script><script src="/site-nav.js"></script></body></html>
