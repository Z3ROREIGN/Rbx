<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carteira • BestRobux</title><style>body{margin:0;background:#070708;color:#fff;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#111114;border:1px solid #29292e;border-radius:14px;padding:20px}.balance{font-size:42px;font-weight:900}.muted{color:#8c8c93}.btn,input{width:100%;padding:12px;box-sizing:border-box;border-radius:9px;border:1px solid #333;background:#17171a;color:#fff}.btn{cursor:pointer;font-weight:800}.primary{background:#e3343f;border-color:#e3343f}.rows{margin-top:15px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222}.pos{color:#73dfa0}.neg,.error{color:#ff777f}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="bar"><b>Carteira</b><div><a class="btn" href="/notifications.html">Notificações</a> <button id="refresh" class="btn">Atualizar</button></div></header><section class="card" style="margin-top:18px"><div class="muted">Saldo atual</div><div id="balance" class="balance">R$ 0,00</div><div id="available" class="muted">Conectando...</div></section><div class="grid"><section class="card"><h2>Adicionar saldo</h2><p class="muted">Gere um PIX para adicionar crédito.</p><input id="deposit" type="number" min="1" step="0.01" placeholder="Valor"><button id="dep" class="btn primary" style="margin-top:8px">Gerar PIX</button><div id="pix"></div></section><section class="card"><h2>Saque</h2><input id="amount" type="number" min="1" step="0.01" placeholder="Valor"><input id="key" placeholder="Chave PIX" style="margin-top:8px"><button id="wd" class="btn primary" style="margin-top:8px">Solicitar saque</button><div id="wdmsg"></div></section></div><section class="card" style="margin-top:14px"><h2>Extrato</h2><div id="tx" class="rows">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js"></script><script>(async()=>{const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',','),wait=(p,n=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Tempo limite de conexão.')),n))]);let sb,user,busy=false;async function sess(){await wait(window.bestRobuxAuthReady||Promise.resolve());sb=window.bestRobuxSupabase;if(!sb)throw Error('Serviço de conexão indisponível.');let r=await wait(sb.auth.getSession());if(!r.data.session)r=await wait(sb.auth.refreshSession());if(!r.data.session)throw Error('Sessão expirada.');user=r.data.session.user;return r.data.session}async function call(body){const s=await sess(),r=await wait(fetch('/api/marketplace',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'}),20000),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Operação não concluída.');return d}async function load(){if(busy)return;busy=true;try{const d=await call({action:'wallet'}),a=d.account||{};const bal=Number(a.balance||0);$('balance').textContent=money(bal);$('available').textContent='Disponível: '+money(bal);const t=d.transactions||[];$('tx').innerHTML=t.length?t.map(x=>`<div class="row"><span>${esc(x.description||x.type||'Movimentação')}<small class="muted"><br>${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</small></span><b class="${Number(x.amount)>=0?'pos':'neg'}">${Number(x.amount)>=0?'+':'−'} ${money(Math.abs(Number(x.amount)))}</b></div>`).join(''):'<span class="muted">Nenhuma movimentação.</span>'}catch(e){$('available').innerHTML='<span class="error">'+esc(e.message)+'</span>';$('tx').innerHTML='<span class="error">Não foi possível carregar o extrato.</span>'}finally{busy=false}}$('refresh').onclick=load;$('dep').onclick=async()=>{const b=$('dep'),n=Number($('deposit').value);if(!Number.isFinite(n)||n<1)return $('pix').innerHTML='<div class="error">Informe um valor válido.</div>';b.disabled=true;try{const d=await call({action:'wallet-payment',amount:n}),p=d.payment||{};$('pix').innerHTML='<div class="card"><b>PIX gerado</b><p class="muted">Use o código abaixo para pagar.</p><textarea id="code" readonly style="width:100%;height:90px;background:#080808;color:#fff">'+esc(p.copyPaste||'')+'</textarea><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'code\').value)">Copiar PIX</button></div>'}catch(e){$('pix').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{b.disabled=false}};$('wd').onclick=async()=>{const b=$('wd'),n=Number($('amount').value),k=$('key').value.trim();if(!Number.isFinite(n)||n<=0||!k)return $('wdmsg').innerHTML='<div class="error">Informe valor e chave PIX.</div>';b.disabled=true;try{await call({action:'withdraw',amount:n,pixKey:k});$('wdmsg').innerHTML='<div class="muted">Saque enviado para análise.</div>';load()}catch(e){$('wdmsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{b.disabled=false}};try{await sess();await load()}catch(e){$('available').innerHTML='<span class="error">'+esc(e.message)+'</span>'}})()</script><script src="/site-nav.js"></script></body></html>
